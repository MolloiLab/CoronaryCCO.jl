[meta]
id = "wustmann2003_coronary_wedge_pressure"
data_type = "experimental"
validates = "Human coronary wedge (occlusive) pressure distal to a 1-min balloon occlusion of an angiographically NORMAL coronary artery, with simultaneous aortic, central venous and LV end-diastolic pressure; collateral flow index."
species = "human"
preparation = "100 patients (61 +/- 10 y; 69 M / 31 F) referred for diagnostic angiography; the artery studied had no stenotic lesion. Group 1 (n = 51): all coronary arteries angiographically normal. Group 2 (n = 49): stenoses in 1-2 other arteries. Exclusion criteria are listed in the paper (they include renal insufficiency). Pressure guidewire distal in the normal artery; balloon inflated at 1-2 atm (just occlusive), proximal (65) or mid-vessel (34). CVP as right-atrial pressure from the femoral vein; LVEDP at ventriculography."
conditions = "No pharmacological hyperemia during the occlusion (the distal bed is ischemic, i.e. metabolically dilated, by the end of 1 min). Isosorbide dinitrate (2 + 2 puffs) and 5000 IU heparin beforehand. Pressures are means at the end of the 1-min occlusion. CFI = (Poccl - CVP)/(Pao - CVP)."
verification = "FT"
access = "Publisher PDF (Circulation 107:2213-2220) from the Wayback Machine capture 20220311221857 of the ahajournals PDF URL; text extracted with pdftotext; Table 3 read from the text layer."
notes = """All values mean +/- SD.
Wedge pressure includes the pressure generated by collateral inflow, so it is an UPPER bound on the zero-flow (back) pressure of the occluded bed; CFI 0.19 means collateral flow is not negligible even in normal arteries (22 of 100 had CFI >= 0.25).
Poccl (23 +/- 8 mmHg) is about 4x CVP (5.5 mmHg) and about 2x LVEDP (11 mmHg) in group 1.
Related: Verhoeff et al. 2005 (verhoeff2005_hmr_reference_vessel.toml) report Pw/Pa 0.23 +/- 0.07 distal to stenoses before PCI. Kazmaier S et al. Eur J Anaesthesiol 2006;23:373-379 (doi 10.1017/S0265021505001985; abstract): critical occlusion pressure in 15 LIMA-LAD grafts after CABG 32.3 +/- 9.9 mmHg, 3.1x coronary sinus pressure and 2.6x LVEDP (not hyperemic)."""
use_in_model = """Bounding check on the outflow pressure: the model's effective back pressure at full dilation should sit between venous pressure (~5 mmHg) and the human wedge pressure (~21-23 mmHg, which still contains collateral inflow). 13.6 mmHg satisfies this. Do not use Poccl as the back pressure itself."""

