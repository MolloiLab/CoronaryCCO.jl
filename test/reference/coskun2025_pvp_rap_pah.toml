[meta]
id = "coskun2025_pvp_rap_pah"
data_type = "experimental"
validates = "Resting upper-extremity peripheral venous pressure (PVP) vs simultaneously obtained invasive right atrial pressure (RAP) in awake, spontaneously breathing, supine patients at right heart catheterization; the PVP-RAP offset that drives venous return from the arm"
species = "human"
preparation = "138 consecutive patients with WHO group 1 pulmonary arterial hypertension (PAH) undergoing right heart catheterization, single tertiary centre (Oct 2021 - Sep 2023). PVP via a 16-gauge IV cannula in the upper extremity connected directly to a TruWave transducer zeroed at the phlebostatic axis, arm kept parallel so the IV sat at mid-chest level. RAP by standard RHC transducer zeroed at the phlebostatic axis, end-expiration. Cardiac output by Fick."
conditions = "Rest, supine (catheterization laboratory), awake, spontaneous ventilation. Mean age 43.0 +/- 17.8 y; 69.6% female; heart rate 87.0 +/- 15.4 bpm."
verification = "FT"
access = "Europe PMC fullTextXML of PMC12091662 (Medicine, open access), read 2026-10-15; Tables 1-2 read from the XML table markup."
notes = """PATIENTS WITH PAH (elevated RAP, many with edema), not healthy adults; mean RAP 8.7 mmHg is higher than a typical healthy supine CVP.
The exact upper-extremity site (antecubital, forearm or hand) is not stated; only 'upper extremity'.
The paper reports the two means and SDs and Pearson R = 0.839 between PVP and RAP; it does not report a Bland-Altman bias or limits of agreement in the text read, so no mean paired difference is stored (the difference of the two means is not a paired statistic and is not computed here).
Cutoffs: PVP 8.5 mmHg discriminated RAP < 8 (AUC 0.91, sens 72%, spec 94%); PVP 12.5 mmHg discriminated RAP >= 12 (AUC 0.92, sens 82%, spec 89%)."""
use_in_model = """Sets the resting pressure of the arm venous reservoir relative to the central venous pressure: upper-extremity PVP sits above RAP by roughly the gap between the means (PVP 10.7 vs RAP 8.7 mmHg at the phlebostatic level) with the two tightly correlated. Use R = (PVP - CVP) / Q_arm with Q_arm from zhang2025_limb_basal_arterial_flow, keeping in mind this cohort's RAP is elevated; for a healthy supine subject use a lower CVP with a similar small positive offset (compare amar2001_pvp_cvp_surgical, munis2001_pvp_cvp_neurosurgical)."""

