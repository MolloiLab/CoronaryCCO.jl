[meta]
id = "stoel2009_dye_injection_pressure"
data_type = "experimental"
validates = "Rise of ostial and distal intracoronary pressure during a manual contrast injection for angiography, and the implied (small) acceleration of contrast transit (TIMI frame count) caused by the injection itself"
species = "human"
preparation = "25 consecutive patients in sinus rhythm with intermediate lesions that proved non-significant (FFR > 0.75). 6F guiding catheters without side holes (femoral), iodixanol 320 (Visipaque), MANUAL injections. Pressure wire (Radi) a few mm distal to the ostium and distal to the lesion; guide pressure on the manifold. Extra group of 6 patients: wire at ostium and 3, 6 and 9 cm distal."
conditions = "IV heparin 5000 IU; IC nitroglycerin 200-300 ug. Measurements after adenosine hyperemia (for FFR) had resolved. Recordings from >= 1 beat before to >= 1 beat after the injection. Mean pressure = (systolic + 2 diastolic)/3."
verification = "FT"
access = "Publisher full-text HTML at https://eurointervention.pcronline.com/article/impact-of-dye-injection-on-intracoronary-pressure (read 2026-10-15). Table 3 (systolic/diastolic before/during/after) was not rendered in the HTML; text values used."
notes = """Injection rate and volume were not recorded (manual). The authors stress that the catheter must allow easy backflow of dye into the
ascending aorta; with a non-wedged 6F catheter most of the injectate that the coronary cannot take refluxes into the aorta, so the
coronary sees a small pressure rise, not the full injector flow. 8F catheters or ostial disease may raise pressure more (not studied).
The authors estimate that the 6.7% ostial pressure rise, lasting the whole TFC window, raises velocity ~6.7% at constant resistance,
i.e. TFC falls by 2.3 (LAD), 1.9 (LCx) and 1.1 (RCA) frames at 25 fps, using baseline TFC from their ref 4 (Stoel et al.; the LAD and LCx values equal Stoel 2003 Circulation Table 3).
Cites Hodgson 1985 (dogs): only a small (<1.5%) increase in coronary flow during the initial phase of dye injection.
Limitation noted: contrast viscosity exceeds blood and may reduce velocity; not addressed."""
use_in_model = """Represent injection in the transport model as a pressure boundary condition at the ostium raised by ~6 mmHg (~7%) for the
duration of the TFC window, NOT as an added inflow equal to the injector rate. Expected effect on model arrival time: about -6% (-2 frames
LAD at 25 fps). The ostium-to-9 cm pressure profile (6.9 -> 3.1 mmHg rise) can check the model's epicardial pressure drop under a
proximal pressure perturbation."""

