# Huo Y, Kassab GS (2012). Intraspecific scaling laws of vascular trees. J R Soc Interface 9:190-200.
# Scaling exponents fitted to the measured pig coronary morphometry (Kassab 1993) and to other
# published vascular trees, plus the theoretical exponents. Numbers from Tables 1-3, Fig. 2 legend
# and the Discussion text of the publisher PDF.

[meta]
id = "huo2012_intraspecific_scaling"
data_type = "morphometry-derived scaling fits + theory"
validates = "Stem-crown scaling of the synthetic tree: crown volume vs stem diameter (exponent ~3), stem flow vs stem diameter (theory 7/3, measured 2.3-2.6), flow vs crown length (~1), diameter vs crown length (3/7), and Horton ratio parameters."
species = "pig (coronary) plus rat, cat, dog, human, hamster, rabbit trees for the pooled fits"
preparation = "Pig values from the Kassab 1993 cast/histology morphometry, reconstructed into full trees (946,937 LAD, 571,383 LCx, 836,712 RCA segments in Fig. 2). Other trees from the literature listed in the paper (refs 7-19)."
conditions = "Anatomy only; capillaries (< 8 um) excluded. Flows for the Q-D and Q-L fits are model flows computed on the anatomy."
verification = "FT"
access = "Publisher PDF (royalsocietypublishing.org, local copy)."
notes = """
Stem = a vessel segment; crown = the whole tree distal to it. Vc = summed intravascular volume of the crown, Lc = summed length of the crown, Ds = stem diameter, Qs = stem flow.
Two different volume-diameter exponents are reported for the pig trees: 2.96/3.00/2.98 (LAD/LCx/RCA) from the segment-level density plot of the reconstructed trees (Fig. 2, abstract), and 3.09/3.10/3.11 (LAD/LCx/RCA) from the per-order fit in Table 1. Keep both and say which one you compare to.
The flow-diameter exponent is 2.62 +/- 0.65 in Table 3 but 2.64 +/- 0.64 in the Discussion text for the same set of trees; large-order trees give 2.32 +/- 0.18 (text).
Table 2 caption writes LR = BR^-1/(3-gamma) in one place and BR^-1/(3+gamma) in another; Methods use BR^-1/(3-gamma).
"""
use_in_model = """For every segment of the CCO tree compute Ds, Vc, Lc and Qs, normalize by the root values, and fit log-log slopes. Compare Vc-Ds slope with 2.96-3.00 (pig), Qs-Ds slope with 7/3 theory and 2.1-2.2 (Mittal 2005 model on the same anatomy), Qs-Lc slope with ~1."""

[source]
authors = ["Huo Y", "Kassab GS"]
year = 2012
title = "Intraspecific scaling laws of vascular trees"
journal = "J R Soc Interface"
volume = "9"
issue = "66"
pages = "190-200"
doi = "10.1098/rsif.2011.0270"
crossref_verified = "2026-10-14; Crossref title exact match (vol 9, issue 66, 190-200; issued 2012-01-07, published online 15 June 2011)"

