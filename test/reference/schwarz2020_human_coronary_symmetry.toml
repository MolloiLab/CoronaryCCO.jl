# Schwarz JCV, van Lier MGJTB, van den Wijngaard JPHM, Siebes M, VanBavel E (2020). Topologic and
# hemodynamic characteristics of the human coronary arterial circulation. Front Physiol 10:1611.
# Symmetry quartiles digitized from Fig. 3A; group sizes printed in Fig. 4; histograms from Fig. 3B-C.

[meta]
id = "schwarz2020_human_coronary_symmetry"
data_type = "experimental"
validates = "Daughter symmetry S = dS/dL vs mother diameter class (ten classes, 30 um to >= 400 um) in a human left coronary tree, number of bifurcations per class split at S = 0.5, and the full S histograms for mothers 75-90 um and >= 400 um. Use for a size-dependent symmetry floor or target distribution in CCO growth (human)."
species = "human"
preparation = "One post-mortem human heart; coronary arteries filled with fluorescent replica material; imaging cryomicrotome; 3-D reconstruction of the left coronary tree: 202,184 segments, diameters 30 um to 4 mm; 91% of nodes are bifurcations."
conditions = "Post-mortem cast; resolution about 30 um (segments < 30 um not reconstructed)."
verification = "mixed"
access = "Open-access full text (CC BY) via Europe PMC JATS XML (PMC6989553); Fig. 3 and Fig. 4 images from the publisher (frontiersin.org files/Articles/485791/xml-images, 2500 px wide) for digitization."
notes = """S = dS/dL (smaller over larger daughter diameter), Eq. 1. Area growth A = (dL^2 + dS^2)/dM^2, Eq. 2.
Fig. 3A box plots: box = 25th-75th percentile, line = median; whiskers follow the Tukey 1.5 IQR rule (the Fig. 2 legend states 1.5 IQR; digitized lower whiskers equal max(min, Q1 - 1.5 IQR) within 0.003). Upper whiskers end at S = 1 in every class. Outliers are not shown, so the lower whisker is not a percentile.
Text: for mother diameter > 500 um the median S was 0.59 (vs < 0.40 in porcine data); bifurcations become more symmetric and less variable with decreasing diameter. 'Very asymmetric branches generally reflected consecutive segments of large vessels having small side branches.'
Class sizes in Fig. 4 are bifurcations by mother diameter class (n = 867 in 30-45 um, 18,281 in 120-150 um, 1,396 in >= 400 um; 86,964 in total)."""
use_in_model = """Bin CCO bifurcations by mother diameter into the ten classes and compare Q1/median/Q3 of S = dS/dL with symmetry_by_mother_diameter, and the fraction with S < 0.5 with fraction_s_below_0p5. A floor at about the lower Tukey whisker (Q1 - 1.5 IQR) excludes only outliers; a floor at Q1 removes a quarter of real junctions. For a sampled target use the full histograms (75-90 um and >= 400 um) and interpolate the quartiles for other classes."""

[source]
authors = ["Schwarz JCV", "van Lier MGJTB", "van den Wijngaard JPHM", "Siebes M", "VanBavel E"]
year = 2020
title = "Topologic and Hemodynamic Characteristics of the Human Coronary Arterial Circulation"
journal = "Front Physiol"
volume = "10"
