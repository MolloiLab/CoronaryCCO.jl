[meta]
id = "kitaoka1992_human_acinar_volume"
data_type = "experimental"
validates = "Volume of the human acinus defined as everything distal to one terminal bronchiole (TB), its spread, and its independence of location and of TB generation."
species = "human"
preparation = "Normal part of the left upper lobe of a 51-yr-old woman operated for small lung cancer; fixed by intrabronchial infusion of polyethylene glycol + formalin; 48 serial slices 0.5 mm thick; soft x-ray radiographs at x12; 3-D reconstruction and Cavalieri volumetry of 130 acini wholly inside the sliced block (171 TBs found)."
conditions = "Fixed lung; shrinkage not measured (stated)."
verification = "FT"
access = "J-STAGE open PDF (Tohoku J Exp Med 167:1), read 2026-10-18 via pdftotext; Abstract, Results and Discussion."
notes = """Acinus = airspace distal to one TB. Mean 172.7 +/- 37.9 mm3 (n = 130), range 86-258 mm3, approximately normal. Six 'asymmetric' acini (TB splitting into one RB and one non-RB) were 200-258 mm3, about 1.5x the mean.
TB branching generation 11-20, mean 15.4 +/- 1.8; no correlation between acinar volume and TB generation (r = -0.24); no volume difference between costal, mediastinal and deep acini (groups of 43, 23, 61).
Key definitional point (Discussion): Haefeli-Bleuer & Weibel's 187 mm3 'was in reality obtained based on another definition of acinus, the area belonging to a first RB and not a TB. One can say therefore that they gave a volume about twice larger than our estimation.' Kitaoka also states that the airspace supplied by the first RB is always about half that supplied by a TB.
Also quoted: Hansen & Ampaya 1975 182.8 mm3; Gamsu et al. 1971 mean acinar diameter 7.4 mm; Pump 1969 1.33-30.9 mm3 and Boyden 1971 15.6 mm3 (judged too small).
Single lobe of a single subject; the number of acini per lung is not estimated."""
use_in_model = """If a lung terminal is one TB unit, its parenchymal volume is ~173 mm3 (SD 22%) and nearly uniform across the lobe; the design implies a near-constant acinar size, which supports uniform terminal density by volume. Under the RB1/transitional-bronchiole definition the unit is about half as large per Kitaoka's reading, so match the definition to the count used (Vasilescu 2020: ~7,700 TB vs ~15,000 TrB per lung)."""

