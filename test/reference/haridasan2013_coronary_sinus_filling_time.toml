# Haridasan V, Nandan D, Raju D, et al. (2013). Coronary sinus filling time: a novel method to assess
# microcirculatory function in patients with angina and normal coronaries. Angiographic first appearance of
# contrast in the coronary sinus after left coronary injection. Abstract (PubMed) plus open full text (PMC3860691).

[meta]
id = "haridasan2013_coronary_sinus_filling_time"
data_type = "experimental"
validates = "Human resting angiographic transit from the proximal LAD to first appearance of contrast at the coronary sinus origin (coronary sinus filling time, CSFT), a first-appearance (minimum transit) time, not a mean transit time."
species = "human"
preparation = "Diagnostic coronary angiography (Philips Allura Xper FD20, 15 frames/s). Left coronary injection of about 7 mL contrast at about 2 mL/s by hand (not standardized). Coronary sinus viewed in at least two projections (LAO cranial, RAO caudal). Angina group: 41 patients with angina and normal coronaries and a positive treadmill test. Control group: 16 patients having angiography before balloon mitral valvuloplasty."
conditions = "Rest; no adenosine or other vasodilator used (the authors state they found no study of adenosine or dipyridamole effects on CSFT). Contrast injection itself is a mild hyperemic stimulus."
verification = "FT"
access = "PubMed abstract (PMID 23647892) and PMC full-text HTML (PMC3860691) read via WebFetch."
notes = """
Definition (Methods): first frame = frame of maximal LAD opacification at the first diagonal or first septal branch, whichever comes first; last frame = first frame with dye at the coronary sinus origin, 'the point where great cardiac vein joins the posterolateral vein'. CSFT (s) = (last frame - first frame) / 15. Modified from Sankareddi et al. (conference abstract, n = 10), who used maximal sinus opacification as the end point.
The start point is in the proximal LAD, not at the ostium, so CSFT omits the left main and proximal LAD transit.
The control group is the authors' comparison group (mitral stenosis before valvuloplasty), not established normal values. Mitral stenosis may alter coronary hemodynamics.
Internal inconsistency: control 52.06 +/- 5.0 frames at 15 frames/s gives an SD of 0.33 s, but the paper prints 3.46 +/- 0.99 s. The angina group is consistent (10.7 frames = 0.71 s).
Follow-up by the same group (Kadermuneer P et al., Indian Heart J 2015;67:245-9, PMID 26138182, abstract): controls (patients with SVT undergoing ablation) 4.16 +/- 0.72 s, n = 16; angina with normal coronaries 5.31 +/- 1.03 s, n = 72. Not stored as data here.
"""
use_in_model = """Inject a bolus at the model LAD at the level of its first major side branch (or at the ostium and subtract the ostium-to-that-point arrival), and record the first time contrast reaches the great cardiac vein / coronary sinus junction at resting flow. Compare with control CSFT 3.46 +/- 0.99 s (first-appearance threshold). This is a minimum-transit check, complementary to the mean transit time in ishikawa1974_coronary_circulation_time."""

