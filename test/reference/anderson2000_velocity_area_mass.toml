[meta]
id = "anderson2000_velocity_area_mass"
data_type = "experimental"
validates = "Resting proximal LAD average peak velocity (APV) and its inverse relation to lumen-area-to-regional-mass ratio (flow continuity); estimated LAD resting flow (ml/min) and regional perfusion"
species = "human"
preparation = "59 patients undergoing diagnostic catheterization (chest pain, heart failure, valvular disease, or preoperative evaluation); excluded remote anterior MI, recent MI, occlusions, visible collaterals, left main stenosis, >90% LAD stenosis, prior CABG. LAD disease deliberately ranged from none/luminal irregularities (n = 22) to mild 30-50% (n = 15) and moderate 50-70% (n = 22). 0.014-in Doppler FloWire in the proximal LAD; QCA diameter 5 mm distal to the wire tip (circular area assumed); biplane ventriculographic LV mass; regional mass from summed distal branch lengths (Seiler method)."
conditions = "Resting; hyperemia by 18 ug intracoronary adenosine for CFR. Nitroglycerin use not stated in the available text."
verification = "FT"
access = "HighWire full-text HTML read via Wayback Machine capture 20150408063446 of http://circ.ahajournals.org:80/content/102/1/48.full. Tables 1-3 were popup/image tables that were not archived; values below are from Abstract and Results text."
notes = """Spatial mean velocity taken as V = APV/2. Qart = V x A; Qbed = perfusion (from double product) x regional mass.
Regression from Abstract: V = 46.5/(A/m), r = 0.68, P < 0.001 (units of V and of the constant are not stated in the available text;
V is defined in the Methods as the spatially averaged velocity, APV/2).
This cohort is NOT purely normal: only the 'none or luminal irregularities' group (n = 22) approximates normal arteries.
Estimated regional perfusion 58 +/- 15 ml/min/100 g (range 27-103) from the double product, not measured."""
use_in_model = """At the proximal LAD under resting conditions, compare model APV (2 x mean velocity for Poiseuille) and the lumen area / distal myocardial mass
ratio (mm2 per 100 g) against the values here. A healthy CCO tree with A/m >= 10 mm2/100 g should give resting APV near 23 +/- 9 cm/s.
Compare the model's proximal LAD resting flow with ~59-63 ml/min (Qart / Qbed)."""

