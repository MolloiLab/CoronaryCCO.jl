authors = ["Anderson HV", "Stokes MJ", "Leon M", "Abu-Halawa SA", "Stuart Y", "Kirkeeide RL"]
year = 2000
title = "Coronary artery flow velocity is related to lumen area and regional left ventricular mass"
journal = "Circulation"
volume = "102"
issue = "1"
pages = "48-54"
doi = "10.1161/01.CIR.102.1.48"
crossref_verified = "2026-10-14; Crossref title exact match (case-insensitive)"
pmid = "10880414"

