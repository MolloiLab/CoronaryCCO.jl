
# Beutler E, Waalen J (2006). The definition of anemia: what is the lower limit of normal of the blood hemoglobin
# concentration? Blood 107:1747. Scripps-Kaiser (San Diego, 1998-2002) and NHANES-III databases after excluding
# iron deficiency, inflammation, renal failure and other causes. Full text read from PMC1895695.

[meta]
id = "beutler2006_hemoglobin_reference"
data_type = "experimental"
validates = "Model input: normal blood hemoglobin concentration (mean +/- SD) by sex, age decade and race in healthy adults; used with SaO2 to set arterial O2 content and with c0 (O2 capacity of RBCs) via hematocrit."
species = "human"
preparation = "Two population databases: Scripps-Kaiser (San Diego area, 1998-2002) and NHANES-III. Excluded: transferrin saturation < 16% or ferritin < 10 ug/L, raised creatinine, raised ESR or CRP (older subjects), pregnancy; 10-30% excluded (about 40-50% for black NHANES subjects)."
conditions = "Venous blood counts, community-dwelling adults."
verification = "FT"
access = "PMC1895695 HTML full text, read 2026-10-15."
notes = """Table 4 proposed lower limits (5th percentile, Scripps-Kaiser, NHANES confirmatory): white men 20-59 y 13.7 g/dL, 60+ 13.2; white women 12.2; black men 20-59 y 12.9, 60+ 12.7; black women 11.5.
Text: Hb below 13.7 g/dL in a white man aged 20-60 y has only about a 5% chance of being normal.
Table 1 reproduces textbook lower limits for men (WHO 13, Jandl 14.2, Williams 14.0, Wintrobe 13.2 g/dL)."""
use_in_model = """For a healthy adult male: Hb about 15.2 g/dL (white men 20-49 y, both databases, SD 0.8-1.0). Compare Crapo et al. 1999 arterial CO-oximeter Hb 14.0 +/- 1.0 g/dL (n = 44, sea level, ages 18-79). The model's Arciero-style c0 = 0.5 cm3 O2 per cm3 RBC is a per-RBC capacity; convert with hematocrit, not Hb, unless the 1.34 mL O2/g Hb relation is used (not given in this paper)."""

