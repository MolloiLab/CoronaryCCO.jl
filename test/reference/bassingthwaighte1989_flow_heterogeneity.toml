# Bassingthwaighte JB, King RB, Roger SA (1989). Fractal nature of regional myocardial blood flow heterogeneity.
# Full text first read from the NIH author manuscript in PMC (PMC3361973, HTML), then re-verified against the
# original journal PDF (Circ Res 65:578-590, 13 pages; local copy supplied by the project lead): pdftotext
# -layout plus 300 dpi page renders of Table 1, Table 2, Fig. 1, Fig. 6 and Fig. 7 checked by eye. Fractal relation (paper Eq. 5): RD(m) = RD(m_ref) * (m / m_ref)^(1 - D),
# with m_ref = 1 g. Equivalent by piece number N (Eq. 1): RD(N) = RD(N=1) * N^(D - 1).

[meta]
id = "bassingthwaighte1989_flow_heterogeneity"
data_type = "experimental"
validates = "Spatial heterogeneity of regional LV blood flow as a function of tissue sample mass: RD at 1 g reference mass and fractal dimension D, per animal and per species (baboon, sheep, rabbit). Target for the flow distribution over CCO terminal segments after aggregating tissue into pieces of known mass."
species = "baboon, sheep, rabbit"
preparation = """Baboons: 10 awake animals, 15 um microspheres (4-6 differently labelled injections at different times, control, mild exercise or heat stress); a separate group of 3 baboons got simultaneous injections to measure method error. Sheep: 11 anesthetized open-chest animals, 2-iododesmethylimipramine (IDMI, 'molecular microsphere') plus 15 um microspheres injected into the left atrium; in 5 sheep two IDMIs and two microsphere labels were injected simultaneously. Rabbits: 6 anesthetized open-chest animals, two IDMIs and two microsphere labels simultaneously. Hearts stopped about 1 min after injection. LV only. LV usually cut into 96 (rabbit), 168 (baboon) or 192 (sheep) pieces (4 rings x 8 sectors x 3 or 6 transmural slices), then regrouped into aggregates of adjacent pieces."""
conditions = "Baboons awake (control and mild stresses; flow did not change much). Sheep and rabbits anesthetized, open chest; sheep in good physiological condition; 4 of 6 rabbits good, 2 rabbits had low blood pressure and high heart rate at injection (paper Results). No vasodilator."
verification = "mixed"
access = "Original journal PDF (local copy from project lead), verified page by page at 300 dpi; also NIH author manuscript PMC3361973 (HTML). Table 2 values cross-checked programmatically between both sources (27/27 rows identical)."
notes = """
RD_s is SPATIAL dispersion: observed dispersion corrected for method error (sheep, rabbits: RD_s^2 = RD_obs^2 - RD_M^2, Eq. 11) or for method + temporal error (baboons: RD_s^2 = RD_obs^2 - RD_tau,M^2, Eq. 12).
Regressions used aggregates up to 2 g (Fractal Analysis section); Fig. 5 legend says pieces up to 4 g for the example sheep.
Text says rabbit average D 1.25 +/- 0.07 with N = 7 (confirmed in the original journal PDF, so not a transcription error), but Results and Table 2 list 6 rabbits; the mean of the 6 Table 2 values is 1.247, matching 1.25.
Text: temporal RD_tau(m = 1 g) about 6% in baboons, with fractal D of 1.233 (r = 0.996) for RD_tau over 0.2-2 g (Fig. 6 legend). The regression printed inside Fig. 6 is RD_tau = 6.26 m^-0.233 (r = -0.996).
Text: microspheres give 2-4 times the method variation of IDMI and a small bias toward high-flow and subendocardial regions; microsphere fractal slopes in sheep and rabbits were essentially the same as IDMI slopes.
Discussion extrapolation (not a measurement): if the unit size were about 1 mm^3, RD would be more than 60% by the linear fractal relation; the authors expect a plateau before that.
Fig. 8 (not digitized): hearts with larger RD_s(1 g) tend to have smaller D.
"""
use_in_model = """Assign each CCO terminal flow to the tissue it perfuses, voxelize the LV into pieces of mass m (0.1 to 2 g, as in the paper), compute RD = SD/mean of mass-weighted piece flow at each m, fit log RD vs log m. Compare RD(1 g) and D with per_animal_fractal / composite_fractal_fit (spatial, method-corrected). Model has no method noise, so compare with RD_s not RD_obs. Expect D about 1.15-1.25 and RD(1 g) about 7-43% (species range)."""

