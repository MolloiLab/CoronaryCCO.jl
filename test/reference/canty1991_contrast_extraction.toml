[meta]
id = "canty1991_contrast_extraction"
data_type = "experimental"
validates = "First-pass myocardial extraction of a nonionic iodinated contrast agent (ioversol) vs an intravascular emulsion (ethiodol) during pharmacological vasodilation, in normally perfused and stenotic (flow ~halved) regions; effect on CT-derived intramyocardial blood volume and mean appearance time"
species = "dog"
preparation = "8 mongrel dogs, chronically instrumented (>= 1 week recovery): transit-time ultrasonic flow probe (Transonics) and hydraulic occluder on the proximal circumflex, catheter distal to the occluder for circumflex pressure, left atrial and aortic catheters. Study day: pentobarbital 30 mg/kg IV anesthesia, controlled ventilation, 8F pigtail in the ascending aorta via the left carotid. Picker/Imatron FASTRAC fast CT (electron beam): end-diastolic tomograms at 4 contiguous levels every beat or every other beat for 20 cycles, ~50 ms aperture, ~1.4 x 1.4 mm pixels, 8 mm slices; myocardial curves from level 4 (~3 cm below the ostia), aortic input from level 1."
conditions = "Maximal vasodilation with carbocromen (chromonar) 7.5 mg/kg IV; then circumflex flow reduced by ~50% with the occluder before scanning. Bolus aortic-root injections: ioversol 320 mgI/mL (n = 7) or iohexol 365 mgI/mL (n = 1), 8-10 mL/s for 2-3 s, followed by ethiodol emulsion (237 mgI/mL, particles < 3 um). Normal region = anterior free wall and septum (non-circumflex, normal coronary pressure); stenotic region = circumflex territory. Full-thickness myocardial ROIs."
verification = "mixed"
access = "Publisher PDF (Circulation 84:2071-2078) read from Wayback Machine capture 20180723113357 of http://circ.ahajournals.org/content/circulationaha/84/5/2071.full.pdf, text extracted with pdftotext; Table 1 and the Results flow sentence checked against 200 dpi page renders; Fig. 6 stenotic bars digitized from a 300 dpi render. Abstract also read via PubMed E-utilities (PMID 1657448)."
notes = """NO PER-GRAM FLOWS: flow was measured only as absolute circumflex volumetric flow (mL/min) by the transit-time probe. No microspheres, no perfused mass, no myocardial flow in mL/min/g.
The normal (anterior/septal, LAD-supplied) region had no flow measurement at all; it was at normal coronary pressure under full carbocromen vasodilation. The stenotic circumflex region was at ~46 mmHg distal pressure with flow ~half the vasodilated value (still ~3x resting).
Hematocrit is not reported. No PS or capillary permeability values are reported, and none can be derived without per-gram flow: PS = -F_plasma ln(1 - E) needs F_plasma in mL/min/g.
The paper's text gives only the extraction ratio between regions (33% vs 50%) and the circumflex flow ratio (~0.5). Any PS estimate needs an assumed circumflex perfused mass and hematocrit; those would be assumptions, not data from this paper.
Extraction is from residue curves, E = (R_ioversol - R_ethiodol)/(1 - R_ethiodol), with R = fraction of peak CT intensity at the onset of recirculation (method of Guller et al.). The authors note two biases: back-diffusion makes it an underestimate; peak truncation at high flow makes it an overestimate; they judge these small or cancelling.
Stenosis effect: circumflex flow 67 +/- 12 (ioversol) vs 70 +/- 11 (ethiodol) mL/min in Table 1; the Results text prints 70 +/- 12 for ethiodol. Table value stored.
Retention/extraction n: one of the 8 dogs could not be analysed (acquisition ended before recirculation), so those values are most likely n = 7; the paper does not restate n.
CT calibration: CT number = 23 x iodine (mg/mL) + 32 (n = 9 phantom concentrations, r = 0.998), 0-1,000 HU range.
Blood volume is end-diastolic, ml per 100 ml myocardium (the Discussion also writes ~16 ml/100 g)."""
use_in_model = """Extraction targets for an iodine exchange model at hyperemic flow: E ~ 0.33 at full vasodilated flow and ~0.50 at half that flow (same dog, same contrast bolus). Use the RATIO between the regions to check the flow dependence of E (E rises as flow falls, as in E = 1 - exp(-PS/F)).
To get PS you must assume hyperemic myocardial flow (mL/min/g) and hematocrit; this paper does not supply them. Vascular blood volume from the intravascular emulsion (16.4 +/- 2.7 normal vs 12.5 +/- 1.8 ml/100 ml stenotic) is a target for model diastolic blood volume during vasodilation."""

