[meta]
id = "carlson2008_autoregulation_model"
data_type = "model"
validates = "Model input and benchmark, not data: large- and small-arteriole wall-mechanics and tone parameters (myogenic, shear, conducted metabolic); control-state assumptions; model-predicted flow-increase factors over 80->130 and 50->150 mmHg with each regulatory mechanism switched on or off"
species = "generic (parameters fitted to isolated arterioles: Sun et al. for the large arteriole, Davis & Sikes for the small arteriole; O2 demand from rat cortex)"
preparation = "Theoretical representative-segment model: seven compartments in series (upstream arteries, large arterioles, small arterioles, capillaries, small venules, large venules, veins); only LA and SA are vasoactive. Wall tension = passive (exponential in D/D0) + activation x maximal active (Gaussian in D/D0); activation is a sigmoid of Stone = Cmyo*T - Cshear*tau_wall - Cmeta*SCR + C''tone. Metabolic signal from RBC ATP release conducted upstream (Arciero et al. 2008)."
conditions = "Control state: input arterial pressure 100 mmHg; activation ALA = ASA = 0.5 (Stone = 0); O2 demand 8.28 cm3 O2/100 cm3/min. MAP varied 20-200 mmHg."
verification = "FT"
access = "PMC HTML of PMC2593503 (publisher version, free in PMC, not open-access licensed), read 2026-10-15. Europe PMC fullTextXML and NCBI efetch returned no body for this record; the journals.physiology.org page was blocked (HTTP 403). Displayed equations are images on the PMC page and were NOT read; equation forms are described from the text."
notes = """Abstract rounds the constant-activation (A = 0.5) flow increase to 'fivefold'; Table 3 gives 5.29.
Table 1 prints the Cmeta unit as '1 uM/cm' while Table 2 gives 1/(uM*cm); stored as 1/(uM*cm).
C'tone is refit to the four-flow pressure-diameter data of Sun et al. (differs from Carlson & Secomb 2005). C''tone is set so that Stone = 0 in the control state.
Cmyo and Cact were taken from linear regressions on reference diameter (Carlson & Secomb 2005); Cpass and C'pass taken directly from that paper.
Cshear for the small arteriole was set equal to the large-arteriole value (no small-arteriole shear data).
The text states the control flow as '70.9 cm3 O2*100 cm-3*min-1 (MAP = 100 mmHg)'; this unit is as printed and is likely a typesetting error (a flow, not an O2 rate).
O2 demand 8.28 is justified by rat cortex consumption 6.3-8.3, while the Limitations paragraph says results are 'for steady-state conditions in skeletal muscle'; kept as printed.
Single-vessel pressure-diameter fits used time constants of 1 s for diameter and activation."""
use_in_model = """Per-segment parameter set for two vasoactive arteriole classes (D0 = 156.49 um and 38.99 um). The team's quoted 'activation 0.5' and 'M0 8.28' control
assumptions are confirmed here. Use flow_increase_factors as a qualitative target: with myogenic + shear + metabolic regulation the model gives 1.18x flow for
an 80->130 mmHg step (1.44x for 50->150), vs 5.29x at fixed A = 0.5."""

