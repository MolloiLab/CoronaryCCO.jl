[meta]
id = "lassen2023_rb82_adenosine_cardiac_output"
data_type = "experimental"
validates = "Cardiac output, heart rate, stroke volume and LV volumes at rest and during adenosine 140 ug/kg/min in healthy young adults (ECG-gated Rb-82 PET), by sex; pulmonary mean bolus transit time and pulmonary blood volume at rest and under adenosine"
species = "human"
preparation = "33 young healthy volunteers (15 female; median age 22-23 y, BMI 22), recruited Sept 2016 - Mar 2017; 25 with test-retest sessions (14 days apart, median). Siemens Biograph mCT 128-slice PET/CT, ~1100 MBq Rb-82 per session. LV volumes from 8-gate ECG-gated reconstructions (Cedars QPS/QGS); HR averaged from the list file over the first 40 s of acquisition. Mean bolus transit time = delay of Rb-82 bolus arrival from the pulmonary trunk to the left atrium; PBV = CO x MBTT."
conditions = "Rest, and adenosine 140 ug/kg/min IV for 6 min with PET emission starting 2.5 min into the infusion. Caffeine abstinence >= 24 h; sessions with plasma caffeine >= 1 ug/L excluded (8 of 66 sessions). Supine."
verification = "FT"
access = "Europe PMC fullTextXML of PMC10682170 (J Nucl Cardiol, open access), read 2026-10-15; Table 2 read from the XML table markup."
notes = """CO is SV x HR as computed by the authors from gated-PET volumes (QGS) and list-mode HR; the stress gated series uses data from bolus arrival + 90 s to 210 s of the acquisition, i.e. during the infusion.
Gated Rb-82 PET volumes are smaller than CMR volumes; resting CO here (2.7 L/min women, 3.9 L/min men) is low for healthy adults. The stress/rest RATIO is therefore the more transferable quantity, and it is large here (CO roughly doubles), larger than the ~28% rise reported by CMR (thomas2017_adenosine_cmr_hemodynamics).
Values are mean +/- SD by sex; for participants with repeat scans the mean of the two scans is used (Table 2 footnote). Table 2 does not restate n; the full cohort is 33 (15 F, 18 M).
'Reserve' columns are stress minus rest as printed by the authors (not ratios). No blood pressure is reported in the text read."""
use_in_model = """Hyperemic scaling of cardiac output in the whole-body bolus model: adenosine raises HR (58 -> 92 F, 57 -> 84 M) and SV (47 -> 72 mL F, 69 -> 101 mL M), and CO by +3.9 / +4.5 L/min. Use with caution as an upper bound on the CO rise; CMR-based data (thomas2017) suggest a smaller relative rise.
Pulmonary MBTT falls from 12-15 s to 9-11 s and PBV rises under adenosine; use to check the lung segment's response to raised CO."""

