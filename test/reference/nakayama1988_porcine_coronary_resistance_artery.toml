[meta]
id = "nakayama1988_porcine_coronary_resistance_artery"
data_type = "experimental"
validates = "Passive (papaverine) and resting pressure-diameter curve, 10-90 mmHg, of isolated pressurized porcine intramyocardial coronary resistance arteries (~223 um, 150-285 um); absence of myogenic tone at this size; maximal agonist (acetylcholine) constriction at 40 mmHg"
species = "pig"
preparation = "Isolated cylindrical segments of porcine intramyocardial coronary resistance arteries cannulated in a pressurized arteriograph (no flow), PSS 36-37 C bubbled with 95% O2/5% CO2; lumen diameter and wall thickness by video dimension analyzer. Equilibrated 1-2 h at 20 mmHg. Endothelium verified by substance P/bradykinin relaxation."
conditions = "Group D (n = 7 vessels): pressure cycled twice 10-90 mmHg, then 10-mmHg steps 10->90 mmHg, then 40-mmHg sudden steps; repeated with papaverine 1e-4 M for passive curve. Drug studies at constant 40 mmHg."
verification = "mixed"
access = "Publisher PDF (Circ Res 62:741-748) from Wayback Machine capture 20220710090633 of https://www.ahajournals.org/doi/pdf/10.1161/01.RES.62.4.741?download=true; text by pdftotext; Fig. 5 digitized from the embedded 300 dpi page scan by automatic marker detection against detected axis ticks (10-mmHg x ticks, 80/90/100% y ticks)."
notes = """All values mean +/- SEM (n = vessels).
Mean lumen diameter 223 +/- 7 um (range 150-285, n = 30) and wall thickness 37 +/- 3 um at 40 mmHg; 3-5 smooth muscle layers.
Group D (FT): 10 -> 90 mmHg, lumen diameter 209 +/- 14 -> 257 +/- 19 um and wall 41 +/- 4 -> 36 +/- 3 um in PSS; with papaverine 215 +/- 16 -> 260 +/- 19 um. 'Diameter at 10 mm Hg was approximately 80% of that at 90 mm Hg.'
PSS and papaverine curves were not significantly different at any pressure: these ~220-260 um arteries had no intrinsic myogenic tone and responded only passively to 40-mmHg pressure steps.
Acetylcholine (3e-8 to 6e-6 M) caused maximal lumen-diameter reductions of 71 +/- 3% (EC50 1.9e-7 M, n = 7) at 40 mmHg; 4e-7 M ACh caused ~55% reduction. Norepinephrine and epinephrine did not constrict.
Derived here: passive D50/D90 = 0.971 and D10/D90 = 0.827 (Fig. 5); maximal ACh constriction gives D/D_rest ~0.29 at 40 mmHg, where D_rest ~ passive (no tone)."""
use_in_model = """Size anchor at ~220-260 um: passive curve is stiff above 40 mmHg (D50/D90 ~0.97), and in vitro these arteries carry no spontaneous myogenic tone, although their smooth muscle can still constrict ~70% with an agonist. Supports keeping maximal active tension large at 150-300 um while setting basal (myogenic) activation low there."""

