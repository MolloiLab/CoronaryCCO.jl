[meta]
id = "klein2003_femoral_flow_mri"
data_type = "experimental"
validates = "Resting supine common femoral artery volume flow (whole-leg arterial inflow) by cardiac-triggered phase-contrast MRI in healthy adults; popliteal flow and its dependence on calf muscle volume"
species = "human"
preparation = "50 healthy volunteers, 26-80 y. Cardiac-triggered 2D phase-contrast quantitative flow MRI of the common femoral and popliteal arteries, plus MRI of the calves (muscle volume). 10 subjects scanned three times for reproducibility."
conditions = "Resting, supine in the MRI scanner (implied by MRI; not restated in the abstract)."
verification = "abs"
access = "Abstract only (Europe PMC, PMID 14603218, read 2026-10-16). Full text (J Vasc Surg, Elsevier) not accessible."
notes = """Abstract gives only means: CFA 353 mL/min, popliteal 61.9 mL/min; no SD and no sex/age-group breakdown.
Femoral flow depended on age and sex; popliteal flow depended on calf muscle volume (adjusted for age and sex).
Between-session CV: 16% (femoral), 19% (popliteal).
Higher than the semi-recumbent Doppler value in kochesteves2023_lower_limb_flow_volume (~290 mL/min); method and posture differ."""
use_in_model = """Supine PC-MRI cross-check for resting whole-leg inflow (~0.35 L/min per leg). Use with leg tissue volume from kochesteves2023_lower_limb_flow_volume."""

