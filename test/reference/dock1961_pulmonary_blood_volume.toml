[meta]
id = "dock1961_pulmonary_blood_volume"
data_type = "experimental"
validates = "Pulmonary mean transit time (pulmonary artery -> left atrium) and pulmonary blood volume (mL/m2) by double-indicator dilution in man; mean transit and volume from left atrium to brachial artery (LA + LV + aorta + arm arteries)"
species = "human"
preparation = "45 adults (22-60 y, mean 41; 19 men) at combined right and left heart catheterization for suspected valve disease, no shunts; 4 had 'normal circulatory dynamics' (final diagnoses: coronary disease 1, restrictive pleuritis 1, no cardiac or pulmonary abnormality 2). Simultaneous 3 mL injections: Evans blue (T-1824) into the main pulmonary artery just beyond the bifurcation, and I-131 albumin into the left atrium (percutaneous paravertebral needle); sampling from the left brachial artery into a fraction collector, 2-s samples. Stewart-Hamilton cardiac output and MTT with semilog extrapolation of the downslope; collecting-system delay subtracted. PBV = CO x (MTT PA->BA - MTT LA->BA)."
conditions = "Fasting, supine during indicator studies (prone for LA puncture), premedication secobarbital 100 mg oral and meperidine 50-75 mg IM (some morphine 8 mg)."
verification = "FT"
access = "Scanned PMC PDF (PMC290725, jcinvest00301-0161.pdf) retrieved from Wayback Machine capture 20240921083850 of the www.ncbi.nlm.nih.gov PMC PDF URL; text by pdftotext; Table I (rotated) read from a 300 dpi page render."
notes = """These are PATIENTS (mostly mitral or aortic valve disease); only 4 had normal hemodynamics, so the normal-group values rest on n = 4. Patient initials printed in Table I are not stored.
Text: PA -> LA MTT whole group 3.2-28.0 s (1.9-15.2 s per m2), mean 9.1 s (5.6 per m2); normal-dynamics group mean 5.3 s (3.5 per m2). PBV whole group 172-634 mL/m2, mean 322; normal-dynamics group mean 246 mL/m2.
LA -> BA MTT ranged 3.1-14.8 s overall (excluding 5 severe MR outliers); 4.3-8.1 s in the normal-dynamics group.
Cardiac outputs from the PA and LA injections agreed (mean ratio 0.98, SD 0.15).
PBV did not correlate with cardiac output; it correlated with PA -> LA MTT (R = +0.769); log PA -> LA MTT correlated inversely with cardiac index (R = -0.742).
The PA injection site is beyond the pulmonary trunk bifurcation; PBV therefore excludes part of the main PA and includes pulmonary veins and part of the LA up to the LA injection point.
No dispersion statistics (variance, width) are reported."""
use_in_model = """Constrains the PA -> LA pulmonary segment volume and mean transit: in the 4 subjects with normal hemodynamics, PBV 219-269 mL/m2 (text mean 246) and MTT 3.6-7.8 s (text mean 5.3 s) at cardiac index 2.1-4.0 L/min/m2. Indicator-dilution PBV is the classical anchor for the pulmonary compartment volume (compare MRI: nelsson2021_pulmonary_transit_time). LA -> brachial artery MTT 4.3-8.1 s bounds the LA + LV + arterial path."""

