[meta]
id = "claussen1984_bolus_geometry"
data_type = "experimental"
validates = "Direction of the effects of injection site (peripheral vein vs catheter in the vena cava), injection speed (4 to 8 mL/s and above), contrast volume, saline chaser and pulse rate on arterial bolus peak time, FWHM and maximum enhancement after intravenous contrast"
species = "human"
preparation = "Fast digital recording of x-ray attenuation profiles on a CT scanner ('Chronogram' mode) after intravenous contrast injection, for DSA and dynamic-CT protocol optimization."
conditions = "Varied: injection site, injection speed, contrast volume, saline after contrast. Number of subjects and measurement site not stated in the abstract."
verification = "abs"
access = "Abstract only (PubMed E-utilities, PMID 6484168), read 2026-10-15. Radiology full text not accessible (RSNA blocked; no Wayback capture found)."
notes = """Qualitative findings only (abstract):
- A catheter positioned in the vena cava reduced peak time and increased enhancement compared with peripheral injection.
- Higher injection speed shortened peak time. Raising speed from 4 to 8 mL/s gave markedly higher enhancement; further increases did not add significantly.
- At a given speed, larger contrast volume increased enhancement and delayed the peak.
- A saline injection after contrast did not change results significantly.
- Faster pulse rate correlated with shorter peak time.
No numbers are given in the abstract; all numeric arrays are placeholders."""
use_in_model = """Qualitative checks for the peripheral venous segment: moving the injection from an arm vein to the vena cava must shorten the arterial peak time and raise peak enhancement; enhancement should saturate above ~8 mL/s for a fixed volume. Use with numeric sources (bae2010 central-venous shift of 4-6 s; deng2026 port vs arm HU)."""

