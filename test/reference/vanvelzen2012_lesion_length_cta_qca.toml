[meta]
id = "vanvelzen2012_lesion_length_cta_qca"
data_type = "experimental"
validates = "Length of stented coronary lesions measured on CT angiography (plaque shoulder to shoulder) and on quantitative coronary angiography (lumen shoulder to shoulder). Sets the axial length of a synthetic focal stenosis and shows how much longer the plaque is than the angiographic narrowing."
species = "human"
preparation = "Leiden University Medical Center. 89 patients retrospectively analyzed who had CTA, then invasive angiography and PCI with stenting; 83 patients and 119 lesions included."
conditions = "CTA: 64-row (n = 47) or 320-row (n = 36) Toshiba scanners; length measured on curved MPRs in two angles from the proximal to the distal shoulder of the plaque; plaque = a structure >= 1 mm2; a tandem lesion within 4 mm counted as part of the lesion; two readers in consensus. QCA: QCA-CMS 6.0 (Medis), catheter calibration, two orthogonal projections, proximal to distal shoulder, longest value kept."
verification = "FT"
access = "Open access (Springer, PMC3485532); NCBI efetch db=pmc XML, read 2026-10-16."
notes = """Lesion location: LAD 56 (47%), LCx 35 (29%), RCA 28 (24%). Lengths are not reported per vessel.
Mean QCA diameter stenosis 71 +/- 11%.
Plaque type on CTA: non-calcified 27 (23%), mixed 72 (60%), calcified 20 (17%).
Only 2 lesions were longer on QCA than on CTA.
The paper quotes Yamagishi et al. for IVUS: QCA 12.4 +/- 6.1 mm vs IVUS 16.3 +/- 8.9 mm. That is a secondary citation and is not stored as data here.
No entrance or exit taper lengths are reported."""
use_in_model = """Axial size of a synthetic stenosis: the lumen narrowing (what angiography sees) about 12.5 +/- 6.1 mm long, and the plaque (what CT sees, including the outwardly remodelled shoulders) about 21.4 +/- 8.4 mm long. So the plaque should extend beyond the visible lumen narrowing, by 8.8 +/- 6.7 mm in total. The split between the proximal and distal ends is not reported."""

