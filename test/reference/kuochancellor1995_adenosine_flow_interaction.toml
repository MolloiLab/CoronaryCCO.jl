[meta]
id = "kuochancellor1995_adenosine_flow_interaction"
data_type = "experimental"
validates = "Resting active tone of isolated porcine coronary arterioles 50-150 um at 60 cmH2O, and the interaction between adenosine and flow-induced dilation: a threshold dose of adenosine (1e-10 M) potentiates flow-induced dilation, and endothelial KATP blockade shifts the adenosine ED50 right by one order of magnitude."
species = "pig"
preparation = "Isolated, cannulated subepicardial porcine coronary arterioles, 50-150 um, with intraluminal pressure and flow independently controlled (the Kuo dual-reservoir preparation)."
conditions = "Intraluminal pressure 60 cmH2O (44.1 mmHg); stepwise increases in flow; adenosine 1e-10 M threshold dose; luminal glibenclamide 1e-6 M, luminal K+ 40 mM, L-NMMA 1e-5 M, indomethacin 1e-5 M, endothelial denudation; nitroprusside 1e-10 M as the endothelium-independent control."
verification = "abs"
access = "PubMed abstract (PMID 7653618) via E-utilities, 2026-10-16. AJP full text not accessed: journals.physiology.org is paywalled and the Wayback Machine holds no capture of this DOI's PDF or abstract page (CDX query returned nothing for journals.physiology.org and for ajpheart.physiology.org/content/269/2/H541). The PubMed abstract is truncated at 250 words."
notes = """All vessels developed active tone to about 67-73% of maximum diameter at 60 cmH2O; the abstract does not break this down by size within the 50-150 um range.
Flow-induced dilation was potentiated by adenosine 1e-10 M but not by nitroprusside 1e-10 M, so the potentiation is not a simple additive dilation.
Luminal glibenclamide abolished the adenosine-potentiated component of the flow response; luminal 40 mM K+ blocked flow-induced dilation completely.
Endothelial denudation, L-NMMA, high luminal K+ and luminal glibenclamide each shifted the adenosine ED50 right by an order of magnitude, i.e. roughly a tenth of the adenosine dilation at submaximal doses is endothelium- and KATP-dependent. Nitroprusside was unaffected by all of these."""
use_in_model = """Supports treating adenosine sensitivity and flow sensitivity as coupled rather than independent in arterioles of 50-150 um: a subthreshold adenosine concentration raises the gain of the flow response. Also a second porcine estimate of resting tone at ~44 mmHg (active diameter 67-73% of passive, i.e. passive/active ~1.4-1.5), consistent with the 63-67% of kuo1995_longitudinal_gradient_shear_adenosine at 37-52 mmHg."""

