[meta]
id = "dong2025_iohexol_three_compartment"
data_type = "experimental"
validates = "Three-compartment population PK of IV iohexol in healthy adults with dense sampling from 10 min to 24 h: central and two peripheral volumes, intercompartmental clearances, renal clearance; NCA half-life, Vz, CL, recovery; dose linearity 259 vs 3235 mg."
species = "human"
preparation = "12 healthy volunteers (5 men, 7 women), median age 34 y (23-48), weight 77.3 kg (59.1-95.8), eGFR 100 mL/min/1.73 m2 (83.6-134). Randomized changeover, two fasting iohexol doses 7-14 days apart."
conditions = "IV iohexol 259 mg ('test') or 3235 mg ('reference'). Plasma at 10, 20, 30, 45, 60, 90 min and 2-24 h; urine to 24 h. LC-MS/MS (LLOQ 25 ng/mL). NONMEM 7.5."
verification = "FT"
access = "Open access (CC BY 4.0). Full text read from Europe PMC XML (PMC11788587) on 2026-10-16."
notes = """Three compartments beat two by 225 OFV points. No non-renal clearance. No dose effect on any parameter.
Sum V1 + V2 + V3: median individual EBE 15.1 L (11.5-18.8).
First sample at 10 min, so V1 (9.06 L) already includes space that equilibrates within ~10 min; the sub-10-min fast phase is not resolved.
Q2 (5.84 L/h) to V3 (4.34 L) is the 'intermediate' exchange; Q1 (0.221 L/h) to V2 (1.56 L) is a very slow pool.
The injection rate/duration is not stated beyond 'intravenous bolus'.
Iohexol plasma protein binding 1.5% (cited); MW 821 (Delanaye 2016, PMC5036902)."""
use_in_model = """Iohexol 10-60 min target in healthy adults: simulate the 3-compartment model (CLR 5.50 L/h, V1 9.06 L, Q2 5.84 L/h, V3 4.34 L, Q1 0.221 L/h, V2 1.56 L) from 10 min onward and compare with the model's plasma curve. Do not compare before 10 min. Complements hooper2025 (2-compartment) and meurer2015 (sampling from 1 min)."""

