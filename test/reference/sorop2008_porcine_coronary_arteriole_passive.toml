[meta]
id = "sorop2008_porcine_coronary_arteriole_passive"
data_type = "experimental"
validates = "Passive (papaverine) pressure-diameter curves, 10-120 mmHg, of isolated subendocardial and subepicardial swine coronary arterioles of ~200 um passive diameter at 60 mmHg, from healthy control swine and from swine with chronic LAD stenosis"
species = "pig (domestic swine)"
preparation = "Arterioles dissected from LAD and LCx regions, cannulated in a pressure myograph; passive pressure-diameter relations (10-120 mmHg) measured in the presence of papaverine 5e-5 M (passive inner diameter at 60 mmHg used as normalizer for drug responses). Active (myogenic) curves 20-120 mmHg in 20-mmHg steps after 30 min at 60 mmHg."
conditions = "Control swine (CON, LAD and LCx pooled) vs swine 3-4 months after a progressive LAD occluder (LAD = distal to stenosis, LCx = remote)."
verification = "mixed"
access = "Publisher PDF (Circ Res 102:795-803) from Wayback Machine capture 20231118195652 of https://www.ahajournals.org/doi/pdf/10.1161/circresaha.108.172528; text by pdftotext; Fig. 6A-B digitized visually from a 600 dpi render against the printed axis ticks."
notes = """Abstract: arterioles ~200 um passive inner diameter at 60 mmHg. Fig. 2 legend: stenosed-animal ENDO arterioles 192 +/- 15 um (LAD, N = 5) and 223 +/- 35 um (LCx, N = 4) passive inner diameter at 60 mmHg.
Fig. 6 diameters are normalized to the passive inner diameter at 10 mmHg. LAD ENDO arterioles distal to stenosis were stiffer (P < 0.05 vs LCx and vs control).
Derived here from the CON curves: D50/D100 = 1.207/1.277 = 0.945 (ENDO) and 1.229/1.279 = 0.961 (EPI); D10/D100 = 0.78.
Myogenic tone (Fig. 2) is shown only for stenosis animals (LAD vs LCx ENDO, n = 4-5) and is not digitized here; Dick et al. 2018 include it as the subendocardial order-7 data set (229 um)."""
use_in_model = """Second independent passive curve for ~200 um swine coronary arterioles: D/D100 ~0.95 at 50 mmHg, ~0.78 at 10 mmHg, matching Liao & Kuo/Dick composites and far stiffer than the Fry 2013 linear C'pass at D0 ~ 200-250 um."""

