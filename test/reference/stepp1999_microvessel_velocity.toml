[meta]
id = "stepp1999_microvessel_velocity"
data_type = "experimental"
validates = "Blood (tracer-microsphere) velocity vs diameter in subepicardial coronary small arteries and arterioles (40-430 um), at rest and during maximal adenosine vasodilation; derived wall shear stress"
species = "dog"
preparation = "48 adult mongrel dogs (5-15 kg), pentobarbital 30 mg/kg, open chest, high-frequency jet ventilation synchronized to the cardiac cycle, propranolol 1 mg/kg to slow the heart, four 22-gauge pins through the LV to limit vertical motion. Epicardial microvessels imaged by stroboscopic fluorescence intravital microscopy (FITC-dextran for diameter). Velocity from 10 um fluorescent microspheres injected into a coronary artery, triple-strobed within one video frame (8 ms between flashes); spheres within 5% of the diameter from the wall or out of focus excluded."
conditions = "Basal (beating heart, propranolol). Maximal vasodilation: intracoronary adenosine 25 ug/kg/min for 10 min (coronary flow 12 +/- 3 -> 62 +/- 10 mL/min, 5.3-fold). Also L-NMMA alone and L-NMMA + adenosine (summary values only). All velocities taken in mid/peak diastole (75% of the cardiac cycle)."
verification = "mixed"
access = "Publisher PDF (circ.ahajournals.org) read via Wayback Machine capture 20170817071219 of http://circ.ahajournals.org/content/circulationaha/100/14/1555.full.pdf; HTML full text via capture 20160728025939"
notes = """Velocity is the velocity of 10 um tracer microspheres moving in the focal plane away from the wall, measured in diastole only.
It is therefore closer to a diastolic near-centreline velocity than to the cycle-averaged mean velocity; the authors nevertheless used it
directly as v in tau = 4*v*eta/r. In 3 preliminary dogs diastolic velocity was 46% greater than systolic (7 vs 5 mm/s).
Fig. 2A (basal) and Fig. 3A (basal filled + adenosine open) are 300 dpi raster stencils inside the PDF; points were located by blob
detection and least-squares disk fitting for overlapping markers. Fig. 2A: all 19 points recovered (mean 7.1 mm/s, matches text 7 +/- 1).
Fig. 3A adenosine: 14 of the 16 points recovered (mean 14.5 mm/s vs text 15 +/- 1); 2 open circles are hidden behind filled basal markers.
Basal points also replotted in Fig. 3A agree with Fig. 2A to within ~3 um / 0.1 mm/s.
Vessel class split used by the authors: small arteries > 160 um, arterioles < 160 um."""
use_in_model = """Compare model diastolic (or, with a correction, mean) velocity in subepicardial arterial segments 40-430 um against basal_velocity_vs_diameter,
and under a maximal-dilation run against adenosine_velocity_vs_diameter. If the model reports cross-sectional mean velocity of Poiseuille
flow, the tracer velocity here is expected to exceed it (centreline = 2x mean for parabolic flow; blunted profiles in blood reduce this),
so compare the trend with diameter and the rest/adenosine ratio (~2.1x) rather than absolute values alone."""

