[meta]
id = "halliwill1999_limb_venous_compliance"
data_type = "experimental"
validates = "Whole-forearm (and calf) venous pressure-volume curve and venous compliance in healthy young adults by venous-collecting-cuff strain-gauge plethysmography; quadratic P-V model coefficients; agreement of cuff and antecubital intravenous pressure; resting antecubital venous pressure"
species = "human"
preparation = "22 healthy normotensive non-smoking volunteers (11 women, 11 men), 20-40 y; subsets per protocol. Mercury-in-Silastic strain gauge (Hokanson EC4) on the forearm 5 cm distal to the antecubital crease; collecting cuff on the upper arm 5 cm proximal to the crease. Study I (n = 7, 3 women): 22 G 5-cm antecubital catheter in the same forearm for intravenous pressure. Study II (n = 9, 5 women): simultaneous forearm and calf. Study IV (n = 11, 6 women): forearm and calf with and without sympathoexcitation."
conditions = "Supine, 15 min rest, arm slightly above heart level. Method: cuff inflated to 60 mmHg for 4 min (8 min in a repeat trial), then deflated at 1 mmHg/s to 0 mmHg; data 60 -> 10 mmHg in 2-mmHg steps; cuff pressure used as intravenous pressure."
verification = "FT"
access = "Full-text HTML (journals.physiology.org) read from Wayback Machine capture 20220120123149 of https://journals.physiology.org/doi/full/10.1152/jappl.1999.87.4.1555; Table 1 and figure-legend regression coefficients read from the HTML."
notes = """Model (Methods): delta_limb_volume [ml/dl tissue] = beta0 + beta1*P + beta2*P^2, P = cuff pressure (mmHg), fitted 60 -> 10 mmHg during deflation at 1 mmHg/s. Compliance = d(delta V)/dP = beta1 + 2*beta2*P [ml/dl tissue/mmHg].
beta0 lumps resting-pressure volume, hysteresis (wall creep, capillary filtration) and unstressed-volume shifts; only beta1 and beta2 describe compliance. Doubling the collection time (8 vs 4 min) raised beta0 but not beta1/beta2.
Units: 'ml/dl of tissue' = ml per 100 ml of forearm tissue at the gauge site (strain-gauge plethysmography; % volume change of the segment under the gauge).
Regression parameters are estimate +/- SE of the estimate; other values mean +/- SD (Methods).
Printed inconsistency: the Fig. 5 legend labels the 4-min CALF curve with the same coefficients as the Fig. 6 FOREARM curve (0.928 + 0.108 P - 0.00102 P^2), while the text gives calf beta0 (4 min) = 0.30. The Fig. 6 legend (forearm 0.928..., calf 0.296 + 0.111 P - 0.00094 P^2) matches the text, so those are stored for study II.
Resting antecubital venous pressure without cuff: 5.7 +/- 1.1 mmHg (n = 7). Intravenous pressure rose during a 60-mmHg collection at 0.54 +/- 0.36 mmHg/s (~147 +/- 68 s to reach 60 mmHg) and fell to resting levels in < 1 s on instantaneous cuff deflation.
Day-to-day CV of compliance 4.9% (4 subjects, 2 extra days). Compliance in the leg was higher than in the arm (P < 0.05)."""
use_in_model = """Sets the per-volume compliance of the arm venous reservoir: C_forearm(P) = beta1 + 2*beta2*P ml per 100 ml tissue per mmHg, using the forearm rows of quadratic_pv_fits (study II 4-min, or study IV control). Compliance falls with pressure (beta2 < 0), so a reservoir distended by an injection stiffens as it fills.
Whole-limb C = C_per_100ml x (limb tissue volume / 100); limb volume must come from elsewhere (e.g. buffa2015_upper_limb_volume); the forearm value applied to the whole arm is an assumption (upper-arm veins not measured here).
Resting antecubital pressure (5.7 mmHg) gives the reservoir's starting pressure; the < 1 s pressure fall on cuff release bounds the outflow time constant of the distended forearm veins from above."""

