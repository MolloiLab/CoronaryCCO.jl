[meta]
id = "chou1994_ivus_doppler_volumetric_flow"
data_type = "experimental"
validates = "Coronary volumetric flow from IVUS lumen cross-sectional area x k x Doppler guide-wire APV vs transit-time flow probe; best-fit mean/APV constant k"
species = "dog"
preparation = "4 dogs; femoral artery -> circumflex coronary shunt with in-line transit-time ultrasound (TTU) flow probe. 2D IVUS imaging catheter over a 0.014-in. Doppler guide wire in the LCx, wire tip 2 cm beyond the imaging catheter tip. CSA from IVUS, APV from Doppler wire."
conditions = "TTU flow 31-385 mL/min across 119 measurements (interventions not stated in abstract)."
verification = "abs"
access = "Abstract only (PubMed / Europe PMC). Elsevier full text not accessed."
notes = """Direct in vivo measurement of the mean/APV ratio in a coronary artery against an independent flow reference.
CBF = CSA x 0.5 APV correlated well; the adjusted constant 0.47 gave slope 0.9997, r = 0.99, bias minimal (SEE -6.7 +/- 8.6 as printed).
So measured mean/APV ~= 0.47 in canine LCx (with IVUS catheter in the vessel, which may perturb the profile).
How 0.47 was derived (regression on the same data vs separate fit) is not stated in the abstract."""
use_in_model = """Second in vivo estimate of mean/APV: 0.47 (vs 0.5 assumed, 0.425 implied by Doucette proximal LCx).
Contrast-front/mean = 0.63/0.47 = 1.34 using Stoel 2003."""

