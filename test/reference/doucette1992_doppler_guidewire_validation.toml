[meta]
id = "doucette1992_doppler_guidewire_validation"
data_type = "experimental"
validates = "Doppler guide wire time-averaged spectral peak velocity (APV) vs electromagnetic-flowmeter flow, and the mean velocity = 0.5 x APV rule for volumetric flow (Q_D = pi D^2/4 x 0.5 APV) in model tubes and canine LCx"
species = "dog (in vivo); bovine blood in plastic tubes (in vitro)"
preparation = "In vitro: heparinized bovine blood, pulsatile roller pump, straight tubes i.d. 0.79, 1.59, 3.17, 4.76, 7.94 mm; wire advanced 20-60 cm (>20 diameters) for fully developed flow; in-line EMF calibrated by timed collection; 8-14 paired points per tube. Tortuous 3.17-mm model with 1, 1/2, 1/4 in. bend radii. In vivo: 4 mongrel dogs (20-36 kg), pentobarbital, open chest; femoral artery -> LCx shunt with in-line EMF and steel cannula (i.d. 2.9 mm) tied into proximal LCx; proximal-LCx branches ligated so EMF flow = LCx flow. 12-MHz 0.018-in. Doppler guide wire (Cardiometrics prototype), sample volume 5 mm beyond tip. Diameter at sample volume by single-plane QCA (Brown method, circular lumen assumed)."
conditions = "LCx flow 0-180 mL/min varied by graded clamping, reactive hyperemia and IC papaverine 8 mg. Spontaneous HR 68-130 bpm; atrial pacing 150 bpm in 3 dogs. APV = manual trace of 2-s spectral envelope, forward and reverse traced separately."
verification = "FT"
access = "Scanned full-text PDF (14 pp) from Wayback capture 20170903235728 of http://circ.ahajournals.org/content/circulationaha/85/5/1899.full.pdf; text layer read with pdftotext. Figures not digitized. Local copy only in scratchpad/pdfs_doppler/."
notes = """This is the primary source cited for 'mean velocity = 0.5 x APV'. The 0.5 factor is an ASSUMPTION (time-average parabolic profile,
Methods 'Quantitative Flow Calculations'), tested by the slope of Q_D vs Q_EMF. Slope 1.0 means mean/APV = 0.5 exactly.
In straight small tubes slope 1.00 +/- 0.04, so APV 'almost exactly twice the true mean velocity'.
In vivo the slope was below 1: 0.95 in the rigid cannula and 0.85 in the native proximal LCx (9 placements, 4 dogs), range 0.78-1.15.
Implied in vivo mean/APV = 0.5 x slope = 0.475 (cannula) and 0.425 (proximal LCx); this is my inference ignoring intercepts, not stated by the paper.
Authors warn the long unbranched cannula may have made the LCx profile MORE parabolic than native vessels, and that in irregular, branched
or ectatic vessels the peak/mean relation is 'even more inconsistent'. Tortuous segments: APV underestimated expected by 3-24%; slope 0.82 in tightest bend.
Pulsatility (in vitro, 3.17 mm tube) changed APV by <= 10.4% from expected."""
use_in_model = """Convert Doppler APV to cross-sectional mean velocity with factor 0.5 nominal, plausible in vivo range ~0.43-0.5 (proximal canine LCx).
Combined with Stoel 2003 (FCV = 0.63 APV): contrast-front/mean = 0.63/0.5 = 1.26, or 0.63/0.425 = 1.48 if the in vivo LCx slope applies.
Q_D underestimates true flow by ~15% in native artery, so APV-based flows in other references may be low by that amount."""

