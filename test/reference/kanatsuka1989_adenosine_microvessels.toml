[meta]
id = "kanatsuka1989_adenosine_microvessels"
data_type = "experimental"
validates = "Which arterial microvessel sizes dilate for a metabolic stimulus (rapid pacing doubling MVO2) vs adenosine or dipyridamole at matched myocardial perfusion: size range of dilation (40-380 um with pacing; < 150 um only with adenosine/dipyridamole), inverse relation of % dilation to control diameter; hemodynamics, perfusion and MVO2 per group"
species = "dog"
preparation = "40 small mongrel dogs (3-10 kg), ketamine 20 mg/kg + isopromazine 0.2 mg/kg IM, alpha-chloralose 50 mg/kg + sodium borate 50 mg/kg IV; open chest, high-frequency jet ventilation, sinus node suppressed with formaldehyde and atrioventricular sequential pacing (AV interval 50 ms), aortic snare for pressure control. Anterior LV free wall partially restrained with 4-5 22-gauge needles. Subepicardial arterial microvessels imaged at end diastole by stroboscopic epi-illumination intravital microscopy (Leitz x6 and x10 objectives; resolution 8 and 5 um); arterial vs venous identified with FITC-dextran. Perfusion by 15-um radioactive microspheres; MVO2 from arterial and coronary sinus O2 saturation, hemoglobin and perfusion."
conditions = "Group 1 (n = 15): control vs rapid pacing 300 bpm. Group 2 (n = 15): control vs IV adenosine (0.1-0.4 mg/kg/min tested; mean dose 0.21 +/- 0.03 mg/kg/min). Group 3 (n = 10): control vs IV dipyridamole bolus (0.2-0.3 mg/kg; mean 0.23 +/- 0.02 mg/kg), doses chosen to match the pacing-induced perfusion increase. Large-dose arms: adenosine 1.1 mg/kg/min (n = 6) and dipyridamole 1.0 mg/kg (n = 5), giving 5- to 7-fold perfusion increases. Mean aortic pressure held within 10 mmHg of control. Measurements 5-15 min after each intervention."
verification = "FT"
access = "Publisher PDF (Circ Res 65:1296-1305) read from Wayback Machine capture 20220710031222 of https://www.ahajournals.org/doi/pdf/10.1161/01.RES.65.5.1296?download=true, text extracted with pdftotext; Table 1 checked against a 200 dpi page render (p. 1299). Abstract also read via PubMed E-utilities (PMID 2805245)."
notes = """All values mean +/- SEM.
Main findings (FT, Abstract, Results and Discussion):
(1) Rapid pacing (MVO2 about doubled) dilated nearly all arterial microvessels over 40-380 um; dilation was heterogeneous and inversely related to control diameter (smaller vessels dilated more), and vessels > 150 um still dilated significantly. Hindrance fell in all observed vessels.
(2) Adenosine and dipyridamole at doses matching the pacing flow increase did not change MVO2 and dilated only arterial microvessels < 150 um; vessels > 150 um showed no significant diameter change. Hindrance changes were restricted to vessels < 150 um.
(3) Even large doses (adenosine 1.1 mg/kg/min, dipyridamole 1.0 mg/kg; 5-7-fold perfusion) dilated only vessels < 150 um.
The authors note that the absence of dilation in vessels > 150 um does not prove that their tone did not fall, because their distending pressure probably fell with the higher flow.
Cyclic diameter change (end diastole vs midsystole) was -1.1 +/- 0.9% (n = 13) at HR < 150 bpm and 0.1 +/- 0.7% (n = 13) at 270-300 bpm in Results; the Discussion prints 1.1 +/- 0.9% and 0.1 +/- 0.6%.
Hindrance change (%) = (1/rx^4 - 1/rc^4)/(1/rc^4) x 100 as described in Methods (rc control, rx intervention radius).
Per-vessel % diameter changes (Figs 4, 6, 7, 8) and small/large class means (Figs 5, 9) are given only as figures and are not digitized here.
Regional perfusion and CVR in the restrained vs non-restrained wall (Table 2) are not transcribed."""
use_in_model = """Qualitative check for a size-dependent regulation model: a metabolic signal should dilate arterial segments across ~40-380 um with larger % dilation in smaller vessels, while an adenosine-like vasodilator acting at matched flow should dilate only segments < 150 um. Use group_hemodynamics to set the matched perfusion levels (roughly 1.6- to 1.9-fold rest) and MVO2 (pacing ~2.2-fold, adenosine/dipyridamole unchanged)."""

