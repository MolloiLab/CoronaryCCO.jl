# Singhal S, Henderson R, Horsfield K, Harding K, Cumming G (1973). Morphometry of the human
# pulmonary arterial tree. Tables 4 and 5 transcribed from a 220 dpi render of the scanned PDF.

[meta]
id = "singhal1973_human_pulmonary_arterial_tree"
data_type = "experimental (partly extrapolated by the authors)"
validates = "Whole-lung human pulmonary arterial tree by (classical, not diameter-defined) Strahler order 1-17: number of branches, diameter, length, end branches, fraction of capillary bed supplied, cross-sectional area, volume, cumulative volume and velocity at 80 mL/s."
species = "human"
preparation = "Both lungs of one 32-yr-old woman (death from uremia, no respiratory disease). Airspaces flushed with CO2, lungs inflated to near the top of the pressure-volume curve (20 cmH2O to hold volume), pulmonary artery perfused with saline at 25 cmH2O, then resin cast poured with surface 25 cm above the lung. All branches >= 0.8 mm measured; a sample of 0.8-0.1 mm branches measured; branches < 0.1 mm obtained by extrapolation of regression lines and by assuming order-1 count = number of alveoli (3 x 10^8)."
conditions = "Postmortem resin cast at full inflation."
verification = "FT"
access = "Publisher PDF (circres.ahajournals.org/content/circresaha/33/2/190.full.pdf) retrieved from the Wayback Machine capture 20170818051718; text by pdftotext; Tables 4-5 read from a 220 dpi page render."
notes = """Classical Strahler ordering (no diameter rule): order increases only when two equal orders meet. Not directly comparable per-order with Huang 1996 (diameter-defined); compare order-1 size, total count and ratios.
Three zones: proximal (>= 0.8 mm, all measured), intermediate (0.8-0.1 mm, sampled), distal (< 0.1 mm, extrapolated). Order-1 values (13 um, 0.13 mm, 3 x 10^8) are ASSUMPTIONS from extrapolation and the alveolar count, not measurements. The branching ratio jumps from 2.994 (orders 3-17, regression y = 3.7681 - 0.4763x) to 23.7 between orders 2 and 1, because precapillary vessels number 1-2 per alveolus and arise from arterioles along alveolar ducts and sacs.
Order-2 count (1.266 x 10^7) was matched to the number of alveolar sacs (11-12 x 10^6, Weibel).
Velocity column assumes pulmonary blood flow 80 mL/s spread evenly over the capillary bed.
Table 4 order-17 length is printed 90.50 mm (main pulmonary artery plus trunk as one element in this scheme)."""
use_in_model = """Whole-lung total arterial volume (150.91 mL, excluding capillaries), order-1 precapillary diameter (13 um, extrapolated) and count (~3 x 10^8, one per alveolus) bound the terminal density for growth. Use the 17-order cumulative volume curve to check the arterial compartment volume of the grown tree and the velocity column (at 4.8 L/min) for large-vessel velocities."""

