dose_levels_gI_per_kg = [0.3, 0.6, 0.9, 1.2]
concentration_mgI_per_mL = 300.0
distribution_half_life_min = 26.0
elimination_half_life_min = 131.0
volume_of_distribution_L_per_kg = 0.28
