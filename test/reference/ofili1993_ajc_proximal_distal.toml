[meta]
id = "ofili1993_ajc_proximal_distal"
data_type = "experimental"
validates = "Proximal-to-distal velocity ratio and coronary vasodilator reserve in angiographically normal human coronary arteries (Doppler flow wire)"
species = "human"
preparation = "Doppler angioplasty flow wire; baseline and hyperemic flow velocity in proximal and distal segments of 20 angiographically normal arteries (RCA 8, LCx 7, LAD 5) and 29 significantly stenosed arteries."
conditions = "Baseline and hyperemia (agent not stated in the abstract)."
verification = "abs"
access = "PubMed abstract (PMID 8488773). Full text (Am J Cardiol supplement) not accessible (Unpaywall: closed)."
notes = """Abstract: all 3 normal arteries had a diastolic-predominant velocity pattern proximally and distally, with significantly less diastolic
predominance in the RCA; coronary vasodilator reserve was similar in all three normal arteries and in proximal and distal segments.
The abstract reports CVR 2.3 +/- 0.8 for normal vs 1.6 +/- 0.7 for abnormal arteries (identical to the JACC 1993 abstract of the same group;
patient overlap with ofili1993_jacc_flow_velocity is likely but not stated)."""
use_in_model = """In a normal model tree, the ratio of proximal to distal epicardial mean velocity should be about 1.1 (velocity preserved distally).
The RCA should show less diastolic predominance than the left arteries when intramyocardial compression is modelled."""

[source]
authors = ["Ofili EO", "Labovitz AJ", "Kern MJ"]
year = 1993
title = "Coronary flow velocity dynamics in normal and diseased arteries"
journal = "Am J Cardiol"
volume = "71"
