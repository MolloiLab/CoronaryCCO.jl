[meta]
id = "edelson1984_iohexol_pharmacokinetics"
data_type = "experimental"
validates = "Plasma pharmacokinetics of IV iohexol in healthy men at high (urography-range) doses: renal and total body clearance, apparent volume of distribution, urinary recovery and its time course, three-compartment structure with a slow terminal phase."
species = "human"
preparation = "16 healthy men. Iohexol 346 mg I/mL IV at 500, 750, 1000 and 1500 mg I/kg (four volunteers per dose)."
conditions = "Single IV dose. Normal renal function implied by 'healthy'; GFR not in the abstract."
verification = "abs"
access = "Abstract only, via PubMed E-utilities (PMID 6470969). Full text (J Pharm Sci, Wiley) not accessible."
notes = """Clearances are given in mL/min (not per kg or per 1.73 m^2). Vd is in mL/kg.
An open three-compartment model fit best. The 12.6-h value is the gamma (terminal) phase half-life. The alpha- and beta-phase half-lives are not in the abstract.
The Vd of 165 mL/kg is lower than the 0.27 L/kg of olsson1983_iohexol_pharmacokinetics; the abstract does not say which Vd definition (steady-state, area or central) was used.
Neither clearance nor percent excreted correlated with dose."""
use_in_model = """Renal clearance of iohexol in healthy men is about 120 mL/min (total 131 mL/min), close to GFR. Use as the renal sink in the whole-body model. Only 92.3% of the dose was recovered in urine, 89.9% within 12 h, and a 12.6-h terminal phase exists, so a small slowly exchanging pool is present. That pool matters for scans repeated hours later, not for a 5-15 min CT protocol."""

