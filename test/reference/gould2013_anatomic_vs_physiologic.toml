[meta]
id = "gould2013_anatomic_vs_physiologic"
data_type = "experimental (review summary)"
validates = "Literature-pooled PET rest flow, stress flow and CFR by population (normal controls through established CAD), PET ischemic CFR and stress-flow cutoffs by radionuclide, and the qualitative relation between percent stenosis, FFR and coronary flow capacity; definition and mechanism of myocardial steal with collaterals"
species = "human"
preparation = "State-of-the-art review (multi-society PET authors). Table 1 pools 14,962 subjects from 252 unique publications (N-13 ammonia 5,541; O-15 water 3,161; Rb-82 6,175) over nearly 25 years, 15 countries, many scanners, stress agents and flow models."
conditions = "Mixed vasodilator stress agents and radionuclides (per source publication)."
verification = "FT"
access = "Full text HTML (J Am Coll Cardiol, Elsevier open archive) read from Wayback Machine capture 20200205145627 of http://www.onlinejacc.org:80/content/62/18/1639; Tables 1 and 2 from captures of .../content/62/18/1639/T1 and /T2 (footnotes included). Online Appendix (per-paper table) not read."
notes = """Table 1 values are pooled across publications; the paper does not say in the text read whether the +/- values are SDs across studies or pooled subject SDs. The small rest-flow SDs (0.06-0.18) suggest SDs of study means; treat them as such.
'Normal controls' are as defined by each source paper; the review warns that up to 50% of otherwise 'healthy' volunteers may have unrecognized risk factors.
CFC map colors in this review: high flow of normal volunteers (red); intermediate flows split into upper (orange) and lower (yellow) halves; mixed signs of ischemia, angina or ECG change but not both (green); at or below the definite ischemic threshold (blue or purple); transmural scar (black). Thresholds as in Johnson & Gould 2011/2012.
Percent stenosis vs flow: the review states a pronounced curvilinear relation between % stenosis and CFR for idealized experimental stenoses, but wide variability clinically (diffuse disease, multiple stenoses, remodeling). It gives no mapping from % diameter stenosis or FFR to CFC category.
FFR vs flow: ~40% discordance between FFR and CFR measured invasively (literature). Schematic example: mild diffuse disease lowers absolute CFR from 4.2 (young volunteers) to 2.7 (patients > 40 y with risk factors) with FFR staying high; a discrete stenosis can lower FFR to 0.65 while absolute CFR stays 2.7.
Myocardial steal: established feature of collateralized myocardium distal to chronic occlusion; stress perfusion falls below rest because high flow in the narrowed feeding artery lowers distal pressure at the collateral origins. With exceptionally well-developed collaterals there may be no steal, only limited CFR; rarely, collaterals give flow capacity comparable to native arteries.
Table 2 rows: the Danad 2013 O-15 entry (CFR cutoff 2.30, stress 1.86) differs from the Danad cutoffs quoted by de Winter 2022 (hMBF 2.3 mL/min/g, CFR 2.5); stored as printed here."""
use_in_model = """Global sanity targets for a healthy model heart under vasodilator hyperemia: pooled normal-control rest 0.82, stress 2.86, CFR 3.55 (all tracers pooled). Use tracer-specific references where possible (O-15 water reads higher stress flow than Rb-82). Ischemic cutoffs by tracer (ischemic_thresholds_by_tracer) show the spread a model-derived threshold should fall within."""

