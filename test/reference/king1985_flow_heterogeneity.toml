# King RB, Bassingthwaighte JB, Hales JRS, Rowell LB (1985). Stability of heterogeneity of myocardial blood
# flow in normal awake baboons. Full text read from the NIH author manuscript in PMC (PMC3426898, HTML;
# tables are HTML text). Relative dispersion RD = SD/mean of piece flows, pieces of about 0.17 g.

[meta]
id = "king1985_flow_heterogeneity"
data_type = "experimental"
validates = "Regional flow heterogeneity (RD) at about 0.17 g piece mass in whole heart, LV, RV and atria of awake primates; split into observed, temporal ('twinkling'), methodological and spatial components. Also mean LV/RV/atrial flow relative to whole-heart flow."
species = "baboon"
preparation = """13 male adolescent baboons (Papio anubis), 8.2-15.5 kg; 11 awake, sitting in primate chairs (rest/feeding, mild leg exercise or whole-body heating), 2 lightly anesthetized methodological controls. 15 +/- 3 um microspheres (0.5e6/kg) injected into the LV apex over about 40 s, up to six labels at intervals of 20 min to several hours, arterial reference sampling. Hearts cut into 204 locatable pieces: LV 168 (4 rings x 8 sectors (apical ring 4) x 6 transmural slices), RV 27, atria 9. LV slice weights 0.032-0.737 g, mean about 0.17 g."""
conditions = "Awake, conscious, no vasodilator. Heat stress and mild exercise did not change total myocardial flow significantly, so test and control states are physiologically similar (paper Methods)."
verification = "FT"
access = "NIH author manuscript, PMC3426898, read as HTML (pmc.ncbi.nlm.nih.gov article page)."
notes = """
Abstract gives spatial RD corrected for method scatter and temporal variation: 0.33 +/- 0.06 whole heart (n = 67), 0.26 +/- 0.07 LV, 0.32 +/- 0.11 RV, 0.22 +/- 0.19 atria; temporal RD per piece 0.11 +/- 0.03 whole heart (n = 2040), 0.09 +/- 0.03 LV, 0.15 +/- 0.05 RV, 0.23 +/- 0.06 atria. These abstract values differ slightly from the Results/Table values stored below (Table 3 LV RD_temporal = 0.114); both are in this file, abstract values in abstract_corrected_rd.
Results text computes LV RD_spatial = sqrt(0.283^2 - 0.114^2) = 0.26 and whole heart 0.333 (the printed formula for the whole heart contains a typo, '0.57^2').
Method noise (six labels injected simultaneously in one awake baboon): RD_method 6.7 +/- 1.0% in LV (n = 504) and 6.5 +/- 1.0% whole heart (n = 720). LV RD_twinkle = sqrt(0.114^2 - 0.067^2) = 0.092.
Pooled density function of all 13 hearts (Fig. 4 legend): RD whole heart 0.38, LV 0.30, RV 0.31, atria 0.17; LV mass fraction 0.70 with relative flow 1.14, RV 0.20 and 0.81, atria 0.10 and 0.41.
Distributions were nearly symmetric but leptokurtic. Flow pattern stable over hours: mean correlation between states 0.86 +/- 0.07 (control-control, n = 21), 0.83 +/- 0.10 (control-test, n = 65), 0.86 +/- 0.09 (test-test, n = 33).
9 vs 15 um spheres and LA vs LV injection gave similar RD (0.34 +/- 0.024, n = 8).
"""
use_in_model = """Voxelize the model LV into pieces of about 0.17 g (match the paper's ~15 x 10 x 1 mm transmural slices if possible), compute RD of piece flow; compare with LV RD_spatial about 0.26 (method- and temporal-corrected) and RD_obs 0.28. Model flows are noise-free and static, so the spatial value is the right target. Use region_mean_flow_relative for LV vs RV perfusion if the model includes RV."""

