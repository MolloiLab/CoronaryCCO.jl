[meta]
id = "miura2001_human_coronary_flow_induced_dilation"
data_type = "experimental"
validates = "Magnitude of flow (shear)-induced dilation of isolated human coronary arterioles, and the degree of spontaneous myogenic tone those vessels develop; human counterpart to the porcine flow-dilation data of Kuo and co-workers."
species = "human"
preparation = "Right atrial appendage and ventricular tissue from 77 patients at cardiac surgery. Arterioles dissected from the endocardial surface of the appendage or the epicardial surface of the ventricle, cannulated at both ends with matched glass micropipettes (30-40 um tip ID), Krebs solution recirculated at 30 mL/min, 37 C, videomicroscopy. Smooth-muscle membrane potential recorded simultaneously with a glass microelectrode in some protocols."
conditions = "Both reservoirs held 81.6 cmH2O (60 mmHg) above the vessel; flow generated by moving the reservoirs equally and oppositely, so intraluminal pressure is unchanged. Vessels pre-constricted with endothelin-1 1e-10 to 5e-10 mol/L to 30-50% of passive diameter. Diameter read at pressure gradients of 5, 10, 20 and 100 cmH2O. Maximum diameter from sodium nitroprusside 1e-4 mol/L."
verification = "FT"
access = "Publisher PDF (Circulation 103:1992-1998) from Wayback Machine capture 20231208051944 of https://www.ahajournals.org/doi/pdf/10.1161/01.cir.103.15.1992; text extracted with pdftotext -layout. Figures not digitized; only numbers printed in the running text are recorded."
notes = """Data are mean +/- SEM; n is the number of patients.
Dilation is expressed with 100% representing the full change from the endothelin-1-constricted diameter back to the maximal (nitroprusside) diameter, NOT as a percent change in raw diameter. This differs from the convention in the porcine isolated-vessel literature (percent increase over resting diameter), so the two are not directly comparable.
Flow-induced dilation was abolished by mechanical endothelial denudation, reduced by cytochrome P450 inhibition (miconazole, 17-ODYA) and by charybdotoxin, unaffected by indomethacin or glibenclamide, and only modestly reduced by L-NAME and only in patients without coronary artery disease.
Age was an independent predictor of reduced flow-induced dilation on multivariate analysis.
These are mostly atrial, not ventricular, microvessels; only 4 of 103 vessels were ventricular, and the two did not differ."""
use_in_model = """Human check on the size range and magnitude of coronary flow-induced dilation. A ~91-um human coronary arteriole at 60 mmHg recovers about 69% of its endothelin-constricted tone when flow is raised to ~14 uL/min, and these vessels carry 10-50% spontaneous myogenic tone before any constrictor is added. The paper gives ONE pooled size class (40-212 um), so it cannot be used to make flow sensitivity a function of diameter; use kuo1995_longitudinal_gradient_shear_adenosine for that and this source as the human magnitude anchor."""

