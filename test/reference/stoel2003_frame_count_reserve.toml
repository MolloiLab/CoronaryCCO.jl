[meta]
id = "stoel2003_frame_count_reserve"
data_type = "experimental"
validates = "TIMI frame count at rest and during IV adenosine hyperemia in the LAD and LCx, guidewire-measured catheter-tip-to-landmark path length, frame count velocity (path length / transit time) vs simultaneous Doppler average peak velocity, and the implied resting and hyperemic volume flow"
species = "human"
preparation = "38 patients with stable angina or for diagnostic angiography/PCI (Free University Amsterdam). At least one of LAD/LCx visually normal; all TIMI 3 flow. 7F guiding catheters without side holes; ionic contrast (Hexabrix); MANUAL injections through the contrast-filled guide, synchronized to an acoustic heartbeat signal; Philips Integris 3000 at 25 frames/s. Doppler wire (Cardiometrics) in a normal proximal segment. Path length measured by marking a guidewire placed 1-3 mm into the TIMI landmark and pulled back to the catheter tip (Gibson 1997 method)."
conditions = "Intracoronary nitroglycerin 0.2-0.4 mg > 5 min before angiography (epicardial vessels dilated). Angiography >= 2 min after the last contrast injection 'to prevent reactive hyperemia attributable to ischemia or contrast agent'. Hyperemia: IV adenosine 140 ug/kg/min for >= 3 min. During adenosine MAP fell 100.7 +/- 10.8 -> 93.4 +/- 10.4 mmHg and HR rose 67.4 +/- 9.0 -> 76.3 +/- 9.9 bpm. 71% on beta-blockers."
verification = "FT"
access = "Full-text HTML (Methods, Results, Tables 1-3, Discussion) read via Wayback Machine capture 20231119033755 of https://www.ahajournals.org/doi/10.1161/01.CIR.0000074279.44131.DE. Tables are HTML text, not images. Figures 1-3 (scatter plots) not digitized."
notes = """TFC at 25 frames/s (multiply by 1.2 for 30 fps, as the paper notes). TFC is uncorrected (LAD not divided by 1.7).
Frame count velocity FCV = guidewire length * 25 / TFC (cm/s); volume flow = FCV * pi * (proximal QCA diameter / 2)^2.
Key relation: FCV / Doppler APV = 0.63 for the whole population (FCV vs APV r = 0.75, n = 174). APV is the Doppler spectral PEAK velocity;
the paper notes that mean velocity is about 0.5 * APV, so the contrast front moves at roughly 1.26x the cross-sectional mean velocity
(an inference from 0.63 / 0.5, not stated as such in the paper).
LAD/LCx TFC ratio 1.4 vs length ratio 1.3: once TFC is divided by path length, LAD and LCx velocities, flows and resistance are equal.
Hyperemia shortens TFC ~3x (FCR 3.3 in arteries without >50% stenosis) and the front can then cross the artery within one diastole,
which the authors say inflates FCR relative to CVR above ~3.
Injection was manual; the paper cites Dodge 1998 for the minor impact of injection rate. Injection rate and volume are not reported.
Mean QRS-to-first-TFC-frame interval 0.38 +/- 0.09 s (injections began near the end of the T wave, just before diastole).
Related abstracts (not tabulated here): Manginas 1999 (doi 10.1016/s0002-9149(99)00149-6) found FCR with IC adenosine correlated well with
Doppler CFR; Tanedo 2001 (doi 10.1002/ccd.1203; 46 heart-transplant LADs) found TFC correlates with Doppler APV (r = -0.42) but NOT with
Doppler x IVUS volume flow (r = -0.01); Chugh 2004 (doi 10.1016/j.jacc.2004.05.048) found no CTFC-CFVR correlation after PCI."""
use_in_model = """(1) Resting transit: compare model ostium-to-landmark arrival time with basal TFC/25 s and model path length with
guidewire_length_cm. (2) Hyperemic transit: rerun the model at adenosine flow and compare with hyperemic TFC (FCR ~3.3).
(3) Front-speed rule: model front arrival should correspond to ~0.63 * Doppler peak velocity, i.e. ~1.2-1.3x the mean velocity, not the
Poiseuille centerline (2x mean). (4) Volume flow per artery at rest ~1.1-1.2 mL/s (LAD, LCx) and ~3.5 mL/s at hyperemia.
Caveat: nitroglycerin was given, so epicardial diameters are dilated relative to the no-drug resting model."""

