# Bauer WR, Hiller KH, Galuppo P, Neubauer S, Kopke J, Haase A, Waller C, Ertl G (2001). Fast high-resolution
# magnetic resonance imaging demonstrates fractality of myocardial perfusion in microscopic dimensions.
# Isolated buffer-perfused rat hearts, perfusion-sensitive T1 maps at 140 x 140 um in plane, 1.5 mm slice.
# Full text read from a Wayback Machine snapshot of the HighWire full-text HTML (2004-02-22).

[meta]
id = "bauer2001_flow_heterogeneity"
data_type = "experimental"
validates = "Fractal dimension D of perfusion heterogeneity at sub-millimetre resolution (aggregation from 0.14 x 0.14 x 1.5 mm pixels up to 2.24 x 2.24 x 1.5 mm blocks), at three perfusion pressures and with nitroglycerin vasodilation."
species = "rat"
preparation = "Isolated Wistar rat hearts (300-350 g body weight), Langendorff perfusion with oxygenated Krebs-Henseleit buffer at 37 C, LV balloon (LVEDP 5 mmHg). Perfusion from slice-selective inversion T1 (1/T1 linear in perfusion). Fractal analysis: 4 non-overlapping 16 x 16 pixel squares in the LV wall per map; RD of 1/T1 for N = 256 pixels and N = 128, 64, 32, 16, 8, 4 blocks of neighbouring pixels; D from log RD vs log N (RD(N) proportional to N^(D-1))."
conditions = "Group 1 (5 hearts): perfusion pressure 100, 80, 50 mmHg. Group 2 (5 hearts): constant 100 mmHg, before, during and after nitroglycerin 0.5 mg/min. Crystalloid buffer, no red cells."
verification = "FT"
access = "Wayback Machine snapshot 20040222041749 of http://circres.ahajournals.org/cgi/content/full/88/3/340 (HTML full text)."
notes = """
Buffer-perfused hearts have much higher flow than blood-perfused hearts (microspheres: 13 +/- 1.3 mL/g/min initial perfusion of the imaged slice), so the absolute heterogeneity may differ from in vivo.
RD of the perfusion-sensitive T1 maps ranged 10% to 34% (Results), above the 2% relative error of T1 determination. RD here is of 1/T1, which the authors argue scales linearly with perfusion (Eq. 2); because 1/T1 includes a perfusion-independent offset (1/T1 at zero flow), the RD of 1/T1 is not numerically equal to the RD of perfusion, but D is.
Correlation coefficients of log RD vs log N were 0.90-0.98 (mean 0.96).
Pixel volume 0.14 x 0.14 x 1.5 mm = 0.0294 mm^3 (about 29 ug); 16 x 16 pixel square = 7.5 mm^3. The 1.5 mm slice is Gaussian-shaped.
Partition coefficient lambda = 0.83 +/- 0.003 (used in perfusion equation).
"""
use_in_model = """Within an LV region, aggregate model perfusion on a 0.14 x 0.14 mm in-plane grid through a 1.5 mm slab into 2^k blocks (k = 0..6) and fit log RD vs log N. Compare D with fractal_dimension (about 1.12, lower than the 1.2 of coarser microsphere studies). Note the preparation is a vasodilated-like buffer-perfused heart."""

[source]
authors = ["Bauer WR", "Hiller KH", "Galuppo P", "Neubauer S", "Kopke J", "Haase A", "Waller C", "Ertl G"]
year = 2001
title = "Fast high-resolution magnetic resonance imaging demonstrates fractality of myocardial perfusion in microscopic dimensions"
journal = "Circ Res"
volume = "88"
issue = "3"
pages = "340-346"
doi = "10.1161/01.res.88.3.340"
crossref_verified = "2026-10-14; Crossref title match (case differs only; vol 88, issue 3, 340-346)"
pmid = "11179203"

[data.fractal_dimension]
description = "Mean fractal dimension D of perfusion heterogeneity (from 1/T1 maps) per condition"
location = "Results, 'Analysis of Heterogeneity of Perfusion' (text)"
provenance = "FT"
statistic = "mean +/- SD"
condition = ["100 mmHg", "80 mmHg", "50 mmHg", "100 mmHg before nitroglycerin", "100 mmHg during nitroglycerin", "100 mmHg after nitroglycerin"]
fractal_D = [1.118, 1.119, 1.120, 1.124, 1.117, 1.154]
fractal_D_sd = [0.007, 0.017, 0.016, 0.02, 0.013, 0.01]
coronary_flow_ml_min = [nan, nan, nan, 16.2, 19.0, 15.3]
coronary_flow_sd_ml_min = [nan, nan, nan, 4.3, 4.1, 3.9]
n_hearts = [5, 5, 5, 5, 5, 5]
pixel_size_um = [140.0, 140.0, 1500.0]
missing_note = "Whole-heart coronary flow (ml/min, not per gram) given only for the nitroglycerin group; flows at 100/80/50 mmHg not stated numerically in text. The post-nitroglycerin rise to 1.154 was significant."

[data.rd_range]
description = "Range of relative dispersion of the perfusion-sensitive T1 maps"
location = "Results, 'Analysis of Heterogeneity of Perfusion'"
provenance = "FT"
range = [10.0, 34.0]
unit = "percent (RD of T1 map, pixel scale 0.14 x 0.14 x 1.5 mm)"
