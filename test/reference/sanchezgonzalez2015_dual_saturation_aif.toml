[meta]
id = "sanchezgonzalez2015_dual_saturation_aif"
data_type = "experimental"
validates = "Saturation-recovery delay at which blood signal stops tracking high [Gd] (phantom to 22 mM; in vivo aortic first pass after 0.1 mmol/kg); R2* at peak"
species = "pig"
preparation = "3 T Philips Achieva TX. Phantom: 15 tubes of Gd-DTPA in water 0-22.5 mM; single-shot TFE TR/TE/FA 2.26/1.07 ms/15 deg; TS = 10-90 and 200 ms; signal normalized to PD image. In vivo: healthy pigs, 0.1 mmol/kg Gd-DTPA at 3 mL/s + 20 mL saline, 6 TS (3.2-328.2 ms) and 4 TE (0.8-3.8 ms) in slices along the descending aorta every second. 11 pigs (6 post-MI, hyperemia models) compared dual-saturation (AIF TS 20 ms, tissue TS 100 ms) with dual-bolus (0.01 and 0.1 mmol/kg)."
conditions = "Anesthetized pigs; phantom"
verification = "FT"
access = "Europe PMC fullTextXML of PMC4332925 (CC BY), read 2026-10-16."
notes = """Phantom: at TS 10 ms S/SPD rose linearly with [Gd] (R2 = 0.986); for TS above 40 ms the signal fully recovered at high [Gd] (S/SPD near 1), saturating the response. In vivo (aorta, single 0.1 mmol/kg bolus): with longer TS the signal reaches a plateau that cannot track the highest concentrations, while short-TS signal follows the bolus. Authors conclude TS < 30 ms is needed to avoid AIF saturation, and that TS 200 ms resolves only [Gd] below ~4.24 mM (R1 13.95 Hz).
Upper phantom [Gd] 22 mM was chosen as the upper limit observed in humans for 0.1 mmol/kg at 6 mL/s (cited work, not measured here).
Peak delta-R2* 39 Hz underestimated AIF 3.5% at TE 0.9 ms."""
use_in_model = "Places the linearity limit: standard SR readouts with TS ~100 ms saturate for blood [Gd] above a few mM, far below single-bolus peaks; peak plateau shape is shown in vivo."

