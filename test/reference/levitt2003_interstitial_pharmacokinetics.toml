[meta]
id = "levitt2003_interstitial_pharmacokinetics"
data_type = "model"
validates = "Whole-body PBPK parameter set for extracellular solutes in a 70-kg, 20%-fat 'standardhuman' (PKQuest): per-organ weight, water, interstitial (EDTA) water fraction, blood flow and interstitial albumin ratio; human steady-state and equilibrium volumes of distribution for mannitol, EDTA, inulin, sucrose, glucuronides and beta-lactams; animal and human per-tissue interstitial volume fractions; muscle capillary PS for inulin and protein-bound antibiotics; and the rule that sets every other organ's PS from the muscle PS."
species = "human (model parameters); rat, rabbit, cat, dog and man (Table 4 interstitial volumes)"
preparation = "Literature survey. Published human plasma curves (antecubital venous sampling, digitized with UN-SCAN-IT) refitted with PKQuest. Most data sets are group means treated as one 'average' subject; some are single subjects (N = 1)."
conditions = "Resting adult. Single IV bolus or infusion. Renal clearance is the only solute-specific adjustable parameter for flow-limited solutes; muscle fclear (hence PS) is added for permeability-limited solutes."
verification = "FT"
access = "Open access. Full text read from Europe PMC XML (PMC194216) on 2026-10-16. Tables 1 and 6 also checked against the BMC PDF text layout (bmcclinpharma.biomedcentral.com). The PDF is kept outside the repo."
notes = """KEY POINT: this paper does NOT give a per-tissue PS for EDTA. It treats EDTA (and mannitol, the glucuronides and weakly bound beta-lactams) as FLOW-LIMITED (fclear = 1) in every organ. Adding a permeability limitation did not improve the EDTA fit.
The only EDTA PS it quotes is a literature 'standard reference value' of about 5 mL/min/100 g for skeletal muscle, skin and subcutaneous tissue (citing Crone & Levitt 1984, APS Handbook). With resting muscle flow 2.25 mL/min/100 g this gives fclear 0.89 by eq. 6. It also cites EDTA muscle PS 5.0 (cat, Watson 1995) and 12.9 mL/min/100 g (rat, Haraldsson & Rippe 1986), both at flows >= 10x resting.
Eq. 6: fclear_i = 1 - exp(-fP * PS_i / F_i), with fP the free plasma fraction and F_i 'the organ plasma volume flow (liters/min/Kg)'. The EDTA example in the Discussion plugs in the muscle BLOOD flow (2.25) although eq. 6 names plasma flow.
PKQuest default PS rule (Methods): liver, kidney and portal organs flow-limited; heart and lung PS = 50 x muscle PS; brain PS = 0 when fclear[muscle] < 1; all other organs (skin, tendon, other, adipose) PS = muscle PS. Only fclear[muscle] is input.
Inulin (MW ~5000) is permeability-limited: PS_muscle = 0.61 mL/min/100 g (fclear[muscle] = 0.409) and its interstitial volume is 0.42 x the EDTA volume (mecf = 0.42). Literature range quoted for inulin muscle PS: 0.59 to 1.62 mL/min/100 g.
The paper gives no explicit PS-vs-molecular-size law. Its only size statements: inulin PS ~ 1/8-1/10 of the EDTA reference, inulin volume about half of EDTA (Ladegaard-Pedersen & Engell: 48% smaller), and EDTA and beta-lactams 'are of similar size'.
Extracellular water is 17.46 L of 41.84 L total body water (42%). Skin + tendon + other hold 62% of extravascular ECF water and dominate whole-body exchange kinetics.
Organ flows were fine-tuned to fit solute data; muscle 2.25 mL/min/100 g (D2O fit), adipose 4.4 mL/min/100 g (enflurane fit), tendon 1 mL/min/100 g. Cardiac output 5.62 L/min.
'Bone' is the inert solid only (no water, no flow); skeletal water and flow are distributed among the other organs. 'Blood' volume includes intra-organ blood, so organ values are extravascular.
Antecubital vein blood is modelled as about 10% muscle, 20% skin, 5% other, 5% adipose and 60% A-V anastomoses (refined in levitt2004_arterial_antecubital_difference). Antecubital Vss is 4-10% above arterial Vss."""
use_in_model = """Use Table 6 as the physiological prior for per-bed interstitial volume (ecf water) and flow. Do not cite this paper for an EDTA PS per tissue: it has none, and it models EDTA as flow-limited. If a PS is wanted, start from the muscle reference (~5 mL/min/100 g for EDTA, or a human measurement such as keiding1988), apply Levitt's rule (skin, tendon, other, adipose PS = muscle PS per 100 g; heart, lung 50x; liver, kidney, gut flow-limited), then scale for solute size (see haraldsson1986 and keiding1988). Compare: the bed values under review (muscle 4000 mL, skin 1300, fat 2000, other 1500, bone 1500) vs Table 6 ecf water (muscle 3042, skin 1092, adipose 3500, other 3756 + tendon 2550, bone 0)."""

