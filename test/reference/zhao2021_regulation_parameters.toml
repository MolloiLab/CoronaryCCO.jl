[meta]
id = "zhao2021_regulation_parameters"
data_type = "model"
validates = "Model input, not data: per-compartment vessel-wall mechanics parameters (collateral, large arteriole, small arteriole), RBC ATP-release and conducted-response parameters, O2-transport constants, and chronic remodeling/angiogenesis constants; model-predicted autoregulation ratios before and after a major arterial occlusion"
species = "rat (hindlimb model)"
preparation = "Theoretical compartmental (electrical-circuit) model of the rat hindlimb: central iliac artery, external+femoral artery branch, internal iliac branch, one collateral artery (COL), calf microcirculation of LA, SA, C, SV, LV compartments. Acute regulation by myogenic (wall tension), shear and conducted metabolic (RBC ATP release, upstream conducted signal) responses in COL, LA and SA; chronic arteriogenesis (passive diameter growth) and angiogenesis (capillary number growth). Krogh-cylinder O2 transport."
conditions = "Control state: M0 = 8.28 cm3 O2/100 cm3/min (moderate activity), no occlusion, aortic inflow pressure 140 mmHg, venous pressure 0. Occlusion: external/femoral artery diameter set to zero."
verification = "FT"
access = "NIH author manuscript NIHMS1756593 (PMC9128362) full-text XML via NCBI E-utilities efetch (db=pmc), read 2026-10-15. Europe PMC fullTextXML endpoint returned an error for this record. Tables read from the XML table markup; displayed equations are MathML in the XML."
notes = """Author manuscript, not the typeset version; numbers could differ from the final Microcirculation article if changed at proof.
Table 2 shading (acute-model parameters taken from Zhao et al. 2021 ref [10] vs new chronic parameters) is not preserved in the XML; the split below follows the text:
c0, HD, M0, HT, kd, Cback, S(0), C(0), R0, R1, L0 and the SCR geometry come from ref [10]; k0, beta, eta_i, kN, Nmax, Scrit are new.
Eq. 11: ATP release rate R(S) = R0*(1 - R1*S). Eq. 10 degradation term kd*pi*D*(C - Cback).
The conducted signal decays upstream with length constant L0 = 1 cm; it splits 0.5/0.5 between COL and the EF branch at xbif.
k0 and kN are printed with unit 's' in Table 2 although they enter Eqs. 12 and 14 as rates; kept as printed.
Nmax = 2.9e6 is stated in the text as 1.7x the control capillary number nc = 1.7e6 (a ~70% capillary-density increase after ligation).
Scrit = 0.33 corresponds to PO2 = 20 mmHg (text).
In Table 1, the LA values of Cact, C'act, C''act and Cmyo equal Carlson et al. 2008 Table 1 large-arteriole values; Cpass, D0 and C''tone differ."""
use_in_model = """Use Table 1 per-compartment values as an alternative parameter set for actively regulated arterioles (D0 = 60.6 um SA, 140 um LA, 266 um collateral),
and Table 2 values (R0, R1, kd, Cback, L0, Cmeta = 30) for an ATP-based conducted metabolic signal. The autoregulation ratios (flow at Pa+100 mmHg / flow at Pa)
are model predictions for rat calf, useful only as a sanity check that a tone-regulated model gives a ratio near 1.25 over a 100 mmHg step."""

[source]
authors = ["Zhao E", "Barber J", "Sen CK", "Arciero J"]
year = 2021
title = "Modeling acute and chronic vascular responses to a major arterial occlusion"
journal = "Microcirculation"
volume = "29"
issue = "1"
pages = "e12738"
doi = "10.1111/micc.12738"
crossref_verified = "2026-10-15; Crossref title exact match ('Modeling acute and chronic vascular responses to a major arterial occlusion'; Microcirculation vol 29 issue 1, article e12738; published online 2021-11-26; authors Zhao, Barber, Sen, Arciero)"
pmid = "34779082"
pmcid = "PMC9128362"

