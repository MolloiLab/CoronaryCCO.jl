[meta]
id = "ashikawa1986_microvessel_velocity"
data_type = "experimental"
validates = "Phasic red-cell velocity pattern in subepicardial small arterioles, capillaries and small venules of the beating LV (timing of peak, fraction of flow during ejection)"
species = "dog"
preparation = "Open-chest anesthetized dogs; floating objective + high-speed cinematography of the superficial epimyocardium; LA pacing at 140 bpm."
conditions = "Baseline and dilazep 50 ug/kg i.v. (adenosine potentiator)."
verification = "abs"
access = "PubMed abstract (PMID 3815760) only; publisher PDF not reachable (ahajournals.org blocked; no Wayback PDF capture)"
notes = """Abstract-only; no absolute velocities or diameters in the abstract. Peak red-cell velocity occurred in mid-systole in small arterioles and
capillaries and in late systole in small venules; abrupt fall, often momentary stop or reversal, in the pre-ejection period. Small-venule diameter
increased in late systole; small-arteriole diameter nearly constant. Dilazep increased velocity throughout the cycle and dilated arterioles."""
use_in_model = """Phase-resolved check only (requires intramyocardial pressure coupling): fraction of the velocity-time integral during ejection by vessel type."""

[source]
authors = ["Ashikawa K", "Kanatsuka H", "Suzuki T", "Takishima T"]
year = 1986
title = "Phasic blood flow velocity pattern in epimyocardial microvessels in the beating canine left ventricle"
journal = "Circ Res"
volume = "59"
issue = "6"
pages = "704-711"
doi = "10.1161/01.res.59.6.704"
crossref_verified = "2026-10-14; Crossref title exact match ('Phasic blood flow velocity pattern in epimyocardial microvessels in the beating canine left ventricle.')"
pmid = "3815760"

[data.ejection_fraction_of_velocity_area]
description = "Percent of the total area under the red-cell velocity curve occurring during the ejection phase, baseline"
location = "Abstract"
provenance = "abs"
statistic = "as stated (central values)"
vessel = ["small arterioles", "capillaries", "small venules"]
pct_area_during_ejection = [51.0, 43.0, 40.0]
missing_note = "Absolute velocities, diameters, n and dispersion not available (abstract only)."
