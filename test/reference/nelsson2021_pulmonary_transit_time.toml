[meta]
id = "nelsson2021_pulmonary_transit_time"
data_type = "experimental"
validates = "Pulmonary transit time (PTT) of an intravenous contrast bolus and pulmonary blood volume (PBV = CO x PTT) by CMR: PA -> LA centre-of-gravity reference, and RVOT -> basal LV first-pass-perfusion methods (transit beats, peak-to-peak, centre of gravity) that also include the LA volume"
species = "human"
preparation = "58 participants (64 +/- 11 y, 24 women): 21 healthy controls and 37 patients referred for clinical CMR (ischemic heart disease, idiopathic HF, HFpEF, transplant, DCM, others); no severe valvular lesions. 1.5 T Siemens MAGNETOM Aera. CO from through-plane phase-contrast flow in the pulmonary trunk. Gadoteric acid 0.5 mmol/mL (Dotarem or Clariscan) at 4 mL/s followed by 20 mL saline in the same arm. Reference CoG(PA-LA): 2 mL bolus, saturation-recovery single-shot bSSFP in a plane through the main PA and LA, temporal resolution 100 ms. FPP: 0.05 mmol/kg bolus, basal short-axis slice through RVOT and LV, 1 image per heartbeat."
conditions = "Rest (both PTT sequences acquired at rest, at least 2 min apart; 55 of 58 also had adenosine stress perfusion, not used for PTT). Retrospective ECG gating."
verification = "FT"
access = "Europe PMC open-access full-text XML (PMC8554972), retrieved 2026-10-15 via the Europe PMC REST API; Tables 1-4 read from the XML."
notes = """PTT is reported only for all 58 participants pooled (Table 3); Table 2 splits PBV and PBVI by healthy vs patients but gives no group PTT.
CoG(PA-LA) is the validated reference (flow phantom, Ugander et al.); its PBV excludes the LA volume. The FPP methods measure RVOT -> basal LV and so include the LA volume; subtracting LAVmean (n = 50) removes most of their bias.
PTB(FPP) PBV = transit beats x RV stroke volume (RVSV 84.5 +/- 16.7 mL from PA flow); peak-peak(FPP) and CoG(FPP) PBV = PTT (s) x CO (mL/s).
CO by PA flow: 93.4 +/- 22.5 mL/s for all participants (Table 3); 5.5 +/- 1.2 L/min controls and 5.7 +/- 1.4 L/min patients (Table 1; Table 1 does not state which method gave this CO).
Injection arm (left or right) is not stated.
Statistic: mean +/- SD throughout; group differences by Mann-Whitney U."""
use_in_model = """Compare the model's pulmonary transit (main PA -> LA) centre-of-gravity delay with ptt_all.CoG(PA-LA) = 5.7 +/- 1.4 s, and its
pulmonary blood volume (PA + pulmonary capillaries + pulmonary veins, excluding LA) with 541 +/- 111 mL (healthy 526 +/- 87 mL; 282 +/- 43 mL/m2).
If the model is sampled RV(outflow) -> LV instead, compare with the FPP rows (about 7.1 s), which include LA volume and the LA/LV mixing delay.
Note the MRI bolus here is small (2 mL Gd at 4 mL/s) and CO ~ 93 mL/s; scale by the model CO (PBV = CO x PTT)."""

