[meta]
id = "reeves2005_human_pulmonary_distensibility"
data_type = "experimental (review summary)"
validates = "Pulmonary vascular distensibility alpha (fractional diameter change per mmHg) of the whole human lung circulation, estimated from published Ppa, Pw and flow during exercise."
species = "human"
preparation = "Review/re-analysis: a distensible-vessel hemodynamic model (Linehan et al. 1992) fitted to published Ppa, wedge pressure and cardiac output over a range of flows; 59 normal sea-level subjects; Operation Everest II (n = 6) and Duke chamber acute hypoxia (n = 8)."
conditions = "Rest and exercise; normoxia, chronic hypoxia, acute hypoxia."
verification = "abs"
access = "Abstract only (Europe PMC record, PMID 15695542). APS full text is behind a bot check."
notes = """The abstract states alpha ~ 0.02 /mmHg (2% diameter change per mmHg) for isolated large and small pulmonary arteries in vitro, and the human in vivo estimate matches it.
alpha tended to decrease with age in men > 60 y; it fell in chronic hypoxia (remodelling).
Related: Krenz & Dawson 2003 (Am J Physiol Heart Circ Physiol 284:H2192, doi 10.1152/ajpheart.00762.2002, Crossref-verified 2026-10-15) argue that diameter-independent distensibility preserves flow partitioning; its abstract gives no numeric alpha and its full text was not readable. Ebrahimi 2022 and Clark 2011 cite Krenz & Dawson for alpha = 1.49e-4 /Pa (see ebrahimi2022_pulmonary_model_parameters.toml)."""
use_in_model = """Distensible-vessel resistance for pulmonary arteries and veins: D = D0 (1 + alpha P_tm) with alpha = 0.02 /mmHg (young normal), so each vessel has R = R0 / (1 + alpha P_tm)^4 and the bed follows a fifth-power pressure-flow law. Use 0.008-0.014 /mmHg as a stiffer (hypoxic or older) bound. Check: model mPAP vs flow should rise less than linearly, with alpha ~ 0.02 /mmHg fitted from the curvature."""

[source]
authors = ["Reeves JT", "Linehan JH", "Stenmark KR"]
year = 2005
title = "Distensibility of the normal human lung circulation during exercise"
journal = "Am J Physiol Lung Cell Mol Physiol"
volume = "288"
issue = "3"
pages = "L419-L425"
doi = "10.1152/ajplung.00162.2004"
crossref_verified = "2026-10-15; Crossref title exact match (vol 288, issue 3, L419-L425; authors Reeves, Linehan, Stenmark)"
pmid = "15695542"

[data.distensibility_alpha]
description = "Distensibility alpha (fractional diameter change per mmHg)"
location = "Abstract"
provenance = "abs"
statistic = "mean +/- spread as printed (SD or SE not named for alpha); n = subjects"
group = ["normal sea level", "Operation Everest II baseline", "Operation Everest II chronic hypoxia", "Duke chamber normoxia", "Duke chamber acute hypoxia"]
alpha_mean_per_mmHg = [0.02, 0.022, 0.008, 0.014, 0.012]
alpha_spread_per_mmHg = [0.002, 0.002, 0.001, 0.002, 0.002]
n = [59, 6, 6, 8, 8]
isolated_vessel_alpha_per_mmHg = 0.02
fit_error_mmHg = 1.3
fit_error_se_mmHg = 0.1
missing_note = "The abstract writes 'alpha (0.02 +/- 0.002)' without naming SD or SE; the explicit '(SE)' label is attached to the 1.3 +/- 0.1 mmHg fit error. Age-band values and per-study data are in the full text, not read."
