[meta]
id = "cousins2002_bromide_dtpa_exchange"
data_type = "experimental"
validates = "Three-compartment-in-series volumes for 99mTc-DTPA (MW ~393) vs 77Br-bromide in humans, early forearm extraction fractions and the time to asymptotic net extraction (20-25 min)."
species = "human"
preparation = "Group A: 8 patients at diagnostic arteriography, frequent arterial samples to 40 min, antecubital samples 30 s after each. Group B: 8 GFR patients + 2 normal volunteers, frequent venous samples to 280 min. Simultaneous IV 99mTc-DTPA and Na 77Br-bromide."
conditions = "Bromide volumes corrected for red-cell uptake; intracellular bromide accumulation assumed."
verification = "abs"
access = "Abstract only, via PubMed E-utilities (PMID 11976804). Full text (Eur J Nucl Med Mol Imaging, Springer) not accessible."
notes = """Bromide/DTPA normalised venous ratio 0.56 (SD 0.08) at 1 min: smaller bromide leaves plasma faster.
Forearm plasma-to-interstitium extraction fraction: bromide about 0.6, DTPA about 0.5. Net extractions of both reached asymptotes with identical time courses over 20-25 min.
Volume of the second space is an inverse function of solute size; the third space a positive function.
DTPA total volume 18.0 L, of which first + second spaces 12.3 L and third space 5.8 L."""
use_in_model = """For a small chelate like EDTA/DTPA, about 12 L equilibrates within the first ~20-25 min and another ~6 L more slowly. A contrast model with only a fast-equilibrating ECF will miss the slower third space that shapes the 20-60 min plasma curve."""

[source]
authors = ["Cousins C", "Skehan SJ", "Rolph SM", "Flaxman ME", "Ballinger JR", "Bird NJ", "Barber RW", "Peters AM"]
year = 2002
title = "Comparative microvascular exchange kinetics of [77Br]bromide and 99mTc-DTPA in humans"
journal = "Eur J Nucl Med Mol Imaging"
volume = "29"
issue = "5"
pages = "655-662"
doi = "10.1007/s00259-001-0746-5"
crossref_verified = "2026-10-16; Crossref title exact match (vol 29, issue 5, 655-662; first author Cousins)"
pmid = "11976804"

[data.distribution_volumes]
description = "Distribution volumes of DTPA and bromide (group B) and early exchange measures (group A)"
location = "Abstract"
provenance = "abs"
