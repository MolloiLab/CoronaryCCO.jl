solute = ["99mTc-DTPA", "77Br-bromide (corrected)"]
total_volume_L = [18.0, 22.5]
total_volume_sd_L = [2.8, 3.8]
first_plus_second_space_L = [12.3, 13.9]
first_plus_second_space_sd_L = [2.0, 2.9]
third_space_L = [5.8, 4.1]
third_space_sd_L = [2.2, 2.8]
fraction_first_plus_second = [0.69, 0.78]
fraction_first_plus_second_sd = [0.09, 0.14]
