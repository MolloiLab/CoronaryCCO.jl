[meta]
id = "daghini2007_ct64_myocardial_permeability"
data_type = "experimental"
validates = "Myocardial microvascular permeability-surface area product (MPSP, Patlak model) and fractional vascular volume (FVV) for iopamidol in normal pig myocardium by EBCT and 64-slice CT, at baseline and during IV adenosine"
species = "pig"
preparation = "12 pigs studied with both EBCT and 64-slice helical CT (CT-64), in randomized order 1 week apart. Central-venous injection of iopamidol; myocardial time-attenuation curves analysed with indicator-dilution and Patlak models."
conditions = "Baseline and during intravenous adenosine infusion (dose not in the abstract)."
verification = "abs"
access = "Abstract only, via PubMed E-utilities (PMID 17414522). Full text (Invest Radiol, Lippincott) not open; Wayback Machine holds only redirects (HTTP 301) for the full-text URL."
notes = """Only baseline Patlak values are given numerically in the abstract. The adenosine response is described only as 'similar' between scanners, with no numbers.
Myocardial flow (mL/min/g) at which MPSP was measured is not in the abstract.
The authors conclude that indicator-dilution MPSP and FVV from CT-64 are unreliable (sensitive to scan duration), while Patlak values are feasible. Patlak MPSP is a unidirectional influx constant, not necessarily equal to a capillary PS from a distributed model.
Same lab (Mayo Clinic, Lerman/Ritman)."""
use_in_model = """Baseline (rest) iopamidol influx constant of ~0.37 mL/min/g in normal pig myocardium. Use as the PS of an iodinated agent in the model's capillary-interstitial exchange term. A Patlak Ki = E*F_plasma = F_plasma(1 - exp(-PS/F_plasma)) is below both PS and plasma flow, so it is a lower bound on PS. Combine with flow from another source; this abstract gives none."""

