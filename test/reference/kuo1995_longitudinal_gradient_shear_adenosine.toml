[meta]
id = "kuo1995_longitudinal_gradient_shear_adenosine"
data_type = "experimental"
validates = "Vessel-size-dependent sensitivity of isolated porcine coronary microvessels to shear stress (flow) and to adenosine, in four size classes from 40 to 180 um: percent dilation vs shear stress, adenosine thresholds and ED50 by size, and resting active tone as a fraction of maximum (nitroprusside) diameter."
species = "pig"
preparation = "Pigs 8-12 weeks. India ink-gelatin perfusion of LAD and LCx to visualise microvessels; four consecutive branch orders dissected at 4 C and cannulated at both ends with resistance-matched glass micropipettes (tip ID 20, 30, 40, 60 um for the four classes), PSS-albumin, 36-37 C, in situ length. Dual independent reservoirs allow flow (pressure gradient) to be set without changing mean intraluminal pressure, so flow responses are measured free of the myogenic response."
conditions = "Each class held at its own luminal pressure chosen from in vivo micropressure data: 50, 60, 70 and 80 cmH2O (36.8, 44.1, 51.5, 58.8 mmHg) for small arterioles, intermediate arterioles, large arterioles and small arteries. Flow steps at delta P = 4, 10, 20, 40, 60 cmH2O; shear stress computed as 4*eta*Q/(pi*r^3) with eta = 0.8 cp and r the pre-flow radius, spanning 0-10 dyn/cm2. Cumulative dose-response curves to substance P, adenosine and sodium nitroprusside at constant pressure with no flow. Maximum diameter from nitroprusside 1e-4 mol/L."
verification = "FT"
access = "Full text (HTML) from Wayback Machine capture 20170520022950 of http://circ.ahajournals.org/content/92/3/518; Abstract, Methods, Results and Discussion read in full. Table 1 (active and passive IDs per class) and Figures 1-5 are separate pages that are NOT in the capture, so only the numbers printed in the running text and abstract are recorded here."
notes = """Data are mean +/- SEM. ED50 obtained by Hill transformation of each vessel's dose-response curve; drugs applied to the bath.
Shear-induced dilation hierarchy: large arterioles > intermediate arterioles > small arterioles = small arteries. Large arterioles also regulated wall shear stress best (smallest slope of regulated vs theoretical shear stress).
Adenosine hierarchy is the reverse: sensitivity and magnitude fall as vessel size rises. Large arterioles and small arteries had identical adenosine dose-response curves.
Nitroprusside was identical in all four classes (threshold 1e-10 mol/L, ED50 9.2e-8 mol/L, maximum at 1e-4 mol/L), which argues the gradients are not an artefact of smooth-muscle cGMP sensitivity or of dissection damage.
Substance P: no ED50 difference among the three arteriolar classes; ED50 shifted right two orders of magnitude in small arteries."""
use_in_model = """Primary isolated-vessel source for making adenosine sensitivity and flow (shear) sensitivity functions of vessel diameter in a coronary network model. Adenosine EC50 rises steeply with size (small arterioles lowest threshold 1e-12 M; large arterioles and small arteries ~3e-7 M), while flow-induced dilation peaks near 100 um. Resting tone is ~63-67% of passive diameter for 40-106 um arterioles and ~74% for ~180 um small arteries, i.e. a passive/active diameter ratio of about 1.5 for arterioles and 1.35 for small arteries at in vivo pressures."""

