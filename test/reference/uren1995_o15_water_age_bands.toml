[meta]
id = "uren1995_o15_water_age_bands"
data_type = "experimental"
validates = "Human global LV myocardial blood flow by [15O]H2O PET at rest and during dipyridamole/adenosine hyperemia, and myocardial perfusion reserve, by decade of age (20-29 to 80-89 y) in normal volunteers."
species = "human"
preparation = "56 normal subjects (21 women, 35 men; 50 +/- 20 y, range 21-86) at low risk for CAD: no clinical history of CAD, normal examination, non-smokers, no cardiovascular medication, normal resting ECG and a negative high-workload treadmill test (subjects over 60 y recruited from a ballroom dancing class). Two centres: University of Louvain, Brussels (10 subjects; ECAT 911/01) and MRC Cyclotron Unit, Hammersmith, London (46 subjects; ECAT 931-08/12). MBF on transaxial images with 15O-water given as IV infusion (Louvain) or by 15O-CO2 inhalation (Hammersmith)."
conditions = "Rest, then hyperemia 2 min after IV dipyridamole 0.56 mg/kg over 4 min (n = 46) or during IV adenosine 140 ug/kg/min (n = 10). Heart rate and cuff blood pressure every minute. Corrected basal flow = basal flow x (group mean RPP / individual RPP)."
verification = "FT"
access = "Publisher PDF from jnm.snmjournals.org (J Nucl Med 36:2032-2036); abstract and text via pdftotext; Tables 1-2 read from a 110 dpi page render."
notes = """All values mean +/- SD.
Age-band counts in Tables 1-2 (10, 9, 10, 8, 7, 7, 5) differ from the abstract grouping (<30 y n = 11, 30-49 n = 18, 50-69 n = 15, >=70 n = 12).
Abstract totals: basal 1.00 +/- 0.26, hyperemic 3.31 +/- 1.38 mL/min/g, reserve 3.38 +/- 1.35; reserve 3.54 +/- 0.96 (<30), 4.23 +/- 1.35 (30-49), 3.51 +/- 1.21 (50-69), 1.94 +/- 0.46 (>=70).
Table 1, 20-29 band, hyperemic systolic pressure is printed '120 +/- 114' (likely 120 +/- 14); stored as nan.
Hyperemia is mostly dipyridamole; Chareonthaitawee 2001 found adenosine hyperemic MBF higher than dipyridamole in men (3.77 vs 3.11 mL/min/g), so these bands may be low for an adenosine target.
By sex (40-70 y subgroup analysis): hyperemic flow 3.73 +/- 1.47 (men) and 3.69 +/- 1.66 (women) mL/min/g."""
use_in_model = """Young-adult PET hyperemic MBF: 2.95 +/- 1.04 (20-29 y, n = 10) and 3.66 +/- 0.89 mL/min/g (30-39 y, n = 9), resting 0.86-0.88. Together with kaufmann1999 and chareonthaitawee2001 this brackets the PET adenosine/dipyridamole hyperemic target at ~3-4 mL/min/g with SD ~1."""

