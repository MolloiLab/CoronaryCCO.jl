[meta]
id = "bentley2020_healthy_exercise_pulmonary_hemodynamics"
data_type = "experimental"
validates = "Invasive pulmonary haemodynamics in healthy middle-aged adults at semiupright rest and steady-state submaximal cycling: mPAP, PA systolic/diastolic, PAWP, RAP, cardiac output, transpulmonary gradient, Rp (PVR), pulmonary compliance Cp and the RC time; healthy upper limits of dmPAP/dCO and dPAWP/dCO."
species = "human"
preparation = "36 healthy community volunteers (50% male, age median 55, IQR 50-60 y; BMI 25.3 +/- 3.0) with no cardiac or systemic disease, from a previous exercise-haemodynamics study; right heart catheterization with end-expiratory pressures at semiupright rest and during steady-state submaximal semiupright cycling (work rate 67 +/- 26 W). Compared with 85 dyspnoea patients (BREATH cohort), not stored here."
conditions = "Semiupright posture; submaximal steady-state exercise; end-expiratory PAWP."
verification = "FT"
access = "Open access full text (Europe PMC JATS XML, PMC7763717); Table 2 parsed from the XML table cells."
notes = """Only the healthy-control columns are stored. Rp in the healthy rest column is printed 0.07 +/- 0.22 mmHg.s/mL; the SD looks like a typo (the other columns have SD 0.02-0.05) but is kept as printed.
Healthy-derived upper 95% limits used for phenotyping: dmPAP/dCO <= 3.2 WU, dPAWP/dCO <= 2 mmHg/(L/min), exercise PP/PAWP <= 2.5.
Healthy dPAWP/dCO = 0.7 +/- 0.8 mmHg/(L/min)."""
use_in_model = """Inlet and outlet boundary conditions for a lung model: rest mPAP 17 +/- 3 mmHg, PAWP (left-atrial proxy) 11 +/- 2 mmHg, CO 4.8 +/- 0.8 L/min, transpulmonary gradient 6 +/- 2 mmHg; exercise (CO 11.2 L/min) mPAP 25 +/- 5, PAWP 15 +/- 5, TPG 10 +/- 3. The TPG/CO ratio checks total pulmonary vascular resistance (~1.2 WU at rest), and the fall of TPG/CO with exercise checks recruitment/distension in the capillary sheet model. RpCp time 0.39 s (rest) checks the lumped compliance."""

