conditions = "37 C; plasma is Newtonian (viscosity independent of shear rate)."
verification = "abs"
access = "Abstract only (Europe PMC record, PMID 18503132). Full text (IOS Press) not accessed."
notes = """Abstract: 'Its normal value is 1.10-1.30 mPa s at 37 degrees C and independent of age and gender.'
Plasma is a Newtonian fluid; viscosity is set by water content and macromolecules (fibrinogen, globulins); it is not influenced by hematocrit.
Raised in inflammation, unstable angina and stroke; elevation correlates with progression of coronary and peripheral artery disease."""
use_in_model = """Set plasma viscosity mu_p in [1.10, 1.30] mPa*s (= cP) at 37 C (no central value is printed in the abstract). Whole-blood apparent viscosity in each segment = mu_p x Pries relative viscosity(D, Hd)."""

