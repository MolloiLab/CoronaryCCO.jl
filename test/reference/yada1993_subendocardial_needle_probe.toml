[meta]
id = "yada1993_subendocardial_needle_probe"
data_type = "experimental"
validates = "First needle-probe videomicroscope observation of subendocardial arterioles and venules in the beating heart: end-diastolic vs end-systolic diameter by layer and size class (50-100 vs > 100 um)"
species = "pig"
preparation = "12 open-chest anesthetized pigs; sheathed needle probe with a doughnut balloon and flushing microtube introduced into the LV through the left atrial appendage and mitral valve; CCD camera, x200-400 on a 15-in monitor."
conditions = "Baseline only in the abstract (no vasodilator reported in the abstract)."
verification = "abs"
access = "PubMed abstract (PMID 8477527), truncated at 250 words. ahajournals.org returns HTTP 403 to scripted requests and no Wayback PDF capture was found."
notes = """Values mean +/- SD. Reported as phasic (cardiac-cycle) change, NOT rest vs vasodilation. The question of rest vs maximal dilation in < 40 um vessels is not addressed in the abstract.
Larger (> 100 um) subendocardial vessels narrowed more in systole than 50-100 um vessels (p < 0.05); percentages not in the abstract."""
use_in_model = """Context for compression rather than vasodilation: subendocardial arterioles narrow ~24% from end-diastole to end-systole; subepicardial arterioles ~2%. Diastolic diameters are the relevant 'rest' state for comparisons with Kanatsuka/Chilian end-diastolic data."""

