[meta]
id = "johnson2012_coronary_flow_capacity"
data_type = "experimental"
validates = "Coronary flow capacity (CFC) classification of each LV pixel or region from absolute stress perfusion (cc/min/g) and CFR: the ORIGINAL 2012 thresholds (normal, minimally reduced, mildly reduced, moderately reduced, definite ischemia, myocardial steal, transmural scar), the classification geometry, and the per-group distribution of CFC categories (% of LV) including 241 scans of young healthy volunteers"
species = "human"
preparation = "1,500 rest-stress cardiac PET studies in 1,249 subjects (April 2007 - June 2011), Weatherhead PET Center, Houston: young asymptomatic volunteers plus clinical patients across the whole CAD spectrum. Rb-82, PET with 16-slice CT for attenuation correction. 21 short-axis slices x 64 radial pixels; rest flow, stress flow and CFR per pixel; flow from the Yoshida/Mullani/Gould simple integrative model. 4 basal and 2 apical slices excluded from relative-uptake endpoints."
conditions = "Rest, then intravenous dipyridamole hyperemia. Rb-82. Thresholds for ischemia are from Johnson & Gould 2011 (dipyridamole, mostly Rb-82; see johnson2011_pet_ischemic_thresholds.toml); normal limits from young volunteers (Sdringola 2011)."
verification = "mixed"
access = "Full text HTML (JACC: Cardiovascular Imaging, Elsevier open archive) read from Wayback Machine capture 20200131224211 of http://imaging.onlinejacc.org:80/content/5/4/430; Table 1 and Table 2 from captures of .../content/5/4/430/T1 and /T2; Figure 1 from capture 20200729191709 of .../content/jimg/5/4/430/F1.medium.gif (440 x 363 px), viewed upscaled."
notes = """THE ORIGINAL (2012) CFC MAP. Axes: x = absolute stress flow (cc/min/g), y = CFR. Rest flow = stress/CFR, so lines through the origin are iso-rest-flow lines.
Classification geometry (Fig. 1, confirmed visually): the categories are NESTED RECTANGLES anchored at the origin. A point is in a given reduced category only if BOTH CFR and stress flow are below that category's upper bounds; it takes the most severe rectangle that contains it.
Equivalently: classify CFR and stress flow separately and take the LESS severe of the two classes. Example: CFR 1.5 with stress flow 2.0 is 'mildly reduced', not 'definite ischemia'.
Normal (red) = CFR > 3.37 OR stress flow > 2.39 (everything outside the orange rectangle), within the clinically observed rest-flow band.
Myocardial steal (dark purple/navy) = CFR < 1 inside the definite-ischemia stress-flow column (stress < 0.91). In Fig. 1 the dashed CFR = 1 line spans only that column. Points with CFR < 1 but stress flow >= 0.91 are drawn in the green/yellow columns, which extend down to the upper rest-flow boundary.
Transmural scar (black) = rest flow below the lowest iso-rest-flow line. The text lists the thick dashed iso-rest-flow lines as 0.2, 0.5, 1 and 2 cc/min/g, and says the lowest marks scar (>3 SD below mean rest flow in young volunteers) and the highest marks the upper limit of clinically observed rest flow. Fig. 1 shows the white dashed scar line reaching CFR 5 at stress flow ~1.0 (i.e. 0.2) and the black dashed upper line reaching CFR 2.5 at stress 5 (i.e. 2.0).
Nontransmural infarction is a separate overlay: relative uptake < 60% of maximum at both rest and stress, over a contiguous region >= 5% of the LV.
The 2012 normal limit is the young-volunteer mean minus 1 SD (CFR 3.37, stress 2.39). The minimal/mild split (CFR 2.70, stress 1.76) divides the band between normal and the moderately reduced thresholds.
LATER (2018 onward) Gould/Johnson papers use DIFFERENT cutoffs (normal CFR > 2.9 and stress > 2.17; minimal > 2.38 / > 1.82; mild > 1.6 / > 1.09; moderate > 1.27 / > 0.83; severe <= 1.27 / <= 0.83; steal CFR < 1; scar rest and stress <= 0.3). They are stored in gould2018_cfc_revised_thresholds.toml; do not mix the two sets.
The thresholds are empirical for Rb-82 with dipyridamole and the Gould flow model; the authors argue the concept transfers to other modalities, but O-15 water uses its own cutoffs (dewinter2022_o15_water_cfc.toml).
Case counts in Table 1 are scans, not unique subjects (repeat scans included)."""
use_in_model = """For a simulated heart, compute per-voxel (or per-segment) rest flow, hyperemic flow and CFR = stress/rest, then classify each voxel with category_thresholds_2012 using the nested-rectangle rule
(category = least severe of the CFR class and the stress-flow class), and report % of LV per category. A healthy model heart should resemble group 1 of cfc_distribution_by_group (young volunteers: median 99% normal, IQR 87-100; minimally reduced median 1%, IQR 0-12; no moderate, ischemic or steal pixels).
Whole-LV averages for the volunteers (rest 0.70 +/- 0.15, stress 2.71 +/- 0.58 cc/min/g, CFR 4.02 +/- 0.85) are the matching global targets. Model flows are true tissue flow; PET Rb-82 flows depend on the extraction model, so compare categories with that caveat."""

