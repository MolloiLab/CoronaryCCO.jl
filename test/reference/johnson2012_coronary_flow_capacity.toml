[data.category_thresholds_2012]
description = "Original CFC category bounds on the CFR-vs-stress-flow plot. Each reduced category is the region inside its own rectangle (CFR below cfr_upper AND stress flow below stress_upper) but outside the next more severe rectangle."
location = "Text, 'Integrating absolute flow with its thresholds' (p. 431-432); Figure 1"
provenance = "FT"
statistic = "thresholds (no dispersion)"
category = ["normal", "minimally_reduced", "mildly_reduced", "moderately_reduced", "definite_ischemia", "myocardial_steal"]
color = ["red", "orange", "yellow", "dark green", "dark blue", "dark purple"]
cfr_upper = [nan, 3.37, 2.70, 2.03, 1.74, 1.0]
stress_flow_upper_mL_per_min_per_g = [nan, 2.39, 1.76, 1.12, 0.91, 0.91]
basis = ["young asymptomatic volunteers; limit = mean - 1 SD (CFR 3.37, stress 2.39)", "upper half of the band between the normal limit and the moderately reduced thresholds; 'minimally reduced perfusion but no ischemia'", "lower half of that band (split at CFR 2.70, stress 1.76); 'mildly reduced perfusion but no ischemia'", "Johnson & Gould 2011 thresholds for indeterminate ischemia (only 1 of 3 ischemic features): CFR 2.03, stress 1.12", "Johnson & Gould 2011 thresholds for definite ischemia: CFR 1.74, stress 0.91", "CFR < 1: 'hyperemic' flow below basal flow"]
rule = "Nested rectangles anchored at the origin: severe category requires BOTH CFR < cfr_upper AND stress < stress_upper; a point takes the most severe rectangle containing it. Normal = outside the minimally-reduced rectangle (CFR > 3.37 OR stress > 2.39)."
rest_flow_scar_boundary_mL_per_min_per_g = 0.2
rest_flow_upper_clinical_boundary_mL_per_min_per_g = 2.0
rest_flow_boundary_note = "The text lists the thick dashed iso-rest-flow lines as 0.2, 0.5, 1 and 2 cc/min/g and says the normal rest range lies between the scar and upper boundaries, containing the 0.5 and 1 lines; which value is which boundary is read from Fig. 1 (scar line white, upper line black)."
missing_note = "The text does not state whether boundaries are inclusive (< vs <=). Steal is drawn only within the stress < 0.91 column (Fig. 1); the text defines it only as CFR < 1. Normal has no upper bound (nan)."

