
# Crapo RO, Jensen RL, Hegewald M, Tashkin DP (1999). Arterial blood gas reference values for sea level and an
# altitude of 1,400 meters. Healthy lifetime nonsmokers, arterial samples analyzed in duplicate on two blood-gas
# analyzers and two CO-oximeters. Full text read from a Web Archive copy of the publisher PDF.

[meta]
id = "crapo1999_arterial_blood_gas_reference"
data_type = "experimental"
validates = "Model input: normal arterial O2 saturation (SaO2, CO-oximetry) and PaO2 by age at sea level, and arterial hemoglobin concentration by sex, in healthy adults. Sets the inlet saturation and Hb for O2 transport."
species = "human"
preparation = "339 healthy lifetime nonsmokers aged 18-81 y (166 men, 173 women): 96 at sea level (Los Angeles, Hartford) and 243 at 1,400 m (Salt Lake City). Arterial puncture; each sample run on two blood-gas analyzers and two CO-oximeters; outliers excluded (1.8% of SaO2 values)."
conditions = "Resting, breathing room air. Sea level and 1,400 m altitude."
verification = "FT"
access = "Publisher PDF via Web Archive snapshot 2022-03-14 of atsjournals.org/doi/pdf/10.1164/ajrccm.160.5.9806006; read 2026-10-15. Tables 4 and 5 checked against 200 dpi page renders."
notes = """SaO2 correlated with age (r2 0.270) and barometric pressure (r2 0.312) but not with sex (r2 0.002, p = 0.45) (Table 3), so Table 4 pools men and women. Hb correlated with sex (r2 0.467), height and weight.
Sea-level men (n = 44) mean age 40.6 y (18-79), height 176.8 cm, weight 76.0 kg (Table 2).
SaO2 is CO-oximeter (fractional) saturation; mean sea-level COHb was 1.63 +/- 0.54% (Los Angeles 1.87, Hartford higher than Salt Lake City), which lowers fractional SaO2 slightly.
Reference equations (Tables 7, 8) not stored."""
use_in_model = """Inlet arterial saturation for a healthy young-to-middle-aged adult at sea level: SaO2 = 0.967-0.969 (Table 4, 18-44 y). This matches the S(0) = 0.97 assumed by Arciero et al. 2008. Hb for men at sea level 14.0 +/- 1.0 g/dL (n = 44); see beutler2006_hemoglobin_reference.toml for a much larger Hb sample."""

