# Kassab GS, Fung YC (1994). Topology and dimensions of pig coronary capillary network.
# Every number below was transcribed from the publisher PDF (local copy). First pass with pdftotext;
# every table (Tables 1, 2, 3, 5) and every quoted text number was then confirmed on 400 dpi page
# renders, and the parsed arrays were cross-checked against the OCR text by script.
# Table 4 (literature capillary diameters of other species) is not transcribed except for the pig rows,
# which repeat Tables 1-2. Units are in the key suffix.

[meta]
id = "kassab1994_capillary_network"
data_type = "experimental"
validates = "Lumped capillary beds of the CCO model: capillary segment diameter and length by segment type and ventricle, arteriole-to-venule functional length and traced path length, number of cross-connections per path, node-type mix, capillaries fed per arteriole element and drained per venule element by order, and whole-heart capillary counts."
species = "pig"
preparation = "Four farm pigs (Yorkshire x Duroc), 30.1 +/- 0.7 kg, 3-4 months. Same preparation as Kassab 1993: KCl-arrested, maximally vasodilated heart perfused with catalysed silicone elastomer (CP101) through the three major coronary arteries and hardened at physiological pressure. Twelve transmural plugs (about 4 x 4 mm) per ventricle per pig; 60-80 um serial sections, dehydrated and cleared; capillaries traced by optical sectioning (148 RV and 117 LV sections). Arteriolar/venular zone topology from additional full-thickness plugs (about 10 x 10 mm) of one further pig."
conditions = "Diastolic arrest (KCl), maximal vasodilation, silicone-elastomer cast hardened at physiological perfusion pressure (the companion arterial paper used 80 mmHg). Diameters are cast lumen diameters. Free walls of RV and LV reported separately; data of the four pigs pooled."
verification = "FT"
access = "Publisher PDF (journals.physiology.org, UC Irvine institutional download), local copy in the lab's validation-papers folder; tables read from rendered page images."
notes = """
Capillaries are order 0. C0a = capillary segments fed directly by arterioles ('arterial capillaries'); C0v = segments draining directly into venules ('venous capillaries'); C00 = the other capillary segments connecting C0a and C0v; Ccc = cross-connections between capillaries (the middle bar of an H node), which may join adjacent capillaries or capillaries from different arterioles. Segment = vessel between successive nodes. The network is not treelike.
Functional capillary length = straight-line distance between the centres of mass of adjacent arteriolar and venular domains. Capillary blood path length = traced curved length from arteriole to venule. The paper states the path-to-functional ratio is about 1.09 (RV) and 1.07 (LV) and that the path length is 8-10 times the segment length.
Table 3 C0a rows are given by ventricle (RV, LV), not by artery. The values equal the order 0 row of the Kassab 1993 connectivity matrices (RCA 2.75 +/- 0.082; LAD and LCX 3.18 +/- 0.118).
Internal inconsistency kept as printed: the Results text says RV order 4 arterioles give rise to 0.40 capillaries, but Table 3 prints 0.040 +/- 0.028. The table value is stored.
Capillary density (number per mm^2 or mm^3) is NOT reported in this paper.
Secondary sources compared with this original (an earlier version of this file used them):
(1) Wang et al. 2024 (Comput Methods Programs Biomed 243:107908, Table A1) segment diameters/lengths for ac, cp, cc, cv are exactly the LV values of Table 2 (C0a, C00, Ccc, C0v); Wang does not say they are LV.
(2) Wang et al. 2024 (J Appl Physiol 136:1157) quote the RV capillary path length as 547 +/- 180 um; the original is 547 +/- 228 um (n = 8). The LV value 550 +/- 203 um matches.
(3) Functional lengths 501 +/- 178 (RV) and 512 +/- 163 um (LV) match the original. Wang et al. 2025 (Comput Methods Programs Biomed 258:108486) print the RV value as 510 +/- 178, which is wrong.
(4) Gkontra et al. 2018 (Sci Rep 8:1854) attribute a smallest LV capillary diameter of 4.1 um and a largest pig capillary diameter of 8.2 um to this paper. Neither number is printed here; they equal LV Ccc mean - SD (5.5 - 1.4) and LV C0v mean + SD (7.0 + 1.2), not measured extremes. Dropped.
(5) Kaimovitz et al. 2010 (Am J Physiol 299:H1064) give capillaries per order 1 arteriole as 3.18 +/- 0.118 (LAD, LCx) and 2.75 +/- 0.082 (RCA), and 2.56 +/- 0.073 per order -1 venule; the values match Table 3, but the original labels the arterial rows LV and RV. Kaimovitz's 'cross-connected mesh of 18-30 capillaries' is not in this paper; the paper instead gives 8 +/- 2 (RV) and 9 +/- 2 (LV) cross-connections per arteriole-venule path. Dropped.
"""
use_in_model = "Lumped capillary bed: compare the equivalent capillary path between a CCO arterial terminal (order 1, about 9 um) and its venous terminal with functional_length (straight line, about 0.5 mm) and capillary_path_length (traced, about 0.55 mm). Compare equivalent capillary diameter with segment diameters (about 6 um; lumped 6.1-6.3 um). Compare capillaries fed per order 1 arteriole (2.75 RV, 3.18 LV) and drained per order -1 venule (2.56). A network capillary model should have about 8-9 cross-connections in series along each arteriole-to-venule path, spaced about 53-61 um apart."

