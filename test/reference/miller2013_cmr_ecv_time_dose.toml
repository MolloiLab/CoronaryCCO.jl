[meta]
id = "miller2013_cmr_ecv_time_dose"
data_type = "experimental"
validates = "Time course of myocardial ECV after an extracellular-contrast bolus in healthy adults: the myocardium-to-blood ratio from 2 to 20 min after Gd-DTPA, at three doses."
species = "human"
preparation = "30 healthy volunteers in three age- and sex-matched groups of 10 (15 male overall); 1.5 T; mid-ventricular short-axis MOLLI before contrast and every 2 min from 2 to 20 min after it; hematocrit measured the same day."
conditions = "Gd-DTPA bolus at 0.10 (group A), 0.15 (B) or 0.20 mmol/kg (C). Dynamic-equilibrium ECV from blood and myocardial T1 with the same-day hematocrit."
verification = "FT"
access = "Conference abstract (SCMR 2013), full abstract text read on PMC (PMC3559320), 2026-10-16. Per-time-point values are only in its Fig 1C and are not stored."
notes = """ECV rises slowly and linearly after the bolus in every dose group; the authors read this as an incomplete dynamic equilibrium between blood and myocardium.
The rise is small: about +1 to +1.6 percentage points over 2-20 min. Per-minute rates are not printed; from the endpoints they are about +0.06 to +0.09 points/min (computed here, not by the authors).
The direction is the useful part for a transport model: in healthy myocardium the ratio does NOT fall from a high early value; at 2 min it is already within about a point of its 20-min value.
Gd-DTPA (MW about 547) is a smaller extracellular agent than iohexol (MW 821); T1-based ECV assumes fast water exchange."""
use_in_model = """Qualitative and semi-quantitative check of washout dynamics: after a bolus of an extracellular agent, the healthy myocardium-to-blood ratio converted to ECV changes by only about +1 to +1.6 points between 2 and 20 min. A model whose ratio falls by several points over that window has plasma falling too fast early or tissue trailing too much."""

