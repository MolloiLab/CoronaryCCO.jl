[meta]
id = "bindschadler2014_iodine_exchange_model_ps"
data_type = "model"
validates = "Model input, not data: the capillary permeability-surface area product for iodinated contrast assumed as a linear function of flow (PS = slope*F + intercept) in dynamic cardiac CT perfusion models, with the fitted coefficients, the other exchange-model volumes, hematocrits and vessel relative dispersions; a second set of coefficients used for human CT-vs-PET flow estimation"
species = "model (coefficients fitted to porcine dynamic CT time-attenuation curves with microsphere flow; applied to simulated and human data)"
preparation = "Bindschadler 2014: axially distributed blood-tissue exchange model (after Kroll et al. 1996) with 20 parallel flow paths, driving iodine dynamics in a modified XCAT phantom; physics-based CT simulation. Alessio 2019: 2-compartment model fitted to human dynamic CT (34 patients, regadenoson stress, 120 kVp) with fixed PS-F relation."
conditions = "Simulated MBF 0.5, 1, 2, 3 mL/min/g and cardiac output 3, 5, 8 L/min (Bindschadler 2014). Human rest and regadenoson stress (Alessio 2019)."
verification = "FT"
access = "Bindschadler 2014: NIH author manuscript HTML on pmc.ncbi.nlm.nih.gov (PMC4057043), read 2026-10-15 (Europe PMC fullTextXML returned no body). Alessio 2019: author manuscript HTML on pmc.ncbi.nlm.nih.gov (PMC6579038), read 2026-10-15."
notes = """The PS-F slope and intercept in Bindschadler 2014 were 'set ... by simultaneously optimizing them to fit several porcine myocardial TACs with differing MBF values (as measured by fluorescent microspheres; unpublished data shared by So and Lee, Robarts Research Institute)'; Table A1 footnote 1: 'Value estimated based on fitting to porcine dynamic cardiac CT TACs (Lee and So, personal communication)'. Linearity of PS vs F is justified by Cousineau 1983/1994 and Caldwell 1994 (other tracers).
The PS equation as rendered on the PMC page reads 'PSg(Fp(i)) = PSg_Slope (Fp(i)/(1 - HctTD)) = PSg_Intercept'; the second '=' is presumably '+' (linear relation with intercept). F in the slope term is therefore blood flow Fp/(1 - Hct). Stored as printed; interpret with care.
These are MODEL ASSUMPTIONS fitted to unpublished pig data, not independent measurements of PS. The underlying pig data (microsphere flow and CT curves) are not published in this paper.
Alessio 2019 fixes PS = 0.35 F + 0.22 mL/min/g tissue (Table 2) for its human fits; the source of those coefficients is given as the group's prior simulation work (refs 12, 14), not a new measurement."""
use_in_model = """Default iodine exchange law for the model's capillary-interstitial term: PS(F) = a*F + b with (a, b) = (0.3853, 0.3 mL/min/g) per Bindschadler 2014 or (0.35, 0.22 mL/min/g) per Alessio 2019 (note the different flow variable, see ps_flow_relation). Compare the resulting PS with the CT-measured PS of Ritman 1994 (0.13-0.19 mL/min/g, vasodilated) and the Patlak MPSP of Daghini 2007 (0.37 mL/min/g at baseline) before choosing; run sensitivity over that range.
Also useful: interstitial volume 0.16 mL/g, capillary plasma volume 0.05 mL/g, relative dispersion 0.18 (large vessels) and 0.48 (small arterioles/venules)."""

