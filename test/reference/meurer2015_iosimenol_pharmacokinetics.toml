[meta]
id = "meurer2015_iosimenol_pharmacokinetics"
data_type = "experimental"
validates = "Early plasma kinetics of an IV iodinated non-ionic dimer (iosimenol) in healthy men with samples from 1 min: initial (distribution) half-life, fraction of dose left in plasma at 2 min, terminal half-life, Vz, clearance, urinary recovery."
species = "human"
preparation = "Phase 1, randomized, double-blind, placebo-controlled dose escalation (Berlin, 2002). 24 healthy Caucasian men 18-43 y, BMI 20-27; 6 per dose on iosimenol, 2 per dose on saline."
conditions = "Iosimenol 340 mgI/mL at 0.5, 1.5 or 3.0 mL/kg (about 0.2, 0.5, 1.0 gI/kg), IV at 3 mL/s. Blood at 1, 2, 5, 10, 30, 45 min, 1, 1.5, 2, 3, 4, 6, 8, 12, 24, 48 h. Iodine by X-ray fluorescence (LOQ 0.15 mgI/mL)."
verification = "FT"
access = "Open access (CC BY-NC 3.0). Full text read from Europe PMC XML (PMC4396406) on 2026-10-16."
notes = """Cmax at 1-2 min (5 min in two subjects). At 2 min only 39.6 +/- 3.3% of the dose was in the total plasma volume (how plasma volume was estimated is not stated in the text read).
The authors state that reported CM distribution half-lives vary between about 10 and 30 min, and attribute this mainly to injection rate and sampling times.
Plasma levels for the two lower doses were quantifiable only to 3-4 h (LOQ), which limits the terminal fits.
Iosimenol is a dimer, so larger than iohexol (MW 821); its MW is not stated in the text read. Unbound to plasma protein (per the authors).
Initial-phase half-life is a per-subject biexponential estimate; the method is not detailed beyond t1/2,lambda1."""
use_in_model = """Best open human benchmark found for the first hour after an iodinated contrast bolus: with sampling from 1 min, the fast phase half-life is ~10 min (7-13 min by dose) for a dimer, and ~60% of the dose has left plasma by 2 min. A monomer like iohexol should equilibrate at least as fast. So a model plasma distribution half-life of 5.8 min is not clearly too fast when compared with early-sampled data; the 26-min iodixanol value (svaland1992) comes from a fit to later samples."""

