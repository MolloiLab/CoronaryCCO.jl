[meta]
id = "clark2011_capillary_compliance_lung_volume"
data_type = "model"
validates = "Model input, not data: dependence of capillary-sheet compliance on transpulmonary pressure (lung volume), human sheet constants, total capillary sheet area and extra-capillary vessel compliance used in a CT-based whole-lung perfusion model."
species = "human (alpha_C vs Ptp slope from dog data of Glazier et al. 1969, scaled to the human alpha_C 0.127 um/cmH2O)"
preparation = "Multiscale model: CT-derived arterial and venous trees to ~32,000 acini, ladder acinar model with sheet flow, gravity and tissue deformation."
conditions = "Supine, prone and upright at FRC; cardiac output 5 l/min, left atrial pressure 5 mmHg."
verification = "FT"
access = "Open access full text (PMC3075121, HTML page). Methods text and Table 2 read."
notes = """Glazier et al. 1969 (J Appl Physiol 26:65, rapidly frozen dog lungs) values are reproduced in the text, so their provenance here is 'secondary'.
Sheet thickness: H/H0 = alpha_C P_tm + 1 (Eq. 2), valid up to P_tm = 32 cmH2O (cited to Sobin et al. 1979 human abstract), above which the vessel is taken as maximally distended. Note the Table 2 alpha_C is in m/Pa, i.e. used in the additive form.
Extra-capillary vessels: D/D0 = alpha P_tm + 1 (Eq. 1) with alpha = 1.49e-4 Pa^-1 cited to Krenz & Dawson 2003; 1.49e-4 /Pa x 133.3 Pa/mmHg = 0.0199 /mmHg, consistent with Reeves 2005 (0.02 /mmHg). The reference list mislabels the Krenz & Dawson journal as Am J Respir Crit Care Med.
Capillary viscosity printed '1.92e-3 Pa/s' (means Pa.s)."""
use_in_model = """Capillary sheet resistance with lung-volume dependence: H = H0 + alpha_C(Ptp) P_tm with alpha_C = a + b Ptp (human a = 0.165 um/cmH2O, b = -2.58e-3 um/cmH2O^2), H0 = 3.5 um, P_tm capped at 32 cmH2O; Q ~ [H_a^4 - H_v^4]/(4 mu_C f l_C^2 alpha_C) x S A with A = 73 m2 at TLC. Arteries/veins: D = D0 (1 + alpha P_tm), alpha = 1.49e-4 /Pa (~2 %/mmHg)."""

[source]
authors = ["Clark AR", "Tawhai MH", "Hoffman EA", "Burrowes KS"]
year = 2011
title = "The interdependent contributions of gravitational and structural features to perfusion distribution in a multiscale model of the pulmonary circulation"
journal = "J Appl Physiol"
volume = "110"
issue = "4"
pages = "943-955"
doi = "10.1152/japplphysiol.00775.2010"
crossref_verified = "2026-10-15; Crossref title exact match (vol 110, issue 4, 943-955; authors Clark, Tawhai, Hoffman, Burrowes)"
pmcid = "PMC3075121"

