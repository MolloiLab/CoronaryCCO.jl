# Shiode N, Morishima N, Nakayama K, et al. (1996). Flow-mediated vasodilation of human epicardial coronary
# arteries: effect of inhibition of nitric oxide synthesis. Proximal LAD QCA diameter during intracoronary
# adenosine 100 ug/min, before and after L-NMMA. ABSTRACT ONLY.

[meta]
id = "shiode1996_adenosine_flow_mediated_dilation"
data_type = "experimental"
validates = "Flow-mediated dilation of the human proximal LAD at intracoronary adenosine hyperemia, with the accompanying flow increase and baseline diameter."
species = "human"
preparation = "12 patients. Quantitative coronary angiography of the proximal LAD and intracoronary Doppler flow velocity. Adenosine 100 ug/min infused into the LAD; acetylcholine 3 and 30 ug/min into the left ostium; L-NMMA 25 umol/min for 5 min intracoronary."
conditions = "Baseline, intracoronary adenosine (flow increase), acetylcholine; repeated after L-NMMA."
verification = "abs"
access = "Abstract via PubMed E-utilities (PMID 8557898). Full text not read."
notes = """
The abstract labels the diameters 'mean +/- SEM'; the same convention is assumed for all values.
Patient characteristics (angiographically normal or not) are not stated in the abstract.
Flow-mediated dilation persisted after L-NMMA, so the authors conclude mediators other than NO are responsible.
"""
use_in_model = """Compare model proximal-LAD diameter change at hyperemia with +9.2% for a flow increase of about +400% (about 5x). With fixed epicardial diameters the model sits at 0%."""

[source]
authors = ["Shiode N", "Morishima N", "Nakayama K", "Yamagata T", "Matsuura H", "Kajiyama G"]
year = 1996
