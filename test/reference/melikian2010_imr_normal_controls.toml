[meta]
id = "melikian2010_imr_normal_controls"
data_type = "experimental"
validates = "Human index of microcirculatory resistance (IMR = Pd x hyperemic mean transit time, units) in patients without clinical atherosclerosis vs patients with atheroma; FFR."
species = "human"
preparation = "116 patients, 143 coronary arteries. Control group: 15 patients (22 arteries, 48 +/- 16 y) with no clinical evidence of atherosclerosis. Atheroma group: 101 patients (121 arteries, 63 +/- 11 y) with established atherosclerosis and multiple risk factors. IMR is by definition a bolus-thermodilution index from a pressure/temperature wire (method details not in the abstract)."
conditions = "Maximal hyperemia (agent not stated in the abstract). IMR and FFR per artery."
verification = "abs"
access = "Abstract only (PubMed PMID 20542779); full text not accessed."
notes = """Mean +/- SD with ranges. IMR is pressure x transit time (mmHg.s); it scales with resistance x vascular volume and cannot be converted to mmHg.min.g/mL without volumetric flow and territory mass.
Commonly used upper normal limit IMR < 25 (Mahendiran 2025 cites '>25 widely accepted' for abnormal)."""
use_in_model = """Context only: normal IMR 19 +/- 5 U (range 8-28). If the model reports a transit time from the distal wire site to the venous outflow at full dilation, Pd x that transit time can be compared with IMR (with the caveat that IMR uses the mean transit time of a saline bolus, not of blood volume)."""

[source]
authors = ["Melikian N", "Vercauteren S", "Fearon WF", "Cuisset T", "MacCarthy PA", "Davidavicius G", "Aarnoudse W", "Bartunek J", "Vanderheyden M", "Wyffels E", "Wijns W", "Heyndrickx GR", "Pijls NH", "De Bruyne B"]
year = 2010
title = "Quantitative assessment of coronary microvascular function in patients with and without epicardial atherosclerosis"
journal = "EuroIntervention"
volume = "5"
issue = "8"
pages = "939-945"
