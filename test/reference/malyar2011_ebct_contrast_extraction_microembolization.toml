[meta]
id = "malyar2011_ebct_contrast_extraction_microembolization"
data_type = "experimental"
validates = "EBCT myocardial perfusion F (mL/g/min), intramyocardial blood volume and an iopamidol microvascular permeability (extraction) index in the pig LAD territory at baseline and during intracoronary adenosine, before microembolization; behaviour of the index when flow roughly doubles"
species = "pig"
preparation = "34 anesthetized pigs (32 +/- 3 kg); 30 completed. Catheter in the proximal LAD (between the 2nd and 3rd diagonal) for intracoronary adenosine and microspheres. EBCT (Imatron C-150), 50 ms scans at 4 short-axis levels, triggered at 80% of RR. LAD territory outlined after a 4 mL selective intracoronary iopamidol injection; flow scans after an intravenous bolus of 0.33 mL/kg iopamidol (Isovue-370). Time-density curves split into intravascular and extravascular components; F, blood volume Bv and the permeability index computed (method of Ritman 1994, ref 30). 20-min washout between the four scan sequences."
conditions = "Baseline: intracoronary saline 1 mL/min. Adenosine: intracoronary adenosine 50 ug/kg/min for 5 min. Then adenosine + microspheres (10, 30 or 100 um at 1/8, 1/4 or 1/2 of the lethal dose; 3 pigs per size and dose) and recovery. Controls: 3 pigs, no microspheres."
verification = "FT"
access = "Author manuscript HTML on pmc.ncbi.nlm.nih.gov (PMC3154707), read 2026-10-15; Europe PMC fullTextXML returned an error and NCBI efetch gave no body. Tables 1-3 read from the HTML."
notes = """Flow is EBCT-derived (indicator dilution), not microspheres. Units printed as ml g myocardium^-1 min^-1.
The permeability index is in ARBITRARY UNITS (Table 3 caption). The abstract describes it as 'microvascular extraction of a nonionic contrast agent (an index of microvascular permeability)'; the text read does not give its formula, so it is not stored as E and no PS is computed.
Key finding for normal myocardium: the index is unchanged by intracoronary adenosine although EBCT flow roughly doubles (control pigs 0.40 +/- 0.08 -> 0.37 +/- 0.11 with F 1.09 -> 2.22 mL/g/min).
Hematocrit not reported. The methods give iopamidol molecular weight as '777.09 kDa' (as printed; iopamidol is 777 Da).
Embolization columns are included for completeness; only BL and IC AD columns describe intact myocardium."""
use_in_model = """At rest vs hyperemia in pig myocardium: flow ~1.0 -> ~2.2 mL/g/min (EBCT), blood volume ~0.12 -> ~0.23 mL/g, permeability/extraction index ~0.37 -> ~0.37 (unchanged). If the index tracks first-pass extraction E, an unchanged E with doubled flow implies PS rising roughly in proportion to flow (capillary recruitment), consistent with PS-F relations of the form PS = a*F + b used by CT perfusion models (bindschadler2014_iodine_exchange_model_ps). This interpretation is not stated by the authors."""

