[meta]
id = "kellman2017_dual_sequence_aif_linearity"
data_type = "experimental"
validates = "Size of SR blood-pool signal nonlinearity at first-pass peak: peak LV [Gd] after 0.05 mmol/kg, raw-signal vs LUT-corrected peak-to-valley ratio, residual saturation vs [Gd], blood T2* at peak, first-pass duration"
species = "human"
preparation = "29 healthy volunteers, 1.5 T Siemens Aera. Gadobutrol 0.05 mmol/kg at 4 mL/s + 20 mL saline; rest and adenosine stress (140 ug/kg/min). Dual sequence: low-res AIF image right after the R wave (6-pulse SR prep, dual-echo FLASH, FA 5 deg, TE 0.76/1.76 ms, saturation delay 23.8 ms, linear PE order, 64x34 matrix) plus high-res myocardial SR-SSFP (FA 50 deg, TS 95 ms) or SR-FLASH (FA 14 deg, TS 100 ms). Signal normalized to PD image and converted to [Gd] by Bloch-simulation look-up table (LUT) with T2* correction."
conditions = "Rest and adenosine stress"
verification = "FT"
access = "Europe PMC fullTextXML of PMC5383963 (CC BY 4.0), read 2026-10-16."
notes = """Even with a dedicated short-delay (TS 23.8 ms) low-flip AIF readout and only HALF dose (0.05 mmol/kg), the raw blood signal is compressed at the peak: peak-to-valley ratio 5.6 raw vs 8.3 after LUT conversion to [Gd] (~48% correction). So raw SR signal underweights the peak relative to the tail; the normalized raw curve is flatter/wider than the concentration curve. A standard long-TS (~95-100 ms) SR-SSFP myocardial readout at 0.1 mmol/kg is expected to be far more saturated (not measured here).
Abstract states stress myocardial peak SNR 17.7 +/- 6.6; the Results text says 21.8 +/- 7.6. Both recorded as printed.
Blood T2* at peak ~10 ms at 1.5 T (vs ~25 ms in saline at the same [Gd]); omitting T2* correction overestimates MBF ~10%."""
use_in_model = "Gives the expected peak LV [Gd] for a half dose (~4.4 mM rest) and a measured index of raw-signal peak compression; use to argue that SR-SSFP signal-time FWHM at 0.1 mmol/kg (e.g. Lehmonen 2022) overstates the concentration FWHM."

