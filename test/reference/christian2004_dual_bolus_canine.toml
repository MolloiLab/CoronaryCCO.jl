[meta]
id = "christian2004_dual_bolus_canine"
data_type = "experimental"
validates = "Dual-bolus doses used to keep the AIF linear (0.0025 then 0.10 mmol/kg); microsphere validation; semi-quantitative indices plateau"
species = "dog"
preparation = "16 beagles, coronary occlusion or intracoronary adenosine; fluorescent microspheres. First-pass MR during dual-bolus Gd-DTPA 0.0025 mmol/kg followed by 0.10 mmol/kg; Fermi deconvolution."
conditions = "Occlusion / regional hyperemia"
verification = "abs"
access = "PubMed abstract (PMID 15284436) read 2026-10-16; RSNA full text not accessible (no Wayback capture)."
notes = """The low dose for the AIF bolus is 1/40 of the tissue dose, reflecting that the blood signal is only usable at very low dose. Abstract gives no AIF saturation numbers. Semi-quantitative measures plateaued around 3.0 mL/min/g and qualitative ones underestimated hyperemic flow."""
use_in_model = "Citation for the dual-bolus dose ratio; no numbers on curve-width distortion."

