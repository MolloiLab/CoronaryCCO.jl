[meta]
id = "bache1977_vasodilated_tachycardia_transmural"
data_type = "experimental"
validates = "Four-layer transmural LV flow at maximal adenosine vasodilation vs paced heart rate (100-250/min) and diastolic time fraction (65% -> 52%) in awake beating hearts, with tone-intact controls. Isolates the mechanical (systolic compression) effect on hyperemic flow."
species = "dog"
preparation = "13 mongrel dogs 20-38 kg, chronically instrumented (aortic and LA catheters, RV outflow pacing electrode), studied awake 39-84 days after surgery. 7-10 um microspheres into the LA, 90 s reference withdrawal at 15 ml/min. Central two LV rings (62 +/- 4% of LV mass), six regions, each cut into four equal layers (layer 1 epicardial ... layer 4 endocardial); regions and rings pooled."
conditions = "Ventricular pacing 100, 150, 200, 250/min in random order, 4 min at each rate before injection. Control group (6 dogs) with tone intact; adenosine group (7 dogs) 4 umol/kg/min i.v. (dose giving no further flow with higher dose and abolishing reactive hyperemia), started 10 min before pacing. At 100/min only 5 of 7 adenosine dogs (sinus rate > 100 in 2)."
verification = "FT"
access = "Publisher PDF (Circ Res open archive) retrieved from an Internet Archive snapshot of the ahajournals.org PDF; read with pdftotext; Tables 1-2 read from the text layer."
notes = """All values mean +/- SE. During adenosine in sinus rhythm: MAP 88 +/- 3 mmHg, HR 97 +/- 4/min. Endo/epi = layer 4 / layer 1. Mean flow fell 18% from 100 to
250/min (P < 0.05); layers 1-2 did not change with rate; layer 4 at 250/min was 47 +/- 9% of its 100/min value. Fig. 1: endo/epi vs duration of diastole (sec/min)
in adenosine dogs, y = 0.0752x - 1.87, r = 0.81; text: endo/epi = 0.000392 DPTI - 0.354 (r = 0.71). Comparison cited by the authors: Domenech & Goich 1976
(Cardiovasc Res 10:224), intracoronary dipyridamole, 15 um spheres: endo/epi 1.20 at 100/min -> 0.70 at 180/min, subepicardial flow unchanged."""
use_in_model = """Best beating-heart test of the compression penalty at full dilation. At 100/min (diastole 65% of the cycle) hyperemic flow is transmurally uniform
(endo/epi 1.00) and the outer half is insensitive to rate up to 250/min, so systolic compression acts on the inner half. Mean hyperemic flow changes only from
5.49 to 4.94 ml/min/g between diastolic fractions 65% and 53% (-10%), and to 4.52 (-18%) at 52%/250 per min. A model compression term should reproduce
this weak whole-wall sensitivity together with the strong layer-4 loss."""

