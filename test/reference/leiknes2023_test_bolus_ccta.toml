[meta]
id = "leiknes2023_test_bolus_ccta"
data_type = "experimental"
validates = "Whole-body contrast transit to the ascending aorta: test-bolus time to peak and peak attenuation, main-scan aortic attenuation, injection protocol (rate, contrast and saline volumes, scan delay), with MRI cardiac output and body size of the same patients"
species = "human"
preparation = "40 consecutive patients referred for clinically indicated CCTA (suspected myocardial ischemia; excluded prior MI, heart failure, myocarditis, pericarditis, valvulopathy). Siemens Somatom Definition Flash dual-source CT; Omnipaque 350 mgI/mL (iohexol). Test-bolus images acquired sequentially at 2-s intervals over the aorta; central ROI about two-thirds of the aortic diameter in the ascending aorta. Cardiac MRI (Philips Intera 1.5 T, short-axis cine stack) immediately after CCTA for volumetric cardiac output, averaged over two readers."
conditions = "Resting. Beta-blockers to a target pulse of about 60 bpm (35 of 40 patients); sublingual nitroglycerin 2 x 0.4 mg immediately before the main CCTA scan and before MRI (39 of 40). Pulse during CCTA 59.24 (SD 8.98) bpm, during MRI 57.4 (SD 8.49) bpm."
verification = "FT"
access = "Publisher PDF (Frontiers, open access) and the Supplementary Material (Table S1 as 'Table 1.DOCX', the MRI sequence table as 'Table 2.DOCX', Supplementary Figure S1 as 'Image 1.png') supplied locally by the project lead; PDF read with pdftotext (layout and raw modes); DOCX read from word/document.xml; Fig. S1 read from the PNG."
notes = """The aim of the paper is cardiac-output estimation from the test-bolus curve (Bae-type compartment model vs Stewart-Hamilton); the injection and enhancement numbers are the useful part here.
Of the 40 included patients, 1 was excluded (MRI quality) and 2 as outliers (simulated vs measured TDC); the Results say Table 1 gives 'the demographics of the included participants', so Table 1 most likely describes 37 patients, but n is not printed in the table.
Table 1 labels the rows only by name. 'Attenuation in test-bolus (HU)' is taken to be the test-bolus peak attenuation in the ascending aorta and 'Attenuation in the aorta (HU)' the main-scan aortic attenuation; the paper does not define them further. 'Change in attenuation' and 'Simulated attenuation' are not defined in the text.
Several '95% CI' columns in Table 1 are far wider than a CI of the mean (e.g. CO_SH 4.25-15.36, ejection fraction 51.60-75.00); they are stored as printed.
Gender-difference column: positive = men higher than women (text: men 15.58 cm taller, 19.24 kg heavier, CO_MR 0.92 L/min higher). The text says women received 0.25 ml/kg more contrast (Sect. 4.6; Sect. 3 writes '0.25 mg CM less per kilogram' for men) with p = 0.01, while Table 1 prints p < 0.01.
Injection site (arm, vein, cannula size) is NOT stated in the paper or the supplement.
Test-bolus imaging starts 12 s after injection start (Table S1), so the early part of each curve is unsampled; the authors note the baseline is unknown in several patients and some curves end before washout.
Contrast concentration: 350 mgI/mL; 80 mL at 6 mL/s is a 13.3 s injection (worked example in Table S1 footnote)."""
use_in_model = """Simulate the Table S1 test bolus (20 mL of 350 mgI/mL at 6 mL/s, then 40 mL saline at 6 mL/s; t = 0 at injection start) through the whole-body circulation at CO about 5 L/min,
and compare ascending-aorta time to peak (18.3 +/- 2.6 s) and peak enhancement (about 194 +/- 62 HU at 100 kV, absolute HU) with the cohort; sample the simulated curve every 2 s from 12 s to mimic the acquisition.
For the main bolus (80 mL at 6 mL/s + 80-100 mL saline) compare aortic attenuation (579 +/- 195 HU). The injection arm is not stated; use the project's chosen arm and note it.
Supplementary Fig. S1 gives one patient's measured test-bolus curve (fig provenance) for a shape check."""

