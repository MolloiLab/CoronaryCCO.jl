[meta]
id = "mahendiran2025_mass_indexed_microvascular_resistance"
data_type = "experimental"
validates = "Human LAD absolute resting and hyperemic flow (mL/min), microvascular resistance (WU) and the same indexed by CT-derived subtended myocardial mass (mL/min/g and WU.kg = mmHg.min.g/mL), in ANOCA patients with normal microvascular resistance reserve (controls) vs functional and structural CMD."
species = "human"
preparation = "100 patients with angina and non-obstructive coronary arteries (no stenosis > 50%, FFR > 0.80, no prior MI), Aalst 2019-2023. CCTA on SOMATOM Force; vessel-specific subtended mass by Voronoi (Synapse 3D), volume x 1.05 g/cm3. Invasive: IC isosorbide dinitrate 0.2 mg; PressureWire X and RayFlow 2.52 Fr infusion catheter in the first millimetres of the LAD; room-temperature saline (20-23 C)."
conditions = "Rest: saline 10 mL/min; hyperemia: saline 20 mL/min (saline-induced hyperemia, no adenosine). Q from continuous thermodilution (Eq. 1); Rmu,rest from Pa,rest/Qrest; Rmu,hyper from Pd,hyper/Qhyper (no back pressure subtracted). MRR = (Qhyper/Qrest) x (Pa,rest/Pd,hyper). Controls: MRR >= 3.0 (n = 49); functional CMD: MRR < 3.0 and Rmu,hyper < 475 WU (n = 31); structural CMD: MRR < 3.0 and Rmu,hyper >= 475 WU (n = 20). LAD only. Median CCTA-to-invasive interval 28 days (IQR 9-93)."
verification = "FT"
access = "Open full text (PMC12337768) read as HTML; Tables 1-2 read from the HTML tables. Supplementary PDF not retrieved (bot challenge)."
notes = """All values mean +/- SD. Indexed resistance = Rmu x mass (WU.kg); 1 WU.kg = 1 mmHg.min.g/mL exactly.
Table 2 labels the resting indexed resistance row as 'Mass-indexed Rmu,hyper, WU.kg' (67.04 / 80.82 / 45.07 / 67.31); the Results text identifies these as indexed Rmu,rest. Stored as resting.
The 'control' group is ANOCA patients with normal MRR, not healthy volunteers (61 +/- 11 y, 37% female, 55% hypertensive); their hyperemic Pd is not printed but FFR 0.86 +/- 0.03 and Pa,hyper 92.5 +/- 13.6 mmHg are.
Means of individual indexed values are not equal to ratios of group means.
Discussion: control indexed Qhyper 4.56 mL/min/g is compared to a 3-5-fold PET flow increase; indexed Qrest 1.36 to PET resting 0.7-1.2 mL/min/g (upper end).
HRhyper SD (48.84 overall, 84.52 functional CMD) is as printed."""
use_in_model = """Second human target for hyperemic microvascular resistance per gram: controls 20.7 +/- 8.0 mmHg.min.g/mL (Pd/Q x mass) at Qhyper 4.56 +/- 2.20 mL/min/g in the LAD, with subtended LAD mass 59.6 +/- 21.7 g (40% of LV mass 147 g). Compare with model P_distal/Q x mass for the LAD tree at full dilation, no back pressure subtracted. The resting indexed values (81 +/- 31 WU.kg, 1.36 mL/min/g) are the autoregulated-rest targets."""

