[meta]
id = "kim2008_ijv_subclavian_csa"
data_type = "experimental"
validates = "Ultrasound cross-sectional area of the internal jugular vein and subclavian vein in supine awake healthy adults, and its change with Trendelenburg, reverse Trendelenburg and passive leg elevation"
species = "human"
preparation = "20 healthy male volunteers, awake; ultrasound CSA of the IJV and subclavian vein (SCV)."
conditions = "Supine (control); Trendelenburg 15 degrees; reverse Trendelenburg 15 degrees; passive leg elevation 50 degrees."
verification = "abs"
access = "Abstract only (PubMed E-utilities, PMID 18326134), read 2026-10-15. Full text (Anaesth Intensive Care, SAGE) not accessible."
notes = """Side (right/left), measurement level, probe and respiratory phase are not stated in the abstract.
The IJV is very posture-sensitive (CSA x0.34 head-up to x1.5 head-down); the SCV hardly changes (0.86-0.98 cm2), consistent with its tethering to the clavicle and first rib."""
use_in_model = """Supine CSA for the subclavian segment (0.92 cm2) and for the internal jugular vein (1.12 cm2, relevant if modelling reflux into the neck or a jugular CVC injection). Multiply by a segment length to get a volume."""

