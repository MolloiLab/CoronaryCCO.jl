[meta]
id = "nakamura2014_pulmonary_radius_exponent"
data_type = "review_and_reanalysis"
validates = "Pulmonary ARTERIAL radius exponent x (flow ~ r^x, i.e. junction exponent under flow conservation) resolved by vessel radius class (proximal r > 0.1 mm, peripheral 0.004 <= r <= 0.1 mm), recomputed from published cast-morphometry tables for human, dog, cat, rat; plus quoted literature values (Suwa & Takahashi 1971, Horsfield & Woldenberg 1989, Singhal 1973 flow-radius slope)"
species = "human, dog, cat, rat (pulmonary arteries only; no veins)"
preparation = "Re-analysis of published Strahler-ordered postmortem cast morphometry tables: Horsfield 1978 table 6, Singhal et al. 1973 table 4, Huang et al. 1996 table 2 (EXCLUDED source - see notes), Gan & Yen 1994 table 1 (dog right lung), Milnor 1982 table 2.3 (dog), Zhuang et al. 1983 table 1 (cat right lung), Jiang et al. 1994 table 2 (rat left lung)."
conditions = "x_n computed between each consecutive order pair from mean radius ratio beta_n = r_(n+1)/r_n and number ratio eta_n = N_(n+1)/N_n assuming flow preservation (N_n r_n^x = N_(n+1) r_(n+1)^x, so x_n = ln(eta_n)/ln(1/beta_n)); then mean +/- SD of x_n within each radius class. Radius classes from Suwa & Takahashi 1971 table 1(a)."
verification = "FT"
access = "Europe PMC fullTextXML of PMC3966250 (open access, CC BY), read 2026-10-18. Values from Table 3B, Table 1B and Results/Introduction text."
notes = """Exponent definition here is an ORDER-AVERAGED (Strahler, number-ratio) exponent, not a per-junction fit; it equals the per-junction Murray exponent only for a self-similar tree with flow conserved across orders.
Radii are vessel RADII in mm (not diameters).
Huang et al. 1996 rows are re-derived from the scored reference (Huang 1996 J Appl Physiol 81:2123) and must NOT be used as independent evidence; they are stored only with use_flag = "excluded_scored_reference".
Literature values quoted in the text (stored in [data.quoted_literature], provenance SC for the original authors): Horsfield & Woldenberg 1989 x = 2.3 +/- 0.1 over 0.0065 <= r <= 15 mm; Suwa & Takahashi 1971 x = 2.47 +/- 0.09 for r < 0.1 mm and 2.66 +/- 0.07 for r >= 0.1 mm, 'by pulmonary arterial cast morphometry of normal humans'; Nakamura et al. 2011 x = 2.2 in peripheral human pulmonary arteries (fractal model + catheter data); Singhal 1973 flow-vs-radius log-log slope 2.32 (Fig. 2, from Singhal tables 4 and 5 with assumed cardiac output 4.8 L/min), 'constant from proximal large to peripheral small arteries'.
Dawson et al. 1999 dog cast data: text only says 'a marked large SD of the arithmetic mean of x_p around 2.9' (Fig. 1B); no exact number printed in text."""
use_in_model = """Human pulmonary ARTERIAL exponent ~2.3-2.5 at all sizes (non-Huang human sets: proximal 2.30-2.42, peripheral 2.33-2.54; Suwa & Takahashi 2.47 below r = 0.1 mm, 2.66 above). Dog arteries slightly higher (2.5-2.8). No size class reaches Murray's 3. No venous data in this source."""

