[meta]
id = "namani2018_coronary_wall_parameters"
data_type = "model"
validates = "Model input, not data: passive (arctan sigmoid) and myogenic pressure-radius parameters for swine coronary vessels by Kassab order, fitted to Liao & Kuo 1997 isolated-vessel data (orders 5-7, D80 ~66-252 um), Kassab 1999 in situ data (orders 0-1) and Hamza 2003 (order 10, ~1.6 mm)"
species = "pig (parameters fitted to swine isolated coronary vessels; network from Kassab 1993 swine morphometry)"
preparation = "Theoretical 400-vessel subendocardial and subepicardial subtrees (Kaimovitz 2005 reconstruction) with myogenic, shear (Liao & Kuo 1997 forms) and conducted metabolic regulation plus myocardium-vessel interaction (tethering, intramyocardial pressure)."
conditions = "Reference inlet pressure 100 mmHg; quasi-static regulation at fixed heart rate."
verification = "FT"
access = "Europe PMC fullTextXML of PMC5749109 (CC BY-NC-SA 4.0) read 2026-10-16; Tables A2 and A3 read from XML table markup. Displayed equations read from MathML text in the XML."
notes = """Passive radius (Eq. 1): Rp(dP) = Bp + (Ap - Bp)/pi * [pi/2 + arctan((dP - phi_p)/C_p)]; dP in mmHg, radii in um.
Myogenic radius reduction (Eq. 2): dRm = rho_m/pi * {pi/2 - arctan[((dP - phi_m)/C_m)^(2m)]}, m = 2; regulated radius Rreg = Rp - A*dRm.
Appendix F says Bp was set to zero for the network and isolated-vessel parameters re-estimated with Bp = 0, yet Table A2 prints nonzero Bp; the printed (Ap, Bp, phi_p, C_p) reproduce the printed R0 and R80 exactly (checked here), so the table values are the Bp != 0 fits.
Derived here from Table A2 (Eq. 1, printed Bp): D50/D100 = 0.957 (o5, D100 67 um), 0.968 (o6a, 100 um), 0.958 (o6b, 164 um), 0.956 (o7, 255 um), 0.980 (o10, 1646 um); D20/D100 = 0.86-0.88 for orders 5-7.
Implied Carlson-Secomb C'pass from D50/D100 (x/2 = exp(C'(x-1))) is ~17 for orders 6b-7, versus 12.52 - 0.027*D0 = 5.6 at 255 um.
Two order-6 rows: Liao & Kuo 99 um and 164 um vessels both fall in Kassab order 6. Table A3 values in parentheses are the authors' adjusted phi_m/C_m (see Appendix F)."""
use_in_model = """Direct parameter source for coronary passive P-D in 60-260 um and ~1.6 mm vessels. Interpolating Ap, phi_p, C_p over R80 (the paper used quadratic/linear fits, Fig. A2) gives a passive law that stays stiff (D50/D100 ~0.96) through the 150-400 um gap, unlike the Fry 2013 linear C'pass. Myogenic amplitude rho_m ~ 0.6 x R80 for orders 5-7, set to 0 at order 10."""

