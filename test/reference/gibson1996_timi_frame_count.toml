[meta]
id = "gibson1996_timi_frame_count"
data_type = "experimental"
validates = "Angiographic contrast transit time from coronary ostium to standard distal landmarks (TIMI frame count, TFC; corrected TFC, CTFC) in arteries with normal flow, per artery (LAD, LCx, RCA); ostium-to-landmark path lengths"
species = "human"
preparation = "Diagnostic cine coronary angiography. Normal-value cohort: 78 consecutive patients at the West Roxbury VA Hospital catheterization laboratory without myocardial infarction, with visually normal flow and technically adequate films (one artery per patient: RCA n = 38, LCx n = 21, LAD n = 19). Hand injections of contrast. TIMI 4 trial films (acute MI, after thrombolysis) were used for the reproducibility and catheter-size analyses."
conditions = "Cinefilm at 30 frames/s. In the TIMI 4 trial protocol, sublingual or IV nitroglycerin was given at both angiographic time points and repeated every 15 min 'to preserve a state of maximum vasodilation'. The paper does not state nitroglycerin use, catheter size, or contrast agent for the 78-patient normal cohort. Resting (no pharmacological hyperemia)."
verification = "FT"
access = "HighWire full-text HTML read via Wayback Machine capture 20120513055257 of http://circ.ahajournals.org:80/content/93/5/879.full (and capture 20180308025922 of the same article). Tables 1-2 are image/popup tables that were not archived; all numbers below are from the Results/Methods/Discussion text."
notes = """TFC definition (Methods, Fig 1): first frame = first frame in which a column of nearly full or fully concentrated dye extends across the
entire width of the artery origin, touches both borders, and moves antegrade. Last frame = frame in which dye first enters the distal
landmark branch (full opacification not required). TFC = number of frames between these (last frame counted).
Landmarks (Methods, Figs 2-4): LAD = distal bifurcation ('mustache', 'pitchfork', 'whale's tail'), usually at the apex; for a wraparound LAD,
the branch closest to the apex. LCx = distal-most branch of the marginal/LCx segment with the longest total dye path that passes the
culprit lesion (usually ~5/6 of the way down the vessel). RCA = first branch of the posterolateral extension after the origin of the
posterior descending artery, regardless of size.
CTFC = TFC for LCx and RCA; LAD TFC divided by 1.7.
Frame-rate correction (Limitations): if filmed at other than 30 frames/s, multiply the TFC by 30 / (actual frame rate).
Results in acute-MI culprit/nonculprit arteries (TIMI 4) are not reproduced here except where noted; they are not normal-flow data.
Gibson cites Seiler et al. (artery length proportional to subtended mass) and Dodge et al. (3-D vector model) for lengths."""
use_in_model = """Simulate a bolus injection at the ostium of the model tree and record the time at which contrast first arrives at the equivalent
distal landmark of each main artery (LAD apical bifurcation, distal-most LCx marginal branch, first RCA posterolateral branch).
Convert time to frames: TFC = t_arrival[s] * 30. Compare to normal_tfc_by_artery (uncorrected) or, after dividing LAD by 1.7, to the CTFC.
Normal 95% range of CTFC is 15-27 frames (0.50-0.90 s). The arrival front is driven by the leading (centerline/peak) velocity, not the
mean, and depends on cardiac phase at injection (see abaci1999_tfc_confounders). The path lengths in landmark_path_lengths give an
independent check of epicardial tree geometry. Resting flow conditions."""

