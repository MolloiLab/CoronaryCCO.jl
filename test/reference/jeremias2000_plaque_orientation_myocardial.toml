[meta]
id = "jeremias2000_plaque_orientation_myocardial"
data_type = "experimental"
validates = "Circumferential orientation of eccentric plaque in non-branching coronary segments by IVUS: most eccentric plaques face the myocardium (inner curve), few face the epicardium. Sets the myocardial vs epicardial side of a synthetic plaque away from branch points."
species = "human"
preparation = "Stanford. 30 consecutive patients before intervention; 14 LAD, 6 LCx and 10 RCA."
conditions = "Motorized IVUS pullback, analysis at 1 mm intervals. Segments within two vessel diameters of a side branch excluded. Eccentric plaques assigned to quadrants: myocardial (inner curve), epicardial (outer curve) and two lateral quadrants, using perivascular landmarks."
verification = "abs"
access = "PubMed abstract (PMID 10996357, NCBI efetch, read 2026-10-16). Atherosclerosis full text not read."
notes = """The abstract gives 184 myocardial, 54 epicardial and 54 lateral cross sections out of 292 eccentric ones, with percentages 62.6%, 17.3% and 19.5%. The two 54 counts are printed with different percentages; kept as printed.
The rule for calling a plaque eccentric is in the full text.
Plaque size did not differ between myocardial and epicardial plaques."""
use_in_model = """For a plaque away from a branch: make it concentric about half the time (52.4%). When eccentric, face it toward the myocardium about 63% of the time, toward the epicardium about 17%, and laterally about 20%. Plaque area about 6.8 mm2 and thickness about 1.26 mm in either orientation."""

[source]
authors = ["Jeremias A", "Huegel H", "Lee DP", "Hassan A", "Wolf A", "Yeung AC", "Yock PG", "Fitzgerald PJ"]
year = 2000
title = "Spatial orientation of atherosclerotic plaque in non-branching coronary artery segments"
journal = "Atherosclerosis"
volume = "152"
issue = "1"
pages = "209-215"
doi = "10.1016/S0021-9150(99)00461-X"
crossref_verified = "2026-10-16; Crossref title exact match (vol 152, issue 1, 209-215; first author Jeremias)"
pmid = "10996357"

