[meta]
id = "cury2022_cadrads2_stenosis_grading"
data_type = "reporting standard (expert consensus)"
validates = "Clinical grading of coronary stenosis by percent LUMINAL DIAMETER stenosis (0, 1-24, 25-49, 50-69, 70-99, 100%), the 50% and 70% thresholds for obstructive disease, and the CT definitions of positive remodelling (ratio > 1.1) and low-attenuation plaque (< 30 HU). Sets how a synthetic stenosis should be labelled so it matches clinical reporting."
species = "human (clinical standard)"
preparation = "Expert consensus document of SCCT, ACC, ACR and NASCI for coronary CT angiography reporting (CAD-RADS 2.0)."
conditions = "Coronary CTA. Stenosis graded per patient by the most severe luminal stenosis."
verification = "FT"
access = "PMC9627235 (free full text, Radiology: Cardiothoracic Imaging version; HTML read 2026-10-16). Table 1 read from the PMC table image ryct.220183.tbl1.jpg (800 x 1175 px)."
notes = """Table 1 header: 'Degree of luminal diameter stenosis'. So CAD-RADS grades DIAMETER stenosis, the same convention as invasive angiography and QCA.
The text uses '>70%' for three-vessel obstructive disease and 'at least 50%' for left main, while Table 1 uses 70-99% for severe and 50-69% for moderate. Both are stored as printed.
Positive remodelling here is a DIAMETER ratio of the outer vessel: Av / [(Ap + Ad) / 2] > 1.1, with Ap and Ad the proximal and distal outer diameters. This differs from the IVUS AREA ratio (lesion EEM area / reference EEM area) used by Mintz 1997 and Schoenhagen 2000.
High-risk plaque (HRP) needs two or more of: positive remodelling, low attenuation (< 30 HU), spotty calcification, napkin-ring sign.
The published document does not state the area-diameter conversion. For a circular lumen whose reference and minimal sections are both circles, area stenosis = 1 - (1 - DS)^2 follows from geometry. This formula is geometry, not data from this source, and it fails for eccentric or non-circular lumens.
IVUS reports area stenosis and plaque burden instead. The ACC IVUS consensus (Mintz et al. 2001, J Am Coll Cardiol 37(5):1478-1492, doi 10.1016/S0735-1097(01)01175-5; Crossref-verified 2026-10-16) was not read."""
use_in_model = """Label each synthetic stenosis by % diameter stenosis = (1 - MLD / reference diameter) x 100, and map it to the CAD-RADS grade. Build test lesions at 50% and 70% DS. When the plaque is outwardly remodelled, report the outer-diameter ratio and check it against the > 1.1 positive-remodelling cut-off. A lipid-rich core should read below 30 HU on the non-contrast-equivalent image."""

