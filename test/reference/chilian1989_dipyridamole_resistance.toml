[meta]
id = "chilian1989_dipyridamole_resistance"
data_type = "experimental"
validates = "Subepicardial microvascular pressure vs vessel diameter (arteries ~355 um to veins ~400 um) in the beating LV at rest and during dipyridamole vasodilation; absolute and % resistance of artery (>170 um) / microvessel / vein (>150 um) compartments"
species = "cat"
preparation = "24 cats: ketamine 2 mg/kg + acepromazine 1 mg/kg i.m., pentobarbital sodium 30 mg/kg i.v. (supplements ~12-25 mg/h), midsternotomy, high-frequency jet ventilation triggered from LV dP/dt. LV epicardium partially immobilized by 3-4 22 G needles; mineral oil on the surface. Stroboscopic epi-illumination (Leitz Ploemopak), diameters from SIT video in late diastole (3-5 images per vessel). Pressures by servo-null micropipette (2-5 um tip, 3-5 MOhm) carried by an electromagnetic micromanipulator ('wobbler') replaying the vessel's motion (200 intervals per cycle); value = average of 10-15 beats over ~30 s. Subepicardial flow by 15 um radioactive microspheres."
conditions = "Control (vasomotor tone intact) and dipyridamole 0.4 mg/kg/min i.v., with mean arterial pressure held at control by a descending-aortic snare. Beating heart; subepicardial LV vessels only."
verification = "mixed"
access = "Original publisher PDF supplied locally by the project lead (validation-papers/), read with pdftotext; tables confirmed against 300 dpi page renders; Fig. 3 and Fig. 4 digitized from the 300 dpi render"
notes = """All values mean +/- SE. Compartments (paper): artery = aorta to arteries > 170 um; microvessel = arterioles < 170 um to venules < 150 um;
venous = veins > 150 um to 0 (right-atrial/atmospheric reference not stated beyond 'pressure drop'). Compartment resistance = pressure drop / MBF
(MBF in ml/min/g). Coronary resistance in Table 1 (66 +/- 5) is a mean of individual ratios (mean pressure 90 / mean flow 1.80 = 50).
Microvessel-compartment pressure gradient fell from 62 (control) to 25 mmHg (dipyridamole) (Discussion). Coronary venular pressure rose to
~27 mmHg with dipyridamole. Nonrestrained-region flow 1.73 +/- 0.11 and 6.36 +/- 0.14 ml/min/g (not different from restrained region).
Fig. 3 x-axis is a single 'adjusted diameter' axis: arterial diameters decrease from 400 um (left) to 0 at an unlabelled central tick, then venous
diameters increase from 0 to >400 um (authors fit sigmoids on 0-826 um). Fig. 3 points: control 42 of 50 tabulated observations recovered,
dipyridamole 46 of 50; the missing ones are hidden in overlapping clusters, mainly along the venous baseline (~3-6 mmHg) and in the
~250-300 um arterial cluster."""
use_in_model = """Primary beating-heart pressure-vs-diameter check. Compare model mean pressure in subepicardial arterial segments (diameter-binned) and venous
segments against pressure_vs_diameter_*; compare the model's fraction of the inlet-to-outlet pressure drop over D > 170 um arteries, the
arteriole-capillary-venule bed, and veins > 150 um against resistance_pct. Resting tone is not in a passive Poiseuille tree, so the dipyridamole
columns are the more natural comparison for a fully dilated model."""

