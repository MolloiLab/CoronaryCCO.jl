[meta]
id = "you2007_injection_arm_side"
data_type = "experimental"
validates = "Right vs left antecubital injection: carotid artery and internal jugular vein attenuation, time to peak, diagnostic-window duration, and retrograde flow of contrast from the subclavian/brachiocephalic vein (randomized)"
species = "human"
preparation = "60 patients randomized to right (n = 30) or left (n = 30) antecubital injection; head and neck CT with repeated measurements of carotid artery (CA) and internal jugular vein (IJV) attenuation at 1.5-s intervals."
conditions = "80 mL of 300 mgI/mL contrast at 2 mL/s (40-s injection)."
verification = "abs"
access = "Abstract only (PubMed, PMID 17895776, read 2026-10-15). Full text (J Comput Assist Tomogr, Wolters Kluwer) not accessible; no Wayback capture found."
notes = """The abstract gives only significance statements, no numeric attenuations or times.
Findings: CA and IJV attenuation slightly higher with right-arm injection (P = 0.06 and 0.07); right-arm injection significantly reduced perivenous artifacts and retrograde flow of the contrast column from the subclavian or brachiocephalic vein; no significant difference in time to peak attenuation or diagnostic-window duration."""
use_in_model = """Segment: left vs right brachiocephalic vein. A left-arm path (longer brachiocephalic vein crossing behind the sternum) should NOT shift arterial time to peak appreciably at 2 mL/s, but should allow retrograde reflux into neck veins. Model the left path with similar transit and a reflux/stasis branch, not a large delay."""

