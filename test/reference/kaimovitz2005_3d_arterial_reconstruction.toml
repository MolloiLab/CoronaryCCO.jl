# Kaimovitz B, Lanir Y, Kassab GS (2005). Large-scale 3-D geometric reconstruction of the porcine
# coronary arterial vasculature based on detailed anatomical data. Ann Biomed Eng 33:1517-1535.
# Full text not accessible. Abstract (PubMed) plus statements about this reconstruction in two later
# papers by the same group: Kaimovitz et al. 2008 (AJP Heart, full text) and Kaimovitz et al. 2010
# (AJP Heart, PMC2957345, open full text).

[meta]
id = "kaimovitz2005_3d_arterial_reconstruction"
data_type = "model"
validates = "Model benchmark, not data. A stochastic 3-D reconstruction of the entire pig RCA, LAD and LCx arterial trees down to the first capillary segment, built from the Kassab 1993 morphometry by simulated annealing and mapped onto a prolate spheroid. Diameters were assigned from per-order diameter-asymmetry statistics. Useful as a precedent for how a Kassab-constrained tree assigns diameters, and for the reconstructed arterial blood volume and its LV/septum/RV split."
species = "pig (model built on pig morphometry)"
preparation = "Computational reconstruction. Constraints: measured morphometry of the pig coronary arterial trees (Kassab et al. 1993). Five reconstructed sets (n = 5, per Kaimovitz 2010)."
conditions = "Anatomy of arrested, maximally vasodilated casts (inherited from the input morphometry). 150-cm3 heart geometry (per Kaimovitz 2010)."
verification = "mixed"
access = "Abstract via PubMed (PMID 16341920). Full text is paywalled (Springer, bot challenge; Semantic Scholar lists it as closed; no PMC copy) and was not read. Secondary statements from Kaimovitz et al. 2008 (publisher full-text HTML, Wayback capture 20220305070123) and Kaimovitz et al. 2010 (PMC2957345, read 2026-10-16)."
notes = """Abstract: RCA, LAD and LCx trees reconstructed down to the capillaries; 3-D structure first built in rectangular slab geometry by global optimization with parallel simulated annealing, constrained by the measured morphometry; then mapped onto a prolate spheroid by least squares on changes in segment lengths and angles. 'Vessel diameters were assigned based on a novel representation of diameter asymmetry along bifurcations.' Reconstructed morphological statistics are stated to be consistent with the measured data (no numbers in the abstract).
Diameter-assignment procedure as described in Kaimovitz 2008 (Discussion, Anatomical reconstructions): start at the most proximal segment with a diameter from a uniform random number generator; the other segments of the same element get diameters from a normal random generator with the intra-element Dl/Dm mean and SD for that order; side-branch segments get diameters from the inter-element Ds/Dm statistics (the asymmetry ratio matrix); the segment stemming from the distal segment of the mother element uses inter-element Dl/Dm statistics; repeated top-down to the capillaries. The per-order statistics themselves are tabulated in kaimovitz2008_diameter_asymmetry.toml (ARM) and in that paper's unreadable supplement.
The per-order asymmetry and segments-per-element (S/E) statistics used as constraints in this paper are not available here. S/E per order comes from Kassab 1993 (kassab1993_arterial_morphometry.toml)."""
use_in_model = """Not a validation target for the anatomy itself: it is another model built from the same Kassab data. Compare a CCO tree's arterial blood volume (4.1 +/- 0.23 ml/100 g excluding capillaries) and per-branch LV/septum/RV volume split with the reconstructed values, and use the 2008 ARM for the diameter-asymmetry check. The diameter-assignment recipe (normal sampling of Dl/Dm along elements, ARM for side branches) is an option for assigning diameters in a grown tree."""

