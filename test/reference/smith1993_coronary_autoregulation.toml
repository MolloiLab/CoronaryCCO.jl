[meta]
id = "smith1993_coronary_autoregulation"
data_type = "experimental"
validates = "Steady-state coronary pressure-flow autoregulation in the circumflex bed: closed-loop autoregulatory gain over the plateau, lower autoregulatory break point, pressure-flow slope below the break point, with and without nitric oxide synthesis (L-NAME); reactive hyperemia and pacing-induced metabolic flow recruitment"
species = "dog"
preparation = "19 chronically instrumented mongrel dogs (28 +/- 1 kg, mean +/- SEM), studied conscious at least 10 days after thoracotomy. Proximal left circumflex: transit-time ultrasonic flow probe, hydraulic occluder and distal coronary catheter (distal coronary pressure). LV micromanometer, left atrial and aortic catheters, RV outflow pacing leads. Superficial epicardial anastomoses (LAD-LCx, distal RCA-LCx) ligated to limit unmeasured collateral flow. Group 1 (n = 10): intracoronary acetylcholine and steady-state autoregulation; detailed autoregulatory relations analyzed in 8 (2 excluded because peripheral coronary pressure during total occlusion exceeded 20 mmHg). Group 2 (n = 9): 30-s occlusion reactive hyperemia and pacing to ~200 bpm."
conditions = "Conscious, sedated with Innovar-Vet (1-3 mL IM), lying on the right side (group 1) or standing in a sling (group 2). Heart rate held constant by ventricular pacing at the spontaneous rate. Distal circumflex pressure lowered with the occluder in 5-10 mmHg steps over the plateau and smaller steps below the break point; at least 1 min to equilibrate per step; data are 15-s averages (>= 15 beats). Control, then L-NAME 10 mg/kg IV (measurements repeated 30 min after L-NAME, 60 min after restoring pressure). Hematocrit 36 +/- 1%."
verification = "FT"
access = "Publisher PDF (scanned, Circ Res 73:232-240) read from Wayback Machine capture 20170706083036 of http://circres.ahajournals.org/content/circresaha/73/2/232.full.pdf, text extracted with pdftotext; Tables 1-2 and the autoregulation paragraph checked against 150 dpi page renders (pp. 235-236). Abstract also read via PubMed E-utilities (PMID 8330372)."
notes = """All values mean +/- SEM. Flows are absolute circumflex flows in mL/min (the perfused mass was not reported), so convert to per-gram only with an assumed bed mass.
Closed-loop autoregulatory gain = 1 - (dF/dP)(Pi/Fi), where dF/dP is the slope of the plateau regression, Pi the resting coronary pressure and Fi the resting flow (Fig 1 legend and Methods).
Plateau regressions used points above 50 mmHg (control) and above 70 mmHg (L-NAME). The ischemic relation used points with flow reduced by at least 20% below the plateau mean. The lower break point is the intersection of the plateau and ischemic regression lines.
From resting pressure down to the break point, flow fell by 8 +/- 4% (control) and 9 +/- 2% (L-NAME), P = NS.
Fig 3 (group pressure-flow points) is not digitized here.
Acetylcholine response: the abstract and Results text give a 31% maximum after L-NAME; the Fig 2 legend says 32%. Both are kept in notes; the table stores 31 +/- 10 from the abstract.
The zero pressure reference was the dorsal spine (group 1, right lateral decubitus) or mid-chest (group 2, standing)."""
use_in_model = """Target for an autoregulating coronary model under resting tone: as inlet (distal coronary) pressure is lowered from ~90 mmHg, flow should stay within about 10% of resting until ~45 mmHg (control) and then fall roughly linearly with slope ~1.0 mL/min/mmHg in this circumflex bed. Closed-loop gain over the plateau should be ~0.8. Loss of the NO / flow-dependent (shear) component shifts the break point up to ~61 mmHg and lowers the sub-break-point slope to ~0.58 mL/min/mmHg without changing the plateau gain; use this to test a shear-dependent tone term."""

