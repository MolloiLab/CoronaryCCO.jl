[meta]
id = "thomas2017_adenosine_cmr_hemodynamics"
data_type = "experimental"
validates = "Heart rate, blood pressure, biventricular volumes, stroke volume index and ejection fraction in healthy young adults at baseline and after adenosine 140 ug/kg/min (CMR cine), with the time course over 15 min; percent rise in cardiac output from the same group's conference abstract"
species = "human"
preparation = "25 healthy subjects aged 18-45 y (17 men; age 34 +/- 5 y; BMI 26 +/- 4) with normal ECGs, San Antonio Military Medical Center. 1.5 T Siemens Magnetom Espree; SSFP short-axis cine stacks (8 mm slices, 2 mm gap); QMass analysis; volumes indexed to BSA. Caffeine abstinence 48 h, orally verified."
conditions = "Adenosine 140 ug/kg/min IV for 6 min. Cine stacks and vital signs at baseline, IMMEDIATELY AFTER the end of the infusion, and 5, 10 and 15 min later; then a 10-min washout and regadenoson 0.4 mg (not stored). No gadolinium."
verification = "mixed"
access = "Full paper: Europe PMC fullTextXML of PMC5713097 (J Cardiovasc Magn Reson, open access), read 2026-10-15; Table 2 read from the XML markup. Conference abstract (second_source): Europe PMC fullTextXML of PMC4328550, read 2026-10-15."
notes = """TIMING CAVEAT: the 'immediate post-vasodilator' acquisition was made 'immediately following conclusion of vasodilator stress administration', i.e. after the 6-min infusion ended, not during it. HR was still 96 +/- 13 bpm at that point (baseline 64 +/- 8), so the measurement captures the adenosine state, but the infusion was off during imaging.
The full paper reports no cardiac output and no aortic flow. The group's 2015 SCMR abstract (Minor, Lee, Steel; same institution, same protocol and n = 25 healthy volunteers, probably the same cohort) measured pulmonic and aortic flow and states 'Cardiac output immediately increased by 28% following adenosine'; no absolute CO, SD or method of calculation is given in the abstract.
The abstract also states biventricular volumes up to 20% higher than with regadenoson at 5 min and still elevated at 15 min, and RVEF and LVEF +5% at 15 min after adenosine; the full paper's Table 2 instead shows LVEF back to baseline by 10 min after adenosine and LVEDVi below baseline at 15 min. The Table 2 values are stored; the abstract's percent CO rise is stored separately with provenance abs.
MAP is not reported; SBP and DBP are. Table 1 footnote says 'Median values with standard deviation' for demographics; Table 2 is mean +/- SD."""
use_in_model = """CMR-based estimate of the CO rise under adenosine for the whole-body bolus model: +28% (abstract), with HR 64 -> 96 bpm and LV stroke volume index 44.8 -> 51.0 mL/m2 immediately after the infusion; SBP and DBP essentially unchanged.
Use the 5-15 min columns only as wash-out time course (adenosine effect falls within minutes after the infusion stops)."""

