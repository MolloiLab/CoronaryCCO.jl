[meta]
id = "kawalecrutkowska2025_ijv_csa_posture"
data_type = "experimental"
validates = "Right and left internal jugular vein cross-sectional area (and flow volume) by ultrasound in healthy adults supine, sitting and in right/left lateral decubitus"
species = "human"
preparation = "25 healthy individuals (age 20-52, stated as 20-52 +/- 12.1 y). GE Versana Active, 10 MHz linear probe, venous preset. IJV measured at mid-neck (level of the thyroid cartilage), same skin-marked level for all postures."
conditions = "Flat examination table: supine, sitting, right lateral decubitus, left lateral decubitus."
verification = "FT"
access = "Europe PMC fullTextXML of PMC11856538 (J Clin Med, CC BY open access), read 2026-10-15. Values are from the Results text and Abstract; Figures 1-2 not digitized."
notes = """Right IJV is larger than left supine (paired t-test p = 0.03), as commonly reported.
Supine flow volumes are shown only in Figure 2 (not digitized). Lateral-decubitus flow (Abstract): right lateral R 74.3 +/- 97.5, L 48.8 +/- 82.8 mL/min; left lateral R 56.7 +/- 56.1, L 99.7 +/- 123.9 mL/min.
CSA at the thyroid-cartilage level; the IJV widens caudally toward the bulb, so this underestimates the lower IJV."""
use_in_model = """Internal jugular vein segment (reflux from left-arm injection into the neck, or a jugular CVC injection site): supine mid-neck CSA right 96 mm2, left 65 mm2. Use with kim2008_ijv_subclavian_csa (1.12 cm2) for the spread across studies."""

