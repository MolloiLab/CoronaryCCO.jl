[meta]
id = "olsson1983_iohexol_pharmacokinetics"
data_type = "experimental"
validates = "Whole-body plasma pharmacokinetics of IV iohexol in healthy adults: apparent volume of distribution, biologic (elimination) half-life, urinary recovery at 24 h, excretion by glomerular filtration, dose independence."
species = "human"
preparation = "20 healthy volunteers. IV iohexol at four dose levels, 125-500 mg I/kg. Comparison with chromium-51 EDTA clearance, given separately and together with iohexol."
conditions = "Single IV injection. Normal renal function implied by 'healthy volunteers'; GFR values not in the abstract."
verification = "abs"
access = "Abstract only, via PubMed E-utilities (PMID 6408018). Full text (Invest Radiol, Lippincott) not accessible."
notes = """The abstract names the parameters t1/2 alpha, t1/2 beta, Vd, ClT and ClR (no dose dependence found) but prints only Vd (0.27 L/kg) and the 'biologic half-life' (121 min). The distribution half-life and the clearances are not in the abstract.
The 121-min half-life is taken to be the elimination (beta) phase, since the abstract calls it the biologic half-life. Check against the full text.
Vd 0.27 L/kg is described as distribution in the extracellular water.
Recovery in urine was 100% at 24 h, unmetabolized. Iohexol and Cr-51 EDTA clearances compared: iohexol is mainly cleared by glomerular filtration, and iohexol does not change GFR."""
use_in_model = """Whole-body washout target for a healthy adult: plasma iohexol falls with an elimination half-life of about 2 h (121 min) and distributes into about 0.27 L/kg (roughly the extracellular water). Over a 5-15 min CT protocol, renal loss is small (exp(-ln2 x 15/121) ~ 0.92 of the beta-phase level remains), so most of the early fall in blood iodine must come from distribution into the extravascular extracellular space, not from excretion."""

