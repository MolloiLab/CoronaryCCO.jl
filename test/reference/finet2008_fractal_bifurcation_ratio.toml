[meta]
id = "finet2008_fractal_bifurcation_ratio"
data_type = "experimental"
validates = "Per-bifurcation diameter ratio R = Dm/(Dd1 + Dd2) (mean +/- SD) at 173 normal human epicardial coronary bifurcations, overall and in six mother-diameter classes (2.2-5.2 mm); mother and daughter diameters per class. Gives the spread of parent-to-daughter size ratios at angiographically visible bifurcations."
species = "human"
preparation = "Quantitative coronary angiography (dedicated QCA bifurcation software) of patients under 55 y, free of cardiovascular risk factors, with strictly normal coronary angiograms obtained before valve replacement surgery. 87 enrolled, 59 included (35 F, 24 M, age 46 +/- 8.5 y); 173 bifurcations (2.9 per patient). A subgroup of 27 patients had IVUS to confirm normality. Reference diameters measured for mother (Dm) and both daughters (Dd1 >= Dd2)."
conditions = "Clinical diagnostic angiography before valve surgery. Intracoronary nitrate use not identified in the pages read."
verification = "FT"
access = "Publisher open PDF, https://eurointervention.pcronline.com/article/fractal-geometry-of-arterial-coronary-bifurcations-a-quantitative-coronary-angiography-and-intravascular-ultrasound-analysis/pdf (text layer read; Tables 1 and 2 are text in the PDF)."
notes = """Statistics: 'Variables are presented as mean +/- SD' (Statistical analysis and table footnotes; tables print 'DS').
The abstract says 47 patients; the Methods/Results say 59 patients were included. Both are as printed.
The IVUS-subgroup angiographic ratio is printed as 'R(angio)=0.0670+/-0.031' (an evident typo for 0.670); stored as 0.670 with a note.
Table 1 'Reduction in mm' for all bifurcations is 0.631 +/- 0.365; the Results text prints 0.631 +/- 1.05 mm.
DERIVED (not printed in the paper): A0/mean(A1,A2) = 2 Dm^2/(Dd1^2 + Dd2^2) = 2 R^2 (1+s)^2/(1+s^2), s = Dd2/Dd1.
With R = 0.678 and s = 2.236/2.708 = 0.826 (ratio of class means) this gives about 1.82; symmetric daughters give 4R^2 = 1.84.
First-order propagation of SD_R alone (relative SD of R^2 = 2 x 0.0665/0.678 = 0.196) gives SD about 0.36 (CV about 20%),
which ignores the extra spread from per-bifurcation asymmetry s; treat it as a lower bound on the SD of the area ratio."""
use_in_model = """For each model bifurcation with mother diameter in the angiographic range (~2-5.5 mm), compute R = Dm/(Dd1+Dd2) and compare mean and SD with
ratio_by_mother_diameter (overall 0.678 +/- 0.0665, n = 173). To score A0/mean(A1,A2) use the derived conversion in meta.notes, or better compute R directly
in the model and compare R. Vessels below ~2 mm are not represented."""

