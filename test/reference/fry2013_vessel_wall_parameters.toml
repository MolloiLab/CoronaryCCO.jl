[meta]
id = "fry2013_vessel_wall_parameters"
data_type = "model"
validates = "Model input, not data: vessel-wall mechanics and tone-regulation parameters (passive tension, maximally active VSM tension, myogenic, shear and conducted metabolic sensitivities) written as functions of the passive diameter D0, for arterioles down to D0 ~8 um; reference-state boundary conditions of the network model"
species = "hamster (network geometry and diameters from cremaster muscle, Berg 1995); parameters pooled from earlier fits to several species (Carlson & Secomb 2005; Carlson et al. 2008; Roy et al. 2012)"
preparation = "Theoretical model. 143-vessel network: 137-segment microvessel network from hamster cremaster maps in control and maximally dilated states (32 arterioles, 93 capillaries, 12 added venules) plus 2 upstream (artery A, large arteriole LA) and 4 downstream segments (LV1, LV2, V1, V2). Poiseuille flow with Pries & Secomb 2008 in vivo viscosity and Pries 1996 phase separation; Green's-function O2 transport; wall-derived metabolic signal proportional to the local O2 deficit (M0 - M), conducted upstream with exponential decay."
conditions = "Reference state: moderate arteriolar tone, low O2 demand (M0 = 1 cm3 O2/100 cm3/min in the reference figures). Simulations vary M0 from 0.5 to 8 cm3 O2/100 cm3/min. Arterial inflow 100 mmHg, venous outflow 12.91 mmHg."
verification = "FT"
access = "Europe PMC REST full-text XML of PMC3770315 (CC BY 2.5 open access), read 2026-10-15. Table 1 cells read from the XML table markup. Displayed equations (1)-(11) are images in the XML and were NOT read; the equation forms below are described from the surrounding text only."
notes = """Skeletal-muscle (cremaster) model, not coronary. The D0-dependent expressions are the useful part for a coronary tree: they give
wall parameters for any arteriolar passive diameter, including vessels < 30 um that earlier models did not cover.
D0 is the passive diameter at an intraluminal pressure of 100 mmHg (text). Table 1 gives D0 in um (range 8 to 20 um in this network);
the paper does not restate the unit of D0 inside the D0-dependent formulas, so D0 in um is assumed from Table 1 and the Carlson & Secomb 2005 origin.
Cact = 1.30*D0^1.48 was fitted by the authors to six data sets of Carlson & Secomb 2005 with the smallest mean D0 (four hamster sets),
weighted by number of vessels (Fig. 3). Cpass and Cmyo are cited to Carlson & Secomb 2005; C'pass, C'act, C''act and Cshear to Carlson et al. 2008;
Cmeta to Roy et al. 2012. Carlson et al. 2008 itself prints only per-segment values (see carlson2008_autoregulation_model.toml), not these linear formulas.
Cmeta is printed with unit (1/uM/cm) although the metabolic signal here is an O2-deficit signal (Eq. 8), not ATP; kept as printed.
C''tone (VSM constant) is printed as a range, -0.908 to 132.1, with no unit; it is set per arteriole from the reference state (Eq. 11).
Arterioles whose dilated diameter was <= control diameter were given Stone = -1000 (A ~ 0)."""
use_in_model = """Use as the parameter source if the coronary model adds active tone (Carlson-Secomb wall mechanics) to CCO arterioles.
Evaluate each coefficient at the segment's passive diameter D0 (um) with the slope/intercept or power-law arrays below.
Tension in dyn/cm (T = P*D/2), shear stress in dyn/cm2. Fry's D0 range is 8-20 um; extrapolating the linear C' formulas to
coronary arterioles of 100-300 um stays within the Carlson 2005/2008 fitted range (40-300 um), but Cact = 1.30*D0^1.48 was fitted on small vessels only."""

