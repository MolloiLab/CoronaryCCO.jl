[meta]
id = "ebrahimi2022_pulmonary_model_parameters"
data_type = "model"
validates = "Model input, not data: parameter set of an anatomically based human pulmonary perfusion model (Clark/Tawhai/Burrowes lineage) with Fung-Sobin sheet-flow capillaries, ladder acinar units and Strahler-ratio vessel trees."
species = "human (capillary sheet parameters from cat lung)"
preparation = "1D network of ~153,000 extra-acinar vessel elements coupled to 3D CFD of the main, left and right pulmonary arteries; 30,676 acinar units, each a 9-generation symmetric arteriole/venule ladder joined by capillary sheets."
conditions = "Model of an upright or supine human lung; boundary conditions in the paper."
verification = "FT"
access = "Open access full text (Europe PMC JATS XML, PMC10012968); Table 1 parsed from the XML table cells."
notes = """Values are the model's chosen inputs with their cited origin (column 'References & Methodology' in Table 1).
Sheet-flow values (alpha_c, H0, Hmax) are from Sobin et al. 1979 photomicrographs of ex vivo CAT lung, not human. F = 21.6 (Fung & Sobin 1972) is the sheet-flow numerical factor.
Strahler diameter ratios are printed 1.52 (arteries) and 1.56 (veins), 'fit parameter to produce geometry consistent with Huang et al. (1996)'. Huang 1996 itself reports regression diameter ratios 1.56 and 1.58; the model values are tuned, not Huang's.
Acinar unit count 30,676 is the meshing output, stated as consistent with Huang 1996 casts.
Text: the right lung holds 53.6 +/- 1.5% of total lung volume supine (53.3 +/- 1.3% upright), citing Yamada et al. 2020."""
use_in_model = """Starting values for a sheet-flow capillary element: unstrained sheet height 3.5 um, compliance 1.3e-9 m/Pa, maximum height 7.7 um, arteriole-to-venule path length 1186 um, capillary viscosity 1.9 mPa.s, total capillary surface 65.4 m2. The 30,676 acinar units give a coarse terminal count for a lung tree that stops at acini (one terminal per acinus) before adding a ladder model."""

