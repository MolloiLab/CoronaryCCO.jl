[meta]
id = "wieneke2005_flow_velocity"
data_type = "experimental"
validates = "Proximal epicardial average peak velocity (APV) at rest and adenosine hyperemia per main artery (LAD, LCx, RCA), IVUS lumen area per artery, coronary flow velocity reserve, and total (global) coronary flow in ml/min and per LV mass, in humans with angiographically normal arteries"
species = "human"
preparation = "28 patients (16 men, 12 women) undergoing diagnostic angiography for suspected CAD with angiographically smooth coronary arteries; excluded valvular disease, HOCM, DCM, endocarditis, myocarditis, and proximal-branching marginal/diagonal anatomy. 0.014-in Doppler FloWire (Cardiometrics) and IVUS (Boston Scientific Ultra Cross 30 MHz or Endosonics Avanar) at the same site, co-registered by the Echomap system. Sites: AHA segment 6 (proximal LAD), segment 11 (proximal LCx), segment 1 (proximal RCA). LV mass by M-mode echo (Devereux) within 7 days. 6F or 8F guiding catheter."
conditions = "5000 IU heparin and 0.2 mg intracoronary nitroglycerin before angiography; 200 ug IC nitroglycerin before IVUS. Hyperemia by intracoronary adenosine bolus, 18 ug left and 12 ug right coronary. Measurements done twice and averaged."
verification = "FT"
access = "HighWire full-text HTML read via Wayback Machine capture 20130208023948 of http://jap.physiology.org:80/content/98/3/1076.full (also capture 20161104053905). Tables 1-2 and Fig 2 (per-vessel flow in ml/min) were popup/image content that was not archived."
notes = """Flow method (paper Methods): spatial mean velocity V = APV/2 (Doucette 1992, Ofili 1995), vessel flow Q = V x A, with A from IVUS;
a diastolic/systolic-weighted area is used (the weighting equation is an image not available in the archived HTML).
Global flow = sum of LAD + LCx + RCA proximal flows; global CSA = sum of the three areas.
Resting APV did not differ between vessels; hyperemic flow (ml/min) was significantly higher in LAD and RCA than LCx (Fig 2, values not available).
No correlation between lumen area and velocity in any vessel (LAD r = 0.05, LCx r = 0.01, RCA r = 0.05).
Global resting flow correlated with stress-mass-heart rate product (r = 0.62); resting mean APV correlated with pressure-rate product (r = 0.64);
global CSA correlated with LV mass (r = 0.61).
Patients had angina symptoms; authors caution they cannot be taken as truly normal (possible microvascular disease)."""
use_in_model = """Run the model at rest and at maximal vasodilation. At the proximal LAD (segment 6), proximal LCx (segment 11) and proximal RCA (segment 1),
compare the model's spatial-mean velocity x 2 (or centerline velocity, if the model is Poiseuille) to apv_by_vessel, and the lumen area to
ivus_lumen_area_by_vessel. Compare the sum of the three proximal flows to global_flow (197 ml/min rest, 637 ml/min hyperemia) and to
perfusion per LV mass (91 ml/min/100 g; note this divides total coronary flow by LV mass only). Hyperemic/rest ratio (CFVR) ~3.2-3.5 per vessel."""

