[meta]
id = "vanherck2007_hyperemic_zero_flow_pressure"
data_type = "experimental"
validates = "Human hyperemic (intracoronary adenosine) late-diastolic zero-flow pressure Pzf in stented target vessels and in unobstructed reference vessels, in stable-angina controls vs recent myocardial infarction; LVEDP as the main determinant of Pzf."
species = "human"
preparation = "95 patients with de novo single-vessel disease scheduled for elective PCI: 27 stable angina pectoris (AP; control, no prior infarction), 20 non-Q-wave MI and 48 Q-wave MI (3-12 days old). Exclusions: prior cardiac surgery, totally occluded infarct vessel, ECG hypertrophy, visible collaterals, significant valve disease, shock. IV heparin and continuous IV nitrates. 0.014-inch Doppler guidewire (FloWire, 15 MHz FloMap) 1 cm distal to the stent after an optimal angiographic result, then in the mid part of an unobstructed reference vessel perfusing non-infarcted myocardium. Aortic pressure at the guiding-catheter tip."
conditions = "Rest and maximal hyperemia after intracoronary adenosine 40 ug bolus. Pressure-flow loop from 3 superimposed beats; Pzf and slope (SIPF) from linear regression of instantaneous aortic pressure vs peak flow velocity during LATE diastole (method of Di Mario / Mancini). LVEDP measured after the flow measurements."
verification = "mixed"
access = "Open-access full text (PMC2000925) read as HTML; Table 1 and text FT; reference-vessel Pzf digitized from Fig. 3A (PMC figure image, 475 x 192 px)."
notes = """All values mean (SD).
Pzf here is the late-diastolic hyperemic intercept on beating hearts (not a long pause). Validation (n = 26): aortic vs intracoronary pressure gave Pzf mean difference 0.40 (limits SD 3.48) mmHg; intra/interobserver ICC near 0.9.
In the AP control group, hyperemic Pzf (14.6 mmHg treated, ~12.7 reference) is BELOW the measured LVEDP (20.7 mmHg). Reference vessels were 6 LAD and 15 LCX in AP (Table 1 lists counts per group; numbers per group do not all sum to n).
Stepwise regression: LVEDP was the strongest determinant of Pzf in both treated (F to enter 54.2) and reference (48.5) vessels; CFR second (12.0 and 5.2).
'Treated vessel' values are after stenting of a culprit/target lesion (residual diameter stenosis 11.0 (6.6)% in AP)."""
use_in_model = """Human hyperemic effective back pressure in vessels supplying non-infarcted myocardium: ~13-15 mmHg (SD ~7-8) in stable-angina patients with LVEDP ~21 mmHg. Compare with the model's outflow pressure of 13.6 mmHg; the agreement supports keeping it. The LVEDP dependence (and the rise to 22-37 mmHg after infarction) indicates the back pressure is set by intramyocardial/ventricular diastolic pressure rather than by venous (right-atrial) pressure."""

