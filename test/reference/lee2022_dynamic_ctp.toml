[meta]
id = "lee2022_dynamic_ctp"
data_type = "experimental"
validates = "Adenosine-stress dynamic CT myocardial perfusion: injection protocol and scan timing; myocardial attenuation (HU) of non-ischemic vs ischemic territories at the frame of maximal contrast (16.1-21.0 s after injection start); dynamic-CTP MBF (maximum-slope) in non-ischemic vs ischemic territories"
species = "human"
preparation = "42 patients (59.7 +/- 8.8 y, 31 male; 44 enrolled, 2 without CTP excluded) from 3 Korean tertiary centres, 2016-2018, with >= 40% stenosis on CCTA and scheduled invasive angiography with FFR. Excluded prior MI, stent, CABG or cardiac surgery, NYHA III-IV HF, severe COPD, high-degree AV block, SBP < 90 mmHg. CTP on second-generation dual-source CT (SOMATOM Definition Flash) at all centres."
conditions = "Adenosine 0.14 mg/kg/min i.v. (antecubital vein) for 3 min. At 2 min 54 s: 50 mL iohexol 350 mgI/mL at 5 mL/s + 30 mL saline into the antecubital vein of the OPPOSITE arm. Dynamic CTP started at 3 min: shuttle mode, systolic (200 ms after R), 30 s acquisition, 73 mm coverage (38 mm detector, 10% overlap), 100 kVp, 330 mAs/rotation, 285 ms rotation, 2 x 64 x 0.6 mm collimation; 10-14 dynamic datasets per patient (12 phases in the Fig. 2 example). Reconstruction 1.5 mm, B23f kernel; analysis on 3 mm / 1.5 mm increment images."
verification = "FT"
access = "Europe PMC open-access full-text XML (PMC10980466), retrieved 2026-10-15 via the Europe PMC REST API. Supplemental Digital Content 1 (Table S1 time-attenuation data, CCTA protocol) not read."
notes = """'Static CTP' is virtual: the seventh dynamic dataset, acquired 16.1-21.0 s after the start of contrast injection, chosen as the frame with maximal normal-vs-ischemic difference in 9 patients (example in Fig. 2: 16.4 s).
Myocardial attenuation and MBF are per vessel territory, taking the LOWEST segment value in each territory. Ischemic = hemodynamically significant by FFR < 0.8 (or > 90% stenosis on ICA); 20 of 125 assessable territories in 16 of 42 patients. The paper does not state explicitly that the HU and MBF comparison uses these same 20 vs 105 territories.
MBF is from the vendor maximum-slope method (Syngo VIA), in mL/100 mL/min. Stress only: no rest CTP, so no flow reserve.
Contrast arm is the one opposite to the adenosine line; left vs right is not stated.
The LV-lumen time-attenuation curve is shown only graphically (Fig. 2B, one patient).
Radiation: CTP DLP 687 +/- 123.6 (printed in mGy), effective dose 9.6 +/- 1.7 mSv (k = 0.014)."""
use_in_model = """Run the model with this injection (50 mL of 350 mgI/mL at 5 mL/s + 30 mL saline, antecubital) under adenosine-stress flow. At 16.1-21.0 s after
injection start, non-ischemic myocardium at 100 kVp should read about 102 +/- 20 HU (absolute, including the unenhanced myocardium), and maximum-slope MBF
in non-ischemic territories about 123 +/- 31 mL/100 mL/min. Note these are minimum-segment values per territory, which bias low relative to territory means."""

