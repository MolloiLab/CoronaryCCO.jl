[meta]
id = "deng2026_port_vs_peripheral_ct"
data_type = "experimental"
validates = "Effect of injection site (central venous power port with tip at the SVC-RA junction vs peripheral arm cannula) on arterial-phase aortic attenuation, subclavian/SVC stasis artifacts and IVC/hepatic-vein reflux at identical contrast dose and rate, same patients"
species = "human"
preparation = "195 oncology patients, each scanned twice (fixed order): first via a 20-gauge peripheral cannula (right arm 183, left arm 12), then via a totally implantable venous power port (Bard 6F ChronoFlex, inserted via right internal jugular or right subclavian vein, tip at SVC-RA junction; all ports right-sided). Interval 131.0 +/- 26.2 days. Siemens SOMATOM Force dual-source CT, chest arterial phase, automatic kV selection and tube-current modulation."
conditions = "Ioversol 350 mgI/mL, 1.0-1.2 mL/kg (60-90 mL), same dose and rate in both exams: 3.29 +/- 0.40 mL/s (peripheral) vs 3.27 +/- 0.34 mL/s (port), range 2.5-4.0 mL/s; 30 mL saline at the same rate. Bolus tracking in the thoracic aorta, scan 5 s after 100 HU."
verification = "FT"
access = "Europe PMC fullTextXML of PMC13458198 (open access), read 2026-10-15; Tables 1-5 read from the XML table markup."
notes = """Retrospective, nonrandomized fixed-order before-after design (peripheral always first); the authors flag possible temporal confounding (disease course, ~4 months apart).
Automatic kV selection: the tube voltage per exam is not reported, so absolute HU differences may partly reflect kV differences.
Bolus-tracking acquisition: neither arrival time nor time to peak is reported, so the effect of injection site on timing cannot be extracted.
SVC and right-atrium artifacts did not differ between routes; subclavian-artery streak artifacts (from the dense contrast column in the ipsilateral subclavian vein) were present in 98% of peripheral exams and 0% of port exams.
Arterial-phase IVC/hepatic-vein reflux: 4.6% peripheral vs 9.2% port (P = 0.073), i.e. injecting at the SVC-RA junction did not reduce, and may increase, retrograde IVC reflux."""
use_in_model = """Segment: arm vein -> subclavian -> brachiocephalic -> SVC (injection-site effect). Bypassing the arm and subclavian veins (port tip at SVC-RA junction) raised arterial-phase aortic attenuation by about 12% (medians 363.5 -> 405.5 HU; right-arm subgroup means 379.9 -> 426.3 HU) at the same iodine dose and rate.
A model should produce a modestly higher, not grossly different, aortic peak when the injection point moves from an antecubital vein to the SVC, consistent with some loss of bolus compactness (pooling/dispersion) in the arm and subclavian veins. Use the reflux rates as a check on RA -> IVC retrograde mixing."""

