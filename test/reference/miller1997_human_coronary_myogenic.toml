[meta]
id = "miller1997_human_coronary_myogenic"
data_type = "experimental"
validates = "Myogenic constriction of isolated human coronary resistance vessels (passive diameter 44-227 um): diameter at 100 mmHg as fraction of passive diameter; inverse size dependence; effect of hypertension"
species = "human"
preparation = "Microvessels dissected from right atrial appendages obtained at cardiac surgery; cannulated, zero flow, stepwise pressure increases; passive diameter by Ca-free/dilator conditions (detail not in abstract)."
conditions = "Stepped intraluminal pressure; diltiazem, calphostin C (PKC inhibition), PMA (PKC activation); normotensive vs hypertensive patients."
verification = "abs"
access = "PubMed abstract (PMID 9249498) via E-utilities, 2026-10-16. AJP full text not accessed (journals.physiology.org blocked; no Wayback capture tried successfully)."
notes = """At 100 mmHg vessels constricted to 55 +/- 4% of passive diameter. Inverse relation between vessel diameter and myogenic responsiveness (smaller vessels constrict more).
Hypertensive vs normotensive patients: 0.55 +/- 0.04 vs 0.74 +/- 0.03 (P < 0.01) (abstract prints these as the myogenic constriction index; group-label direction as printed: 'enhanced myogenic constriction' in hypertension).
Atrial, not ventricular, vessels."""
use_in_model = """Human check that spontaneous myogenic tone at 100 mmHg holds coronary resistance vessels up to ~227 um at roughly 0.55-0.75 of passive diameter; size-resolved values need the full text."""

