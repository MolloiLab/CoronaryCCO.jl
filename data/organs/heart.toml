# Physiology of one organ's vascular bed, as data. `Physiology(organ = "heart")` reads this file.
# Every value names its sources: `sources` are file stems in data/reference/ (checked on load);
# `cite` holds sources that are not yet in the repo as TOMLs.
[meta]
organ = "heart"
description = "Human (and dog/cat where human data are missing) coronary circulation and myocardium."

[parameters.p_in]
value = 90.0
unit = "mmHg"
note = "Mean aortic pressure. Normal human mean arterial pressure; the PET subjects of the whole-bed resistance anchor (r_total_dilated) had 86-89 mmHg (Kaufmann 1999). Chilian 1989 Table 2 gives 90 mmHg in the cat (dipyridamole ~91)."
sources = ["kaufmann1999_o15_water_reproducibility", "chilian1989_dipyridamole_resistance"]

[parameters.p_out]
value = 13.6
unit = "mmHg"
note = "Effective outflow pressure: zero-flow pressure of the maximally dilated beating heart. Lumps coronary-sinus pressure and the intramyocardial waterfall into one steady back pressure. Human values agree (Nanto 2001, van Herck 2007)."
sources = ["kanatsuka1990_microvessel_velocity", "nanto2001_human_zero_flow_pressure", "vanherck2007_hyperemic_zero_flow_pressure"]

[parameters.regulation]
value = "o2"
note = "Coronary flow is matched to O2 demand; coronary venous O2 tension is the regulated quantity (Tune, Gorman & Feigl 2004)."
sources = ["tune2004_coronary_venous_po2_regulation"]

[parameters.hd]
value = 0.45
unit = "1"
note = "Discharge (bulk) hematocrit, as used by the iodine-exchange model of Bindschadler 2014 (Alessio 2019: 0.45). Tube hematocrit from the Fahraeus law (Pries 1992)."
sources = ["bindschadler2014_iodine_exchange_model_ps"]
cite = ["Pries, Neuhaus & Gaehtgens 1992 Am J Physiol 263:H1770"]

[parameters.fb]
value = 0.09
unit = "mL/mL"
note = "Intramyocardial blood volume fraction, healthy human at rest by CMR: 9.0 +/- 0.7 % (Nickander 2019). McCommis 2007 (CMR, 6.2 mL/100 g) and Kassab's dilated cast (12.2 mL/100 g LV) bracket it."
sources = ["nickander2019_cmr_myocardial_blood_volume", "mccommis2007_myocardial_blood_volume", "kassab1994_venous_morphometry"]

[parameters.share_art]
value = 0.288
unit = "1"
note = "Derived: arterial 3.0 of 10.4 mL coronary cast volume (Kassab 1994, Discussion)."
sources = ["kassab1994_venous_morphometry"]

[parameters.share_cap]
value = 0.317
unit = "1"
note = "Derived: capillary 3.3 of 10.4 mL (Kassab 1994)."
sources = ["kassab1994_venous_morphometry"]

[parameters.share_ven]
value = 0.395
unit = "1"
note = "Derived: venous 4.1 of 10.4 mL (Kassab 1994); 0.394 rounded so the three shares sum to 1."
sources = ["kassab1994_venous_morphometry"]

[parameters.venous_scale]
value = "volume_share"
note = "Grown coronary veins take Kassab's venous/arterial cast volume ratio (the venous tree has no imaged anatomical scale of its own)."
sources = ["kassab1994_venous_morphometry"]

[parameters.capillary]
value = "tube"
note = "Capillary bed resistance from parallel functional capillary tubes (Kassab & Fung 1994 dimensions)."
sources = ["kassab1994_capillary_network"]

[parameters.cap_length_mm]
value = 0.5
unit = "mm"
note = "Functional capillary length."
sources = ["kassab1994_capillary_network"]

[parameters.cap_diameter_um]
value = 6.0
unit = "um"
note = "Functional capillary diameter."
sources = ["kassab1994_capillary_network"]

[parameters.cap_ht_ratio]
value = 0.85
unit = "1"
note = "Derived: tissue tube / discharge hematocrit 0.3825 / 0.45 (Bindschadler 2014)."
sources = ["bindschadler2014_iodine_exchange_model_ps"]

[parameters.ve]
value = 0.224
unit = "mL/mL"
note = "Derived: interstitial fraction = ECV - plasma volume = 0.273 - 0.09 x (1 - 0.45) (Nickander 2019 ECV 27.3 % and MBV 9.0 %, same healthy cohort)."
sources = ["nickander2019_cmr_myocardial_blood_volume"]

[parameters.ps]
value = 0.37
unit = "mL/min/g"
note = "Capillary permeability-surface product for iodinated contrast: Patlak influx constant of iopamidol in normal pig myocardium, by 64-slice CT and EBCT, similar during adenosine."
sources = ["daghini2007_ct64_myocardial_permeability"]

[parameters.rho]
value = 1.053
unit = "g/mL"
note = "Myocardial tissue density (Vinnakota & Bassingthwaighte 2004, Table 3: 1.053; text: about 1.055 for mammals including human)."
sources = ["vinnakota2004_myocardial_density"]

[parameters.plasma_viscosity_mPas]
value = 1.2
unit = "mPa s"
note = "Derived: midpoint of the normal human plasma viscosity range at 37 C, 1.10-1.30 mPa s (Kesmarky 2008)."
sources = ["kesmarky2008_plasma_viscosity"]

[parameters.radius_cv]
value = 0.12
unit = "1"
note = "Derived: median SD/mean of element diameter over the 29 RCA, LAD and LCx orders with an SD (Kassab 1993 Tables): 0.124 (IQR 0.11-0.19)."
sources = ["kassab1993_arterial_morphometry"]

[parameters.d_art_micro]
value = 170.0
unit = "um"
note = "Arterial microcirculation cut-off of Chilian's resistance classes."
sources = ["chilian1989_dipyridamole_resistance"]

[parameters.d_ven_micro]
value = 150.0
unit = "um"
note = "Venous microcirculation cut-off of Chilian's resistance classes."
sources = ["chilian1989_dipyridamole_resistance"]

[parameters.r_micro_dilated]
value = 0.0
unit = "mmHg min g/mL"
note = "Not used: the scale kappa is anchored to the human whole-bed resistance (r_total_dilated). Chilian 1989's dilated cat microvascular resistance (4.0) is now an emergent check."
sources = ["chilian1989_dipyridamole_resistance"]

[parameters.r_total_dilated]
value = 24.0
unit = "mmHg min g/mL"
note = "Whole-bed coronary resistance at maximal dilation in healthy men, MAP / MBF with no back pressure (Kaufmann 1999 PET: 25 +/- 4 and 23 +/- 4 on two adenosine scans; mean 24). Anchors the scale kappa of the grown microvessels (accepted calibration; Dale's decision A2, 2026-10-16); the stress-MBF row is therefore calibrated."
sources = ["kaufmann1999_o15_water_reproducibility"]

[parameters.d_active]
value = 150.0
unit = "um"
note = "Arteries below this passive diameter carry smooth-muscle tone; adenosine and dipyridamole dilate only these."
sources = ["kanatsuka1989_adenosine_microvessels"]

[parameters.wall_cpass_slope]
value = 6.666
unit = "dyn/cm per um"
note = "Passive tension strength C_pass = slope x D0. Carlson & Secomb 2005 / Carlson 2008 fits as tabulated by Fry et al. 2013 Table 1 (hamster cremaster origin; coronary refits: namani2018_coronary_wall_parameters)."
sources = ["fry2013_vessel_wall_parameters"]

[parameters.wall_cpass1_0]
value = 12.52
unit = "1"
note = "Passive tension sensitivity C'_pass = intercept + slope x D0: intercept. Carlson & Secomb 2005 / Carlson 2008 fits as tabulated by Fry et al. 2013 Table 1 (hamster cremaster origin; coronary refits: namani2018_coronary_wall_parameters)."
sources = ["fry2013_vessel_wall_parameters"]

[parameters.wall_cpass1_slope]
value = -0.027
unit = "1/um"
note = "C'_pass slope. Carlson & Secomb 2005 / Carlson 2008 fits as tabulated by Fry et al. 2013 Table 1 (hamster cremaster origin; coronary refits: namani2018_coronary_wall_parameters)."
sources = ["fry2013_vessel_wall_parameters"]

[parameters.wall_cact_coef]
value = 1.3
unit = "dyn/cm"
note = "Maximal active tension C_act = coef x D0^exp: coefficient (refit by Fry 2013 on small vessels). Carlson & Secomb 2005 / Carlson 2008 fits as tabulated by Fry et al. 2013 Table 1 (hamster cremaster origin; coronary refits: namani2018_coronary_wall_parameters)."
sources = ["fry2013_vessel_wall_parameters"]

[parameters.wall_cact_exp]
value = 1.48
unit = "1"
note = "C_act exponent. Carlson & Secomb 2005 / Carlson 2008 fits as tabulated by Fry et al. 2013 Table 1 (hamster cremaster origin; coronary refits: namani2018_coronary_wall_parameters)."
sources = ["fry2013_vessel_wall_parameters"]

[parameters.wall_cact1_0]
value = 0.773
unit = "1"
note = "Active length dependence C'_act = intercept + slope x D0: intercept. Carlson & Secomb 2005 / Carlson 2008 fits as tabulated by Fry et al. 2013 Table 1 (hamster cremaster origin; coronary refits: namani2018_coronary_wall_parameters)."
sources = ["fry2013_vessel_wall_parameters"]

[parameters.wall_cact1_slope]
value = -0.00059
unit = "1/um"
note = "C'_act slope. Carlson & Secomb 2005 / Carlson 2008 fits as tabulated by Fry et al. 2013 Table 1 (hamster cremaster origin; coronary refits: namani2018_coronary_wall_parameters)."
sources = ["fry2013_vessel_wall_parameters"]

[parameters.wall_cact2_0]
value = 0.415
unit = "1"
note = "Active tension range C''_act = intercept + slope x D0: intercept. Carlson & Secomb 2005 / Carlson 2008 fits as tabulated by Fry et al. 2013 Table 1 (hamster cremaster origin; coronary refits: namani2018_coronary_wall_parameters)."
sources = ["fry2013_vessel_wall_parameters"]

[parameters.wall_cact2_slope]
value = -0.0008
unit = "1/um"
note = "C''_act slope. Carlson & Secomb 2005 / Carlson 2008 fits as tabulated by Fry et al. 2013 Table 1 (hamster cremaster origin; coronary refits: namani2018_coronary_wall_parameters)."
sources = ["fry2013_vessel_wall_parameters"]

[parameters.wall_cmyo]
value = 1.369
unit = "cm/dyn x um"
note = "Myogenic sensitivity C_myo = value / D0 (cm/dyn). Carlson & Secomb 2005 / Carlson 2008 fits as tabulated by Fry et al. 2013 Table 1 (hamster cremaster origin; coronary refits: namani2018_coronary_wall_parameters)."
sources = ["fry2013_vessel_wall_parameters"]

[parameters.oef]
value = 0.73
unit = "1"
note = "Resting coronary-sinus O2 extraction: sets the single tone constant at rest (accepted calibration)."
sources = ["mccommis2010_myocardial_oxygenation"]

[parameters.g_meta]
value = 15.0
unit = "1"
note = "Metabolic sensitivity of the control state: C_meta 30 /uM/cm (Carlson 2008 Table) x S_CR about 0.5 uM cm (Carlson 2008 text; not in the TOML)."
sources = ["carlson2008_autoregulation_model"]
cite = ["Carlson, Arciero & Secomb 2008 Am J Physiol 295:H1572 (S_CR)"]

[parameters.mvo2]
value = 0.116
unit = "mL O2/min/g"
note = "Derived: myocardial O2 use 5.2 umol/g/min in healthy volunteers (McCommis 2010) x 22.4 uL/umol."
sources = ["mccommis2010_myocardial_oxygenation"]

[parameters.sao2]
value = 0.967
unit = "1"
note = "Arterial O2 saturation by CO-oximetry at sea level, adults 25-44 y: 96.7 % (Crapo 1999 Table 4)."
sources = ["crapo1999_arterial_blood_gas_reference"]

[parameters.hb]
value = 14.0
unit = "g/dL"
note = "Arterial hemoglobin, healthy men at sea level: 14.0 +/- 1.0 g/dL (Crapo 1999, the same arterial samples as sao2). Beutler 2006 venous reference: 15.4 (white men 20-29 y)."
sources = ["crapo1999_arterial_blood_gas_reference", "beutler2006_hemoglobin_reference"]

[parameters.atp_r1]
value = 1.026
unit = "1"
note = "Slope of red-cell ATP release with saturation, R = R0(1 - R1 S), as used by Zhao 2021. Arciero 2008 printed R1 = 0.891 (fitted to two release rates); the two papers disagree and the regulation is anchored by oef either way."
sources = ["zhao2021_regulation_parameters", "arciero2008_atp_conducted_response"]

[parameters.atp_l0]
value = 1.0
unit = "cm"
note = "Length constant of the conducted metabolic signal, about 1 cm (Arciero 2008; Zhao 2021)."
sources = ["arciero2008_atp_conducted_response", "zhao2021_regulation_parameters"]

[parameters.p_ext]
value = 0.0
unit = "mmHg"
note = "Not used (capillary = tube): pressure outside the capillary sheet."

[parameters.sheet_h0_um]
value = 0.0
unit = "um"
note = "Not used (capillary = tube)."

[parameters.sheet_alpha_um_cmH2O]
value = 0.0
unit = "um/cmH2O"
note = "Not used (capillary = tube)."

[parameters.sheet_s]
value = 0.0
unit = "1"
note = "Not used (capillary = tube)."

[parameters.sheet_area_m2_per_ml]
value = 0.0
unit = "m2/mL"
note = "Not used (capillary = tube)."

[parameters.sheet_mu_cP]
value = 0.0
unit = "cP"
note = "Not used (capillary = tube)."

[parameters.sheet_kf]
value = 0.0
unit = "1"
note = "Not used (capillary = tube)."

[parameters.sheet_path_um]
value = 0.0
unit = "um"
note = "Not used (capillary = tube)."

[parameters.sheet_pmax_cmH2O]
value = 0.0
unit = "cmH2O"
note = "Not used (capillary = tube)."

# Distensible vessels: not used by the heart model (arteries above d_active are rigid conduits; a model choice).
[parameters.beta_art_small]
value = 0.0
unit = "1/cmH2O"
note = "Not used (rigid vessels in the heart model)."

[parameters.beta_art_large]
value = 0.0
unit = "1/cmH2O"
note = "Not used (rigid vessels in the heart model)."

[parameters.beta_ven_small]
value = 0.0
unit = "1/cmH2O"
note = "Not used (rigid vessels in the heart model)."

[parameters.beta_ven_large]
value = 0.0
unit = "1/cmH2O"
note = "Not used (rigid vessels in the heart model)."

[parameters.d_alveolus_um]
value = 0.0
unit = "um"
note = "Not used (rigid vessels in the heart model)."

[parameters.p_pleural_cmH2O]
value = 0.0
unit = "cmH2O"
note = "Not used (rigid vessels in the heart model)."
