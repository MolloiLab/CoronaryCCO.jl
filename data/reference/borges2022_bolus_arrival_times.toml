[meta]
id = "borges2022_bolus_arrival_times"
data_type = "experimental"
validates = "Contrast-bolus arrival times along the venous-to-arterial path in CT: antecubital injection -> superior vena cava -> pulmonary trunk -> ascending aorta (first arrival, +50 HU over unenhanced blood); correlation of pulmonary-trunk-to-aorta time with cardiac index, heart rate, LVEF and stroke volume"
species = "human"
preparation = "43 adult outpatients (retrospective, Dec 2017 - Apr 2019) undergoing coronary CTA, mostly for CAD screening; excluded heart failure, valvular or lung disease, LVEF < 55%, and indexed LV EDV > 100 mL/m2 or ESV > 50 mL/m2. 64-slice Philips Brilliance. Ioversol 350 (Optiray 350) via an 18 G catheter in the RIGHT antecubital vein at 4 mL/s, volume 1.5 mL/kg, followed by 30 mL saline at 4 mL/s. Bolus-tracking monitoring slice at the level of the pulmonary trunk (ROI in descending aorta, trigger 150 HU), imaged once per second from the start of injection; the same slice shows the SVC, pulmonary trunk and ascending aorta. Cardiac output by the geometric (Simpson) method from the 10-phase CTA."
conditions = "Resting, clinical coronary CTA. Monitoring scans typically 100 kVp and 50 mAs. Arrival in each ROI = first image with attenuation >= 50 HU above unenhanced blood. Times are resolved at the 1-s image interval."
verification = "FT"
access = "Europe PMC open-access full-text XML (PMC9254703), retrieved 2026-10-15 via the Europe PMC REST API; tables read from the XML."
notes = """Times are FIRST-ARRIVAL times (+50 HU threshold), not peak or centre-of-gravity times, and are quantized by the 1-s sampling.
The English abstract states '3.0 s from the superior vena cava to the pulmonary trunk', but the Results give 3.0 +/- 2.4 s for injection -> SVC and 2.9 +/- 1.4 s for SVC -> pulmonary trunk; the Results values are recorded (the abstract appears to have shifted the label).
Injection -> ascending aorta is printed as 13.1 +/- 2.56 s (abstract: 13.1 s).
Only the pulmonary-trunk -> ascending-aorta time was tested for normality (D'Agostino-Pearson: normal).
Correlation of PT -> AA time with cardiac index: r = -0.2938, P = 0.055 (Table 3; text and Fig. 2 give r = -0.29).
The paper compares its 7.2 s PT -> AA time with control-group values of 6.6 s (Davarpanah et al.) and about 6.4 s (Skrok et al.); these are cited, not measured here."""
use_in_model = """Inject the model bolus in the right antecubital vein at 4 mL/s (1.5 mL/kg of 350 mgI/mL, then 30 mL saline at 4 mL/s) and sample the
SVC, pulmonary trunk and ascending aorta every 1 s. Detect arrival as the first sample >= 50 HU above baseline and compare the segment times
(arm -> SVC, SVC -> PT, PT -> AA) and the total (injection -> AA) with arrival_times. Convert concentration to HU with the scanner-specific
slope used elsewhere in the project; the monitoring scan here is at about 100 kVp. Check that PT -> AA time falls (weakly) with cardiac index."""

[source]
authors = ["Borges RR", "Morato TN", "Bezerra ASA", "Dias BA", "Reinaux JCF", "Monte GU", "Farage L"]
year = 2022
title = "Evaluation of intravascular contrast media transit times in coronary computed tomography angiography"
journal = "Radiol Bras"
volume = "55"
issue = "3"
pages = "161-166"
doi = "10.1590/0100-3984.2021.0063"
crossref_verified = "2026-10-15; Crossref DOI resolves to Radiologia Brasileira 55(3):161-166, authors Borges, Morato, Bezerra, Dias, Reinaux, Monte, Farage; Crossref holds the Portuguese title ('Avaliacao de diferentes tempos de transito do meio de contraste intravascular em exames de tomografia computadorizada coronariana'); the English title above is from the PMC full text"
