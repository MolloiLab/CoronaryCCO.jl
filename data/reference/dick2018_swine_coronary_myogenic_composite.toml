[meta]
id = "dick2018_swine_coronary_myogenic_composite"
data_type = "meta-analysis"
validates = "Composite passive (nitroprusside-dilated) and active (spontaneous myogenic tone) pressure-diameter curves of isolated swine coronary arterioles/small arteries by Kassab order (order 5 ~52-102 um, order 6 ~102-203 um, order 7 ~203-364 um passive diameter at 80 mmHg), subepicardial and subendocardial; fitted myogenic amplitude per order"
species = "pig (domestic and Yucatan; 11 source studies)"
preparation = "Meta-analysis of 11 ex vivo pressure-myography studies of cannulated swine coronary arterioles without flow (Kuo 1988, 1990a, 1991; Muller 1993; Rajagopalan 1995; Wang 1995, 1997; Tofukuji 1997a,b; Liao & Kuo 1997; Sorop 2008). Source figures digitized by the authors with WebPlotDigitizer, converted to um vs mmHg, assigned to Kassab 1993 orders by passive inner diameter at 80 mmHg, fitted with arctan sigmoids (Eq. 3 passive, Eq. 4 myogenic; Young et al. 2012), and fitted curves sampled every 20 mmHg (0-120 mmHg) to form order means."
conditions = "Passive = 100 uM sodium nitroprusside (or equivalent full dilation in source studies); active = spontaneous myogenic tone in physiological salt solution, no flow. Data above 100 mmHg are extrapolated by the fits (no source data > 100 mmHg)."
verification = "mixed"
access = "Europe PMC fullTextXML of PMC5974144 (CC BY open access) read 2026-10-16 for text and Tables 1 and 3; Fig. 7 digitized from the 1423x846 px (300 ppi) image embedded in the Frontiers publisher PDF (frontiersin.org/articles/10.3389/fphys.2018.00580/pdf), by automatic marker detection against detected axis ticks."
notes = """Fig. 7 values are the composite FITTED curves (sampled fits averaged across studies), not raw measurements.
Order 7 subepi has 1 study (Liao & Kuo 1997, 254 um), order 6 subepi 9 studies, order 5 subepi 3 studies; subendo order 7 = Sorop et al. 2008 (229 um), subendo order 6 = Kuo et al. 1988.
The authors state that orders >= 8 (> 384 um) were assumed passive in their model based on weak/absent myogenic responses (Nakayama 1988; Liao & Kuo 1997); no data for > 364 um.
Derived (computed here, not printed): passive D50/D100 (linear interpolation 40-60 mmHg) = 0.952 (epi o7), 0.937 (epi o6), 0.952 (epi o5), 0.941 (endo o7), 0.932 (endo o6); active/passive at 100 mmHg = 0.72 (epi o7), 0.75 (epi o6), 0.58 (epi o5), 0.56 (endo o7), 0.72 (endo o6).
For comparison, the Carlson-Secomb/Fry linear wall fits give passive D50/D0 = 0.85 at D0 = 256 um and 0.90 at 153 um."""
use_in_model = """Target passive pressure-diameter shape for coronary small arteries 100-260 um: D/D100 should be ~0.93-0.95 at 50 mmHg and ~0.98-0.99 at 80 mmHg; the passive curve is nearly size-independent. Spontaneous myogenic tone at 60-100 mmHg holds diameter at ~0.56-0.75 of passive, i.e. tone is substantial up to ~260 um. Use as a fit target for C'pass(D0) and for the A-dependent active curve in 150-400 um vessels."""

