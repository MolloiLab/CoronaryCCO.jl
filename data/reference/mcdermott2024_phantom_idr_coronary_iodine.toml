[meta]
id = "mcdermott2024_phantom_idr_coronary_iodine"
data_type = "experimental"
validates = "Peak iodine concentration reaching the coronary arteries vs injected iodine delivery rate (IDR) for 10-s injections at a fixed cardiac output of 4.8 L/min in a pulsatile circulation phantom; the 120 kVp HU conversion factor the authors assume (25 HU per mgI/mL)"
species = "phantom (water-filled physiological circulation phantom)"
preparation = "Third-generation cardiovascular circulation phantom (United Biologics, Santa Ana, CA) with heart model and coronary branching vessels; electromechanical pump (ViVitro SuperPump); room-temperature water at heart rate 60 bpm and stroke volume 80 mL (cardiac output 4.8 L/min); internal pressure 120/80 mmHg. Iodine concentration entering the coronaries measured with a Coriolis flow meter (MicroMotion 5700) during the injection and the following 60 s; peak recorded and averaged over 5 repeated trials per IDR."
conditions = "Contrast 370 mgI/mL at 0.81-8.1 mL/s (IDR 0.3-3.0 gI/s), volume adjusted for a constant 10-s injection duration. Injection site within the phantom not stated in the text read. CT part of the study (photon-counting CT, VMI 45-190 keV) used static titrated solutions and is not stored here."
verification = "FT"
access = "Europe PMC fullTextXML of PMC11460796 (Invest Radiol, CC BY-NC-ND open access), read 2026-10-15; Table 1 read from the XML table markup."
notes = """The 120 kVp attenuations in Table 1 are CALCULATED with an assumed conversion factor of 25 HU per mgI/mL ('using conversion factor of 25 HU/mg I/mL'); they are not measured at 120 kVp. The factor is stated without a source in the text read.
Measured peak coronary concentration is linear in IDR (R^2 = 0.997).
The phantom circulates water (no blood, no hematocrit) at a fixed cardiac output. Whether it has a pulmonary circuit, its total volume and its recirculation behaviour are not described in the text read (ref 21-22 of the paper).
Not a human measurement: use as a check of the dilution physics of a bolus model, not of human transit times."""
use_in_model = """Whole-path dilution check: run the model with CO = 4.8 L/min, 370 mgI/mL, 10-s injections at 0.81-8.1 mL/s, and compare peak coronary-inlet iodine concentration with peak_coronary_iodine (about 8.1 mgI/mL per gI/s). The ratio to the undispersed plug value (IDR / CO) measures how much the phantom's heart chambers and vessels flatten a 10-s bolus.
The 25 HU per mgI/mL factor is a nominal 120 kVp conversion; prefer measured kVp-specific factors (bae2010_ct_contrast_timing_review, tomita2019_kvp_iodine_sensitivity) when converting human HU."""

