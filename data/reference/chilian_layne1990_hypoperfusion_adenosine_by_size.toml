[meta]
id = "chilian_layne1990_hypoperfusion_adenosine_by_size"
data_type = "experimental"
validates = "In vivo subepicardial coronary microvessel diameter changes by vessel size (~45-295 um) with adenosine at baseline pressure (~96 mmHg) and with autoregulatory reductions of coronary perfusion pressure to 80, 60, 40 and 30 mmHg; arterioles (< 150 um) vs small arteries (> 150 um)"
species = "dog"
preparation = "Anesthetized open-chest dogs; coronary perfusion pressure lowered with a micrometer and pneumatic occluder on the main coronary artery. Subepicardial LV microvessel diameters by stroboscopic epi-illumination fluorescence (FITC-dextran) intravital microscopy synchronized to the cardiac cycle; myocardial blood flow by radioactive microspheres."
conditions = "Control group (n = 43 dogs at baseline) and adenosine group (n = 17), intracoronary adenosine 0.1-0.2 mg/kg/min with arterial pressure held at ~96 mmHg; perfusion pressures 95, 80, 58, 41 and 30 mmHg (Table 1)."
verification = "mixed"
access = "Publisher PDF (Circ Res 66:1227-1238) from Wayback Machine capture 20231031161535 of https://www.ahajournals.org/doi/pdf/10.1161/01.RES.66.5.1227; text by pdftotext; Fig. 7 digitized from a 300 dpi render by automatic blob detection with axis calibration from tick labels."
notes = """Values mean +/- SEM.
Abstract/Results (FT): at 80 mmHg only arterioles dilated (4.4 +/- 1.2%); at 60 mmHg small arteries (> 150 um) 4.9 +/- 2.2% and arterioles 6.9 +/- 1.2%; at 40 mmHg arterioles 8.1 +/- 1.6%, and adenosine produced a further increase (12.5 +/- 2.1%); at 30 mmHg arterioles -0.2 +/- 2.1%, reversed by adenosine (11.1 +/- 3.1%). Small arteries dilated with adenosine at 100 and 80 mmHg but not at <= 60 mmHg.
Adenosine at baseline pressure (FT): 'small arteriolar vessels dilated as much as 30-40%, whereas larger vessels only dilated 5-10%'; Fig. 7 regression printed as y = -0.048x + 21.4 (% vs um), r = -0.37, 30 vessels from 17 dogs.
Refitting the 30 digitized points gives y = -0.068x + 25.3, which matches the line drawn in the figure better than the printed equation; the printed equation is kept as the authors' value.
Adenosine raised flow ~3-fold (subendocardial 0.89 -> 2.65 ml/min/g, Table 2), so it is near-maximal, but small arteries also see a lower distending pressure at high flow (not measured here).
Derived from Fig. 7 (computed here): mean dilation 15.3% for 150-200 um (n = 6) and 5.1% for 220-295 um (n = 6); D_adenosine/D_control ~1.15 and ~1.05."""
use_in_model = """In vivo rest-to-dilated diameter ratio for coronary small arteries: ~1.05-1.15 at 150-300 um with near-maximal adenosine (vs up to 1.3-1.4 in arterioles < 100 um), and ~1.05 with autoregulatory dilation at 60 mmHg. Use as the target for how much tone a 150-400 um segment should release between rest and maximal dilation."""

