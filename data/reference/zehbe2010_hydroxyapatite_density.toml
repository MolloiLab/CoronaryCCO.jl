[meta]
id = "zehbe2010_hydroxyapatite_density"
data_type = "model input (mineral reference)"
validates = "Formula and maximum theoretical density of calcium hydroxyapatite, Ca10(PO4)6(OH)2, the mineral of calcified plaque. Gives the pure-mineral end member for calcified-plaque materials in a CT phantom."
species = "not applicable (mineral)"
preparation = "Statement in the Discussion of a synchrotron micro-CT study of cartilage and subchondral bone."
conditions = "Not applicable."
verification = "FT"
access = "Open access (Royal Society, PMC2839371); NCBI efetch db=pmc XML, read 2026-10-16."
notes = """Text: subchondral bone 'is composed of hydroxyapatite (Ca10(PO4)6(OH)2), with a maximum theoretical density of 3.16 g cm-3'.
The paper gives the formula and density only. The element mass fractions below are DERIVED here from the formula, using IUPAC standard atomic weights (Ca 40.078, P 30.973762, O 15.999, H 1.008). Molar mass from these weights = 1004.61 g/mol. They are stoichiometry, not measurements.
Biological apatite is carbonated and calcium-deficient, so real plaque mineral differs from this ideal formula.
PubChem (CID 14781, HSDB, citing Hawley's Condensed Chemical Dictionary 13th ed.) gives 'Density: 3.1 to 3.2 /Apatite/'. That agrees with 3.16 and is noted only as a cross-check.
Crossref dates the article 2009 (online); the print issue is vol 7, issue 42, 2010."""
use_in_model = """Pure-mineral end member for calcified plaque: hydroxyapatite at 3.16 g/cm3 with Ca 0.3989, P 0.1850, O 0.4141, H 0.0020 by mass. Mix it by mass with a soft-tissue or collagen-like matrix to reach a target calcified-plaque density (for example Rahdert 1999, 1.45 g/cm3 for whole class VII specimens)."""

