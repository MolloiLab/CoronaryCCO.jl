acinar_volume_sd_mm3 = 79.0
intra_acinar_generations_typical = 9
intra_acinar_generations_min = 6
intra_acinar_generations_max = 12
duct_inner_diameter_gen0_um = 500.0
duct_inner_diameter_gen10_um = 270.0
