retrograde_velocity_qualifier = ["measurable retrograde velocity faster than -40 mm/s", "maximum approximately -20 mm/s"]
missing_note = "Diameters, n, SD, forward/diastolic velocities and conditions other than baseline not available (abstract only). p < 0.0005 (slosh ratio) and p < 0.05 (velocity) endo vs epi."
