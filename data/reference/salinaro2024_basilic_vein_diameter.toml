[meta]
id = "salinaro2024_basilic_vein_diameter"
data_type = "experimental"
validates = "Upper-arm basilic vein lumen diameter and Doppler flow velocity in healthy adults at rest (spontaneous breathing), and their change with 10 cmH2O CPAP"
species = "human"
preparation = "28 healthy volunteers (hospital workers; age 34 +/- 8.5 y, 10 women, BMI 23.3 +/- 2.7). Sonosite Edge II with a 5-10 MHz linear probe. Basilic vein diameter in short axis at mid-arm (midpoint between axillary fold and medial humeral epicondyle); min and max venous velocity by pulsed Doppler in long axis over >= 10 s; each value the average of 3 observations."
conditions = "Semi-recumbent: head of bed elevated 30 degrees (NOT flat supine). FiO2 0.21. Three 5-min steps: spontaneous breathing; CPAP helmet 10 cmH2O PEEP with armpit straps; CPAP 10 cmH2O with straps attached to the bed."
verification = "FT"
access = "Europe PMC fullTextXML of PMC11075407 (J Vasc Access, open access), read 2026-10-15; Tables 1-2 read from the XML table markup."
notes = """Diameter is a single short-axis lumen diameter at mid-upper-arm; it is not stated whether it was the maximal or anteroposterior diameter.
Venous flow velocity (Doppler) is peak velocity across the respiratory cycle; volume flow is not reported.
The arm side (right/left) per volunteer is not stated in the text read; all volunteers were right-handed.
Flow velocities: complete data in 25 of 28 (valves or a too-small vein prevented Doppler in 3).
Posture is 30-degree head-up; supine diameters are likely somewhat larger (raised central venous pressure under CPAP increased diameter by ~20%)."""
use_in_model = """Basilic (upper-arm) segment of the injection path: lumen diameter ~4.4 mm sets the segment's cross-section (area ~15 mm2) and, with the measured resting velocities (~5-11 cm/s), the native-flow contribution to transit through the upper arm. Combine with a segment length (antecubital fossa to axilla, not given here) to get segment volume."""

