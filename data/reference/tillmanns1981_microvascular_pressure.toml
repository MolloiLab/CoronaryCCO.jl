[meta]
id = "tillmanns1981_microvascular_pressure"
data_type = "experimental"
validates = "Pulsatile (systolic/diastolic/mean) servo-null pressures in epimyocardial arterioles and venules of the beating heart, by vessel-size class; arteriole:aortic pressure ratio"
species = "rat and cat (pooled in Table 1; see notes)"
preparation = "Open-chest, beating hearts in situ; 25 rats (Wistar / Wistar-Furth, 200-400 g, Inactin 100 mg/kg i.p.) and 9 cats (0.9-1.5 kg, pentobarbital 25-30 mg/kg i.p.), positive-pressure ventilation. Epimyocardium viewed by incident-light / fluorescence intravital microscopy (FITC-dextran 150 kDa), motion restrained by five fine needles inserted under the field. Resistance servo-null micropipettes (1-7 um tips) in arterioles (30-150 um), small coronary arteries (150-300 um) and venules (30-150 um) of the left and right ventricles."
conditions = "Control (no drug) for Tables 1-2. Dipyridamole 0.5 mg/kg i.v. only for the venular systolic pressure comparison."
verification = "FT"
access = "Publisher PDF (ahajournals.org) read via Wayback Machine capture 20220710031158 of https://www.ahajournals.org/doi/pdf/10.1161/01.RES.49.5.1202"
notes = """Table 1 and Table 2 titles say 'Ventricular Myocardium of the Rat Heart', but the Results state that the 15 large coronary
arterioles (150-300 um) were punctured in seven cats and that arterioles < 100 um were 'occasionally' studied; venules were
studied in 25 rats and 7 cats. The tables therefore appear to pool species; treat species as rat/cat mixed.
Venular diameter row in Table 1 is internally inconsistent: 'small venules (50-100 um)' are listed with mean diameter 148 +/- 26 um and
'large venules (100-200 um)' with 68 +/- 15 um. The text says systolic large and small venular pressures averaged 24.4 and 22.8 mmHg
respectively, the reverse of the table (small 24, large 23). The columns may be swapped; values are recorded exactly as printed.
Statistic is mean +/- 1 SD over individual measurements. Mean pressure in arterioles of ~30 um was ~30% below aortic mean (Discussion).
Measurements were made in motion-restrained beating hearts (needles under the field), which may affect intramyocardial compression."""
use_in_model = """Beating-heart (pulsatile) epicardial-layer reference. Compare model mean pressure in subepicardial arterioles 150-300 um and 25-100 um,
and venules 50-200 um, normalised to model aortic/inlet mean pressure, against mean_pressure / aortic mean (80 mmHg) or Table 2 ratios.
Species is small-heart rat/cat, so use ratios rather than absolute mmHg when comparing with a pig/human-sized tree."""

