[meta]
id = "altieri2025_pa_murray_ct_mra"
data_type = "experimental"
validates = "Per-bifurcation Murray exponent (r0^x = r1^x + r2^x) of large pulmonary ARTERIES from in vivo CT/MRA segmentations in human, dog, pig, mouse"
species = "human, dog, pig, mouse (arteries only)"
preparation = "Human: 7 healthy adults (4 M, 3 F, age 15-51) CT or MR angiography from the Vascular Model Repository. Dog: 5 male beagles (12 +/- 1 kg), MRA. Pig: 4 young female pigs (56 +/- 24 kg), MRA. Mouse: 3 excised C57BL6/J lungs, contrast-perfused micro-CT."
conditions = "3D Slicer segmentation, SGEXT skeleton/spatial graph, custom MATLAB for radius/length/connectivity. About 6 +/- 1 generations analysed per species (resolution-limited; largest vessels only)."
verification = "FT"
access = "PMC HTML of PMC12834150 (author manuscript), read 2026-10-18 (Europe PMC XML endpoint returned an error)."
notes = """Exponent x solved per bifurcation with MATLAB fzero on r0^x = r1^x + r2^x, then mean +/- SD over all bifurcations of all subjects of a species.
Pooled over all species: 2.43 +/- 0.32 (p < 0.0001 vs 3).
Human mean not significantly different from 3 (p = 0.3721) because of large spread with n = 7.
Human MPA radius 1.00 +/- 0.13 cm; only ~6 generations, so the human values cover roughly radius 1 cm down to a few mm (smallest analysed radius not printed).
The paper's pulsatile-flow theory predicts x between 2.1 and 3 depending on Womersley number (human MPA Wo 11.0-19.8)."""
use_in_model = """Large-vessel (first ~6 generations) human pulmonary ARTERIAL per-junction exponent 2.31 +/- 0.60 from in vivo imaging; dog 2.13, pig 2.10. Consistent with cast values ~2.3 for the proximal tree. No veins."""

[source]
authors = ["Altieri Correa S", "Kachabi A", "Colebank MJ", "Miles CE", "Chesler NC"]
year = 2025
