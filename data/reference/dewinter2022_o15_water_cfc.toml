description = "[15O]H2O CFC class bounds. Each class lies inside its own rectangle (hMBF <= hmbf_upper AND CFR <= cfr_upper) and outside the next more severe one; steal is CFR < 1 at any hMBF."
location = "de Winter 2023 Methods (explicit Boolean form); de Winter 2022 Methods ('[15O]H2O PET thresholds for coronary flow capacity')"
provenance = "FT"
statistic = "thresholds (no dispersion)"
category = ["normal", "minimally_reduced", "moderately_reduced", "severely_reduced", "myocardial_steal"]
hmbf_upper_inclusive_mL_per_min_per_g = [nan, 3.01, 2.30, 1.50, nan]
cfr_upper_inclusive = [nan, 2.95, 2.50, 1.50, 1.0]
cfr_lower_exclusive_severe = 1.0
basis = ["above 0.5 SD below the normal-reference means (either value)", "below normal but either value above the ischemic cutoffs", "Danad 2013 ischemic cutoffs: hMBF 2.3 mL/min/g, CFR 2.5", "hMBF <= 1.5 and CFR <= 1.5 (within the ischemic range)", "CFR < 1: hyperemic MBF below resting MBF"]
rule = "normal = hMBF > 3.01 OR CFR > 2.95; otherwise the most severe class whose hMBF and CFR bounds both contain the point; steal = CFR < 1 (any hMBF); severe requires 1.00 < CFR <= 1.50."
missing_note = "Steal is CFR < 1 strictly; the 2023 text writes 'CFR<1' for steal and '1.00<CFR' for severe. Normal has no upper bound (nan)."

