[meta]
id = "dewinter2022_o15_water_cfc"
data_type = "experimental"
validates = "Coronary flow capacity thresholds adapted to [15O]H2O PET (hyperemic MBF in mL/min/g and CFR): myocardial steal, severely, moderately and minimally reduced CFC, normal flow; the normal-reference hMBF and CFR they are built on; distributions of vessels and patients across the categories"
species = "human"
preparation = "de Winter 2022: 314 stable-CAD patients with [15O]H2O PET before and after revascularization (415 revascularized vessels), Amsterdam UMC; parametric MBF by Cardiac VUer; vessel-specific (3 vascular territories) hMBF and CFR. de Winter 2023: 1,300 patients with known or suspected CAD (Amsterdam UMC and Turku), parametric MBF by Cardiac VUer or Carimas with a basis-function single-tissue compartment model; per patient, the vascular region with the lowest CFR."
conditions = "Rest, then adenosine 140 ug/kg/min with simultaneous [15O]H2O injection (2023 Methods); low-dose CT for attenuation correction."
verification = "FT"
access = "de Winter 2022: Europe PMC fullTextXML of PMC9159743 (open access), read 2026-10-15. de Winter 2023: Europe PMC fullTextXML of PMC10510823 (open access), read 2026-10-15. Tables in the 2023 paper are images in the XML and were not read."
notes = """O-15 WATER-SPECIFIC thresholds; do not mix with the Rb-82 cutoffs of Johnson & Gould.
Ischemic cutoffs (hMBF 2.3 mL/min/g, CFR 2.5) are cited from Danad et al. (J Nucl Med 2013). Severe cutoffs are hMBF <= 1.5 and CFR <= 1.5.
The normal reference is 155 patients from the Driessen cohort with obstructive CAD ruled out (calcium score 0 and no obstructive lesion on CCTA): hMBF 3.66 +/- 1.30 mL/min/g, CFR 3.69 +/- 1.48. The minimal/normal boundary is set 0.5 SD below these means (3.01, 2.95; the paper states these values).
There is no separate 'mildly reduced' class: the O-15 scheme has 5 classes (steal, severe, moderate, minimal, normal).
Combination rule (printed explicitly in 2023, Methods):
  myocardial steal = CFR < 1;
  severe = hMBF <= 1.50 AND 1.00 < CFR <= 1.50;
  moderate = (1.50 < hMBF <= 2.30 AND CFR <= 2.50) OR (hMBF <= 2.30 AND 1.50 < CFR <= 2.50);
  minimal = (2.30 < hMBF <= 3.01 AND CFR <= 2.95) OR (hMBF <= 3.01 AND 2.5 < CFR <= 2.95);
  normal = hMBF > 3.01 OR CFR > 2.95.
This is the nested-rectangle rule (a class needs BOTH values at or below its bounds; one value above a bound lifts the pixel to the less severe class), except that steal is CFR < 1 at ANY hMBF.
2022 wording: severe = 'hMBF <= 1.5 and CFR <= 1.5'; moderate = 'hMBF <= 2.3 and CFR <= 2.5, yet with either hMBF > 1.5 or CFR > 1.5'; normal = 'either hMBF > 3.01 or CFR > 2.95'. In 2022, only 7 of 415 baseline vessels (2%) had BOTH hMBF and CFR above the normal thresholds."""
use_in_model = """If the model's hyperemic flow is compared with O-15 water PET (closest to true tissue flow, freely diffusible tracer), classify per territory with category_thresholds_o15 and compare a healthy model heart with the normal reference (hMBF 3.66 +/- 1.30, CFR 3.69 +/- 1.48 in patients with obstructive CAD ruled out).
A healthy model heart should be 'normal' (hMBF > 3.01 or CFR > 2.95) in all territories."""

