[meta]
id = "johnson2011_pet_ischemic_thresholds"
data_type = "experimental"
validates = "Low-flow thresholds of ischemia during dipyridamole PET: worst-pixel stress perfusion (cc/min/g) and CFR separating definite ischemia, indeterminate (1 of 3 ischemic features) and no ischemia; frequency of myocardial steal (worst CFR < 1) in each group. These are the ischemic cutoffs used in the 2012 coronary flow capacity map."
species = "human"
preparation = "1,674 sequential rest-dipyridamole PET studies in 1,370 patients (whole CAD spectrum). Most studies: GE Discovery ST PET-CT (2D mode), 35-50 mCi Rb-82, March 2007 - July 2010. Minority: 538 studies (Feb 1993 - May 1997) on the University of Texas cesium-fluoride scanner with 15-20 mCi N-13 ammonia, and 56 studies (Sept 2006 - Apr 2010) on a Positron mPower scanner. Flow by the group's radionuclide-specific integrative model; 21 slices x 64 radial pixels, smoothed with a 5 x 5 pixel average; 4 basal and 2 apical slices excluded."
conditions = "Dipyridamole 142 ug/kg/min for 4 min; caffeine, theophylline and cigarettes withheld 24 h. Definite ischemia = new or worse stress perfusion defect plus significant (> 1 mm) ST depression and/or severe angina needing IV aminophylline, sublingual nitroglycerin and/or IV metoprolol. Indeterminate = only 1 of these 3 abnormalities. No ischemia = no prior MI and no angina or ECG change after dipyridamole."
verification = "FT"
access = "Full text HTML (JACC: Cardiovascular Imaging, Elsevier open archive) read from Wayback Machine capture 20200113012440 of http://imaging.onlinejacc.org:80/content/4/9/990; Table 1 from capture of .../content/4/9/990/T1. Abstract also in the capture."
notes = """'Worst' stress flow and 'worst' CFR are the single worst pixel values (after 5 x 5 smoothing) recorded by software; the worst CFR pixel need not coincide with the worst stress-flow pixel.
Cutoffs were chosen to match sensitivity and specificity. Normalizing to a pressure-rate product (7,000 rest, 10,000 stress) did not improve the AUC (worst stress-flow cutoff 0.89 ml/min/g at PRP 10,000, AUC 0.99; worst CFR cutoff 1.75 at PRP 10,000/7,000, AUC 0.91).
Results were similar when the 2 scanners that account for > 96% of studies were analysed separately. The Results text says 302 indeterminate studies (Abstract and Table 1: 301).
Mean PRP 7,351 +/- 1,869 at rest and 10,861 +/- 2,504 mmHg/min at peak dipyridamole; PRP vs whole-LV flow r^2 = 0.22 at rest, 0.08 at stress.
Of all 1,674 studies, 339 (20%) showed only scar and are excluded from the three-way comparison.
The abstract states that when the worst vasodilator stress flow exceeds 1.12 ml/min/g, ischemic manifestations occur rarely. The paper gives no CFR equivalent of that sentence; the 2.03 CFR value is the cutoff separating indeterminate from no ischemia.
The thresholds were derived with a mix of Rb-82 (majority) and N-13 ammonia; the paper presents this as evidence of independence from scanner and radionuclide."""
use_in_model = """Use cutoffs as the 'definite ischemia' (stress < 0.91 cc/min/g, CFR < 1.74) and 'moderately reduced' (stress < 1.12, CFR < 2.03) boundaries of the 2012 CFC map. Compare the model's worst-voxel hyperemic flow and CFR distal to a simulated severe stenosis or occlusion with worst_values_by_group.
Steal frequency: a model with collateral-supplied myocardium distal to an occlusion should be able to produce CFR < 1 (seen in 40% of definite-ischemia studies, 1.4% of nonischemic studies)."""

