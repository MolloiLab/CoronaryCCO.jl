# Kassab GS, Le KN, Fung YC (1999). A hemodynamic analysis of coronary capillary blood flow based on
# anatomic and distensibility data.
# This is a MODEL paper. Only its experimental INPUT data (capillary distensibility measured by
# intravital microscopy) are relevant here; no model outputs are stored.
# The publisher full text could NOT be read (journals.physiology.org returns HTTP 403; Unpaywall lists
# no open-access copy; no Wayback copy). Numbers come from open-access later papers. Each dataset says which.

[meta]
id = "kassab1999_capillary_hemodynamics"
data_type = "experimental"
validates = "Capillary distensibility (diameter change per unit transmural pressure) for a compliant lumped capillary bed, and a published pressure-radius curve for order 0 (capillary) and order 1 (smallest arteriole) vessels fitted to these data."
species = "pig"
preparation = "Distensibility of coronary capillaries on the epicardial surface measured as a pressure-diameter relationship by intravital microscopy (abstract). Anatomic inputs were the earlier pig capillary-network data (Kassab and Fung 1994). Number of animals and vessels not verified (full text not accessible)."
conditions = "Epicardial surface capillaries; the abstract states the analysis applies to the diastolic state and that intramyocardial capillary compliance remains unknown. Arrest/perfusion details not verified."
verification = "mixed"
access = "Primary full text not accessible (publisher HTTP 403, Unpaywall closed, no Wayback copy). Abstract read via PubMed E-utilities (PMID 10600833). Numbers read from open-access secondary sources: Huo and Kassab 2009 J Appl Physiol (PMC2724323, HTML) and Namani, Kassab, Lanir 2018 J Gen Physiol (PMC5749109, XML)."
notes = """
Input data only. The paper's model results (pressure and flow dispersion with and without cross-connections, resistance) are model outputs and are not stored.
Abstract findings (qualitative, provenance abs): (1) dispersions of pressure and flow are significantly reduced when capillary cross-connections are present, and flow resistance is reduced as well (model result); (2) epicardial surface capillary compliance is so small that its effect on the blood pressure drop is negligible in the diastolic state; (3) intramyocardial capillary compliance and systolic muscle-vessel interaction remain unknown.
Huo and Kassab 2009 convert the capillary diameter-compliance into a normalised compliance of about 2.1e-3 per mmHg for order 0. That conversion is their own estimate and is not stored.
The pressure-radius curve parameters in capillary_pressure_radius_fit are a published FIT by Namani et al. 2018 to the Kassab 1999 in situ diameter-pressure data. They are derived values, not raw measurements. Namani state that the radius for each order was referred to the 80 mmHg cast radius (Kassab 1993) to be compatible with the in situ data, so R80 should be read as a cast-based radius, not as a Kassab 1999 measurement. The same Ap, Bp, phi_p, Cp values for orders 0 and 1 reappear in Wang 2024 CMPB Table A2 (PMC10872892); that is the same lineage, not an independent check.
"""
use_in_model = """If the lumped capillary bed is compliant, its diameter-compliance should be of the order of capillary_diameter_compliance (about 0.017 um/mmHg for capillaries under 8 um), i.e. close to rigid over the physiological pressure range. If a pressure-radius law is needed for capillaries or the smallest arterioles, capillary_pressure_radius_fit gives the Namani 2018 arctan law R(dP) = Bp + (Ap - Bp)/pi * (pi/2 + atan((dP - phi_p)/Cp)), radius in um, transvascular pressure dP in mmHg."""

