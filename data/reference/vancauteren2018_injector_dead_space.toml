[meta]
id = "vancauteren2018_injector_dead_space"
data_type = "experimental"
validates = "Injector-to-venous-port tubing dead space used to size the saline chaser (12 mL), and a cited estimate of the contrast volume held in the arm-to-SVC venous path (20-30 mL)"
species = "minipig (dead-space statement concerns the injection set-up); venous-path statement is a citation about humans"
preparation = "4 minipigs with a surgically implanted port-a-cath (Power PAC II, 1.9 mm, Smiths Medical) in the left shoulder connected to the superior vena cava; dual-head injector (Nemoto-Kyorindo); 64-slice MDCT dynamic scans for 120 s. Contrast at constant iodine delivery rate 0.64 gI/s and total iodine dose 320 mgI/kg, concentrations 120-370 mgI/mL (injection rates 2.1-5.3 mL/s)."
conditions = "Contrast at 20 degC. Each contrast injection was followed, at the same rate, by a 12-mL saline chaser 'which equals the exact volume of the dead space of the tubing from the injector to the PAC'."
verification = "FT"
access = "Europe PMC fullTextXML of PMC6269421 (Sci Rep, open access), read 2026-10-15."
notes = """The 12 mL figure is the dead space of THIS set-up (injector tubing to an implanted port), not a generic CT patient line.
The Discussion states, citing Awai et al. (Radiology 2004;233:682), that a volume of injected contrast 'is retained between the brachial vein and the superior vena cava' and that 'this venous space can contain 20-30 mL of the injected CM'. This is a secondary statement; the Awai full text was not accessible and the basis of the 20-30 mL estimate was not checked.
Main study result (not about the venous path): at constant IDR and dose, lower-concentration contrast gave higher aortic peak enhancement and longer peak width (e.g. 245 HU and 9.2 s at 320 mgI/mL vs 291 HU and 16.1 s at 160 mgI/mL)."""
use_in_model = """Injection line: a 12-mL tubing dead space (injector to venous access) delays the contrast front and must be flushed by the saline chaser; compare with the ~2.8 mL of a standard low-pressure connecting tube (cowan2017_injector_tubing_volume). Arm-to-SVC venous path: the cited 20-30 mL is an order-of-magnitude check for the model's peripheral venous volume (antecubital/brachial to SVC); treat it as unverified."""

