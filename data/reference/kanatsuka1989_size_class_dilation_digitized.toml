[meta]
id = "kanatsuka1989_size_class_dilation_digitized"
data_type = "experimental"
validates = "Supplement to kanatsuka1989_adenosine_microvessels: digitized class-mean in vivo % diameter change of arterial microvessels <= 150 um vs > 150 um (up to 380 um) with rapid pacing, adenosine and dipyridamole at matched perfusion, and with large doses (5-7-fold perfusion)"
species = "dog"
preparation = "As in kanatsuka1989_adenosine_microvessels: open-chest dogs, subepicardial arterial microvessels by stroboscopic epi-illumination intravital microscopy at end diastole; mean aortic pressure held within 10 mmHg of control."
conditions = "Fig. 5: rapid pacing 300 bpm (group 1), adenosine IV ~0.21 mg/kg/min (group 2), dipyridamole IV ~0.23 mg/kg (group 3), doses matched to the pacing flow increase. Fig. 9: adenosine 1.1 mg/kg/min IV and dipyridamole 1.0 mg/kg IV."
verification = "fig"
access = "Publisher PDF (Circ Res 65:1296-1305) from Wayback Machine capture 20220710031222 of https://www.ahajournals.org/doi/pdf/10.1161/01.RES.65.5.1296?download=true; Figs. 5 and 9 rendered at 400 dpi and bar tops/SEM caps read against the printed y ticks (Fig. 5: ~31 px per 1%; Fig. 9: ~12.8 px per 1%)."
notes = """Bar heights are means, caps are +SEM; n are vessels.
Fig. 5 small (<= 150 um) vs large (> 150 um): pacing dilated both classes significantly; adenosine and dipyridamole dilated only small vessels.
Fig. 9 large doses: small vessels dilated significantly; large vessels did not dilate.
The authors caution that distending pressure in > 150 um vessels probably fell at high flow, so absence of dilation does not prove tone did not fall.
Per-vessel scatter (Figs. 4, 6, 7, 8; 40-380 um) not digitized."""
use_in_model = """In vivo rest-vs-dilated diameter ratio for > 150 um coronary arteries in the dog: ~1.05 with a metabolic stimulus (pacing, MVO2 x2) and ~1.00 with adenosine or dipyridamole even at 5-7-fold perfusion; for <= 150 um ~1.11-1.12 at matched flow and ~1.16-1.23 at large doses."""

