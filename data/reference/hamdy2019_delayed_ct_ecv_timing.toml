[meta]
id = "hamdy2019_delayed_ct_ecv_timing"
data_type = "experimental"
validates = "Time course of the late myocardium-to-blood iodine partition: CT ECV at 3, 5 and 7 min after contrast injection in control subjects and in remote and infarcted myocardium; image SNR and infarct CNR at each delay."
species = "human"
preparation = "Mie University. 35 patients with a delayed-CT enhancement pattern typical of previous myocardial infarction and 17 control subjects. Delayed scans at 3, 5 and 7 min after contrast injection."
conditions = "Contrast agent, dose, kV and hematocrit handling are not in the abstract. ECV from pre-contrast and delayed CT."
verification = "abs"
access = "Abstract only, via PubMed E-utilities (PMID 30564976). Full text (Int J Cardiovasc Imaging, Springer) not accessible."
notes = """The abstract gives ECV at 5 min only (controls 27.1 +/- 2.1%). For 3 and 7 min it says ECV values were 'constant over the three time points', with a trend to lower values at 3 min in infarcted segments only.
The definition of 'control subjects' is not in the abstract.
SNR is given as 15.2 +/- 1.0 at 5 min, 13.6 +/- 1.0 at 3 min and 14.9 +/- 1.0 at 7 min. These are image-quality numbers, not physiology.
Infarct-to-remote CNR: 6.4 +/- 2.5 at 7 min vs 6.1 +/- 2.2 at 5 min (P = 0.08)."""
use_in_model = """Shape check for late washout in normal myocardium: the ratio dHU_myo / dHU_blood is already flat by 3 min and stays flat to 7 min (normal ECV about 27% at 5 min). In the model, the myocardium-to-blood partition (times 1 - Hct) should reach its plateau by about 3 min and then track the blood curve downward. Infarcted (expanded-interstitium) tissue may still be rising at 3 min."""

[source]
authors = ["Hamdy A", "Kitagawa K", "Goto Y", "Yamada A", "Nakamura S", "Takafuji M", "Nagasawa N", "Sakuma H"]
year = 2019
title = "Comparison of the different imaging time points in delayed phase cardiac CT for myocardial scar assessment and extracellular volume fraction estimation in patients with old myocardial infarction"
journal = "Int J Cardiovasc Imaging"
