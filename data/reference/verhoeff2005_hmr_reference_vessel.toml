[meta]
id = "verhoeff2005_hmr_reference_vessel"
data_type = "experimental"
validates = "Human hyperemic microvascular resistance index h-MRv = h-Pd / h-v (HMR, mmHg.cm^-1.s) in angiographically normal reference vessels and in target vessels before and after PCI; resting MRv; hyperemic distal pressure and velocity."
species = "human"
preparation = "23 patients with stable angina (57.8 +/- 7.3 y; 17 M), 24 lesions. Prototype 0.014-inch dual-sensor guidewire (Doppler at the tip, pressure 3 cm proximal; Volcano). Aortic pressure via the guiding catheter. Intracoronary nitroglycerin 0.1 mg every 30 min. Reference vessels: distal part of an angiographically normal vessel; all were left coronary arteries (n = 20)."
conditions = "Rest and maximal hyperemia with intracoronary adenosine 20-40 ug bolus. Hyperemia = highest average of 3 consecutive per-beat velocity averages; matching per-beat Pa and Pd. h-MRv = h-Pd/h-v; h-SRv = (h-Pa - h-Pd)/h-v. Collateral index Pw/Pa at the end of balloon occlusion (target vessels)."
verification = "FT"
access = "Publisher PDF (Circulation 111:76-82) from the Wayback Machine capture 20220804102832 of the ahajournals PDF URL; text extracted with pdftotext; Table 2 read from the text layer."
notes = """All values mean +/- SD. CRU in the table footnote = mmHg.cm^-1.s (printed as 's^-1', an obvious typo for an index of pressure/velocity).
h-v is average peak velocity (APV) from the Doppler spectrum, not volumetric flow, so HMR cannot be converted to mmHg.min.g/mL without vessel area, a velocity-profile factor and territory mass (none reported).
HMR is computed with Pd, not Pd - Pzf; the paper discusses the pressure dependence of h-MRv (it fell as h-Pd rose after PCI).
Pw/Pa in target vessels before PCI was 0.23 +/- 0.07, unrelated to pre-treatment h-MRv (r = 0.28, P = 0.19)."""
use_in_model = """Use reference-vessel values (h-MRv 1.73 +/- 0.38 CRU at h-Pd 93 mmHg, h-v 56 cm/s) only as a ratio check: model distal-segment pressure / mean velocity in a mid-to-distal left coronary artery at full dilation, with the wire-measured APV converted from the model mean velocity (APV ~ 2x mean for a parabolic profile is an assumption, not in this paper). The absolute per-gram resistance target comes from the thermodilution files (fournier2021, mahendiran2025)."""

