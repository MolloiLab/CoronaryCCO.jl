# Yipintsoi T, Kroll K, Bassingthwaighte JB (2016). Fractal regional myocardial blood flows pattern according
# to metabolism, not vascular anatomy. Open-chest dogs, microspheres, ~0.2 g LV pieces, control vs
# catecholamine stimulation vs adenosine vasodilation. Full text read from PMC (PMC4796624, HTML).

[meta]
id = "yipintsoi2016_flow_heterogeneity"
data_type = "experimental"
validates = "LV and RV flow heterogeneity (RD at ~0.2 g pieces) and spatial correlation (Hurst coefficient H, D = 2 - H) at rest, under metabolic stimulation, and under adenosine vasodilation, with absolute flows. Adenosine state is the best experimental analog of a fully dilated, anatomy-only (no vasomotor tone) CCO tree."
species = "dog"
preparation = "Adult mongrel dogs (4 main + 1 adenosine-only dog), 20-26 kg, morphine + alpha-chloralose, open chest. 15 +/- 1 um carbonized microspheres (4-5 labels) into the left atrium over 15 s, aortic reference sample. Hearts cut completely: LV 643 +/- 160 pieces, mean piece weight 0.17-0.24 g per heart (0.1-0.2% of LV); LV weight 128.9 +/- 15.6 g."
conditions = "C1 control; LM low catecholamine (norepinephrine 4 ug/ml + epinephrine 1 ug/ml at 1 ml/min, plus atropine 0.25 mg/kg); HM high catecholamine (2.5 ml/min); HM + Ado (adenosine iv titrated to keep mean aortic pressure near 100 mmHg); C2 final control 10-30 min after stopping infusions; Ado alone (iv adenosine about 400-700 ug/kg/min) in one heart."
verification = "FT"
access = "PMC4796624, HTML article page (pmc.ncbi.nlm.nih.gov)."
notes = """
RD values are observed RDs from single microsphere injections (not corrected for method error); RD of LV and RV each relative to their own mean.
Text: range of RD 12-26% during adenosine vs 21-33% in LV (and >40% in RV) in other states.
Hurst coefficient H from the average of dispersional analysis (Disp) and the nearest-neighbour correlation-falloff method; the authors treat flows as 1-D (E = 1), so D = 2 - H. Mean H over all conditions 0.80 (D about 1.2), nearest-neighbour correlation r1 = 2^(2H-1) - 1 = 0.516.
Fig. 6 (fifth dog, adenosine only): mean LV flow Ado1 2.31, control 1.59, Ado2 1.51 ml/g/min; 761 pieces averaging 157 +/- 54 mg, heart weight 119 g; the two adenosine flow patterns were almost identical, differing from control.
Fig. 1 example (heart 4): adenosine LV flow 4.17 vs control 0.37 ml/g/min (>10-fold).
Sestier et al. (cited in Introduction, not stored): RD rose from 22 to 31% with a fourfold adenosine flow increase at constant coronary pressure.
"""
use_in_model = """Voxelize the LV into ~0.2 g pieces and compute RD of piece flow. The CCO model without vasomotor tone corresponds to the adenosine states (RD_LV about 20%, H about 0.8-0.9). Rest states (RD_LV about 23-26%) include metabolic vasoregulation the model does not have. Use fractal D = 2 - H from hurst_by_state for the spatial-correlation check (dispersional analysis over aggregated pieces)."""

