[meta]
id = "yang2025_qca_lesion_geometry"
data_type = "experimental"
validates = "QCA geometry of intermediate-to-severe coronary stenoses: reference diameter, minimal lumen diameter, lesion length, inflow (entrance) and outflow (exit) angles, area and diameter stenosis, and plaque symmetry. Gives the lumen profile shape of a synthetic focal stenosis."
species = "human"
preparation = "Two cohorts with invasive FFR. Development: 113 patients, 170 vessels (two centres in Singapore, prospective, 2016-2020). Validation: 107 patients, 133 vessels (China, retrospective, 2014-2021). Visual diameter stenosis 30-90%; left main, in-stent restenosis and myocardial bridges excluded."
conditions = "QCA with QAngio XA 7.3 (Medis) in a core lab, end-diastolic frame, single best projection, catheter-tip calibration. For sequential lesions the most severe one represented the vessel."
verification = "FT"
access = "Open access (Frontiers, PMC12226509); NCBI efetch db=pmc XML, read 2026-10-16. Supplementary Table S1 (QCA parameter definitions, including the inflow and outflow angles) was not read."
notes = """Definitions from the Methods: lesion length = distance from the proximal lesion-free segment to the distal lesion-free segment. Reference diameter and area = computer-generated estimate at the stenosis assuming no lesion. DS_QCA = [1 - (MLD / reference lumen diameter)] x 100%. Area stenosis = [1 - (minimal lumen area / reference lumen area)] x 100%. Plaque symmetry = ratio of the plaque areas on the two sides in the 2-D projection (0 = fully asymmetric, 1 = fully symmetric).
Table 2 prints the area stenosis unit as 'mm 2'. The values (about 76) and the Methods formula show it is a percent. Stored as percent with this note.
Inflow and outflow angles are not defined in the main text (Supplementary Table S1). They are presumably the wall angles of the converging and diverging parts of the lumen profile.
Vessel distribution (LAD vs other) per cohort is not given in the main text read here; a subgroup analysis by LAD vs non-LAD exists."""
use_in_model = """Lumen profile of a synthetic stenosis: reference diameter about 2.8-2.9 mm, MLD about 1.3-1.4 mm (DS_QCA about 52-54%), lesion length 14-20 mm, with converging (inflow) and diverging (outflow) wall angles of about 12-17 deg and 12-14 deg. The near-equal angles support a roughly symmetric entrance and exit taper. Plaque symmetry 0.6 +/- 0.3 says the plaque is usually eccentric in projection."""

