# Kaimovitz B, Huo Y, Lanir Y, Kassab GS (2008). Diameter asymmetry of porcine coronary arterial trees:
# structural and functional implications. Am J Physiol Heart Circ Physiol 294:H714-H723.
# Numbers from Tables 1-4 and the text of the publisher full-text HTML.

[meta]
id = "kaimovitz2008_diameter_asymmetry"
data_type = "experimental"
validates = "Asymmetry ratio matrix (ARM): mean +/- SD of Ds/Dm (smaller-daughter over mother diameter) for inter-element bifurcations, indexed by the diameter-defined order of the smaller daughter (row) and of the mother (column), for pig LAD, LCx and RCA. This is the diameter analogue of Kassab's connectivity matrix and the most direct target for side-branch size vs parent size."
species = "pig"
preparation = "Raw bifurcation data of the Kassab et al. 1993 arterial database (casts > 50 um, histology < 50 um), ordered by the original manual diameter-defined Strahler scheme ('raw' tables)."
conditions = "Arrested, maximally vasodilated, cast (as Kassab 1993)."
verification = "mixed"
access = "Publisher full-text HTML (journals.physiology.org) read via Wayback Machine capture 20220305070123; tables parsed from HTML cells (column positions preserved). Supplemental Tables S1-S8 (one PDF, Tables+S1-S8.pdf: automatic-scheme ARMs; per-order Dl/Dm, Ds/Dm and AER) were not accessible: re-tried 2026-10-16, live site 403 (bot challenge), Wayback 404; figure images (Figs. 1-7) are not archived either. Tables 1-3 re-checked cell by cell against the same capture on 2026-10-16 (119 cells, 0 mismatches)."
notes = """Inter-element bifurcations only: each daughter belongs to a different element, so the smaller daughter starts a side branch of lower order. Intra-element Dl/Dm (taper along an element) is shown only in Fig. 1 (minimum at mother order 5, ~70-80 um) and Supplemental Tables S5-S7.
Row = order of the smaller daughter Ds (0 = capillary), column = order of the mother Dm. Entries are stored as flat parallel arrays (daughter_order, mother_order, value). Empty cells in the printed matrix are simply absent here.
Some cells print a mean without SD or n (single observation or omitted); those SD/n are stored as nan.
Rows 0-2 of the LCx table are identical to the LAD table (shared histological data), as in Kalsho & Kassab 2004.
The authors state (text, data not shown) that S_D = Dl/Ds is uniform over orders 1-5 and increases above order 5; AER is near 1 for orders 6-11 and rises toward order 1."""
use_in_model = """For each CCO bifurcation assign diameter-defined orders to the mother and smaller daughter and compare the mean Ds/Dm in each (daughter, mother) cell with these matrices; weight by n_mother_vessels. Together with Kassab 1993 connectivity matrices this checks both how often and how large side branches are. The diagonal-adjacent cells (daughter = mother - 1) give near-symmetric junctions (Ds/Dm ~0.45-0.7); cells far from the diagonal give the small side branches off trunks (Ds/Dm < 0.1)."""

