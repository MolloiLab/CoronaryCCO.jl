[meta]
id = "cobb1974_awake_adenosine_transmural"
data_type = "experimental"
validates = "Epicardial and endocardial LV blood flow and endo/epi ratio at rest and at maximal adenosine vasodilation in the beating heart, awake vs after anesthesia and thoracotomy (heart rate 71 -> 176/min)"
species = "dog"
preparation = "13 mongrel dogs 25-33 kg, chronically instrumented (aortic and left atrial catheters), studied awake, lying quietly; then repeated after pentobarbital 30 mg/kg, thoracotomy and pericardiotomy. 7-10 um radioactive microspheres into the left atrium; reference arterial withdrawal. LV rings 2 and 3 cut into six circumferential regions, each split into epicardial and endocardial halves (2-3 g samples)."
conditions = "Control and adenosine 4.0 umol/kg/min i.v. (dose shown previously to abolish reactive hyperemia and give no further flow increase at higher dose); awake (control n = 13, adenosine n = 11) and after anesthesia/thoracotomy (control n = 13, adenosine n = 9)."
verification = "FT"
access = "JCI open-access PDF read with pdftotext; Tables I-II read from the text layer (OCR errors such as '40.32' for '+/-0.32' corrected by context)."
notes = """All values mean +/- SEM. Hemodynamics: awake control HR 71 +/- 3/min, BP 100 +/- 3 mmHg; awake adenosine HR 111 +/- 5, mean arterial 86 +/- 3 mmHg;
anesthetized control HR 156 +/- 10, BP 117 +/- 4; anesthetized adenosine HR 176 +/- 10, BP 96 +/- 3. Awake adenosine: coronary resistance fell to 13% (epi) and
16% (endo) of control. Adenosine increase in endocardial flow was 22-37% smaller than in the epicardium (Discussion). Ratio of layer flows is a two-layer
(halves) ratio, not quarters."""
use_in_model = """Beating-heart hyperemic transmural target: at moderate heart rate (~110/min) the endo/epi ratio is ~0.8-1.0 (rest 1.06-1.16), dropping to 0.63-0.78
at ~176/min. A steady (no-systole) model that reproduces the arrested endo/epi of ~1.2 (Downey 1975) will overpredict hyperemic endocardial flow; the endocardial
deficit (~10-20% of endocardial flow at 110/min) is the size of the compression penalty on the inner half of the wall."""

