[meta]
id = "kochesteves2023_lower_limb_flow_volume"
data_type = "experimental"
validates = "Resting whole-leg arterial inflow (common femoral artery blood flow, diameter, mean velocity) per leg, and anthropometric whole-leg volume and lean fraction, in the same healthy young and elderly adults"
species = "human"
preparation = "19 healthy, recreationally trained adults: 10 young (26 +/- 7 y; 7 M / 3 F) and 9 elderly (69 +/- 5 y; 6 M / 3 F). Duplex Doppler ultrasound (GE Vivid E95, 9-MHz linear probe, insonation angle <= 60 deg, sample volume centred in the vessel); velocity averaged over two 12-s recordings, diameter from four B-mode images (EchoPAC). Leg volume and composition from seven circumferences plus skinfolds by the Jones & Pearson (1969) anthropometric method."
conditions = "Baseline after a 30-min rest, SEMI-RECUMBENT in a knee-extensor ergometer chair, room 21 C. Baseline values are before passive heating of the right leg; left leg is the unheated control leg."
verification = "FT"
access = "Europe PMC fullTextXML of PMC10988472 (Exp Physiol, open access), read 2026-10-16; Tables 1 and 3 read from the XML table markup."
notes = """Posture is semi-recumbent, not supine; leg inflow in supine rest may differ slightly (hydrostatic/sympathetic effects).
Small n (9-10 per group). Participants were trained (recreationally active), not sedentary.
Elderly and young baseline CFA flows did not differ (P >= 0.07): ~0.27-0.29 L/min per leg in all four group x leg cells.
Leg volume is anthropometric (truncated-cone model from gluteal furrow to ankle), not imaging; 'lean volume' = muscle + bone fraction.
Table 1 prints sex percentages for the elderly as 30%/60% of n = 9 (3 F, 6 M); counts stored, percentages ignored.
Whole-leg perfusion check (young, right leg): 0.29 L/min / 11.0 L = 2.6 mL/min per 100 mL of leg tissue."""
use_in_model = """Lower-limb arterial inflow target for a whole-body flow split: Q_leg ~ 0.29 L/min per leg at rest, with leg tissue volume ~10-11 L, i.e. ~2.6 mL/min/100 mL. Cross-check against klein2003_femoral_flow_mri (supine PC-MRI, 353 mL/min) and the supine popliteal flow in zhang2025_limb_basal_arterial_flow (114 mL/min, below-knee only)."""

