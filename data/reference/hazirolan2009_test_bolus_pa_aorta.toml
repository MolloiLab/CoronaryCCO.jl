[meta]
id = "hazirolan2009_test_bolus_pa_aorta"
data_type = "experimental"
validates = "Test-bolus time-enhancement curves measured simultaneously in the main pulmonary artery, ascending aorta and descending aorta (single slice at the main PA level) after a 20 mL antecubital bolus: peak enhancement above baseline at 120 kV, duration above 100 HU (curve width), time to reach 100 HU and time to peak; effect of warming the contrast to 37 C"
species = "human"
preparation = "64 consecutive patients referred for coronary CTA (42 men; mean age 56 y, range 37-75), randomized to warmed (37 C, group 1, n = 32) or room-temperature (24 C, group 2, n = 32) contrast and saline. Group 1: age 59.9 +/- 9.3 y, weight 80.5 +/- 13.6 kg, height 169.8 +/- 8.7 cm; group 2: 52 +/- 10.4 y, 79.4 +/- 14.1 kg, 170 +/- 10.4 cm. Dual-source CT (Siemens Somatom Definition). No beta-blocker. EF 65 +/- 4% (group 1) and 66 +/- 3.5% (group 2); patients with EF < 60% were to be excluded."
conditions = "Test bolus: 20 mL iohexol 350 mgI/mL at 5 mL/s through an 18-gauge needle in the RIGHT antecubital vein, then 20 mL saline at 5 mL/s. 30 non-incremental images at the main pulmonary artery level, 120 kV, 45 mA, 0.75 s scan time, 10 mm slice. ROI 3 cm2 centred in the AA, main PA and DA. Baseline HU subtracted. Heart rate during scans 71 (group 1) and 67 (group 2) bpm."
verification = "FT"
access = "Europe PMC fullTextXML of PMC2651444 (Korean J Radiol, open access), read 2026-10-15. Table 2 (test-bolus analysis) is an image in the XML and could not be retrieved (PMC/KJR image URLs blocked); all stored values are from the Results text."
notes = """Peak values are baseline-subtracted enhancement (Delta HU) at 120 kV.
'Time to peak' is defined in the paper as 'the time required to reach the maximum enhancement value from zero HU', i.e. measured from the onset of enhancement, NOT from injection start. The values (about 4-5 s) are therefore an upslope duration, not a bolus arrival-to-peak from injection.
'Time required to reach 100 HU' is likewise not referenced to injection start in the text; its zero is not defined. Reported as medians.
The image interval is not stated explicitly. 30 images with 0.75 s scan time were taken, but the temporal sampling (every beat, every second?) is not given.
Plateau time = duration of enhancement above 100 HU, a width measure of the bolus at a fixed threshold.
Warming raised peak enhancement significantly (p = 0.005) but did not change plateau or time to peak; the curves shifted left and upward."""
use_in_model = """Pulmonary-artery vs aortic test-bolus shape after a 20 mL / 5 mL/s right-antecubital bolus with 20 mL saline: model peak Delta-HU at 120 kV should be ~280-320 in the main PA and ~175-210 in the ascending aorta (PA/AA peak ratio ~1.6-1.8, reflecting pulmonary-plus-left-heart dilution).
Width above 100 HU: ~5.3-6.0 s in the PA and ~5.9-6.6 s in the AA. Use the width ratio as a dispersion check of the pulmonary+left-heart segment. Use the PA peak to constrain dispersion through the peripheral vein + right heart."""

