[meta]
id = "eden2026_coronary_cmm_autoregulation"
data_type = "model"
validates = "Model input plus replotted data: constrained-mixture (elastin/collagen/SMC) wall parameters for four swine coronary vessel classes (small artery Dh 180 um, large arteriole 95 um, intermediate arteriole 62 um, small arteriole 37 um) calibrated to Liao & Kuo 1997 passive and myogenic pressure-diameter data, which are replotted as D/D100 and digitized here"
species = "pig (calibration data, Liao & Kuo 1997); dog data used for validation"
preparation = "Theoretical 12-generation symmetric coronary subtrees at subepi, midwall, subendo depths (Gharahi 2023 homeostatic optimization); thin-wall constrained mixture model (neo-Hookean elastin, Holzapfel collagen and passive SMC, Rachev-Hayashi active SMC); myogenic, shear and conducted metabolic stimuli set SMC activation A."
conditions = "Stage 1 calibration to ex vivo passive and myogenic curves with homeostatic activation 0.5; Stage 3 to swine pressure-flow autoregulation (Dick 2018)."
verification = "mixed"
access = "Europe PMC fullTextXML of PMC13370741 (CC BY 4.0) read 2026-10-16 for text and Tables 1-3. Fig. 5 (calibration vs Liao & Kuo data) digitized from the PMC CDN image, which is only 546x308 px (~91 px per unit D/D100, ~0.47 px/mmHg); publisher and bioRxiv PDFs were not reachable."
notes = """Class assignment by homeostatic diameter Dh: small artery Dh > 140 um, large arteriole 80-140, intermediate arteriole 50-80, small arteriole <= 50 um. Dick et al. 2018 Table 1 gives the same four Liao & Kuo vessel groups as passive diameters 254, 164, 99 and 64 um at ~80 mmHg; the ratio Dh/D80passive (0.71, 0.58, 0.63, 0.58) matches the active/passive ratios read below.
Data points sit at 14.7, 29.4, 44.1, 58.8, 73.5, 88.2 and 102.9 mmHg (20-140 cmH2O steps); the 102.9 mmHg passive point is ~1.0 (normalizer D100).
Derived here: passive D50/D100 (interpolated) = 0.946 (SA), 0.937 (LA), 0.941 (IA), 0.941 (SAo). Active/passive at ~100 mmHg = 0.76 (SA), 0.61 (LA), 0.55 (IA), 0.69 (SAo).
The paper also compares model diameter changes at pin 59 and 38 mmHg with Kanatsuka et al. 1990 (dog): vessels Dh > 160 um constricted and smaller ones dilated in the Low phi_myo case, as in the data (Fig. 10; not digitized).
Limitations stated by the authors: pressure-diameter data for myocardial coronary vessels are scarce; all small arteries share the same material parameters; no myocardial tethering in the wall model."""
use_in_model = """Best available normalized passive and spontaneous-tone curves for 64-254 um swine coronary vessels (Liao & Kuo 1997): passive D/D100 ~0.84 at 15 mmHg, ~0.94 at 50 mmHg, ~0.98 at 75 mmHg, essentially the same in all four sizes. Use as the fit target for passive wall stiffness across the 150-400 um gap."""

