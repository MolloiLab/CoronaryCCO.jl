[meta]
id = "mahlon2007_svc_ct_length"
data_type = "experimental"
validates = "Length of the superior vena cava (origin at the brachiocephalic confluence to the cavoatrial junction) on CT angiography in adults, and its position relative to the carina and right tracheobronchial angle"
species = "human"
preparation = "Retrospective review of 112 pulmonary CT angiograms: 7 men and 7 women from each decade of life, 20-99 years."
conditions = "Clinical pulmonary CTA (supine, typically breath-hold inspiration)."
verification = "abs"
access = "Abstract only (PubMed E-utilities, PMID 17804772; abstract also on a Wayback capture 20221012134818 of the ScienceDirect page), read 2026-10-15. Full text not accessible."
notes = """SVC diameter or cross-sectional area is not reported in the abstract.
Length was measured from the SVC origin to the cavoatrial junction; the method (straight-line vs centreline, axial vs MPR) is not in the abstract.
The authors recommend a catheter tip ~4 cm below the carina for the cavoatrial junction (consistent with carina-to-CAJ 40.3 mm)."""
use_in_model = """SVC segment length: 70.7 +/- 14.1 mm. Combine with an SVC cross-section (lin2009_great_vessels_mdct: end-diastolic SVC area 1.08-4.42 cm2, 5th-95th percentile) to set SVC volume and plug-flow transit."""

