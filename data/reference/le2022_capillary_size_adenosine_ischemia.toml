[meta]
id = "le2022_capillary_size_adenosine_ischemia"
data_type = "experimental"
validates = "Capillary cross-sectional area and diameter (post-mortem EM) by myocardial layer with vs without intracoronary adenosine in beds distal to a flow-halving stenosis; MCE blood volume (A) and velocity (beta) responses to adenosine during ischemia"
species = "dog"
preparation = "Nine instrumented open-chest dogs; LAD/LCx time-of-flight flow probes; stenoses halving CBF; MCE with microbubble destruction-replenishment (A = blood volume, beta = velocity); perfusion fixation (2% glutaraldehyde + 2% paraformaldehyde) in 3 dogs for EM of capillaries and pericytes."
conditions = "Baseline; primary stenosis (CBF halved, distal pressure 43 mmHg); primary stenosis + intracoronary adenosine; secondary stenosis in the other artery without adenosine (control bed). Fixation during the same conditions."
verification = "FT"
access = "Open-access full text, PMC9263193 (Europe PMC fullTextXML), Results, Tables 1, 3, 5 and Discussion."
notes = """Values mean +/- SEM. This is NOT a normal-bed rest vs maximal-dilation comparison: both EM beds were ischemic (flow halved), one with adenosine.
EM capillary areas come from fixed tissue (3 dogs); fixation artefacts possible (the authors say so).
Discussion: normal dog capillary diameter ~5.5 um (cited); here ischemic capillaries were about half that size and adenosine restored them to ~80% of normal, despite a further fall in driving pressure.
Baseline (no stenosis) maximal hyperemic CBF after 30 s occlusion: LAD 35 +/- 4 -> 94 +/- 13 mL/min, LCx 36 +/- 4 -> 79 +/- 13 mL/min (Results)."""
use_in_model = """Evidence that capillary lumen is not fixed: under ischemia capillaries narrow (pericytes) and adenosine re-opens them. For a normal bed at maximal dilation this suggests capillaries sit at or near their passive (~5.5 um in dog) size rather than dilating beyond it. Do not use the ischemic areas as normal-bed values."""

