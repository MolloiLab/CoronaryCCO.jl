[meta]
id = "duncker2015_resistance_distribution_review"
data_type = "review"
validates = "Review statements on where coronary resistance sits by vessel size at rest and during pharmacological dilation, and on capillary/venular resistance during changes in tone"
species = "multiple (dog, cat, pig, human; review)"
preparation = "Narrative review; the size-distribution statements cite Chilian 1989 (ref 21; cat, dipyridamole), Zhang, Rogers & Merkus 2008 book chapter (ref 28), and Kanatsuka 1989/1990 (refs 29-30)."
conditions = "Basal tone vs pharmacological vasodilation (dipyridamole); autoregulation; increased MVO2."
verification = "FT"
access = "Author manuscript full text, PMC5856234 (NCBI E-utilities efetch db=pmc), section 'Coronary vascular resistance' / microvascular heterogeneity paragraphs."
notes = """Secondary source: every number here comes from cited primary work. The '40% of total CVR in 200-400 um small arteries during dipyridamole' line cites a book chapter (ref 28), not a primary measurement; it matches Chilian 1989's 42% for arteries > 170 um.
The claim that capillary and venular resistance 'remains fairly constant during changes in vasomotor tone' cites Chilian 1989, whose microvessel compartment lumps arterioles < 170 um with capillaries and venules < 150 um, so it does not isolate capillaries.
No statement in the review splits the resistance drop between < 40 um and 40-150 um vessels."""
use_in_model = """Qualitative consensus to check model partitions against: resting resistance mostly in 50-200 um vessels; at maximal dilation the share in 200-400 um small arteries rises to ~40%; capillaries/venules small and roughly fixed. Do not treat as independent of chilian1989_dipyridamole_resistance."""

