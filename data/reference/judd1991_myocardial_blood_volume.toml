# Judd RM, Levy BI (1991). Effects of barium-induced cardiac contraction on large- and small-vessel
# intramyocardial blood volume. Rat LV free wall, dual-label (125I-albumin plasma + 99mTc red cells) blood
# volume per transmural layer, plus vessels > 100 um measured from cryomicrotome photographs.
# Full text read from the publisher PDF archived by the Wayback Machine (snapshot 2015-03-19).

[meta]
id = "judd1991_myocardial_blood_volume"
data_type = "experimental"
validates = "Total intramyocardial blood volume (ml/100 g) and its split into vessels > 100 um vs < 100 um, transmural gradient (epicardium to endocardium), in diastolic (KCl) vs systolic (BaCl2) arrest. Checks the model's intramyocardial vascular volume and how it divides between larger vessels and the microvascular/capillary compartment."
species = "rat"
preparation = "Rats 362 +/- 61 g, anesthetized. Diastolic arrest by iv KCl (n = 8) or systolic contracture by iv BaCl2 (n = 8); hearts frozen in situ immediately after arrest while aortic pressure was decaying. LV free wall cut epicardium to endocardium in a cryomicrotome (200 um sections, grouped). Plasma volume from 125I-albumin (corrected by 6.9 +/- 1.4% vs fibrinogen), red-cell volume from 99mTc-RBC; Vb = Vp + Vrc. Large-vessel (> 100 um) volume from photographs of exposed tissue planes every 100 um in 6 additional rats (KCl n = 3, BaCl2 n = 3)."
conditions = "Arrested hearts: aortic pressure at freezing 45 +/- 4 mmHg (KCl) and 59 +/- 4 mmHg (BaCl2); systemic hematocrit 39 +/- 1% and 38 +/- 1%. Tissue density taken as 1 g/ml."
verification = "FT"
access = "Publisher PDF (circres.ahajournals.org/content/68/1/217.full.pdf) via Wayback Machine snapshot 20150319081235."
notes = """
Statistics are mean +/- SEM (paper).
The KCl (diastolic arrest) group is the closest to a relaxed, perfused vascular tree; the BaCl2 group shows how much volume is squeezed out by contraction (3.6 ml/100 g total, 0.9 from vessels > 100 um, 2.8 from vessels < 100 um).
Small-vessel volume is total minus large-vessel volume, measured in different animals (not paired).
Vessels > 100 um were absent from the most endocardial layers in all rats.
The arrest pressures (45-59 mmHg) are below normal perfusion pressure, so volumes may be lower than in a beating heart at normal pressure.
"""
use_in_model = """Sum model vessel volumes per gram of LV tissue (arterial + venous + capillary). Compare total with total_blood_volume (KCl, 8.6 ml/100 g transmural). Split by vessel diameter at 100 um and compare with large_small_split (1.2 vs 7.4 ml/100 g). Check the transmural gradient: epicardial layers carry more volume (11.9) than endocardial (6.8), mostly because large vessels lie epicardially."""

