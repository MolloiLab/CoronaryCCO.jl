value = [1.30e-9, 21.6, 0.104, 3.5e-6, 1186e-6, 0.86, 436.0, 1471.0, 1.92e-3, 1.33e-6]
cited_origin = ["Fung 1997 (Biomechanics: Circulation)", "Fung & Sobin 1972 (Circ Res 30:451)", "Fung & Yen 1986", "Fung 1997", "Zhou et al. 2006 (Biomed Sci Instrum)", "Gehr et al. 1978", "Fung & Yen 1986", "Fung 1997", "Fung 1997; Yen & Sobin 1988", "Dawson 1999; Krenz & Dawson 2003; Reeves 2005 (value as printed, see notes)"]
sensitivity_plus10_percent = [3.0, -3.0, nan, 5.6, 6.0, 3.0, nan, -2.9, -3.0, nan]
