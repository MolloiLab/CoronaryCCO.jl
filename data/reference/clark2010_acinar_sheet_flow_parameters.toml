missing_note = "Sensitivity is stored as nan where the table gives '<1%' (F, sigma, alpha_arteriole_venule). Upright-lung area scaling A = A_TLC (V/V_TLC)^(2/3) uses C = 0.1 /cmH2O (text) and is not tabulated. No measured spread for any value."
