journal = "J Appl Physiol"
volume = "108"
issue = "5"
pages = "1116-1126"
doi = "10.1152/japplphysiol.01177.2009"
crossref_verified = "2026-10-15; Crossref title exact match (vol 108, issue 5, 1116-1126; authors Clark, Burrowes, Tawhai)"
pmcid = "PMC2867543"

