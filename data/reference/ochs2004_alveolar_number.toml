[meta]
id = "ochs2004_alveolar_number"
data_type = "experimental"
validates = "Number and mean size of alveoli in the adult human lung by design-based stereology; upper bound on the number of precapillary arterioles (1-2 per alveolus)."
species = "human"
preparation = "Six adult human lungs; alveolar openings counted at the free septal edges with physical disectors (Euler number of the 2D network), light microscopy."
conditions = "Fixed lungs."
verification = "abs"
access = "Abstract only (Europe PMC record, PMID 14512270). Full text paywalled."
notes = """Mean 480 million alveoli (range 274-790 million; CV 37%), closely related to total lung volume. Mean alveolar volume 4.2 x 10^6 um3 (range 3.3-4.8 x 10^6; CV 10%), about 170 alveoli per mm3 of parenchyma.
Singhal 1973 assumed one precapillary vessel per alveolus (3 x 10^8) and cites 1-2 per alveolus."""
use_in_model = """(a) Terminal density: ~170 alveoli per mm3 parenchyma and ~4.8 x 10^8 alveoli per adult lung pair bound the count of precapillary arterioles. Huang 1996 order-1 arterioles (20 um) are fewer (~5 x 10^7 per left lung), so one terminal of a growth model probably feeds several alveoli."""

