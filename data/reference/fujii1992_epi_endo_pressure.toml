[meta]
id = "fujii1992_epi_endo_pressure"
data_type = "experimental"
validates = "Subepicardial vs subendocardial arteriolar and venular pressures (~100-130 um vessels) vs left-main perfusion pressure during maximal vasodilation; normotensive dog"
species = "dog"
preparation = "Isolated, blood-perfused, lidocaine-arrested canine hearts (mongrel dogs 18-28 kg). Left main coronary cannulated and perfused from a pressurized reservoir with autologous oxygenated blood (37 C); posterior LV incised at the septal junction to expose the subendocardium; venous blood drained by gravity. Servo-null micropipettes (2-5 um tips) in arterioles and venules identified by FITC-dextran transit; diameters by video microscopy at 80 mmHg."
conditions = "Diastolic arrest (intracoronary lidocaine) plus adenosine 6 mg/min in the perfusion line for maximal vasodilation. Left main coronary (LMC) perfusion pressure 60, 70, 80, 90, 100 mmHg. Non-beating: no extravascular compression. Only the normotensive control group is tabulated here (hypertensive one-clip one-kidney group omitted)."
verification = "mixed"
access = "Publisher PDF (ahajournals.org) read via Wayback Machine capture 20231115035007 of https://www.ahajournals.org/doi/pdf/10.1161/01.res.71.1.120"
notes = """All values mean +/- SEM. Micropunctured vessels were 'approximately 100 um'; measured diameters (80 mmHg) in controls:
epi arterioles 114 +/- 7 (n = 19), endo arterioles 100 +/- 12 (n = 13), epi venules 128 +/- 11 (n = 8), endo venules 127 +/- 10 um (n = 11).
The abstract quotes control endocardial values '50 +/- 2 and 50 +/- 3 mm Hg at 90 and 100 mm Hg'; the Fig. 1 absolute values are ~45 and ~50 mmHg,
so the abstract numbers are evidently percent of LMC pressure (Fig. 3), i.e. endo arteriolar pressure ~50 % of perfusion pressure.
Endocardial arteriolar pressure was significantly lower than epicardial at every LMC pressure; endo venular pressure tended to be
higher than epi venular pressure (not significant). Same design as Chilian 1991 (pig), so the two can be compared directly."""
use_in_model = """Run the model in arrested, maximally dilated mode (no intramyocardial pressure), inlet = LMC pressure, outlet ~0 mmHg.
Compare pressure in ~100-130 um arterioles and venules in the outer vs inner third of the wall with the series below, or as % of inlet pressure."""

