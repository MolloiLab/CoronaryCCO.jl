[meta]
id = "dodge1998_injection_rate_tfc"
data_type = "experimental"
validates = "Sensitivity of angiographic contrast transit time (TIMI frame count) to contrast injection rate over the range of hand-injection rates used by angiographers"
species = "human"
preparation = "Mechanical (power) injection used to vary injection rate in a controlled way; range of hand-injection rates taken from angiographers (Brigham and Women's / West Roxbury VA, Gibson TIMI group)."
conditions = "Not available (abstract only): injection rates, volumes, catheter size, artery, frame rate and patient number are not stated in the abstract."
verification = "abs"
access = "PubMed abstract (PMID 9604968). Publisher full text (ajconline.org) returned HTTP 403; no Wayback capture found."
notes = """Abstract in full: 'A mechanical injection was used to determine the impact of injection rate on the TIMI frame count. The 1.0-ml/s
increase in hand injection rates from the 10th to 90th percentiles for angiographers is associated with a minor decrease of <2 frames that
is <7% of the corrected TIMI frame count.'
So hand-injection rates span about 1 mL/s between the 10th and 90th percentiles of operators (absolute rates not given in the abstract).
Consistent with Abaci 1999 (power injector, +1 mL/s, TFC 28.2 -> 27.2 frames, P = 0.47) and Stoel 2009 (injection raises ostial
pressure only ~6.7%)."""
use_in_model = """Bound on the injection effect: if the model added the injected flow to coronary inflow, +1 mL/s at a resting LAD/LCx
flow of ~1.1-1.2 mL/s (Stoel 2003) would nearly double flow and cut arrival time ~45%; the measured effect is < 7%. Hence injection must
not be modeled as an additive coronary inflow."""

[source]
authors = ["Dodge JT Jr", "Rizzo M", "Nykiel M", "Altmann J", "Hobkirk K", "Brennan M", "Gibson CM"]
year = 1998
