journal = "American Journal of Cardiology"
volume = "81"
issue = "10"
pages = "1268-1270"
doi = "10.1016/S0002-9149(98)00138-6"
crossref_verified = "2026-10-15; Crossref title exact match ('Impact of Injection Rate on the Thrombolysis In Myocardial Infarction (TIMI) Trial Frame Count'), Am J Cardiol 81(10):1268-1270, 1998, first author Dodge"
pmid = "9604968"

[data.injection_rate_effect]
