[meta]
id = "ritman1994_iohexol_capillary_permeability"
data_type = "experimental"
validates = "Myocardial capillary permeability-surface area product (PS) for iohexol measured by fast x-ray CT during coronary adenosine vasodilation, PS = -F ln(1 - E), compared with catheter-sampled dual-dilution curves; dependence on iohexol concentration; response to intracoronary bradykinin"
species = "pig"
preparation = "Anesthetized pigs; fast x-ray CT (Mayo Clinic, Ritman lab) during coronary infusion of adenosine and an aortic-root injection of iohexol. CT gave myocardial perfusion F and capillary extraction factor E; PS = -F ln(1 - E). Reference: catheter-sampled dual-dilution curves after simultaneous injection of cobalt-58 EDTA and iodine-125 albumin. Second group: intracoronary bradykinin 5, 10 or 20 ng/kg/min."
conditions = "Coronary adenosine infusion (maximal vasodilation intended; dose not in the abstract). Iohexol at 350, 230 and 175 mgI/mL."
verification = "abs"
access = "Abstract only, via PubMed E-utilities (PMID 8088969). Full text (Invest Radiol, Lippincott) not open; the Wayback Machine has only the abstract page (journals.lww.com .../abstract/1994/06000/myocardial_capillary_permeability_to_iohexol_.3.aspx)."
notes = """The abstract gives PS but NOT the per-gram flow F or the extraction E behind it, nor n or the units of PS. Units are taken as mL/min/g (ml/min per g) by convention of this group (Daghini 2007 reports MPSP in mL/min/g) but are not printed in the abstract.
The dual-dilution reference (DDC) used cobalt-58 EDTA as the diffusible tracer, not iohexol: the DDC PS values are for EDTA (MW 292 vs iohexol 821), so DDC and CT agreement is a method comparison across two different small solutes.
Pairs in the abstract are printed as 'DDC, CT' for each iohexol concentration; the order is inferred from the sentence 'The DDC and CT-based PS values ... were as follows' and should be checked against the full text.
Bradykinin regression: PS = 0.22 [bradykinin] + 0.083, r = 0.845 (bradykinin in ng/kg/min; PS units as above).
Related, later work of the same lab uses an 'index of microvascular permeability' instead of PS (malyar2011_ebct_contrast_extraction_microembolization) and a Patlak MPSP (daghini2007_ct64_myocardial_permeability)."""
use_in_model = """Order-of-magnitude PS for iohexol in vasodilated pig myocardium: about 0.13-0.19 mL/min/g by CT (flow not given). Compare with the Patlak MPSP of ~0.37 mL/min/g at baseline (daghini2007_ct64_myocardial_permeability), the PS-F relations assumed in CT perfusion models (bindschadler2014_iodine_exchange_model_ps), and the first-pass extractions of canty1991_contrast_extraction. The sources use different methods and do not agree closely, so test model sensitivity over the whole range rather than adopting one value."""

