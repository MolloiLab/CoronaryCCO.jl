[meta]
id = "dymond1982_svc_bolus_fwhm"
data_type = "experimental"
validates = "Width (FWHM) of a small radionuclide bolus in the superior vena cava after hand injection into a medial basilic (antecubital) vein with a rapid 20-mL saline flush; its test-retest variability; right vs left arm; effect of SVC bolus width on RV-to-LV pulmonary transit time"
species = "human"
preparation = "32 cardiac patients (27 men, 5 women; 39-67 y, mean 53 y) in sinus rhythm with suitable veins in both arms and no clinical RV failure. 18-gauge cannula in a medial basilic vein (cephalic vein avoided because it 'may lead to loss of bolus integrity'). High-specific-activity Tc-99m pertechnetate (10 mCi study 1, 15 mCi study 2) injected with a rapid 20-mL saline flush; multicrystal gamma camera (Baird System 77), 20 frames/s for 50 s. Randomized right vs left arm and RAO vs LAO; two sequential studies 15 min apart on each of 2 days."
conditions = "Resting, supine under the camera. Injection by hand (no injector rate stated); bolus volume of the radionuclide not stated. Bolus integrity = FWHM of the SVC time-activity curve (ROI over the SVC)."
verification = "FT"
access = "Publisher PDF (Circulation 65:311-322) read from Wayback Machine capture 20180723040420 of http://circ.ahajournals.org/content/circulationaha/65/2/311.full.pdf, text extracted with pdftotext; Tables 3 and 4 read from 150 dpi page renders (pp. 317, 319). Abstract also read via PubMed E-utilities (PMID 7053889)."
notes = """These are patients with suspected or known heart disease, not healthy volunteers.
The SVC FWHM includes the injection duration (hand push, rate not stated), arm-vein dispersion from the basilic vein to the SVC, and the frame interval (0.05 s acquisition; transit curves analysed at 0.20 s per frame).
Studies with 'obvious sticking or splitting of the bolus in the path toward the heart' were excluded from the reproducibility series, so the stored FWHM values describe acceptable injections only.
Pulmonary transit time here = difference of mean transit times of the RV and LV curves (monoexponential stripping); values are 8-10 s in this patient group (Table 2 and text), longer than in healthy subjects.
Abstract wording for the sequential FWHM difference in the small-variation group is 0.28 +/- 0.29 s; the Results text and Table 4 print 0.29 +/- 0.28 s. Table value stored."""
use_in_model = """Arm-vein + SVC dispersion target for a small, fast hand bolus from a basilic (antecubital) vein: typical SVC FWHM 0.2-1.0 s (good injections, mean ~0.6 s), with poor injections up to ~3 s. A model of the antecubital -> SVC path driven by a short (<1 s) bolus plus a fast saline flush should give an SVC curve FWHM of this order; widths of several seconds indicate too much venous mixing volume.
Right vs left arm made no difference to RV-to-LV transit time (8.78 vs 8.54 s), so for a small flushed bolus the left brachiocephalic route adds no measurable delay in this study."""

