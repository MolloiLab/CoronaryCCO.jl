[meta]
id = "haraldsson1986_credta_b12_muscle_ps"
data_type = "experimental"
validates = "Size dependence of skeletal-muscle capillary PS between Cr-EDTA (MW 341) and cyanocobalamin (vitamin B12, MW 1355): PS at infinite flow, PS ratio vs free-diffusion ratio, equivalent pore radius."
species = "rat"
preparation = "Isolated perfused, maximally vasodilated rat hindquarters; near-isogravimetric; single-injection venous indicator-dilution curves recorded on line."
conditions = "Range of perfusion flows; PS extrapolated to infinite flow (PS_tot) to minimise heterogeneity effects."
verification = "abs"
access = "Abstract only, via PubMed E-utilities (PMID 3092578). Full text (Acta Physiol Scand, Wiley) not accessible."
notes = """PS rose with flow and extraction depended on transit time, showing flow and tissue heterogeneity. PS_tot is taken as the best estimate of true diffusion capacity.
PS_tot ratio Cr-EDTA/B12 = 2.59 +/- 0.11 vs free-diffusion-coefficient ratio 1.79, i.e. restricted diffusion with equivalent pore radius 53 A.
Using PS_peak (no heterogeneity correction) gave ratio 1.89 (pore 300 A); PS_area gave 2.33 (pore 70 A). So the method strongly changes the inferred size dependence.
Maximal vasodilation and very high flow: absolute PS is far above resting human values (cf. keiding1988: EDTA 3.31 in exercising forearm).
Note on MW: the tracer is the Cr-EDTA complex, MW 341 (Keiding uses 340.2), not EDTA free acid (MW 292)."""
use_in_model = """Use the RATIO, not the absolute PS. Between MW 341 and 1355 the PS falls 2.59-fold while free diffusion falls only 1.79-fold. A power-law interpolation in MW between these two points (an estimate made outside this file) puts a MW-821 solute at about 0.55 x the Cr-EDTA PS if diffusion is restricted, or about 0.69 x if PS simply tracks free diffusion."""

