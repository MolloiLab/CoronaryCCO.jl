[meta]
id = "hubbell1995_nist_icru44_tissue_compositions"
data_type = "model input (reference tissue compositions)"
validates = "Elemental mass fractions and densities of ICRU-44 reference tissues used for X-ray attenuation: adipose tissue, soft tissue, skeletal muscle, whole blood, cortical bone and water. These are the published proxies for the plaque materials of a CT phantom (lipid-rich core ~ adipose, fibrous plaque ~ soft tissue, calcified plaque ~ cortical bone)."
species = "human (reference tissue compositions)"
preparation = "Tabulated reference compositions. NIST Table 2 states that 'The compositions of various human tissues was taken from ICRU Report 44 (1989).'"
conditions = "Mass fractions by element (Z: fraction by weight) and nominal density. NIST notes that 'Some density values are only nominal.'"
verification = "FT"
access = "NIST X-Ray Mass Attenuation Coefficients, Table 2 (physics.nist.gov/PhysRefData/XrayMassCoef/tab2.html), the online version of NISTIR 5632; read 2026-10-16 as HTML. ICRU Report 44 itself was not read."
notes = """These are reference compositions for normal tissue. None is a measured composition of coronary plaque. No measured elemental composition of human coronary plaque was found.
Proxies for a phantom, by analogy only: lipid-rich necrotic core ~ adipose tissue (0.95 g/cm3); fibrous plaque ~ soft tissue or muscle (1.05-1.06 g/cm3); calcified plaque ~ cortical bone (1.92 g/cm3, Ca 22.5% by mass) or pure hydroxyapatite (see zehbe2010_hydroxyapatite_density.toml).
Measured plaque densities (Rahdert 1999): non-calcified 1.22 +/- 0.03, calcified 1.45 +/- 0.06 g/cm3. Both are higher than the soft-tissue proxy and lower than cortical bone.
Element order in each table follows the NIST listing. Mass fractions sum to 1.000 within rounding."""
use_in_model = """Material definitions for the XA materials per voxel: use these element / mass-fraction lists with the stated densities. Blood (ICRU-44) and water are included so the lumen and the calibration materials use the same source. For iodinated blood, mix iodine into the blood composition by mass."""

[source]
authors = ["Hubbell JH", "Seltzer SM"]
year = 1995
title = "Tables of x-ray mass attenuation coefficients and mass energy-absorption coefficients 1 keV to 20 MeV for elements Z = 1 to 92 and 48 additional substances of dosimetry interest"
journal = "NIST Interagency/Internal Report (NISTIR) 5632"
volume = ""
issue = ""
pages = ""
doi = "10.6028/NIST.IR.5632"
crossref_verified = "2026-10-16; Crossref title exact match (report, NIST 1995; authors Hubbell JH, Seltzer SM)"
url = "https://physics.nist.gov/PhysRefData/XrayMassCoef/tab2.html"
primary_origin = "ICRU Report 44 (1989), Tissue Substitutes in Radiation Dosimetry and Measurement. Not read. Cited by NIST as the source of the tissue compositions."

