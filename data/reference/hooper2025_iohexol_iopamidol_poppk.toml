[meta]
id = "hooper2025_iohexol_iopamidol_poppk"
data_type = "experimental"
validates = "Two-compartment population pharmacokinetics (CL, V1, Q, V2) of IV iohexol and iopamidol in adult volunteers without and with mild-to-moderate kidney impairment, measured in the same people over 6 h by LC-MS."
species = "human"
preparation = "University of Michigan, open-label parallel-group single-dose study. 24 adults (18 female), stratified 8 per group by 2021 CKD-EPI eGFRcr: normal (>= 90 mL/min), mild (60-89) and moderate (30-59) impairment. Overnight fast >= 10 h. Two separate IV boluses in random order: 2.5 mL Omnipaque-300 (1618 mg iohexol, 647 mg/mL) and 2.5 mL Isovue-300 (1530 mg iopamidol, 612 mg/mL). Serum samples at 0, 10 min, 30 min, 1, 2, 5 and 6 h."
conditions = "Low (GFR-test) dose, not a CT dose; the authors assume linear PK and did not test higher doses. Nonlinear mixed-effects model in MonolixSuite 2024R1. Base model has no covariates. Pragmatic model uses eGFRcr; final model uses eGFRcr-cys. Covariates are scaled as (eGFR/80)^beta, (Weight/72)^beta, (BSA/2)^beta; sex coded 0 = female, 1 = male."
verification = "FT"
access = "Europe PMC open-access full-text XML (PMC12353758, Wiley open access), retrieved 2026-10-16. Tables 1-3 parsed from the XML. Supplemental tables not read."
notes = """Population values are typical-subject estimates at the covariate reference (eGFR 80 mL/min, weight 72 kg, BSA 2 m^2, female where sex is a covariate), with RSE% in the source.
The cohort is not all healthy-kidney: only 8 of 24 have eGFR >= 90 (mean 109 mL/min, age 28 +/- 5 y). The base-model CL (73.9 mL/min iohexol) therefore reflects the whole mixed cohort (overall eGFRcr 83 +/- 29 mL/min).
Table 3 (iopamidol) prints a covariate row labelled 'CL_beta_BSA' (1.99 pragmatic, 1.86 final) directly under V1_pop. Its position suggests a V1 covariate (text: 'iopamidol V1_pop was better estimated with BSA'). Stored as printed under the V1 position with this caveat.
Half-lives and urinary excretion are not reported. Do not back-compute half-lives here; the model user can simulate them from CL, V1, Q and V2.
Iopamidol CL was about 15 mL/min lower than iohexol CL (Bland-Altman bias 15.69, LoA -3.76 to 35.15 mL/min, final model)."""
use_in_model = """Ready-made two-compartment plasma model for iohexol and iopamidol: V1 ~6 L (central, plasma-like), V2 ~6 L (iohexol) or ~4 L (iopamidol) peripheral, Q ~120-170 mL/min, CL ~60-75 mL/min at eGFR 80. V1 + V2 ~ 12 L is the extracellular-fluid scale. For a healthy young adult the CL should be scaled up with eGFR (CL x (eGFR/80)^0.7). Q/V1 sets the distribution time constant (blood-to-interstitium equilibration) that the whole-body model must match over the first hour."""

