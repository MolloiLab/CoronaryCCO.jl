# Kassab GS, Rider CA, Tang NJ, Fung YC (1993). Morphometry of pig coronary arterial trees.
# Every number below was transcribed from Tables 1-9 of the publisher PDF and checked against
# a 200-300 dpi rendering of each table. Units are in the key suffix.

[meta]
id = "kassab1993_arterial_morphometry"
data_type = "experimental"
validates = "Per-order element and segment diameter, length, S/E, connectivity matrix and total element counts of the pig coronary arterial tree (RCA, LAD, LCX), orders 1-11 (diameter-defined Strahler)."
species = "pig"
preparation = "Five 3-4 month farm pigs, 29-31 kg (30.1 +/- 0.7 kg). KCl arrest; coronaries rinsed with cold cardioplegic solution (EGTA, nifedipine 0.2 mg/l, adenosine 80 mg/l), then with a solution containing 2,3-butanedione monoxime. Silicone-elastomer (GE 88017 / CP-101) cast perfused at 130 mmHg for 5 min, then held at 80 mmHg until hardened. Orders >= 4 measured on corroded arterial casts (Cab-O-Sil added to stop the elastomer at the capillaries); orders <= 4 from optical sectioning of 60-80 um histological slices of cast tissue plugs (4 hearts, 12 plugs per ventricle)."
conditions = "Diastolic arrest, vasodilated (adenosine + nifedipine rinse), cast at 80 mmHg perfusion pressure. Diameters are lumen diameters of the cast."
verification = "FT"
access = "Publisher PDF (journals.physiology.org, UC Irvine institutional download, local copy, re-checked 2026-10-14 against the copy in validation-papers/, identical scan); tables read from rendered page images."
notes = """
Orders: diameter-defined Strahler system (Eq. 1a/1b of the paper). Order 1 = smallest arterioles feeding capillaries (order 0).
Segment = vessel between two bifurcation nodes. Element = segments of the same order connected in series; S/E = segments per element.
Orders 1-3 of the LCX (Table 3) and of the LAD (Table 2) are identical in the source, for diameters, lengths, S/E and the first three connectivity columns. The small vessels were measured in histological blocks of the LV, so the same small-vessel statistics appear to serve both left-coronary branches. The LCX has 10 orders; the RCA and LAD have 11.
The 1-element trunk rows (order 11 RCA/LAD, order 10 LCX) have no SD.
Diameter SDs are the SD across vessels, not SE. Table 9 and connectivity matrices report SE.
"""
use_in_model = """Assign diameter-defined Strahler orders to the synthetic tree (Eq. 1 of the source, iterate to convergence), then compare per-order element mean diameter, mean length, S/E and total element count (Table 9) on a log-linear plot vs order. Compare connectivity-matrix columns for asymmetric branching. CCO terminals (~9 um) correspond to order 1."""

