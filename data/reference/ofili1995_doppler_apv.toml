[meta]
id = "ofili1995_doppler_apv"
data_type = "experimental"
validates = "Proximal vs distal intracoronary Doppler velocity, volumetric flow and vascular resistance in angiographically normal human LAD, LCx and RCA (rest and hyperemia)"
species = "human"
preparation = "Paired proximal and distal Doppler guide-wire velocity measurements in 28 angiographically normal coronary arteries in awake patients; diameter and cross-sectional area of proximal and distal segments by angiography; coronary flow and vascular resistance computed."
conditions = "Rest and hyperemia (agent not stated in the abstract)."
verification = "missing"
access = "PubMed abstract only (PMID 7611121). Am Heart J full text is closed (Unpaywall: closed); the Elsevier API returned metadata only; ScienceDirect returned HTTP 403; the Wayback copy of the ScienceDirect page has the abstract only."
notes = """The abstract gives no numbers. Qualitative findings (Abstract): mean velocity and coronary vasodilator reserve were similar in all three native
arteries and were preserved from proximal to distal segments; volumetric flow decreased from proximal to distal segments; flow vs vascular
resistance followed an inverse curvilinear (polynomial) relation suggesting a resistance nadir below which flow no longer increases.
For numeric proximal/distal data from the same group see ofili1993_ajc_proximal_distal (proximal-to-distal velocity ratio 1.1 +/- 0.2 in 20 normal arteries)."""
use_in_model = """Qualitative check: in a normal model tree, mean velocity should be roughly preserved from proximal to distal epicardial segments
(proximal/distal ratio near 1) while volumetric flow falls distally, and the velocity reserve should be similar proximal and distal. Fill the
numeric arrays when the full text becomes available."""

