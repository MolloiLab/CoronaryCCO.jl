[meta]
id = "chilian1991_epi_endo_pressure"
data_type = "experimental"
validates = "Transmural (subepicardial vs subendocardial) arteriolar and venular pressures in ~100 um microvessels, microvascular pressure gradient, and % of total resistance in arteries / microvessels / veins, during maximal vasodilation"
species = "pig"
preparation = "Isolated, blood-saline perfused porcine hearts (pigs 7-15 kg, 8-12 weeks, n = 39 operated; data from 23 successful protocol-1 and 5 protocol-2 experiments). Perfusate ~30-40% whole blood in physiological saline, hematocrit 15-25%, 37 C, perfused via a cannula in the left main coronary artery. Posterior LV wall incised to expose subendocardium (anterior papillary muscle and adjacent free wall) and subepicardium (territory of LAD diagonal branches). Servo-null micropipette pressures (1-2 um tips); diameters by intravital video microscopy; regional flow by 15 um radioactive microspheres. Venous outflow drained to atmospheric pressure."
conditions = "Cardiac arrest with lidocaine (50-100 mg) or sodium pentobarbital (150-250 mg), which the paper states also produced maximal coronary vasodilation (confirmed by abolished reactive hyperemia). Coronary perfusion pressure (CPP) set to 100, 80, 60 and 40 mmHg. Non-beating heart: no extravascular compression."
verification = "mixed"
access = "Publisher PDF (ahajournals.org) read via Wayback Machine capture 20220313122417 of https://www.ahajournals.org/doi/pdf/10.1161/01.res.69.3.561"
notes = """All values in the paper are mean +/- SEM.
Resistance partition definitions (paper, Data Analysis): arterial = pressure drop from left-main cannula (CPP) to the measured arteriole;
microvascular = arteriole-to-venule drop in the same region; venous = venule pressure to zero (atmospheric outflow).
Relative resistance (%) = pressure drop across compartment / CPP x 100.
Measured arterioles and venules were deliberately chosen in the 80-120 um range on both surfaces.
DISCREPANCY: the abstract/text give venular pressures at CPP 100 of 33 +/- 3 (endo) and 22 +/- 3 (epi) mmHg, while the
venular points digitized from Fig. 1 at CPP 100 are ~27 (endo) and ~17 (epi) mmHg. Arteriolar values agree (60 vs 61, 80 vs 79.5).
The Fig. 2 microvascular gradients (~34 endo, ~62 epi at CPP 100) are consistent with Fig. 1, not with the abstract venular values.
Fig. 1 venules n = 11 (epi) and 13 (endo); Fig. 2 used only preparations with paired arteriolar+venular measurements (n = 5 epi, 6 endo).
Both versions are recorded; the source of the difference is not stated in the paper."""
use_in_model = """Run the model under maximal-vasodilation, non-beating (no intramyocardial pressure) settings with inlet pressure = CPP and venous outlet = 0 mmHg.
Compare (1) mean pressure in arterioles of diameter 80-120 um, split by transmural depth (outer vs inner third), to arteriole_pressure;
(2) pressure in venules 80-120 um to venule_pressure; (3) the arterial / microvascular / venous fractions of the total pressure drop to resistance_distribution.
Note the perfusate hematocrit was 15-25%, so use a reduced discharge hematocrit in the Pries viscosity law if matching absolute flows (Table 1)."""

