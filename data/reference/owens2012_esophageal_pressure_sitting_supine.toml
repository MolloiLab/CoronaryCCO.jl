[meta]
id = "owens2012_esophageal_pressure_sitting_supine"
data_type = "experimental"
validates = "End-expiratory esophageal pressure (pleural-pressure estimate) in lean healthy adults, sitting vs supine; overweight/obese comparison group."
species = "human"
preparation = "Esophageal manometry (thin-walled 9.5 cm balloon, ~1.5 cm perimeter, 1 mL air, passed 40 cm via the nares; intrathoracic placement confirmed by cardiac oscillations). Quiet breathing ~3 min seated, then supine (bed flat, one pillow). 11 lean controls (BMI < 25) and 25 overweight/obese subjects (BMI > 25); 20 obese subjects repeated after ~1-2 weeks."
conditions = "Quiet breathing, end-expiration; sitting and supine."
verification = "mixed"
access = "Abstract (Europe PMC, PMID 22695479) read directly. Open full text (PMC3443522) read through a web text-extraction fetch, not checked against page renders; the Europe PMC XML endpoint returned an error."
notes = """Lean values are the normal-adult reference here. The lean supine value (+6.9 cmH2O) is much higher than the sitting value (-3.3 cmH2O); part of the supine rise is the mediastinal/postural balloon artifact discussed by Washko 2006 (washko2006_esophageal_pressure_posture.toml), so the supine Pes overstates true supine pleural pressure.
The upright/sitting values from this paper (-3.3 cmH2O) and from Washko 2006 (implied about -3.7 cmH2O) agree.
Table 2 also lists inspiratory swings (Delta PEs) for the lean group; these are not positional changes and are not stored."""
use_in_model = """Sitting/upright mid-lung pleural pressure at end-expiration: about -3.3 cmH2O (lean adults). Do not take the supine +6.9 cmH2O as pleural pressure without the ~3 cmH2O artifact correction (Washko 2006)."""

[source]
authors = ["Owens RL", "Campana LM", "Hess L", "Eckert DJ", "Loring SH", "Malhotra A"]
year = 2012
