# Kalsho G, Kassab GS (2004). Bifurcation asymmetry of the porcine coronary vasculature and its
# implications on coronary flow heterogeneity. Am J Physiol Heart Circ Physiol 287:H2493-H2500.
# Numbers from Tables 1-3 and 6 of the publisher full-text HTML.

[meta]
id = "kalsho2004_bifurcation_asymmetry"
data_type = "experimental"
validates = "Diameter and length asymmetry ratios of the two daughters at each bifurcation, per diameter-defined Strahler order of the mother vessel, for pig RCA, LAD and LCx (orders 1-11), with quadratic-exponential fits ln(S) = a + b*n + c*n^2."
species = "pig"
preparation = "Same morphometric database as Kassab et al. 1993 (silicone-elastomer casts for vessels > 50 um; histological optical sectioning for < 50 um). Bifurcations analyzed: 5,082 RCA, 4,014 LAD, 1,946 LCx (arteries); 13,778 sinus and 4,505 thebesian venous bifurcations."
conditions = "Arrested, maximally vasodilated, cast at 80 mmHg (as Kassab 1993)."
verification = "FT"
access = "Publisher full-text HTML (journals.physiology.org) read via Wayback Machine capture 20220615163541; tables are HTML text, not OCR."
notes = """Asymmetry ratio S_D = D_m / D_k >= 1 by definition: the LARGER daughter diameter over the SMALLER daughter diameter (mother order n >= m >= k, D_n >= D_m >= D_k). This is the inverse of the CCO symmetry index S = ds/dL. Because the mean of a ratio is not the reciprocal of the mean of its inverse, 1/mean(S_D) is only a rough (upward-biased) estimate of mean(ds/dL); no converted values are stored here.
S_l = l_m / l_k (larger-diameter daughter length over smaller-daughter length) can be < 1.
Mother order uses the diameter-defined Strahler scheme of Kassab 1993; orders 1-4 come from histology and are shared between the LAD and LCx (rows 1-3 identical).
Distributions of S_D per order were right skewed; only mean +/- SD are tabulated. Venous tables (sinus orders 1-12, thebesian 1-10; Tables 4-5) are not transcribed here."""
use_in_model = """For each CCO bifurcation compute S_D = dL/ds and the diameter-defined order of the mother; compare per-order mean +/- SD with diameter_asymmetry_rca/lad/lcx, or compare the fitted curve exp(a + b*n + c*n^2). The ratio is about 1.4 (S ~ 0.7) at orders 1-3, about 1.7-1.8 at order 5 (~70-80 um), 2.4-2.5 at order 6, and 4-7 at orders 7-11 (large trunks give off small branches)."""

