[meta]
id = "abaci1999_tfc_confounders"
data_type = "experimental"
validates = "Sensitivity of angiographic contrast transit time (uncorrected TIMI frame count) to injection rate, catheter size, intracoronary nitrate, heart rate, and cardiac phase of injection; injection volumes/rates used in diagnostic angiography"
species = "human"
preparation = "150 patients (mean age 59 y) undergoing elective diagnostic coronary angiography; excluded prior CABG, left main disease, or >50% proximal stenosis of the studied artery (patients were NOT required to have normal arteries). Five paired-injection protocols of 25 patients each (injection rate, catheter 8F vs 6F, IC nitrate, pacing +20 bpm, systolic vs diastolic injection in left and right coronary arteries). ECG-gated power injector (Angiomat 6000), iopromide 370 (Ultravist-370). Toshiba Infinix CS; 35-mm cinefilm at 25 frames/s."
conditions = "Resting. Oral lorazepam 1 mg premedication; 5000 U IV heparin. No nitrates before angiography (patients given nitroglycerin for spasm were excluded). No contrast for 90 s before each studied injection. Target injection rates 3-4 mL/s (left) and 2-3 mL/s (right). Injections R-wave synchronized except in the cardiac-cycle groups. Nitrate group: 300 ug intracoronary nitrate between injections."
verification = "FT"
access = "Publisher PDF read via Wayback Machine capture 20170705072438 of http://circ.ahajournals.org/content/circulationaha/100/22/2219.full.pdf; text cross-checked against HTML capture 20180511222940 of http://circ.ahajournals.org:80/content/100/22/2219"
notes = """TFC here is UNCORRECTED (the LAD was not divided by 1.7) and filmed at 25 frames/s (not 30), so values are not directly comparable to Gibson 1996.
The paper does not report which artery each group's TFC refers to, except the cardiac-cycle groups (left vs right coronary).
First frame defined as contrast across >70% of the lumen with antegrade motion; last frame as in Gibson 1996.
Medians are given in parentheses in Table 5 and are reproduced in tfc_median_frames.
The Discussion summarizes literature on contrast-induced flow changes (initial slight increase during injection, nadir 45% of baseline at 1.9 s,
hyperemia peaking at 153% of baseline between 5 and 10 s, return to baseline within 60 s); these are cited values (paper refs 4, 15-17), not measured here."""
use_in_model = """In the contrast-transit simulation, test the same perturbations: (1) increasing injection rate by 1 mL/s or changing catheter size
should change landmark arrival time by < ~1 frame on average (not significant); (2) epicardial dilation (nitrate) slowed arrival by ~6.4 frames
(~0.26 s at 25 fps) despite HR rising 70 -> 75 bpm; (3) injecting at the start of diastole shortens arrival by ~5.7 frames (left) and ~3 frames (right)
vs start of systole, reflecting the diastolic-predominant left coronary flow; (4) pacing +20 bpm shortens arrival by ~5 frames.
Convert frames to seconds with 25 frames/s. Use injection_parameters to set the injected bolus (volume/rate) for left and right injections."""

