[meta]
id = "lehmonen2022_cmr_chamber_bolus_passage"
data_type = "experimental"
validates = "Contrast-bolus passage through SVC, left atrium, left atrial appendage and LV by first-pass CMR, in cardiac cycles: arrival time (10% of max), time to peak, FWHM and full width at tenth maximum (FWTM) per chamber, peak-to-peak transit SVC -> LA, SVC -> LV, LA -> LAA; maximum and minimum enhancement rates (wash-in / washout per cycle)"
species = "human"
preparation = "30 stroke-free controls aged 18-50 y (41 +/- 8 y, 15 women), randomly drawn from population registers and age/sex-matched to 30 young cryptogenic-stroke patients (SECRETO study, Helsinki). 1.5 T CMR. Gadoterate meglumine (Dotarem), 0.2 mmol/kg at 4.5 mL/s, given in two halves: the first half injected at the start of the perfusion sequence, the second half after it (to visualize washout). Injection vein not stated. ECG-gated 2D motion-corrected saturation-recovery SSFP perfusion, 4 slice groups (SVC transverse; LAA and LA modified two-chamber, LAA twice per cycle; LV four-chamber), 60 sample points over ~60 s. Circular ROIs >= 150 mm2 (SVC, LA, LV), custom ROI for LAA; baseline = mean of first 3 points."
conditions = "Rest. All time variables normalized to each subject's R-R interval (units: cardiac cycles, cc). TTP measured from the start of the sequence (= injection start). Transit times = differences between curve peaks. Only the first peak analysed (recirculation excluded)."
verification = "FT"
access = "Europe PMC fullTextXML of PMC9700591 (CC BY 4.0 open access), read 2026-10-15; Tables 1-3 read from the XML table markup."
notes = """Values for controls are the target here; patients are stored for completeness (no significant differences except LV minimum enhancement rate).
Statistics are mixed: normally distributed variables mean +/- SD; others median (IQR) where the bracket is the IQR WIDTH as printed, e.g. '7.1 (2.5)' (not quartiles). Columns *_iqr_width_cc hold that number.
No right-heart chamber (RA, RV) or pulmonary-artery curves were acquired; the SVC curve is the venous input and LA/LAA/LV are downstream of the lungs.
The SVC FWHM includes the injection duration (half of 0.2 mmol/kg at 4.5 mL/s; volume per subject not reported) and venous dispersion from the arm.
Signal-intensity curves at this dose (0.1 mmol/kg in the first half) may be affected by T1-saturation nonlinearity at peak; widths in cc are therefore approximate measures of dispersion. Heart rate in controls was 70 +/- 13 bpm; per-subject R-R intervals are not tabulated, so conversion of cc to seconds is approximate.
rBF is AUC/FWTM (arbitrary units)."""
use_in_model = """Constrains segment-wise dispersion in heartbeats for a healthy young heart: bolus width at the SVC (FWHM 7.3 cc, FWTM 15.7 cc), at the LA (FWHM 10.4 cc, FWTM 19.7 cc) and LV (FWHM 10.8 cc, FWTM 20.8 cc), and peak-to-peak transit SVC -> LA 6.6 cc and SVC -> LV 8.2 cc (so LA -> LV ~1.6 cc, LA mixing + LV). The growth of width from SVC to LA (RA + RV + lungs) is the key test of the right-heart + pulmonary mixing model; LV minimum enhancement rate (-36 +/- 13 per cc, normalized units) reflects LV washout per beat at LVEF 64%."""

