# Gould KL, Lipscomb K, Hamilton GW (1974), Am J Cardiol 33:87-94, and Gould KL, Lipscomb K (1974),
# Am J Cardiol 34:48-55. Both original full texts are paywalled (ScienceDirect returned HTTP 403) and
# PubMed has no abstract for either. The numbers below come from an open-access later review that
# reproduces the Gould & Lipscomb 1974 (34:48) rest/hyperemia flow-vs-stenosis figure.

[meta]
id = "gould1974_critical_stenosis"
data_type = "experimental"
validates = "Resting and hyperemic coronary flow vs percent diameter stenosis: resting flow stays at normal levels until a severe stenosis because of autoregulation, while hyperemic flow (flow reserve) starts to fall at about 50% diameter stenosis"
species = "not verified (original full text not accessible; usually cited as dog experiments)"
preparation = "Not verified (original full texts not accessible). The figure reproduced by Kaul et al. 2020 is credited to Gould & Lipscomb 1974 (Am J Cardiol 34:48-55); the caption does not state species, n or the hyperemic stimulus."
conditions = "Rest vs hyperemia across graded proximal stenoses (from the secondary figure caption). Details not verified."
verification = "secondary"
access = "Primary full texts not accessible (ScienceDirect HTTP 403; PubMed records 4808557 and 4835753 have no abstract). Numbers read from the Figure 1 caption of Kaul, Methner & Mishra 2020 (PMC7992506; NCBI efetch db=pmc XML, read 2026-10-15)."
notes = """Secondary wording (Kaul et al. 2020, Figure 1 caption): 'The resting flow is maintained at normal levels (dotted black line) up to 85-90% stenosis because of autoregulation. During hyperemia, however, increases in flow are attenuated at 50% or greater stenosis, with more severe stenosis resulting in greater attenuation of hyperemia flow.' The figure is 'adapted with permission from Gould et al. [5]', where ref 5 = Gould & Lipscomb 1974, Am J Cardiol 34:48-55.
The secondary source gives 85-90% for the resting threshold, not a single 85% value. Both bounds are stored.
The x-axis of the reproduced figure is percent narrowing of coronary artery DIAMETER.
Gould, Lipscomb & Hamilton 1974 (Am J Cardiol 33:87-94) is the companion paper on instantaneous flow response and regional distribution during hyperemia. No open source reproducing its numbers was found, so it is recorded as a citation only (second_source)."""
use_in_model = """Stenosis test for the regulated tree: insert a proximal stenosis of increasing % diameter reduction. With autoregulation active, resting flow should stay near baseline up to roughly 85-90% stenosis; with maximal vasodilation (hyperemia), flow should begin to fall at about 50% stenosis and decline progressively beyond. These are curve-shape thresholds from a reproduced figure, not measured means with error."""

