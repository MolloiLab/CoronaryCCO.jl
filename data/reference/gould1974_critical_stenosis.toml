authors = ["Gould KL", "Lipscomb K"]
year = 1974
title = "Effects of coronary stenoses on coronary flow reserve and resistance"
journal = "Am J Cardiol"
volume = "34"
issue = "1"
pages = "48-55"
doi = "10.1016/0002-9149(74)90092-7"
crossref_verified = "2026-10-15; Crossref title exact match ('Effects of coronary stenoses on coronary flow reserve and resistance'; vol 34, issue 1, 48-55; authors Gould, Lipscomb)"
pmid = "4835753"

