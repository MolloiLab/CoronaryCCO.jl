[meta]
id = "cressoni2013_lung_tissue_mass"
data_type = "experimental"
validates = "CT-densitometric lung tissue mass (g, both lungs, including intrapulmonary blood) with the matching total lung volume, gas volume and mean parenchymal attenuation at full inspiration, in adults with radiologically normal lungs"
species = "human"
preparation = "Retrospective series of 100 adults (53 M, 47 F; age 64 +/- 13 y, none < 30 y, 6% < 50 y) whose clinical helical chest CT was reported as non-pathological. Excluded: contrast-enhanced scans, lobectomy/segmentectomy, nodules, any acute or chronic lung or pleural disease (incl. emphysema, COPD, fibrosis, PE). Siemens Somatom Definition Flash (128-slice), 120 kV, 110 reference mAs, 5 mm reconstruction gap (3 mm in 6), kernels B70f/B50f/B40f/B31f. Lungs manually outlined slice by slice (Maluna), hilar structures excluded by the outline. Tissue volume = (1 - HU/-1000) x voxel volume; tissue density taken as 1 g/mL, so tissue volume in mL = mass in g."
conditions = "Supine, breath-hold at full inspiration (taken as TLC); spontaneous breathing, no spirometric volume control. Unenhanced."
verification = "FT"
access = "Europe PMC fullTextXML of PMC4057220 (Crit Care, open access CC BY), read 2026-10-16; Table 2 and Table 3 read from the XML table text."
notes = """Mass INCLUDES blood: CT cannot separate parenchymal tissue from the blood in capillaries and small intrapulmonary vessels. The outline excludes the hilum and large central vessels. Coxson/Gattinoni-style 'lung weight' = tissue + intrapulmonary blood + any interstitial water.
Not a young cohort: mean age 64 y, many scanned for cancer follow-up; smoking status known in only 50% (no smoker/non-smoker difference). Height and weight self-reported.
Lung weight falls weakly with age: weight (g) = 1157.03 - 3.56 x age (y), r2 = 0.06. Lung weight vs height: weight (g) = -1806.1 + 1633.7 x height (m), r2 = 0.49; slopes did not differ by sex.
Consistency check (derived here): total volume - gas volume = 4995 - 4066 = 929 mL, equal to the reported mean lung weight 929 g (1 g/mL tissue). Using the mean HU directly, (1 - 805/1000) x 4995 = 974 g; the difference is because mean of ratios != ratio of means.
Supine CT TLC (gas volume) was ~1800 mL below predicted sitting TLC (Quanjer), so these are effort-dependent supine inspiratory volumes, not plethysmographic TLC.
Comparable value: Lee 2022 (EJRO, DOI 10.1016/j.ejro.2022.100428) found median 939 g (IQR 800-1094) in 103 contrast-enhanced CTPA patients without PE or cardiopulmonary disease; autopsy (Molina 2012) 840 g in young men (blood-filled, see molina2012_lung_weight.toml)."""
use_in_model = """Lung parenchymal mass for the phantom: ~930 g both lungs (M ~1030 g, F ~820 g), right:left ~ 53:47. Because it includes intrapulmonary blood, subtract the modelled capillary + small-vessel blood volume to get blood-free tissue mass. Use the height regression to scale to a phantom's height. Use mass / total lung volume (~0.19 g/mL at TLC) to set the voxel tissue fraction of lung parenchyma."""

