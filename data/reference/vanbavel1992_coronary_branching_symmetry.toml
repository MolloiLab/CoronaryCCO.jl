# VanBavel E, Spaan JAE (1992). Branching patterns in the porcine coronary arterial tree. Estimation of
# flow heterogeneity. Circ Res 71:1200-1212. Numbers from Tables 1-4 and the text of the publisher PDF.

[meta]
id = "vanbavel1992_coronary_branching_symmetry"
data_type = "experimental"
validates = "Bifurcation symmetry S = ds/dL vs mother diameter (quartiles in six diameter classes), area expansion ratio vs mother diameter, junction exponent by mother-diameter class, and the Strahler ratios (RB, RD, RL) and segments-per-vessel of trees generated from these local statistics. Use for a size-dependent symmetry floor or target distribution in CCO growth."
species = "pig"
preparation = "Two porcine hearts; coronary arterial casts made at diastolic arrest and maximal dilation. 1,663 nodes with mother and both daughter diameters measured (heart 1 n = 685, heart 2 n = 978). Diameter range of the analysis about 10-500 um."
conditions = "Arrested (diastole), maximally dilated, cast."
verification = "FT"
access = "Publisher PDF (Circ Res, 14 pages) read via Wayback Machine capture 20180722060912 of circres.ahajournals.org/content/circresaha/71/5/1200.full.pdf. Table 1 checked against a 200 dpi render of page 1204."
notes = """Symmetry S = ds/dL (small daughter over large daughter diameter, 0 < S <= 1), Eq. 3. Area expansion ratio A = (ds^2 + dL^2)/d0^2, Eq. 2.
A lower bound of S exists that depends on d0: daughters cannot be thinner than about 5 um, so S >= 5 um / dL (dashed line in Fig. 5 left panel). In the computer generation, S was sampled from the observed S of the same diameter class after normalizing between this lower bound and 1.
S and A, each corrected for its dependence on d0, are uncorrelated (r2 = 0.001, n = 1,652). Symmetry of sequential nodes shows slight clustering (54% / 53% same-side-of-median, chi2 p < 0.005). No least-squares fit of S vs d0 was made by the authors (distribution too non-normal).
The generated trees use plain Strahler ordering (not Kassab's diameter-defined ordering), so RD here is not directly comparable to Kassab 1993 diameter-defined orders."""
use_in_model = """Bin CCO bifurcations by mother diameter using the six classes of symmetry_by_mother_diameter and compare the quartiles of S = ds/dL with S25/median/S75.
A symmetry floor for growth can be taken from the lower quartile S25 per class (about 0.63 below 30 um falling to 0.23 above 500 um); a sampled target distribution needs the quartiles plus the 5 um lower bound.
The generated-tree Strahler ratios (RB 3.30, RD 1.51, RL 1.63 at orders 2-8) are the expected outcome of these local rules under plain Strahler ordering."""

