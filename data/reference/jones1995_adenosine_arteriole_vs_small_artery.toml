[meta]
id = "jones1995_adenosine_arteriole_vs_small_artery"
data_type = "experimental"
validates = "Size dependence of the coronary microvascular response to adenosine in the beating heart: arterioles < 100 um vs small arteries > 100 um, and its dependence on nitric oxide. Mechanism for residual tone in larger resistance vessels during adenosine."
species = "dog"
preparation = "Open-chest dogs (n = 20). Subepicardial microvessel diameters by stroboscopic epi-illumination intravital microscopy; epicardial coronary blood velocity (CBV) by Doppler. Isolated canine arterioles (81 +/- 4 um, n = 8) for the in-vitro arm."
conditions = "IC adenosine 1 and 10 ug/kg/min; left atrial pacing 180/min; repeated after L-NAME 30 ug/kg/min IC (NO synthase inhibition)."
verification = "abs"
access = "PubMed abstract (PMID 7882491). Full text on ahajournals.org returned HTTP 403."
notes = """Values mean +/- SE or SD as printed (label not given in the abstract).
These IC adenosine doses were not maximal (CBV +118%, a reserve well below the 4-5x of full dilation), so the data show the size order of the response, not the residual tone at full adenosine dilation.
After L-NAME, small arteries constricted (-8 +/- 2%), arterioles dilated (+10 +/- 4%) and adenosine no longer dilated arterioles further. Isolated arterioles dilated to their maximal diameter with adenosine, unaffected by L-NAME.
The authors conclude that NO-mediated (flow-dependent) dilation of small arteries is needed for a full metabolic/adenosine response; adenosine itself acts mainly on arterioles < 100 um."""
use_in_model = """Mechanism for a submaximal adenosine state: adenosine dilates arterioles < 100 um directly (+25 +/- 3% diameter at 10 ug/kg/min) but small arteries > 100 um much less (+7 +/- 3%); their dilation depends on flow-mediated NO. If clinical adenosine falls short of full conductance, the residual tone should sit in the > 100-150 um small arteries, not the terminal arterioles. In the model this means a 'clinical adenosine' state = arterioles fully dilated, larger pre-arterioles/small arteries with partial tone (a size-dependent dilation fraction), rather than a uniform scaling of all resistances."""

