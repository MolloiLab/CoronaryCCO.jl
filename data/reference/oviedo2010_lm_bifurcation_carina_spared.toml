[meta]
id = "oviedo2010_lm_bifurcation_carina_spared"
data_type = "experimental"
validates = "IVUS plaque distribution at the distal left main bifurcation: the carina (flow divider) is always disease-free, and plaque runs continuously from the left main into the proximal LAD in most patients. Supports placing a proximal-LAD plaque as an extension of left main plaque on the wall away from the carina."
species = "human"
preparation = "140 patients with distal left main and ostial LAD and LCx lesions, with preintervention IVUS of the LAD, the LCx and the left main."
conditions = "IVUS pullbacks from both the LAD and the LCx into the left main; angiograms reviewed for comparison."
verification = "abs"
access = "PubMed abstract (PMID 20197513, NCBI efetch, read 2026-10-16). Circ Cardiovasc Interv full text not accessible (AHA)."
notes = """Abstract: 'both sides of the flow divider were always disease-free' and 'IVUS shows that the carina is always spared and that the disease is diffuse rather than focal.'
Plaque distribution was not influenced by the LAD/LCx angiographic angle, lesion severity, left main length or remodelling.
92.9% of patients had at least one cross section with >= 40% IVUS plaque burden, vs 57.2% with angiographic diameter stenosis >= 50%."""
use_in_model = """At the left main bifurcation keep the carina clear of plaque. In about 90% of patients make the proximal-LAD plaque continuous with left main plaque rather than an isolated ostial lesion."""

[source]
