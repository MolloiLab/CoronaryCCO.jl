[meta]
id = "bassingthwaighte2001_metabolic_heterogeneity"
data_type = "experimental (review summary)"
validates = "Spatial heterogeneity of regional myocardial blood flow (relative dispersion, fractal dimension, near-neighbour correlation), its temporal stability, and its coupling to regional O2 and substrate use; used to justify a metabolic (demand-driven) basis for the model's regional flow heterogeneity"
species = "mixed (baboon, sheep, dog, rabbit; human PET cited)"
preparation = "Review. Numbers are the authors' summaries of earlier microsphere, molecular-microsphere, PET and tracer studies (their refs 12, 13, 36, 38, 42, 50, 52, 53, 61, 95, 102 and others). Fig 1 is an original re-plot of 11 sheep hearts from Bassingthwaighte, King & Roger 1989 (ref 12)."
conditions = "Mostly normal resting hearts; awake baboons for the stability observations (King and Bassingthwaighte, ref 53); rest and moderate exercise; adrenergic stimulation (Deussen 1996, ref 35)."
verification = "FT"
access = "Author manuscript full text (NIHMS, PMC2878314) read as HTML from pmc.ncbi.nlm.nih.gov on 2026-10-15 (the publisher does not allow XML download). Abstract also read via PubMed E-utilities (PMID 11770077)."
notes = """This is a review: every number below is a value the authors state, usually summarizing cited work. Provenance FT means read in this paper's full text, not that the measurement was made here. cited_ref gives the reference number in the review.
Qualitative conclusions (Discussion and conclusions): RD of regional flow of 20 to 30% is amply documented; the flow distribution is stable; local flows associate with local substrate utilization but not with local enzyme concentrations or energy stores; increases in cardiac demand are met by proportional flow increases in all regions without significant change in RD; local flow and O2 consumption are probably driven by local ATP need (crossbridge ATP hydrolysis), which is 'still unproven, but nevertheless compelling'.
Metabolic coupling statements: more O2 is used in high-flow than low-flow regions (Weiss, ref 102, Hb saturation in small arteries and veins); fatty-acid uptake capacity proportional to regional flow (Caldwell, ref 27); higher deoxyglucose uptake in high-flow regions (Sonntag, ref 87); acetate turnover implies local flow nearly proportional to local O2 consumption (van Beek, ref 95); linear association of O2 consumption and flow by 15O-oxygen PET (Li, ref 61). Authors' summary: 'substrate utilization and oxygen utilization are both proportional [to] regional flows'.
Stability statements: regional flows stable 'from a few hours up to a day, in four to six repeated observations' (ref 53, baboon); 'the same regions remained stable in their relative flows during rest and moderate exercise over periods of hours and up to one day' (ref 53); adrenergic stimulation caused proportional regional increases so the same pattern persisted (Deussen et al. 1996, ref 35). No consistent anatomical location of low- or high-flow regions between hearts.
The quoted baboon 'RD 0.25-0.35' is NOT in this paper. It states for the King et al. baboon data (ref 52, ~250 pieces, each ~0.4% of heart mass) that the SD of flows is 20-30% of the mean, and in the Introduction a CV of about 25% in normal awake animals. Baboon RD values per animal are in bassingthwaighte1989_flow_heterogeneity.toml and king1985_flow_heterogeneity.toml.
Related review in the same issue, Deussen A, Lauer T, Loncar R, Kropp J (2001) 'Heterogeneity of metabolic parameters in the left ventricular myocardium and its relation to local blood flow', Basic Res Cardiol 96(6):564-574, doi 10.1007/s003950170008, PMID 11770075 (Crossref title exact match checked 2026-10-15). Only its abstract was accessible (Springer, no PMC copy); it has no numbers. Abstract statements (abs): the broad range of resting flows correlates with local metabolism, possibly affected by spatial differences in adrenergic stimulation; high-flow samples have higher oxidative metabolism than low-flow samples; the flow threshold for local ischemia is higher in high-flow samples; infarct probability after ischemia/reperfusion relates to the local control level of flow-metabolism matching. Not stored as a data table."""
use_in_model = """Targets and justification for a metabolically driven heterogeneity model: regional flow RD of ~20-30% at ~0.2-1% of LV mass with fractal D ~1.2 (RD(m) = RD(1 g) * m^(1-D)), near-neighbour correlation ~0.6; the pattern should be stable in time and scale proportionally when global demand rises (RD roughly unchanged); regional O2 consumption should rise roughly in proportion to regional flow (so regional OEF is roughly uniform). Compare against the per-animal data in bassingthwaighte1989_flow_heterogeneity and king1985_flow_heterogeneity rather than these summary ranges where possible."""

