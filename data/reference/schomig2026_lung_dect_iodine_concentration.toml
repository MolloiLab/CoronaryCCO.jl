[meta]
id = "schomig2026_lung_dect_iodine_concentration"
data_type = "experimental"
validates = "Absolute lung parenchymal iodine concentration (mg/mL) from dual-layer DECT iodine maps, main pulmonary artery iodine concentration, and their ratio, with CT lung volume, in adults with radiologically normal lungs (portal venous phase, NOT first pass)"
species = "human"
preparation = "Retrospective single-center cohort (University Hospital Cologne), 112 adults (59 F, 53 M; age 60.3 +/- 16.6 y; 30 < 50 y, 44 50-70 y, 38 > 70 y) with dermato-oncological disease but no current tumor burden, each with >= 2 staging CTs 2016-2019 (mean interval 262 +/- 169 d). Scans with any lung disease or parenchymal abnormality excluded. Philips IQon spectral (dual-layer detector) CT, 120 kV, dose modulation, 0.33 s rotation, 64 x 0.625 mm, pitch 0.671. 100 mL iohexol 350 mgI/mL (Accupaque) via 20 G antecubital catheter; bolus tracking in the descending aorta at 150 HU, then 50 s delay (portal venous phase). Iodine maps from spectral reconstruction, 2 mm slices. Lungs and lobes auto-segmented (IntelliSpace Portal COPD), merged with iodine maps; large vessels removed by thresholding at the left-atrial iodine concentration; mPA and portal-vein ROIs."
conditions = "Portal venous phase (~50 s after the aortic 150 HU trigger), i.e. near-equilibrium recirculation, NOT first-pass. Supine. Breath-hold level not stated (clinical staging CT, presumably inspiratory, no spirometric control)."
verification = "FT"
access = "Europe PMC fullTextXML of PMC13114350 (Diagnostics, open access CC BY), read 2026-10-16; Table 1 read from the XML table markup."
notes = """Population is oncology follow-up patients (no visible thoracic tumor, lung-healthy on CT), mean age 60 y; no cardiovascular screening (e.g. heart failure not excluded).
Table 1 vs text discrepancy: Table 1 gives mean lung iodine F 0.87 +/- 0.18 and M 0.69 +/- 0.13 mg/mL; Results text gives F 0.87 +/- 0.13 and M 0.69 +/- 0.18. Table 1 values are recorded below; the SD assignment by sex is uncertain.
The paper does not say whether Table 1 averages both timepoints or uses one examination per patient. Between-scan correlation of lung iodine r = 0.82; PIPR_mPA r = 0.88.
PIPR_mPA = lung iodine / mPA iodine = 0.17 +/- 0.05 overall; < 50 y 0.19 vs > 70 y 0.16 (P < 0.01). Lobar PIPR_mPA: RUL 0.181 +/- 0.08 (highest), RML 0.127 +/- 0.04 (lowest), LUL 0.166 +/- 0.05, LLL 0.170 +/- 0.05; left 0.163 vs right 0.159 (text) vs 0.17/0.16 (Table 1, rounded).
Total lung iodine 3347.9 +/- 596.6 mg (text).
The lung/mPA ratio here (~0.17, venous phase) is close to Lee 2022 first-pass PBV (~0.15), as expected if it mostly reflects lung blood volume fraction.
Iodine mg/mL to HU at 120 kV is roughly 25-30 HU per mg/mL (scanner dependent; not reported here)."""
use_in_model = """Validation target for the late (portal venous; ~50 s after an aortic 150 HU trigger, so roughly 65-80 s post-injection, an estimate made here) lung parenchymal iodine: ~0.78 mg/mL whole-lung mean after 100 mL of 350 mgI/mL, with mPA ~4.95 mg/mL. The ratio lung/mPA ~0.17 is the more portable number (dose independent). Not a first-pass value."""

