[meta]
id = "buffa2015_upper_limb_volume"
data_type = "experimental"
validates = "Human arm tissue volume (wrist crease to 60% of the acromion-olecranon distance, hand excluded) by water displacement in healthy adults; arm length and upper-arm circumference by sex"
species = "human"
preparation = "30 adults (15 men, 15 women), 19-60 y, university staff and students (convenience sample). Right arm. Water-displacement volumeter (PVC tank 90 x 14 cm, ~11 L, overflow weighed; verified with a 351.2 mL iron cylinder, measured 351.0 mL, CV 0.228%). Arm volume = (immersion to the upper-arm mark) minus (immersion to the wrist mark). Also measured with a Kinect structured-light scanner (SkanLab) for validation."
conditions = "Standing immersion of the arm; marks at the wrist crease distal to the styloid (minimum wrist circumference) and at 60% of the acromion-olecranon distance. Water 20-25 degC."
verification = "FT"
access = "Europe PMC fullTextXML of PMC4507693 (Sensors, CC BY open access), read 2026-10-15; Tables 4 and 6 read from the XML table markup."
notes = """Volume excludes the hand and the proximal 40% of the upper arm (above the 60% acromion-olecranon mark); it covers the forearm plus distal upper arm.
Volumes are pooled over men and women (no sex split printed). Replicate values from two raters agree within ~10 mL.
Not a venous measure: tissue volume only, used to scale per-100-ml plethysmographic compliance to whole-segment mL/mmHg."""
use_in_model = """Scale factor for the arm venous reservoir: C_arm [mL/mmHg] = C_per_100ml [ml/dl/mmHg] x V_arm/100, with V_arm ~1.9 L (wrist to distal upper arm). Note the plethysmographic compliance is measured at the forearm gauge site; applying it to this whole segment assumes uniform venous compliance per tissue volume."""

[source]
authors = ["Buffa R", "Mereu E", "Lussu P", "Succa V", "Pisanu T", "Buffa F", "Marini E"]
year = 2015
title = "A new, effective and low-cost three-dimensional approach for the estimation of upper-limb volume"
journal = "Sensors (Basel)"
volume = "15"
issue = "6"
pages = "12342-12357"
doi = "10.3390/s150612342"
crossref_verified = "2026-10-15; Crossref title exact match (vol 15, issue 6, 12342-12357; authors Buffa, Mereu, Lussu, Succa, Pisanu, Buffa, Marini)"
