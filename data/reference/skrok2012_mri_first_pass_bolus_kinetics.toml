[meta]
id = "skrok2012_mri_first_pass_bolus_kinetics"
data_type = "experimental"
validates = "First-pass contrast bolus kinetics through the heart and lungs by CMR: RV-to-LV peak-to-peak pulmonary transit time (PTT), LV full width at half maximum (FWHM, bolus dispersion after RV + lungs + LA + LV) and LV time to peak (TTP) in healthy controls, with biventricular volumes, EF and cardiac index"
species = "human"
preparation = "18 age- and sex-matched healthy controls (12 women; median age 51.7 y, IQR 48.2-57.7; Framingham 10-y risk <= 10%), 11 scleroderma patients without PAH and 32 PAH patients. 3 T CMR. Bolus: 1:10 diluted gadopentetate dimeglumine 0.0025 mmol/kg, then 20 mL saline, both at 5 mL/s, intravenous (vein not stated); injection duration 0.5-1.4 s (median 0.8 s). One diastolic basal short-axis slice through both ventricles, ECG-gated saturation-recovery turbo FLASH, 1 image per R-R interval for 40 beats (temporal resolution median 0.87 s), mid-inspiratory breath hold. ROIs in RV and LV cavities; baseline-corrected mean signal."
conditions = "Rest. PTT = time of LV peak minus time of RV peak. TTP = time from first appearance (20% of peak signal) to peak. FWHM = width of the LV time-intensity curve at half its maximum."
verification = "FT"
access = "NIH author manuscript HTML at PMC3359516 (pmc.ncbi.nlm.nih.gov), read 2026-10-15; Table 1 read from the PMC table image 111001t01.jpg (692 x 465 px, read upscaled). Abstract also in the NCBI efetch record."
notes = """Values are medians (25th-75th percentile).
INCONSISTENCIES kept as printed, Table 1 stored:
- Control PTT IQR: Table 1 5.9-7.1 s; Abstract and Results text 5.7-7.1 s.
- Control LV FWHM: Table 1 and Results text 5.7 s (5.3-7.9); Abstract 5.2 s (4.1-6.1).
- PAH LV FWHM: Table 1 and Results 9.0 s (6.6-12.3); Abstract 8.2 s (5.7-11.4). PAH PTT IQR: Table 1 6.9-9.8; text 6.9-9.9.
Example curves (Fig. 1): a 57-y healthy woman had PTT 6.5 s, LV FWHM 4.72 s, LV TTP 2.84 s.
Lakoma et al. (cited) found PA-to-ascending-aorta PTT 6.8 +/- 1.4 s in their controls.
No correlation of PTT, FWHM or TTP with age, height, BSA or heart rate across the study (n = 61); PTT correlated with LV FWHM (r = 0.78) and LV TTP (r = 0.68).
The bolus is very small (diluted 1:10), so MR signal saturation is unlikely to distort the curve shape much; the RV curve FWHM was measured but NOT reported (only LV values were used)."""
use_in_model = """Constrains the RV -> pulmonary circulation -> LA -> LV segment: peak-to-peak transit (6.4 s median in healthy controls) and the bolus width arriving in the LV (FWHM 5.7 s; TTP 3.2 s) after a ~0.8 s injection at 5 mL/s. A model of RA/RV mixing + pulmonary dispersion + LA/LV mixing driven by a short venous bolus should reproduce LV FWHM ~5-8 s and PTT ~6-7 s at cardiac index ~3.0 L/min/m2 and LV/RV EF ~60-66%."""

