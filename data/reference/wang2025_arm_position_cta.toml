doi = "10.1186/s12880-025-01742-w"
crossref_verified = "2026-10-15; Crossref title exact match (vol 25, issue 1, article 198; authors Wang, Zheng, Yang, Su, Sheng, He, Wang, Wu)"
pmid = "40448247"
pmcid = "PMC12125744"

