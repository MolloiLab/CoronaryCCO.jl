[meta]
id = "nellis1981_microvascular_pressure"
data_type = "experimental"
validates = "Micropipette pressures in small coronary arteries and veins (above/below 140 um) of the beating right ventricle, absolute and as % of aortic pressure"
species = "rabbit"
preparation = "New Zealand white rabbits (1-1.5 kg), pentobarbital 50 mg/kg, open chest. Right-ventricular free-wall surface vessels viewed with stroboscopic illumination synchronized to the heart; pressures by servo-null micropipette either with the RV fixed by a holding rod ('fixed-position') or with an electromagnetic micromanipulator tracking the vessel ('free-motion'). Lungs bypassed with an oxygenator (pulmonary artery to left atrium, roller pump) so ventilation could stop; circuit primed with washed donor red cells in Krebs-Ringer."
conditions = "Baseline, no vasodilator. Beating heart; right ventricle (not left)."
verification = "mixed"
access = "Publisher PDF (ahajournals.org) read via Wayback Machine capture 20220816213936 of https://www.ahajournals.org/doi/pdf/10.1161/01.RES.49.2.342"
notes = """Fig. 6 pools fixed-position and free-motion data: 18 arteries and 31 veins from 16 animals, split at 140 um diameter into groups of
roughly equal size. Free-motion venous pressures are lower than fixed-position ones (6.0 +/- 0.71 vs 11.1 +/- 4.2 mmHg mean, SEM),
so the pooled venular values in Fig. 6 are biased upward relative to free-motion alone.
The upper panel of Fig. 6 (absolute pressures) has heavily overlapping symbols for the two venule groups; only the lower panel
(% of aortic) was digitized for veins. Authors: 'appreciable pressure drop ... in arteries with decreasing diameter', the largest drop
in arteries < 140 um; 'little if any pressure gradient' among veins."""
use_in_model = """Compare model mean pressure (as % of inlet mean pressure) in subepicardial arteries > 140 um and < 140 um (but larger than ~40 um,
the smallest arteries punctured), and in veins/venules 45-192 um, with pct_aortic. Right-ventricular, small-heart data: use as a
shape check of the arterial pressure fall above the arteriolar level, not as an LV absolute target."""

[source]
authors = ["Nellis SH", "Liedtke AJ", "Whitesell L"]
year = 1981
title = "Small coronary vessel pressure and diameter in an intact beating rabbit heart using fixed-position and free-motion techniques"
journal = "Circ Res"
