[meta]
id = "seemann2025_porcine_lung_extravascular_ecv"
data_type = "experimental"
validates = "Lung extracellular volume fraction (gadobutrol ECV), plasma volume fraction (ferumoxytol) and their difference, the extravascular ECV, in normal pig lungs and after induced extravascular (mitral regurgitation) or intravascular (colloid) fluid loading; anterior-to-posterior gradients; lung T1 before and after each agent; pulmonary blood volume."
species = "pig"
preparation = "NIH (NHLBI), 18 experiments in female juvenile pigs under general anesthesia, mechanical ventilation and isoflurane. Naive controls (8 animals in the abstract; 5 in Tables 2-3), reversible catheter-induced severe mitral regurgitation (n = 5), and colloid volume loading with 15 mL/kg 6% hetastarch (n = 5). 0.55 T CMR (modified Siemens system), SASHA T1 maps in three axial slices, proton-density lung water maps."
conditions = "Gadobutrol 0.1 mmol/kg bolus at 4 mL/s via ear vein with 20 mL saline (first-pass imaging of a 2 mL part, then the rest). Ferumoxytol 0.7 mg/kg in 50 mL saline at about 0.4 mL/s, about 30 min after gadobutrol; post-ferumoxytol T1 maps at least 1 h after gadobutrol. ECV = (1 - Hct) x dR1_lung / dR1_blood, using femoral arterial hematocrit. Extravascular ECV = gadolinium ECV - ferumoxytol plasma volume fraction. ROI means over both lungs."
verification = "FT"
access = "Europe PMC open-access full-text XML (PMC12182819, J Cardiovasc Magn Reson), retrieved 2026-10-16. Tables 2-4 read from the XML."
notes = """All fractions are of the MRI-visible (non-air) lung tissue. The authors stress that a lung ECV of 70% means 70% of the non-air volume is extracellular, not that the lung is 70% fluid.
'Plasma volume fraction' is the ferumoxytol-based ECV (intravascular agent); the gadolinium ECV includes both plasma and interstitium.
The abstract says normal controls n = 8; Tables 2 and 3 use naive n = 5. Three naive pigs received ferumoxytol first and gadolinium second; the dual-contrast naive values are from the 5 with gadolinium first.
Hematocrit in these anesthetized pigs is low (naive 23 +/- 8.8%), which matters when converting partition coefficients to ECV.
The exact minutes between gadobutrol injection and its T1 map are not stated in the text read; ferumoxytol was given about 30 min after gadobutrol.
Lung water volume (312 +/- 32 mL) was lower than first-pass pulmonary blood volume (439 +/- 67 mL) in naive animals; the authors discuss this discrepancy.
Regional analysis groups naive and MR-baseline animals (n = 10)."""
use_in_model = """Pig lung compartment sizes for a small extracellular tracer: of the non-air lung tissue, about 64% is extracellular (gadolinium ECV), 42% is plasma and 21% is extravascular extracellular (naive). Extravascular ECV is higher anteriorly (non-dependent) and plasma fraction higher posteriorly. Use as the large-animal counterpart of cheriyan2022_lung_dce_mri_ve_ktrans (human ve about 0.32, vp about 0.45, from a different model and method). Gives no exchange rate (PS or Ktrans)."""

