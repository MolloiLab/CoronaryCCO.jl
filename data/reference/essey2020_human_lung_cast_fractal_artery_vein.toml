[meta]
id = "essey2020_human_lung_cast_fractal_artery_vein"
data_type = "experimental"
validates = "Human pulmonary ARTERY and VEIN diameter scaling exponent (number-diameter fractal dimension D_F) from one concurrently cast lung; generation tables give per-generation number and mean diameter"
species = "human"
preparation = "One 49-year-old male donor (death from head injury), lungs without visible pathology; bronchial tree, pulmonary artery and pulmonary vein cast concurrently with coloured latex rubber in situ, then macerated and cleared."
conditions = "Branches classified by Weibel-style generations (from the hilum outward); diameters by digital vernier caliper (three measurements per branch); smallest cleared vessels 0.5-0.8 mm diameter. Arteries 14 generations (7,531 branches), veins 14 generations (7,355 branches)."
verification = "FT"
access = "Europe PMC fullTextXML of PMC7574555 (open access, CC BY), read 2026-10-18."
notes = """D_F computed as 1 minus the slope of a log-log regression of 'total diameter' (N x mean diameter per generation) against mean generation diameter. If N ~ D^-x then N*D ~ D^(1-x), so D_F = x, the diameter exponent of number-vs-diameter scaling (Murray exponent under flow conservation across full-flow generations).
Regression slopes printed: artery -1.88, vein -1.33 (D_F 2.882 and 2.334).
CAVEATS: single lung; generations 13-14 are incompletely counted (number ratio printed as 0.00 at generation 13), so the deepest points are not full-flow sets; venous diameter CVs are very large (up to 268%), and venous mean diameters are not monotone (gen 9 1.45 mm, gen 10 1.63 mm). The fit is over ~0.6-21 mm diameter only.
Artery generation mean diameters 12.94 mm (gen 1) to 0.63 mm (gen 14); vein 20.97 mm (gen 1) to 1.12 mm (gen 14)."""
use_in_model = """Only human source found with arteries and veins measured in the same lung by one method: diameter exponent 2.88 (artery) vs 2.33 (vein) over ~0.6-21 mm. Venous value is lower than arterial here, but the venous data are noisy; treat as weak evidence."""

