[meta]
id = "huang2011_human_sheet_flow_parameters"
data_type = "model"
validates = "Model input, not data: the human parameter set of a Fung-Sobin continuum model of the whole pulmonary circulation (fifth-power law in arteries and veins, fourth-power sheet-flow law in the alveolar capillaries). Human capillary-sheet constants h0, alpha, S, A, mu, k, f and path length; per-order compliance of human arteries and veins."
species = "human (sheet h0, alpha and S from Sobin et al. 1979 postmortem human lung abstract; k, f and viscosity from cat-lung theory and model experiments)"
preparation = "Continuum model: 16 arterial and 15 venous orders (Huang 1996 casts) in series, same-order vessels in parallel, joined by one capillary sheet. Validated against right-pulmonary-artery balloon occlusion data in 3 normal subjects (Harris 1968)."
conditions = "Steady flow; zone 3 unless venous pressure < alveolar pressure. Vessel tables at PA - Ppl = 10 cmH2O."
verification = "FT"
access = "Open access full text (Tech Science Press PDF, read from a scratch copy; not stored in the repo). Tables 1-4 and Methods text read from the text layer and checked line by line."
notes = """Sheet-flow law as printed: h = h0 + alpha (P - PA) (Eq. 5); Qdot = const [h_a^4 - h_v^4] with const = S A / (4 mu k f Lbar^2 alpha) (Eqs. 6-7). S is the 'vascular-space-tissue ratio' (VSTR); k and f are dimensionless alveolar-geometry factors.
Human h0 3.5 um, alpha 0.127 um/cmH2O and S 0.88 are cited to Sobin, Fung, Tremer & Lindal 1979, Fed Proc 38:990 (an abstract on human interalveolar septa; not itself readable). This is the only human sheet-elasticity source found; cat values (Sobin et al. 1972) were not readable.
Lbar 1188 um is NOT measured in humans: the authors scaled the cat value 556 +/- 286 um (Sobin et al. 1980) by the human/cat alveolar-diameter ratio 250/117. Clark 2010 and Ebrahimi 2022 use 1186 um for the same quantity.
k = 12 is cited to Fung 1972 (Ann Biomed Eng) and f = 1.8 to Lee 1969 (J Biomech). Clark 2010 instead uses a single factor f = 21.6, which equals the product k*f here (12 x 1.8).
A = 126 m2 is the Gehr 1978 capillary surface area; Clark 2010 uses A = 73 m2 (half of the 146 m2 alveolar surface, at TLC) with S = 0.86. Do not mix the two conventions.
Vessel compliance beta: the table header prints no unit. Orders 1-3 are from Yen & Sobin 1988, whose abstract gives the same quantity in %/cmH2O (e.g. venule order 1: 0.992 %/cmH2O; arteriole order 1: 0.682 %/cmH2O); the table values are close but not identical (1.010, 0.698), so the unit is most likely %/cmH2O, i.e. 1e-2 per cmH2O. Orders 4-10 are from Yen, Tai, Rong & Zhang 1990 (book chapter). Values marked '*' in the source are extrapolated from the nearest measured order.
Sensitivity: halving all vessel compliances raised main PA pressure by 7.4%; x1.5 lowered it by 5.4% (text, Fig. 2)."""
use_in_model = """Capillary sheet resistance (Fung): flow per unit width scales with h^3 dP, so integrated over the sheet Q = S A / (4 mu k f Lbar^2 alpha) [(h0 + alpha (Pa - PA))^4 - (h0 + alpha (Pv - PA))^4]. Use h0 = 3.5 um, alpha = 0.127 um/cmH2O, S = 0.88, mu = 1.92 cP, k f = 12 x 1.8, Lbar ~ 1188 um. Effective sheet resistance = (Pa - Pv)/Q, which falls as capillary pressure rises. Per-lung or per-acinus area A must be split across terminal sheets.
Distensible arteries and veins: D = D0 (1 + beta dP) with beta from the order tables (~0.36-1.80 %/cmH2O, assumed unit); Poiseuille then gives Q ~ [(1+beta P_in)^5 - (1+beta P_out)^5] (fifth-power law, Eq. 2)."""

