location = "Methods ('Data Analysis')"
provenance = "FT"
statistic = "thresholds"
grade = ["normal", "mildly_reduced", "moderately_reduced", "severely_reduced"]
cfr_lower = [2.8, 2.1, 1.7, nan]
cfr_upper = [nan, 2.8, 2.1, 1.7]
hapv_lower_cm_per_s = [49.0, 33.0, 26.0, nan]
hapv_upper_cm_per_s = [nan, 49.0, 33.0, 26.0]
printed_definition = ["CFR >= 2.8 with corresponding hAPV >= 49.0 cm/s", "CFR < 2.8 and > 2.1 and corresponding hAPV < 49.0 and > 33.0 cm/s", "CFR <= 2.1 and > 1.7 with corresponding hAPV <= 33.0 and > 26.0 cm/s", "CFR <= 1.7 and corresponding hAPV <= 26.0 cm/s"]
missing_note = "Inclusive/exclusive ends as printed in printed_definition; the numeric arrays carry the bounds only."

