[meta]
id = "murai2020_invasive_cfc_stenosis"
data_type = "experimental"
validates = "Relation between invasive (Doppler-wire) coronary flow capacity grade and anatomic / pressure stenosis severity: percent diameter stenosis (QCA), minimal lumen diameter, FFR, iFR, hyperemic APV and CFR per CFC grade, before and after PCI; invasive CFC thresholds"
species = "human"
preparation = "133 vessels with intracoronary Doppler flow velocity and pressure measured before and after PCI, pooled from DEFINE FLOW (>= 50% diameter stenosis) and an international database incl. IDEAL (40-70% visual diameter stenosis); pooled database from Amsterdam UMC, Imperial College London and Hospital Clinico San Carlos. QCA for diameter stenosis."
conditions = "Hyperemia by intracoronary adenosine (20-150 ug) or IV adenosine 140 ug/kg/min (central or peripheral vein). Rest and hyperemic distal pressure and average peak velocity (APV) recorded simultaneously."
verification = "FT"
access = "Europe PMC fullTextXML of PMC7660740 (open access), read 2026-10-15; Table 1 read from the XML table markup."
notes = """This is an INVASIVE, velocity-based CFC (hyperemic APV in cm/s instead of PET stress perfusion in mL/min/g). Thresholds are from van de Hoef et al. JACC Cardiovasc Interv 2015;8:1670 (ref 12, not read).
Grades: normal CFR >= 2.8 with hAPV >= 49.0 cm/s; mildly reduced 2.1 < CFR < 2.8 with 33.0 < hAPV < 49.0; moderately reduced 1.7 < CFR <= 2.1 with 26.0 < hAPV <= 33.0; severely reduced CFR <= 1.7 with hAPV <= 26.0. 'Ischemic' CFC = moderately or severely reduced. Each grade is printed with 'and corresponding hAPV'; the rule for vessels with CFR and hAPV in different grades is not printed here.
Pre-PCI QCA diameter stenosis rises across CFC grades (median 49.1% normal to 66.0% severe), but the IQRs overlap widely (moderate grade 44.0-72.0%). FFR is similar across normal-to-moderate grades (medians 0.73-0.79) and lower only in the severe grade (0.56). So % stenosis and FFR map only loosely onto CFC grade.
No percent-stenosis or FFR mapping to PET CFC categories was found in Gould 2013, Kaul 2020 (PMC7992506) or the other Gould CFC papers read; Gould 2013 reports ~40% discordance between FFR and CFR."""
use_in_model = """For simulated stenoses of known % diameter reduction in the model tree, compare the distal-territory CFC grade with the pre-PCI %DS and FFR distribution per grade here (loose relation expected; severe CFC typically ~66% DS with FFR ~0.56). For a velocity-based comparison use the model's proximal-segment hyperemic mean velocity against hAPV only with care: APV is Doppler average peak velocity, not mean velocity."""

[source]
authors = ["Murai T", "Stegehuis VE", "van de Hoef TP", "Wijntjens GWM", "Hoshino M", "Kanaji Y", "Sugiyama T", "Hamaya R", "Nijjer SS", "de Waard GA", "et al."]
year = 2020
title = "Coronary flow capacity to identify stenosis associated with coronary flow improvement after revascularization: a combined analysis from DEFINE FLOW and IDEAL"
journal = "J Am Heart Assoc"
volume = "9"
issue = "14"
pages = "e016130"
doi = "10.1161/JAHA.120.016130"
crossref_verified = "2026-10-15; Crossref title exact match (vol 9, issue 14, e016130; first authors Murai, Stegehuis, van de Hoef, Wijntjens)"
pmid = "32660310"
pmcid = "PMC7660740"

[data.invasive_cfc_thresholds]
