[data.category_thresholds_revised]
description = "Per-pixel CFC ranges. A range 'CFR > a to b' means a < CFR <= b as printed ('>1.6 to 2.38'). Upper bounds of the normal class are open."
location = "Circ Res 2018, paragraph 'Precision Clinical Coronary Physiology' (p. 1124-1125); identical numbers in EHJ 2024 Methods ('Coronary flow capacity')"
provenance = "FT"
statistic = "thresholds (no dispersion)"
category = ["normal", "minimally_reduced", "mildly_reduced", "moderately_reduced", "severely_reduced_definite_ischemia", "myocardial_steal"]
color = ["red", "orange", "yellow", "green", "blue", "dark blue"]
cfr_lower_exclusive = [2.9, 2.38, 1.6, 1.27, 1.0, nan]
cfr_upper_inclusive = [nan, 2.9, 2.38, 1.6, 1.27, 1.0]
stress_flow_lower_exclusive_mL_per_min_per_g = [2.17, 1.82, 1.09, 0.83, nan, nan]
stress_flow_upper_inclusive_mL_per_min_per_g = [nan, 2.17, 1.82, 1.09, 0.83, nan]
printed_range = ["CFR > 2.9 and stress perfusion > 2.17 cc/min/g", "CFR > 2.38-2.9 and stress perfusion > 1.82-2.17", "CFR > 1.6-2.38 and stress perfusion > 1.09-1.82", "CFR > 1.27-1.6 and stress perfusion > 0.83-1.09", "CFR 1.0-1.27 and stress perfusion <= 0.83", "CFR < 1.0 (stress perfusion falling below rest perfusion)"]
defining_population_circres2018 = ["125 healthy young volunteers < 40 y with no risk factors", "people with risk factors only, no known or clinically manifest CAD", "documented stable CAD without angina or ST depression during dipyridamole stress", "angina or ST depression >= 1 mm with a relative stress defect ('possible ischemia')", "angina AND ST depression >= 1 mm AND a relative stress defect ('definite ischemia')", "nearly always with angina and ST depression >= 1 mm"]
defining_population_ehj2024 = ["healthy young volunteers", "asymptomatic patients with risk factors without known CAD", "known CAD without symptoms of ischaemia", "either a regional stress defect or angina or ST depression >= 1 mm during dipyridamole stress", "two of these three manifestations of ischaemia", "defined as CFR < 1.0"]
scar_definition = "fixed resting and stress perfusion <= 0.3 mL/min/g, expressed as % of LV (EHJ 2024; grey hatch marks)"
combination_rule = "Severe stated explicitly as BOTH CFR <= 1.27 AND stress <= 0.83 (J Nucl Med 2019; CENTURY 2025). For the other classes, 'and' between the two ranges; the rule for mixed pixels is not printed (nested rectangles as in the 2012 map is the consistent reading)."
missing_note = "Lower bound of the severe class's CFR (1.0) separates it from steal; the stress-flow range for steal is not printed. Inclusive/exclusive ends follow the printed '>' and '<=' only where printed; the normal class has no upper bound (nan)."

