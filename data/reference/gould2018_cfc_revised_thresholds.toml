[meta]
id = "gould2018_cfc_revised_thresholds"
data_type = "experimental"
validates = "CURRENT (2018 onward) coronary flow capacity category thresholds of the Houston (Gould/Johnson) group for Rb-82 dipyridamole PET: per-pixel CFR and stress perfusion (cc/min/g) ranges for normal, minimally reduced, mildly reduced, moderately reduced, severely reduced (definite ischemia) and myocardial steal; scar definition; the clinical group that defines each range"
species = "human"
preparation = "Thresholds summarized in a short review (Circ Res 2018) and restated, with acquisition details, in Gould et al. Eur Heart J 2024 (6,979 CAD subjects): Rb-82 30-50 mCi on a GE Discovery ST 16-slice PET-CT (2D) or a United Imaging solid-state 3D PET-CT; per-pixel rest and stress perfusion and CFR; FDA-cleared software (K171303 per Gould 2019 J Nucl Med)."
conditions = "Dipyridamole 0.142 mg/kg/min over 4 min, 4-min wait to peak vasodilation before the stress Rb-82 injection (EHJ 2024 Methods)."
verification = "FT"
access = "Circ Res 2018 full text: Europe PMC fullTextXML of PMC6221383 (Viewpoint, CC BY-NC-ND open access), read 2026-10-15. Eur Heart J 2024: Europe PMC fullTextXML of PMC10787661 (open access), read 2026-10-15. Severe-threshold wording also checked in Gould 2019 J Nucl Med (PMC6424226) and the CENTURY trial, Eur Heart J 2025 (PMC12401582)."
notes = """These cutoffs REPLACE the 2012 set in johnson2012_coronary_flow_capacity.toml (2012: normal CFR > 3.37 / stress > 2.39; minimal/mild split 2.70 / 1.76; moderate < 2.03 / < 1.12; definite ischemia < 1.74 / < 0.91).
The texts read do not explain why the numbers changed. Circ Res 2018 says the 5 categories were set 'by receiver operating curve analysis in 6000 patients' with test-retest precision of +/-10%, citing refs incl. Johnson & Gould 2012 and Kitkungvan 2017 (not read).
How CFR and stress combine: each category is printed as a pair of ranges joined by 'and'. The papers state the severe category explicitly as pixels with BOTH CFR <= 1.27 AND stress <= 0.83 (J Nucl Med 2019; CENTURY 2025: 'CFC maps with any pixels having both CFR <= 1.27 and stress perfusion <= 0.83 mL/min/g are defined as severely reduced').
EHJ 2024 says percent of LV is computed 'for each range of combined both CFR and stress' values. This matches the nested-rectangle geometry drawn in the 2012 map (a pixel needs both values in or below a range to be classed that severe; otherwise it takes the less severe class).
The papers do not print the rule for pixels whose CFR and stress fall in different ranges. Apply the nested-rectangle rule as in 2012, and note it as an inference for the revised set.
Myocardial steal is defined only as CFR < 1.0 (Circ Res 2018: 'stress perfusion falling below rest perfusion'); whether a stress-flow bound also applies is not printed.
EHJ 2024 relabels red as 'Excellent' and orange as 'Adequate'. Circ Res 2018 calls orange 'typical or minimally reduced'. CENTURY 2025 calls them normal and minimally reduced.
Severe CFC in the J Nucl Med 2019 cohort (3,774 scans): see gould2019_artery_specific_cfc.toml."""
use_in_model = """Classify each simulated LV voxel with category_thresholds_revised (nested-rectangle rule; steal = CFR < 1), using model hyperemic flow and CFR. A healthy model heart at rest-and-adenosine-like hyperemia should be red: the normal range is defined from 125 healthy young volunteers < 40 y with no risk factors.
Use either this set or the 2012 set consistently. Thresholds are Rb-82 / dipyridamole specific (O-15 water: dewinter2022_o15_water_cfc.toml)."""

