[meta]
id = "madsen2023_pulmonary_capillary_blood_volume"
data_type = "experimental"
validates = "Resting pulmonary capillary blood volume (Vc, mL) by single-breath DLNO/DLCO in healthy young adults, upright seated vs supine (same subjects), plus seated values in a second group; between-day repeatability"
species = "human"
preparation = "20 healthy, physically active non-smokers (10 men, 10 women; age 24.8 +/- 1.5 y; height 175 +/- 8 cm; DLCOc 92.7 +/- 9.8% predicted). Randomized to Group A (n = 11: seated rest then cycling) or Group B (n = 9: seated rest then 15 min supine rest). Combined single-breath DLCO/DLNO, Jaeger MasterScreen PFT pro, 5 s breath hold, 0.28% CO, 9.3% He, 20.9% O2, NO from 800 ppm stock mixed just before inhalation; duplicate acceptable manoeuvres. Hb-corrected DLCO. Repeated on two days within 1-7 d."
conditions = "Resting, upright seated (all) and resting supine after 15 min (Group B). Normoxia."
verification = "FT"
access = "Europe PMC fullTextXML of PMC10103891 (original, Exp Physiol, open access) and PMC11607620 (published Correction, Exp Physiol 2024, CC BY 4.0), both read 2026-10-16. All Dm and Vc numbers below are from the CORRECTED Table 2 in the correction notice."
notes = """IMPORTANT: the original article's Vc and Dm values are wrong. The correction (doi 10.1113/EP092280) states the Jaeger device reported Dm as DLNO/1.97 rather than the standard Zavorsky 2017 / Munkholm 2018 equations; Tables 2-3 were reissued. Original seated Vc 76.5/77.6 (A) and 71.6/69.1 (B), supine 94.2/91.6 mL are superseded; do not use them.
Corrected method (per correction): Dm = (1/alpha - 1/k)/(1/DLNO - 1/(k DLCO)), Vc = (1/thetaCO)(1 - alpha/k)/(1/DLCO - alpha/DLNO), alpha = 1.97, thetaNO finite 4.5 mL/(mL blood min mmHg), thetaCO per Munkholm 2018.
Values are per day; Day 1 and Day 2 did not differ (Holm-adjusted P = 1.000).
Derived here (not printed): pooled seated Day-1 Vc over both groups (n = 20) = (11 x 67.8 + 9 x 68.1)/20 = 67.9 mL. Supine minus seated in Group B ~ +20 mL (+29%) on both days.
DLNO/DLCO-derived Vc depends on the thetaCO/thetaNO assumptions; Vc by Roughton-Forster multiple-FIO2 in similar healthy young adults seated is ~76-89 mL (bouwsema2017_capillary_blood_volume_exercise). D'Souza 2026 (ERJ Open Res, doi 10.1183/23120541.00889-2025) found no fixed bias between the two Vc methods but gives values only in figures.
Units: DLNO, DLCOc, Dm in mmol/(min kPa); multiply by 2.986 for mL/(min mmHg)."""
use_in_model = """Target for the summed capillary-sheet blood volume of a resting adult lung: ~68 mL seated (SD ~13) rising to ~85-88 mL supine (SD ~18-22). Use the supine value when the phantom represents a supine CT/MRI subject. Vc / total PBV ~ 0.15-0.2 against kanski2013_total_pulmonary_blood_volume (~470 mL). With resting CO ~6 L/min, Vc/Q gives a capillary mean transit of ~0.7-0.9 s."""

