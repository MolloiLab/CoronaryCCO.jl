[meta]
id = "schoenhagen2000_remodeling_stable_unstable"
data_type = "experimental"
validates = "Remodelling ratio (lesion EEM area / proximal reference EEM area) at culprit coronary lesions by IVUS, in stable vs unstable syndromes. Gives the spread of outward and inward remodelling at lesions treated by intervention."
species = "human"
preparation = "Cleveland Clinic. 85 patients with unstable and 46 with stable coronary syndromes, IVUS before coronary intervention."
conditions = "Lesion site and a proximal reference site analyzed. RR = EEM area at lesion / EEM area at proximal reference. Positive remodelling RR > 1.05, negative RR < 0.95."
verification = "abs"
access = "PubMed abstract (PMID 10673250, NCBI efetch, read 2026-10-16). Circulation full text returned HTTP 403."
notes = """The abstract prints the RR SD as 0.2 for both groups ('1.06+/-0.2 versus 0.94+/-0.2').
These are lesions selected for intervention, so most are severe. The abstract gives no lumen area or angiographic % stenosis.
Plaque area here is EEM minus lumen (plaque plus media), the usual IVUS convention."""
use_in_model = """Range check for the remodelling ratio of a synthetic lesion: RR near 1.06 +/- 0.2 for an unstable-type (positively remodelled) plaque and 0.94 +/- 0.2 for a stable-type plaque. Positive remodelling was seen in 51.8% of unstable and 19.6% of stable lesions."""

[source]
authors = ["Schoenhagen P", "Ziada KM", "Kapadia SR", "Crowe TD", "Nissen SE", "Tuzcu EM"]
year = 2000
title = "Extent and direction of arterial remodeling in stable versus unstable coronary syndromes: an intravascular ultrasound study"
journal = "Circulation"
volume = "101"
issue = "6"
pages = "598-603"
doi = "10.1161/01.CIR.101.6.598"
crossref_verified = "2026-10-16; Crossref title match on main title ('Extent and Direction of Arterial Remodeling in Stable Versus Unstable Coronary Syndromes'; Crossref omits the subtitle; vol 101, issue 6, 598-603; first author Schoenhagen)"
pmid = "10673250"

[data.remodeling_by_presentation]
description = "IVUS plaque area, EEM area and remodelling ratio at the target lesion"
location = "Abstract"
provenance = "abs"
statistic = "mean +/- SD; n = patients (one target lesion each, as implied by the abstract)"
group = ["unstable", "stable"]
n_patients = [85.0, 46.0]
plaque_area_mm2 = [13.9, 11.1]
plaque_area_sd_mm2 = [5.5, 4.8]
eem_area_mm2 = [16.1, 13.0]
eem_area_sd_mm2 = [6.2, 4.8]
remodeling_ratio = [1.06, 0.94]
remodeling_ratio_sd = [0.2, 0.2]
positive_remodeling_percent = [51.8, 19.6]
negative_remodeling_percent = [31.8, 56.5]
p_values = "plaque area P = 0.005; EEM area P = 0.004; RR P = 0.008; remodelling category P = 0.001"
missing_note = "Lumen area, reference EEM area, plaque burden and angiographic stenosis are in the full text, which was not read."
