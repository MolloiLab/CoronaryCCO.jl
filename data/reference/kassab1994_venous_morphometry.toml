# Kassab GS, Lin DH, Fung YC (1994). Morphometry of pig coronary venous system.
# Every number below was transcribed from the publisher PDF (local copy). First pass with pdftotext;
# every table (Tables 1-9) and every quoted text/legend number was then confirmed on 300-400 dpi page
# renders. Tables 4, 5 and 8 are printed rotated and are not in the OCR layer; they were read from the
# renders only. Parsed arrays for Tables 1, 2, 3, 6, 7 and 9 were cross-checked against the OCR text by
# script. Units are in the key suffix. Order numbers are negative for veins (-1 = smallest venules).

[meta]
id = "kassab1994_venous_morphometry"
data_type = "experimental"
validates = "Mirrored venous tree of the CCO model: per-order venous segment and element major axis, major-to-minor axis ratio, length, S/E, connectivity matrices, total element counts, Horton fits and blood volume, for the sinusal (coronary sinus) and thebesian venous systems of the pig heart, orders -1 to -12 (diameter-defined Strahler on the major axis). Also epicardial venous arcades and anastomoses."
species = "pig"
preparation = "Five farm pigs (Yorkshire x Duroc), 29-31 kg (30.1 +/- 0.7 kg), 3-4 months. Same isolated-heart preparation as Kassab 1993: KCl-arrested, adenosine-dilated heart perfused with freshly catalysed silicone elastomer through the RCA, LAD and LCX; arterial perfusion pressure held at 80 mmHg and venous outlet at zero (atmospheric) until the elastomer hardened. Orders -1 to about -4: optical sectioning of 60-80 um histological sections from 12 transmural plugs (about 4 x 4 mm) per ventricle in four pigs. Order -4 and up: KOH-corroded venous casts (arteries pruned away) measured under a stereo dissecting microscope. Minor axis measured on a sample of segments per order only."
conditions = "Diastolic arrest (KCl), maximal vasodilation (adenosine), cast with arterial inlet 80 mmHg and venous outlet 0 mmHg. Venous diameters are MAJOR AXES of the cast lumen (widest width as the cast is rotated); the paper orders veins by major axis. RV and LV venule data (excluding epicardial venules) were pooled because they did not differ."
verification = "FT"
access = "Publisher PDF (journals.physiology.org, UC Irvine institutional download), local copy in the lab's validation-papers folder; tables read from rendered page images."
notes = """
Two drainage systems: sinusal veins (to the coronary sinus and anterior cardiac veins; 12 orders) and thebesian veins (smallest cardiac veins draining into the heart chambers; 10 orders). Orders -1, -2 and -3 come from histology, where sinusal and thebesian vessels cannot be told apart, so the paper assumes they are identical and prints the same numbers for orders -1 to -3 in both systems (Tables 1-5).
Segment = vessel between two successive bifurcation nodes. Element = segments of the same order connected in series. S/E = segments per element.
Statistics: major axis and length are mean +/- SD. The major-to-minor axis ratio is printed as mean +/- SD in the Table 1 footnote but mean +/- SE in the Table 2 footnote, although the values for orders -1 to -10 are the same in both tables (except -5: 0.05 in Table 1, 0.052 in Table 2). Connectivity matrices (Tables 4, 5) are mean +/- SE. Total element counts (Table 6) are mean +/- propagated error.
Odd entries kept as printed: Table 2 order -8 elements have n = 54 for diameter but n = 62 for length. Table 1 order -11 has n = 16 for diameter and n = 14 for length.
Horton fits: the paper's text ratios do not all equal 10^b from its own figure legends. Major axis: text 1.69 (sinusal) and 1.65 (thebesian), but 10^0.236 = 1.72 and 10^0.237 = 1.73. Length, orders -4 and above: text 1.77 and 1.61, but 10^0.271 = 1.87 and 10^0.236 = 1.72. Length, orders -1 to -3: text 1.18, 10^0.085 = 1.22. Branching ratio: text 3.37 and 3.05 = 10^0.528 and 10^0.485 (consistent). Both forms are stored.
The fit constants reproduce Table 1 when n is the absolute order number and D, L are in um (e.g. sinusal n = 1: 10^(0.803 + 0.236) = 10.9 um vs 10.6 um measured; 10^(1.80 + 0.085) = 77 um vs 79 um).
Transcription check of the rotated Tables 4-5 against Table 6: sum over n of C(m,n) N_n reproduces the sinusal element counts N_m within 9% for every order (within 2% for orders -1 to -7). For the thebesian system the agreement is within 4% for orders -3 to -8 but 14-16% for orders -1 and -2 (whose matrix columns are shared with the sinusal system) and poor for the top orders, which have no parent.
Secondary sources compared with this original (an earlier version of this file used them): Wang et al. 2024 (Comput Methods Programs Biomed 243:107908, Table A1) reproduce the sinusal element major axes and lengths of Table 1 exactly (lengths converted to um). Kaimovitz, Lanir, Kassab 2010 (Am J Physiol 299:H1064) quote a major-axis Horton ratio of 1.72; the paper's text says 1.69, and 1.72 is 10^b of the Fig. 4 fit. Kaimovitz's other quotes (length ratios 1.77 and 1.18, branching ratio 3.37, branching-type percentages, 2.56 +/- 0.073 capillaries per order -1 venule, 4.9 ml/100 g venous volume) match the original; the 4.9 ml figure is per 100 g LV and includes sinusal and thebesian trees, arcades and anastomoses.
Not tabulated (figures only, not digitised): per-order total cross-sectional area (Fig. 9) and per-order blood volume (Fig. 10); the major-to-minor ratio polynomial fit (Fig. 5); the S/E polynomial fit (Fig. 7). They can be recomputed from Tables 1, 3, 6 with Eqs. 9-10 (A_n = (pi/4) D_n^2 N_n / (major/minor ratio), V_n = L_n A_n).
"""
use_in_model = "Order the mirrored venous tree with the diameter-defined Strahler rule (Eqs. 1a, 1b, applied to the major axis). Compare per-order element mean diameter and length with sinusal_elements (most coronary venous return goes to the coronary sinus). If the model uses circular lumens, compare the model diameter with the equivalent-circle diameter D_major * (minor/major)^0.5 = D_major / sqrt(major_to_minor_ratio), or compare the model's cross-sectional area. Compare S/E, the connectivity matrix columns and total element counts per order. The CCO venous terminals (order -1 ~ 10.6 um) drain 2.56 capillaries each on average (sinusal_connectivity row 0, column -1)."

