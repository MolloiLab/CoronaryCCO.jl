[meta]
id = "nitenberg2007_postocclusion_vs_adenosine"
data_type = "experimental"
validates = "Same-patient comparison of reactive (post-occlusion) hyperemia after a 30-s balloon occlusion vs an IC adenosine bolus (60 ug): coronary flow reserve and coronary resistance reserve, before and after angioplasty of a severe stenosis."
species = "human"
preparation = "10 male patients with stable CAD and stenosis >= 80% scheduled for PTCA. Intracoronary Doppler wire for velocity; aortic pressure from the guide."
conditions = "IC adenosine 60 ug bolus; 30-s balloon occlusion (~3 atm). Both stimuli before and after PTCA. CFR = peak/resting velocity; CRR = (resting Pa / resting velocity) / (Pa at peak / peak velocity)."
verification = "abs"
access = "PubMed abstract (PMID 17827509) plus the journal's HTML article page (hmpgloballearningnetwork.com) read through a summarizing fetch; Table 2 (absolute velocities and resistances) was not captured."
notes = """Values mean +/- SD.
The article text reports that after PTCA adenosine underestimated CFR by 23 +/- 10% and CRR by 24 +/- 10% relative to post-occlusion hyperemia, and that the gap grew with reserve.
60 ug IC is below the dose at which Adjedj 2015 (JACC Cardiovasc Interv 8:1422, doi 10.1016/j.jcin.2015.04.028) found the left-coronary plateau (160 ug; 100 ug RCA). So part of the shortfall may be dose, not a ceiling of adenosine itself.
Post-occlusion hyperemia also includes ischaemic metabolites and possibly a myogenic response to the low distal pressure during occlusion. No journal DOI is registered (Crossref bibliographic search returned no match)."""
use_in_model = """After PTCA (open artery), ratio of published means adenosine/occlusion = 2.53/3.31 = 0.76 for CFR and 2.58/3.46 = 0.75 for CRR. This is the largest human shortfall of an adenosine stimulus vs another stimulus in this set, but it uses a low IC dose. Treat ~0.75 as a lower bound for clinical adenosine conductance relative to a stronger stimulus, not as the IV 140 ug/kg/min value."""

