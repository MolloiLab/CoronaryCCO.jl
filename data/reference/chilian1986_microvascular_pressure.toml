[meta]
id = "chilian1986_microvascular_pressure"
data_type = "experimental"
validates = "Pulsatile and mean subepicardial microvascular pressure vs vessel size class (arterioles ~100-325 um, venules ~110-225 um) in the beating LV, with tone intact and during papaverine vasodilation; percent of total coronary resistance upstream of each class"
species = "cat"
preparation = "Anesthetized open-chest cats: ketamine 2 mg/kg i.m. then pentobarbital sodium 30 mg/kg i.m. (supplemented as required), midsternal split. High-frequency jet ventilation triggered from LV pressure to abolish respiratory motion; LV free wall partially restrained by 3-4 needles through the anterior interventricular groove (measurements >= 0.5 cm from pins). Subepicardial microvessels viewed by stroboscopic epi-illumination (Leitz Ploemopak, x60/x100), diameter by SIT video (resolution ~1.5-2.5 um); epicardium covered with mineral oil. Pressure by servo-null micropipette (2-5 um tip) carried by a computer-driven electromagnetic micromanipulator ('Wobbler') tracking the vessel through the cardiac cycle; each value the average of 10-15 beats over ~30 s. Subepicardial perfusion by 15 um radioactive microspheres."
conditions = "Control: coronary vasomotor tone intact (mean aortic pressure 76 +/- 4 mmHg). Vasodilation: papaverine 0.3 mg/kg/min i.v. (different preparations), mean aortic pressure held near control by donor-cat blood and/or a descending-aortic snare; peak/rest flow-velocity ratio after 15-20 s occlusion fell from 4.5 to 1.2 (near-maximal dilation). Beating heart; all vessels subepicardial LV."
verification = "FT"
access = "Original publisher PDF supplied locally by the project lead (validation-papers/), read with pdftotext and confirmed against 200 dpi page renders"
notes = """All values mean +/- SE. Vessel classes are the authors' (large/medium/small arterioles, small/medium venules); the class mean diameter +/- SE
is given in each table column header, and differs slightly between control and papaverine columns (vessels dilated).
Each class was compared with the aortic pressure measured simultaneously in the same preparations, so the aortic pressure differs by column.
Relative resistance definition (paper): mean microvascular pressure as % of mean aortic pressure = % of total resistance DOWNSTREAM of the
site; 100 minus that = % upstream. Table 6 omits the small-arteriole class; its % can be computed from Table 4 (44/78 = 56 %).
The abstract quotes myocardial perfusion 139 +/- 9 (control) and 339 +/- 52 (papaverine) ml/min/100 g, whereas Table 3 gives 132 +/- 8 (n = 10)
and 339 +/- 60 (n = 7); Table 3 values are recorded. Results text: 'About 20-25% of total coronary resistance was proximal to arterioles
180-220 um'; arterioles 70-130 um had 50-55% of aortic pressure (45-50% of resistance upstream). With papaverine, large and medium arterioles
accounted for only 6 and 10% of total resistance. No venous outflow (coronary sinus) pressure reported apart from right atrial pressure."""
use_in_model = """Beating-heart, resting-tone and dilated reference for the subepicardial arterial pressure profile. Compare model mean pressure (or % of
inlet pressure) in subepicardial arteries/arterioles of ~300, ~190 and ~100 um and in venules of ~110 and ~190-225 um against pressure_control /
pct_aortic. Note the model's tone state: resting data imply ~45-50% of resistance upstream of 100 um arterioles; a passive (fully dilated)
Poiseuille tree should look more like the papaverine column. Small-heart species (cat): compare by diameter class, not by Strahler order."""

