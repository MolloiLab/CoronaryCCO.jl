[meta]
id = "kovacs2009_normal_pulmonary_pressure"
data_type = "experimental (review summary)"
validates = "Normal mean pulmonary arterial pressure at rest (by posture and age) and during mild exercise (by age) from pooled right-heart-catheter data in healthy subjects."
species = "human"
preparation = "Systematic review: 1,187 healthy individuals from 47 right-heart-catheter studies in 13 countries; stratified by sex, age, origin, posture and exercise level."
conditions = "Rest supine or upright; mild exercise."
verification = "abs"
access = "Abstract only (Europe PMC record, PMID 19324955). The publisher PDF is behind a bot check and no archived copy was found."
notes = """Ppa at rest independent of sex and ethnicity; rarely exceeds 20 mmHg. Exercise Ppa depends on level and age and often exceeds 30 mmHg in subjects >= 50 y.
Full-text tables (PAWP, cardiac output, per-level exercise values) were not read."""
use_in_model = """Inlet pressure anchor: resting mean Ppa 14.0 +/- 3.3 mmHg (upper normal ~20 mmHg). Mild-exercise Ppa 19.4 +/- 4.8 mmHg (< 50 y) bounds the rise in inlet pressure for a ~2x flow increase."""

[source]
authors = ["Kovacs G", "Berghold A", "Scheidl S", "Olschewski H"]
year = 2009
title = "Pulmonary arterial pressure during rest and exercise in healthy subjects: a systematic review"
journal = "Eur Respir J"
volume = "34"
issue = "4"
pages = "888-894"
doi = "10.1183/09031936.00145608"
crossref_verified = "2026-10-15; Crossref title exact match (vol 34, issue 4, 888-894; authors Kovacs, Berghold, Scheidl, Olschewski)"
pmid = "19324955"

[data.mpap_rest_exercise]
description = "Mean pulmonary arterial pressure in healthy subjects"
location = "Abstract"
provenance = "abs"
statistic = "mean +/- SD"
group = ["rest all", "rest supine", "rest upright", "rest age < 30 y", "rest age 30-50 y", "rest age >= 50 y", "mild exercise age < 50 y", "mild exercise age >= 50 y"]
mpap_mean_mmHg = [14.0, 14.0, 13.6, 12.8, 12.9, 14.7, 19.4, 29.4]
mpap_sd_mmHg = [3.3, 3.3, 3.1, 3.1, 3.0, 4.0, 4.8, 8.4]
n_total = 1187
missing_note = "Group sizes per stratum are not in the abstract."
