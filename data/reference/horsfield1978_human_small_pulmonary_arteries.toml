[meta]
id = "horsfield1978_human_small_pulmonary_arteries"
data_type = "experimental"
validates = "Human pulmonary arterial tree below 300 um (resin cast and ink-gelatin injection), the revised 17-order whole-tree table with 73 million order-1 (10-15 um) branches, and which orders accompany the respiratory bronchioles, i.e. enter the acinus."
species = "human"
preparation = "Resin cast of both lungs of a 56-yr-old man (sudden death, myocardial infarction, no respiratory disease), airways inflated with saline at 25 cmH2O, resin at 35 cm (density ~1.1); samples of 100-300 um arteries broken off the cast (Table 1). Second lung: ink (400 mL) + gelatin injection, 48 sections 120 um thick, 52 arteries studied."
conditions = "Postmortem, near TLC. Classical Strahler ordering. Order 1 = first branch of >= 30 um (cast) or 10-15 um (ink) on a path from the capillaries."
verification = "FT"
access = "Publisher PDF (circres.ahajournals.org/content/circresaha/42/5/593.full.pdf) from the Wayback Machine capture 20170819094455; text by pdftotext; Table 6 read from a 200 dpi page render (page 596)."
notes = """Pump (1966) arteries accompanying respiratory bronchioles, as summarised here: 'Pump gives the diameters of arteries running with the respiratory bronchioles as 200-300 um with RB1, 160 um with RB2, and 119 um with RB3, which correspond with orders 6 and 7.' 'Arterioles' of 30 um (order 3) give precapillaries of 10.5 um diameter and 21.5 um length (order 1 or their branches). These Pump values are secondary citations (SC) inside this paper.
So the artery entering a human acinus (with RB1 = transitional bronchiole) is ~200-300 um, order ~7 of 17 (Table 6 order 7 = 0.224 mm), leaving ~6-7 Strahler orders inside the acinus.
Capillary origin: precapillaries arise at right angles from ~30 um branches (mostly ~20 um long, some >= 100 um); arteries of 10-30 um may end abruptly in capillary loops or divide 1-4 times into the network; capillaries also arise directly from arteries of >= 100 um, which 'are supplying the alveoli on first and second order respiratory bronchioles'.
'The number of precapillary vessels is unknown but it often is possible to see several supplying the capillary net of one alveolar wall. It seems probable that they are considerably greater in number than the alveoli.'
Table 6 misprints: order 14 printed '2.000 x 10^6' and order 13 '6.600 x 10^6' (should be 20 and 66, as in Singhal 1973 and the branching ratio ~3); order 5 diameter printed '0.86' (0.086 mm in Singhal 1973). Stored corrected in the arrays below and flagged here.
Total arterial cast volume 154 mL (173 g / density 9/8), pulmonary trunk excluded.
Branching ratios (Table 5): proximal zone 2.9943, intermediate 3.0958, distal cast 3.1537, distal ink 3.5953 (y = log10 N vs order).
Derived (not stated): order 8 has 18,770 branches (0.351 mm) and order 7 has 58,090 (0.224 mm) for the whole lung; ~30,000 acini fall between these two counts."""
use_in_model = """Acinar inlet artery ~0.2-0.3 mm (Strahler order 7 of 17, 0.224 mm in Table 6), consistent with ~30,000 acini lying between the order-8 (18,770) and order-7 (58,090) counts. Below the acinar inlet ~6-7 orders remain down to 73 million order-1 arteries of 13 um (whole lung). Capillary beds are fed along the whole intra-acinar path (from >= 100 um arteries down), which supports a ladder-type lumped bed per acinar terminal."""

