[meta]
id = "kaufmann1999_o15_water_reproducibility"
data_type = "experimental"
validates = "Human global and regional LV myocardial blood flow by [15O]H2O PET at rest and during IV adenosine (two repeats within 1 h) in healthy men; coronary vasodilator reserve; whole-bed coronary resistance = MAP / MBF (mmHg.min.g/mL) at rest and hyperemia."
species = "human"
preparation = "21 healthy volunteer men, 45 +/- 8 y, no history of cardiovascular disease or smoking; normal heart rate, blood pressure, resting ECG and echocardiography; low clinical probability of CAD; cholesterol < 6.4 mmol/L; 24-h caffeine abstinence confirmed by blood test. ECAT 931-08/12 PET; 15O-water 700-900 MBq IV over 20 s; factor-analysis images for ROI definition; four regions (septal, anterior, lateral, inferior) on 12 planes; single-tissue-compartment model."
conditions = "Baseline 1, adenosine 1 (140 ug/kg/min IV for 7 min, scan from 2 min), baseline 2, adenosine 2, within one session. Cuff blood pressure every minute. MBFcorr = MBF / RPP x 1e4. Coronary resistance = MAP / MBF."
verification = "FT"
access = "Publisher PDF from jnm.snmjournals.org (J Nucl Med 40:1848-1856); text via pdftotext; Tables 1-2 read from a 100 dpi page render (the text layer of the tables is scrambled)."
notes = """All values mean +/- SD.
Baseline-1 global MBF is 0.89 +/- 0.15 in Table 2 and the Results, 0.89 +/- 0.14 in the abstract. Global CVR 4.05 +/- 0.75 / 3.93 +/- 0.72 (abstract) vs 3.96 +/- 0.75 / 3.97 +/- 0.71 (Discussion); stored from the abstract.
Hyperemic resistance: Results print 25 +/- 4 vs 23 +/- 4, Discussion prints 24 +/- 4 vs 23 +/- 4 mmHg/(mL/min/g); both kept in notes, Results values stored.
MAP is cuff brachial pressure, and the resistance uses no back-pressure term, so it is a whole-bed aorta-to-zero resistance.
Repeatability coefficient for hyperemic MBF 0.90 mL/min/g (25% of mean) in Table 2 and Results; 0.94 in the abstract."""
use_in_model = """Healthy-adult PET hyperemic flow target 3.51 +/- 0.45 and 3.83 +/- 0.49 mL/min/g at MAP 86-89 mmHg, and the matching whole-bed resistance MAP/MBF ~23-25 +/- 4 mmHg.min.g/mL. For the model compute inlet pressure / (flow per gram) without subtracting back pressure. PET mass is per gram of perfusable tissue, which differs from CT territory mass (see fournier2021)."""

