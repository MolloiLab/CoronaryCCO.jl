[meta]
id = "bartolo2026_multiscale_pulmonary_sheet"
data_type = "model"
validates = "Secondary report of the maximum human sheet height from Sobin et al. 1979 (the human abstract behind h0 3.5 um and alpha 0.127 um/cmH2O), plus a model parameter table for sheet flow."
species = "human (model); maximum sheet height attributed to Sobin et al. 1979 human postmortem lungs"
preparation = "1D multiscale pulmonary hemodynamics model (arteries to veins with sheet-flow capillaries); arXiv preprint."
conditions = "Model; sensitivity ranges for h0, alpha_c, friction factor, sheet length."
verification = "secondary"
access = "arXiv:2607.19269v1 PDF (open). Discussion text on h0 and parameter table read."
notes = """Text: 'While Sobin et al. (1979) reported a maximum sheet height of 7.7 um, we intentionally extended our upper bound to 20 um.' Reference list gives Sobin SS, Fung YC, Tremer HM, Lindal RG (1979) 'Distensibility of human pulmonary capillary blood-vessels in the interalveolar septa', Microvasc Res 17(3):S87 (Huang 2011 cites the same work as Fed Proc 38:990). Not read in the primary.
Derived (not stated by any source): with human h0 = 3.5 um and alpha = 0.127 um/cmH2O, h = 7.7 um is reached at P_tm = (7.7 - 3.5)/0.127 = 33 cmH2O. This is consistent with the 'up to 32 cmH2O' human value (Clark 2010 text; Clark 2011 and Burrowes 2011 use 32), not with 15 cmH2O (which would give h_max = 5.4 um)."""
use_in_model = """If capping the human sheet: h_max ~ 7.7 um (Sobin 1979, secondary) corresponds to P_CU ~ 32-33 cmH2O with Huang 2011 constants."""

