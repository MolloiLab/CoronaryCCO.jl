[meta]
id = "komiyama2016_eccentric_plaque_orientation_vh"
data_type = "experimental"
validates = "Orientation (myocardial, lateral, epicardial) and VH-IVUS tissue composition of eccentric plaques in non-branching coronary segments. Sets the myocardial-side bias of a synthetic plaque and its fibrous / fibro-fatty / necrotic core / calcium area mix."
species = "human"
preparation = "Nippon Medical School. 30 consecutive patients with stable angina before elective PCI; 30 vessels (11 LAD, 8 LCx, 11 RCA); 1441 IVUS cross sections (497 LAD, 325 LCx, 619 RCA)."
conditions = "20 MHz phased-array IVUS (Volcano EagleEye), 0.5 mm/s pullback, intracoronary nitroglycerin. Cross sections within twice the vessel diameter of a side branch excluded. Cross sections with calcium arc >= 90 deg excluded. Eccentric = eccentricity index (max / min plaque thickness) >= 3, or a disease-free arc. Orientation from perivascular landmarks into myocardial, epicardial and two lateral quadrants. VH-IVUS tissue maps by pcVH 2.1."
verification = "FT"
access = "Open access (BMC, CC BY 4.0; PMC5120430); NCBI efetch db=pmc XML, read 2026-10-16."
notes = """All values are mean +/- SEM (Methods, statistics).
Two sets of per-patient orientation percentages are printed. Results text: myocardial 50.2 +/- 7.0%, epicardial 25.6 +/- 5.4%, lateral 14.2 +/- 4.4%. Abstract and Fig. 2 legend: myocardial 46.7 +/- 7.5%, lateral 20.8 +/- 5.0%, epicardial 12.5 +/- 4.2%. They disagree. Both are stored as printed. The cross-section counts (401 / 237 / 80) agree better with the abstract ordering (lateral > epicardial).
Concentric 723 (50.2%) and eccentric 718 (49.9% in the abstract, 49.8% in the Results).
A 'normal' wall was intimal thickening < 0.2 mm."""
use_in_model = """Eccentric plaque away from branches: orient it to the myocardial side most often (401 of 718 eccentric sections), then laterally (237 of 718), and least often epicardially (80 of 718). Use an eccentricity index (max / min thickness) of at least 3 for an eccentric plaque. VH area mix for a fibrous-dominant plaque: fibrous 55-61%, fibro-fatty 10-14%, necrotic core 15-18%, dense calcium 10-13%."""

[source]
authors = ["Komiyama H", "Takano H", "Nakamura S", "Takano M", "Hata N", "Miyauchi Y", "Seino Y", "Mizuno K", "Shimizu W"]
year = 2016
title = "Geographical predisposition influences on the distribution and tissue characterisation of eccentric coronary plaques in non-branching coronary arteries: cross-sectional study of coronary plaques analysed by intravascular ultrasound"
journal = "Cardiovasc Ultrasound"
volume = "14"
issue = "1"
pages = "47"
doi = "10.1186/s12947-016-0090-3"
crossref_verified = "2026-10-16; Crossref title exact match (vol 14, article 47; first author Komiyama). Crossref lists the 6th author as family 'Yasushi', given 'Miyauchi'; the PMC record gives 'Yasushi Miyauchi' with the same swap. Stored as Miyauchi Y."
pmid = "27876049"
pmcid = "PMC5120430"

