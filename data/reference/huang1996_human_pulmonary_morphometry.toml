# Huang W, Yen RT, McLaurine M, Bledsoe G (1996). Morphometry of the human pulmonary vasculature.
# Every number below was transcribed from Tables 1-8 of the publisher PDF and checked against a
# 200 dpi rendering of each table page. Units are in the key suffix.

[meta]
id = "huang1996_human_pulmonary_morphometry"
data_type = "experimental"
validates = "Per-order element and segment diameter, length, S/E, connectivity matrices, corrected total element counts and per-order blood volume of the human pulmonary arterial tree (left lung) and venous tree (right lung), diameter-defined Strahler orders 1-15 (arteries +1..+15, veins -1..-15)."
species = "human"
preparation = "Two postmortem lungs, accidental deaths not involving the lung (Table 1). Arterial cast: left lung, 44-yr-old man, 95 kg, 185 cm, 18 h postmortem, antegrade perfusion. Venous cast: right lung, 24-yr-old man, 128 kg, 180 cm, 6 h postmortem, retrograde perfusion. Silicone elastomer (Microfil CP-101, Sobin method) perfused at 34 cmH2O inlet to 0 cmH2O outlet for 20 min with airway pressure 10 cmH2O and pleural pressure atmospheric, then held at 3 cmH2O. Capillaries collapse (venous minus alveolar pressure -7 cmH2O), separating the arterial and venous trees. Tissue dissolved in 10% KOH; casts measured under a stereomicroscope with image analysis (diameter = area / length between normals, at segment midpoint)."
conditions = "Postmortem cast, lung inflated (alveolar pressure 10 cmH2O), zone-1-like capillary collapse. Diameters are cast lumen widths."
verification = "FT"
access = "Publisher PDF (jap.physiology.org/content/jap/81/5/2123.full.pdf) retrieved from the Wayback Machine capture 20170820075218; text by pdftotext; Tables 2-8 read from 200 dpi page renders."
notes = """CITATION CORRECTION: the request cited 'J Appl Physiol 80:1773'. Crossref and the PDF give J Appl Physiol 81(5):2123-2133, 1996.
Orders: diameter-defined Strahler system (Jiang et al. 1994 rule). Order 0 = capillary sheet. Arterial orders printed +1..+15, venous orders -1..-15; stored here as positive integers with separate arterial and venous tables.
One lung per tree (n = 1 subject each). Arteries and veins come from DIFFERENT people and different lungs.
Element = segments of one order in series; S/E = segments per element (Table 6). Diameter and length SDs are SD across vessels; connectivity entries are mean +/- SE.
Text regressions (log10 vs order): arterial diameter y = -1.84 + 0.19x, venous y = -1.74 + 0.20x (diameter ratio 1.56 arteries, 1.58 veins); arterial length y = -0.95 + 0.17x, venous y = -0.79 + 0.18x (length ratio 1.49, 1.50); corrected number y = 8.40 - 0.53x arteries, 7.66 - 0.52x veins (branching ratio 3.36, 3.33).
Fractal dimensions (Eq. 12, Nelson-Manchester): element diameter 2.71 arteries, 2.64 veins; element length 2.97 arteries, 2.86 veins.
Total blood volume (Eq. 11): 150.06 mL arteries (left lung), 86.59 mL veins (right lung). These exclude capillaries.
Table 3 connectivity: diagonal entry for order 15 (C(15,15) = 0.50) and C(14,14) = 0 are printed as such. Blank lower-triangle cells are stored as 0.0.
Table 8 cross-species summary (arteries / veins): cat 12 / 11 orders, order-1 diameter 21 / 22 um; dog 12 / 11 orders, 28 / 29 um; rat arteries 11 orders, 13 um, ratios 1.58 / 1.60 / 2.76 (Jiang 1994); whole human lung Strahler data (Singhal, Horsfield) 17 / 15 orders, 13 / 13 um."""
use_in_model = """Primary per-order target for a LUNG arterial and venous tree. Order the synthetic tree with the diameter-defined Strahler rule and compare element diameter, length and corrected total element count per order on log-linear plots. Order-1 arterioles are 20 +/- 3 um (Table 2) and the corrected count of order-1 arterial elements in ONE left lung is 51,205,812 (Table 5): this sets the terminal size and terminal count for growth (scale left-lung count by lung volume share for both lungs). Per-order volume (Table 7) checks the arterial and venous blood volume split. Compare connectivity columns for asymmetric branching."""

