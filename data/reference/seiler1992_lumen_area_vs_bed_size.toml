[meta]
id = "seiler1992_lumen_area_vs_bed_size"
data_type = "experimental"
validates = "Epicardial lumen cross-sectional area at each point of the human LCA and RCA trees vs summed distal branch length and distal myocardial mass (power laws); parent-to-daughter area ratio at bifurcations; total LV mass vs total left coronary tree length. No flow was measured."
species = "human"
preparation = "Clinical biplane cine coronary arteriograms (9-in mode) with 3-D reconstruction of the entire epicardial tree and automated QCA (CCD film digitizer). Group 1: 12 patients without CAD (normal arteriograms; no CAD by thallium exercise test or cardiac PET; one had an insignificant 35% obtuse-marginal narrowing). Group 2: 17 patients with CAD. LV mass from biplane ventriculograms (Rackley method). Regional mass M = M_tot x L / L_tot (Eq 13)."
conditions = "Clinical diagnostic arteriography. Vasodilator (nitroglycerin) use not identified in the pages read. Resting state."
verification = "FT"
access = "Publisher PDF read via Wayback Machine capture 20170828151016 of http://circ.ahajournals.org/content/circulationaha/85/6/1987.full.pdf; Tables 1, 3, 4, Table 2 and Fig 9 legend checked on rendered page images."
notes = """Fit form for Table 4: A = intercept + slope * X^exponent, A in cm2, X = regional myocardial mass M (g) or distal summed branch length L (cm).
Only group 1 (normal) is in the normal-tree datasets; group 2 (CAD) relations are given for reference in area_power_laws.
Table 3 LCA row order printed as L = 34.0, 48.0, 42.5, 47.5 ...: the '48.0' row is out of sequence (probably 38.0 in the original) but is recorded as printed.
The paper converts its area-mass relations to theoretical area-flow by assuming a resting myocardial perfusion of 0.8 cm3/min/g; that is an assumption, not data.
Observed parent-to-daughter mean lumen area ratio A0/mean(A_daughter) = 1.647 = 2^0.72 at 50 bifurcations in 12 normal LCA trees
(minimum energy loss theory 2^0.67 = 1.588, NS; constant-velocity theory 2^1 = 2, P = 0.005).
Average total epicardial tree length 75 cm and LV mass 250 g are the reference values used in the text (L = 2 cm ~ 7 g)."""
use_in_model = """Generate the CCO tree for a heart with given LV mass, compute for every epicardial segment the distal summed branch length L (cm) and distal
perfused mass M (g), and compare segment lumen area A (cm2) with lca_area_vs_length (binned means +/- SD, group 1) and with the group-1 power laws
in area_power_laws. Check that bifurcation area ratios approach 1.647 and that total left-tree length relates to LV mass as M_tot = 5 + 1.2 L_tot^1.2.
Only arteriographically visible segments (roughly > 1 mm diameter) are in the data; truncate the model tree comparably."""

