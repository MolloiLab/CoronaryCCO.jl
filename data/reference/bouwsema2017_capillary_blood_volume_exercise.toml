[meta]
id = "bouwsema2017_capillary_blood_volume_exercise"
data_type = "experimental"
validates = "Resting pulmonary capillary blood volume (Vc, Roughton-Forster multiple-FIO2 DLCO), DLCO, Dm, cardiac output and DLCO/Q from rest to 90% VO2peak in healthy young adults; mean pulmonary capillary transit time (Vc/Q) floor during exercise."
species = "human"
preparation = "16 women and 16 height-matched men, healthy, young (men 26 +/- 6.4 y, women 22 +/- 2.7 y), upright cycle ergometer. Multiple-FIO2 DLCO breath holds at rest and at 30, 50, 70% VO2peak, VT, VT+25 W and 90% VO2peak; cardiac output by non-invasive method (see paper)."
conditions = "Upright cycling, incremental steady stages."
verification = "FT"
access = "Open full text on PMC (PMC5401957), HTML; Tables 1 and 2 parsed from the HTML table cells."
notes = """Vc during exercise and the transit-time curves are in Figs. 2-5 only (means +/- SE), not tabulated; only the text statements are stored. Mean pulmonary transit time is defined as Vc/Q; it fell with exercise and did not drop below 0.3 s in either sex.
Women had 18% lower Vc and 22% lower Dm than men across workloads; differences disappear after normalising to alveolar volume. Vc did not plateau.
Haemoglobin 15.2 +/- 1.0 (men) and 12.8 +/- 0.6 g/dL (women)."""
use_in_model = """(d) Transit-time check: resting Vc ~76-89 mL with Q ~7.1-7.2 L/min gives a capillary mean transit Vc/Q of roughly 0.6-0.75 s (derived here, not printed); the model's capillary-sheet volume divided by flow should fall in this range at rest and stay above ~0.3 s near peak exercise (Q ~20 L/min). Also sets capillary-sheet blood volume (~80 mL at rest) for the lung."""

[source]
authors = ["Bouwsema MM", "Tedjasaputra V", "Stickland MK"]
year = 2017
title = "Are there sex differences in the capillary blood volume and diffusing capacity response to exercise?"
