[meta]
id = "lee2022_lung_dect_first_pass_pbv"
data_type = "experimental"
validates = "First-pass (CT pulmonary angiography timing) dual-energy CT lung perfused blood volume: lung parenchymal iodine density as a percentage of main pulmonary artery iodine density, per lobe and whole lung, with CT lung volume, mass and density, in patients without PE or cardiopulmonary disease"
species = "human"
preparation = "Retrospective single-center series (Sao Paulo, 2016-2019) of 151 in-hospital patients referred for DE-CTA for suspected PE, after excluding cardiopulmonary disease (emphysema, fibrosing ILD, pneumonia, lung malignancy, etc.), poor enhancement (< 200 HU in the pulmonary trunk) and unprocessable scans. Reference group = 103 PE-negative patients (age median 48 y, IQR 34.5-62.5; 72/103 = 69.9% female). GE Discovery CT750 HD rapid kVp switching (80/140 kVp), 630 mA, pitch 1.375, 0.5 s rotation, 64 x 0.625 mm. Iobitridol 300 mgI/mL (Xenetix 300), 1.0 mL/kg at 4.0 mL/s, then 50 mL saline at 5.0 mL/s. Bolus tracking in the pulmonary artery at the carina; caudo-cranial scan started 7 s after the ROI reached 100 HU. Iodine maps from GSI viewer (material decomposition); lobes segmented semi-automatically in 3D Slicer CIP, which also gave lobar volume, mass and density."
conditions = "First-pass pulmonary arterial phase. Supine (implied, CTPA). Breath-hold state NOT reported (CTPA is normally an inspiratory breath-hold, but no spirometric control). Contrast-enhanced, so CT mass includes iodinated blood."
verification = "FT"
access = "Europe PMC fullTextXML of PMC9192795 (Eur J Radiol Open, open access CC BY-NC-ND), read 2026-10-16; Table 2 read from the XML table markup."
notes = """Population is NOT healthy volunteers: hospitalized patients (oncologic, infectious, postoperative, trauma) with suspected PE but negative CTPA and no cardiopulmonary disease. Other comorbidities were not stratified.
PBV(%) = 100 x mean lobar iodine density (mg/mL) / iodine density in the pulmonary trunk ROI. Absolute iodine concentrations (mg/mL) and enhancement in HU are NOT reported, only the ratio. Lung large vessels were not explicitly removed before averaging (not stated).
All values are median (IQR), not mean +/- SD.
Right middle lobe PBV is lower than every other lobe (P < 0.001), attributed to its non-dependent (ventral) position in the supine patient. Lobar PBV correlated with lobar density (Spearman r = 0.57).
Total lung volume (median 3147 mL) is well below Cressoni 2013 full-inspiration volume (4995 mL), consistent with a less complete clinical breath-hold; lung density 0.28 g/mL corresponds to about -720 HU (derived: (0.28 - 1) x 1000).
Absolute first-pass mg/mL can be estimated (derived here, not reported) only by multiplying PBV by a typical CTPA trunk iodine level, which this paper does not give."""
use_in_model = """Validation target for simulated first-pass lung enhancement: at the CTPA moment, whole-lung parenchymal iodine density should be ~15% (median 14.6%, IQR 10.5-18.1%) of the main-PA iodine density, with the RML lowest (~11%). This ratio is also an estimate of the lung's iodinated blood volume fraction at that instant (PA-blood-equivalent volume per unit lung volume). Use with the phantom's simulated PA iodine level to get mg/mL in the lung."""

