[meta]
id = "vasilescu2020_human_terminal_transitional_bronchiole_count"
data_type = "experimental"
validates = "Number of terminal bronchioles (TB) and transitional bronchioles (TrB, = number of acini by the first-respiratory-bronchiole definition) per single human lung, with lung volume, alveolar number and surface area, for setting the number of acinar terminals of a grown lung tree."
species = "human"
preparation = "13 nontransplantable single donor lungs (3 left, 10 right; 6 F, 7 M; age 57 +/- 16 y, range 25-77; no known respiratory disease; 5 ex-smokers). Air inflated to 30 cmH2O, held at 10 cmH2O and frozen in liquid nitrogen vapor; whole-lung CT for volume; 2-cm slices; systematic uniform random cores scanned by micro-CT; stereology (disector) for TB and TrB counts."
conditions = "Frozen at a transpulmonary pressure of 10 cmH2O (not TLC). Counts are per ONE lung (left or right), not per person."
verification = "FT"
access = "PMC author manuscript HTML (PMC7311688), read 2026-10-18: Abstract, Results text, Table 2 (comparison with historical data) and Table 3 (per-case data). The McMaster repository PDF showed a bot check and was not used."
notes = """Results text: 'There were, on average, 7,697 +/- 2,910 terminal bronchioles per lung and 14,956 +/- 6,664 transitional bronchioles per lung.'
Discussion: 'the respiratory zone of the lung is divided into acini, which start with the first generation of respiratory airways, termed the transitional bronchioles'. So TrB count = acinus count under the Haefeli-Bleuer & Weibel / Rodriguez definition; under the Kitaoka 1992 definition (acinus = everything distal to one TB) the count is the TB count, about half.
TrB/TB ratio per case is ~1.8-2.1 (Table 3), consistent with each TB dividing once into two TrB.
The paper compares with Haefeli-Bleuer & Weibel 1988, who 'estimated a total number of 15,000 transitional bronchioles per lung' (Table 2 gives 13,000-16,000, marked 'estimated based on average lung volume and acinar volume').
Large spread: TrB per lung 5,637-27,363 across 13 lungs. Lung volume here is 2,883 mL for ONE lung at 10 cmH2O.
Derived (not in the paper): parenchymal volume per TrB-acinus = 2,883 mL x 0.87 / 14,956 = 0.168 mL = 168 mm3; per TB = 326 mm3. Both lungs: ~2 x 14,956 = ~30,000 TrB-acini, matching the ~30,000-32,768 used by Clark 2010/2011 and Ebrahimi 2022."""
use_in_model = """Lung terminal count if one terminal = one acinus (TrB definition): ~15,000 per lung, ~30,000 for both lungs (SD ~45% between donors). If one terminal = one TB unit (Kitaoka definition): ~7,700 per lung by this study, but 17,427 (Verleden 2014) and 22,300 (McDonough 2011) by earlier micro-CT, so TB counts disagree ~3x between studies. At 4.8 L/min over ~30,000 acini the mean flow is ~160 uL/min (2.7 mm3/s) per acinus (derived)."""

