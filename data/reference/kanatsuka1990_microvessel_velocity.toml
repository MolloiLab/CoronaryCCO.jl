[meta]
id = "kanatsuka1990_microvessel_velocity"
data_type = "experimental"
validates = "Red-cell velocity vs driving (aortic) pressure in a subepicardial arteriole, venule and capillaries during long diastoles under maximal vasodilation; zero-flow pressure; passive arterial microvessel diameter change with pressure"
species = "dog"
preparation = "16 young mongrel dogs (4.5-8.5 kg), urethane 500 mg/kg + chloralose 60 mg/kg, open chest, atrial pacing 140 bpm after sinus-node suppression. Epimyocardial microcirculation transilluminated by a glass fibre in a 20 G needle inserted in the subepicardial LV muscle, viewed through a 'floating objective' that follows cardiac motion; two 24 G needles through the midmyocardium limit horizontal motion. High-speed cine (128-500 frames/s); RBC velocity by frame-to-frame tracking of red cells / plasma gaps."
conditions = "Maximal vasodilation with dilazep 150 ug/kg i.v. (adenosine potentiator; dipyridamole gave no further dilation). Long diastoles produced by bilateral vagal stimulation + abrupt cessation of pacing, so aortic pressure decays with no cardiac contraction. Velocity tracked only in vessels < 30 um while aortic pressure was high."
verification = "mixed"
access = "Publisher PDF (ahajournals.org) read via Wayback Machine capture 20231126042120 of https://www.ahajournals.org/doi/pdf/10.1161/01.res.66.2.503"
notes = """Fig. 5 shows 'typical examples' (one arteriole, one venule, and the average of 3 capillaries in one field), not group means.
Diameters of the example arteriole/venule are not given; per Methods, velocity at higher aortic pressures was measured only in vessels
< 30 um, so the example arteriole and venule are presumably < 30 um. Velocity rose linearly with aortic pressure above ~30 mmHg
(r = 0.99 +/- 0.02) and became curvilinear below 30 mmHg. Data are mean +/- SD in tables/text.
In the capillary panel one point (~16 mmHg) is drawn as a filled circle; its meaning is not stated. Capillary points carry SD/SE bars
across the 3 capillaries (not digitized). Zero-velocity points are plotted on the x-axis at the pressure where RBC progression stopped
(no antegrade movement for 1 s; detection limit ~2 um/s)."""
use_in_model = """Diastolic, non-contracting, maximally dilated pressure-flow check of the microvascular end of the tree: drive the model with inlet
pressure 50 -> 0 mmHg (venous outlet ~3 mmHg, right atrial) and compare RBC/mean velocity in < 30 um arterioles, capillaries and venules.
Expect the model's capillary velocities near ~1.3 mm/s at 50 mmHg aortic pressure under dilation; the zero-flow pressure (13.6 mmHg)
is a non-Poiseuille effect (yield-stress / waterfall) that a purely Poiseuille model will not reproduce."""

