[meta]
id = "oue2019_forearm_venous_capacitance"
data_type = "experimental"
validates = "Forearm (and calf) venous capacitance (volume stored at 60 mmHg), venous outflow on cuff release, and forearm venous compliance at 20 mmHg by sex, in healthy young adults (supine strain-gauge plethysmography, Halliwill cuff-deflation protocol)"
species = "human"
preparation = "26 healthy young volunteers (10 women, 16 men), randomized to continuous training (C-TRA, n = 8), interval training (I-TRA, n = 9) or control (CONT, n = 9); ages 20.1-22.1 y by group. Mercury strain gauge at the site of maximal forearm (and calf) girth; collecting cuff on the left upper arm (and thigh)."
conditions = "Supine >= 20 min, left forearm slightly above heart level, supported at the wrist. Cuff held at 60 mmHg for 8 min, then deflated to 0 mmHg at 1 mmHg/s. Capacitance = limb volume change from before inflation to 8 min at 60 mmHg. Outflow = rate of volume change over the 1-min deflation from 60 to 0 mmHg. Compliance = numerical derivative (V_i - V_(i-5))/(P_i - P_(i-5)), 15 <= i <= 60 mmHg. Pre-training values are the baseline healthy data."
verification = "FT"
access = "Europe PMC fullTextXML of PMC6739508 (Physiol Rep, CC BY open access), read 2026-10-15; Tables 1-2 read from the XML table markup."
notes = """Compliance-vs-pressure curves are shown only in Fig. 2 (not digitized). The only numeric compliance values are the sex comparison at 20 mmHg in the Discussion (pooled over groups; the time point is not stated, most likely pre-training).
Table values are mean +/- SE. The SE convention for the 20-mmHg compliance values is not restated; they are stored as printed.
Repeatability (pilot, 9 subjects): forearm CV 5.9% within day, 5.3% between days.
'Venous outflow' here is the volume-change rate during a 1-min cuff deflation (ml/dl/min), not resting forearm blood flow."""
use_in_model = """Cross-check of the per-100-ml forearm venous reservoir: total volume stored at 60 mmHg (capacitance ~2.3-3.5 ml/dl after 8 min, includes some filtration) and the compliance at 20 mmHg (men ~0.11, women ~0.08 ml/dl/mmHg as printed) bound C of the arm reservoir; scale to whole-limb mL with a measured limb volume (buffa2015_upper_limb_volume).
The deflation outflow rate (~2.6-3.3 ml/dl/min from 60 to 0 mmHg over 1 min) is a lower bound on how fast distended forearm veins empty."""

