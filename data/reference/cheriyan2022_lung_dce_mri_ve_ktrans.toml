[meta]
id = "cheriyan2022_lung_dce_mri_ve_ktrans"
data_type = "experimental"
validates = "Lung parenchyma extravascular exchange of a small hydrophilic tracer (gadobutrol, extracellular gadolinium chelate) in healthy humans: interstitial (extravascular extracellular) volume fraction ve, transfer constant Ktrans and plasma fraction vp by extended-Tofts DCE-MRI; repeatability and response to exercise; comparison with heart failure."
species = "human"
preparation = "Cambridge, UK, 2014-2017, GSK-funded method-validation study. Evaluable: 17 healthy volunteers (age 61.2 +/- 11.4 y, 15 male, weight 83.8 +/- 13.0 kg; current smokers excluded), 12 chronic heart failure (NYHA II-III), 3 acute decompensated HF. Supine for up to 30 min before Sessions 1 and 2."
conditions = "1.5 T GE MR450, 8-channel cardiac coil, no respiratory gating (nonlinear registration). Variable-flip-angle T1 map, then a 7-min dynamic coronal 3D spoiled GRE series (170 volumes, 2.5 s per volume, 10 mm slices). Gadobutrol (Gadovist) 0.05 mL/kg (half dose) at 1.5 mL/s by power injector at the start of dynamic 15, then 25 mL saline. AIF in the pulmonary artery; concentrations corrected for each subject's hematocrit. Extended Tofts model voxel-wise (Madym); per-subject median over the whole-lung volume. Session 2 about 1 week after Session 1; Session 3 just after two bicycle exercise tests."
verification = "FT"
access = "Europe PMC open-access full-text XML (PMC9544235, Wiley open access), retrieved 2026-10-16. Supplementary methods and Table S1 not read."
notes = """ve and vp are fractions of the MRI-visible (non-air) lung tissue, not of total lung volume. MRI is blind to air. The paper's qS0*ve index scales ve by lung water relative to muscle.
Values in the abstract are group means of per-subject whole-lung medians. Table 2 gives least-squares means (SE) from the repeated-measures ANOVA, so the two differ slightly.
Ktrans in lung is not a clean permeability-surface product. The authors state that Ktrans measures gadolinium permeability and may not reflect fluid permeability. With high lung flow the extended Tofts Ktrans approaches PS-limited exchange, but the paper does not separate flow and PS.
vp for HV was printed as a median (95% CI) after the HF value: Session 1 0.42 (0.36-0.53), Session 2 0.47 (0.36-0.55), Session 3 0.47 (0.40-0.61).
ve in HV rose with age (r = 0.55, P = 0.01, Session 2).
Repeatability, HV, Session 2 minus Session 1: Ktrans +0.19 min^-1 (95% CI -0.10 to 0.48), CV 41.3%; ve -0.05 (-0.19 to 0.09). The Ktrans CV is large.
HF raised ve (Session 1: 0.4946 vs 0.3346) but not Ktrans."""
use_in_model = """Human lung exchange target for a small extracellular tracer: whole-lung Ktrans about 0.21-0.26 min^-1 (per mL tissue) and ve about 0.32-0.33 of non-air tissue, with vp about 0.42-0.47. For the lung compartment of the whole-body iodine model, ve sets the extravascular distribution volume and Ktrans the wash-in rate constant. Gadobutrol (about 605 Da) and iodinated monomers (iohexol about 821 Da; molecular weights not from this paper) are both small hydrophilic extracellular agents, so this is the closest human lung analogue found. Pair with brigham1983_lung_urea_ps (urea PS) and goresky1975_extravascular_lung_water."""

