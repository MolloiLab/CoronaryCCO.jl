[meta]
id = "gould2019_artery_specific_cfc"
data_type = "experimental"
validates = "Prevalence and size of severely reduced coronary flow capacity (pixels with CFR <= 1.27 and stress perfusion <= 0.83 cc/min/g) in a large stable-CAD PET cohort; minimum-quadrant and global stress flow and CFR; outcome association (death, MI, stroke) with and without revascularization"
species = "human"
preparation = "3,774 sequential rest-stress Rb-82 PET scans (prospective cohort, Weatherhead PET Center, Houston), stable CAD or risk factors; GE Discovery ST 16-slice PET-CT in 2D mode, 30-50 mCi Rb-82; CFR per pixel for 1,344 pixels; FDA-cleared CFC software (K171303). Follow-up up to 9 y (mean 3.0 +/- 2.3 y) for 95% of scans."
conditions = "Standard vasodilator stress, primarily dipyridamole. Groups: revascularization (PCI or CABG) within 90 d after PET (n = 134) vs none (n = 3,640)."
verification = "FT"
access = "Europe PMC fullTextXML of PMC6424226 (open access), read 2026-10-15; tables read from the XML table markup. Supplemental Figure 1 (full CFC color-bar definition) not read."
notes = """Only the severe (blue) threshold is printed in the text; the full category definitions are in Supplemental Figure 1 (not read). The full revised set is in gould2018_cfc_revised_thresholds.toml.
CFCsevere = any pixels with BOTH CFR <= 1.27 AND stress perfusion <= 0.83 cc/min/g, expressed as % of LV.
Table 1 'Mild CFC > 15% of LV' and 'Moderate CFC > 15% of LV' are counts of scans with that category over 15% of the LV, as printed.
Abstract: severely reduced CFC associated with a 60% increased hazard of MACE and a 30% increased hazard of death/MI/stroke (DMS); revascularization within 90 d was associated with a 54% lower DMS hazard (P = 0.0369); up to 19% of the cohort had CFC severity associated with reduced DMS after revascularization, depending on the statistical-certainty threshold.
The Cox tables (Tables 2-5) are not stored: they are outcome models, and the coding of the CFC-severe covariate (printed HR 0.65 in Table 2, next to HR 0.552 for PCI/CABG within 90 d) is not explained in the text read."""
use_in_model = """Expected burden of severe CFC: in a stable-CAD/risk-factor population without early revascularization, 17% of scans have any severe pixels and the mean severe area is 2 +/- 8% of LV. A model heart with a single severe proximal stenosis should produce a contiguous severe region in that artery's territory, as in the revascularized group (mean 18 +/- 21% of LV, median 12%)."""

